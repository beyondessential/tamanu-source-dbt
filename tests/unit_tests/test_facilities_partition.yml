unit_tests:
  - name: test_facilities_standard_only
    model: facilities
    description: >
      `facilities` holds standard facilities only: a facility in a sensitive network is absent,
      and so is a soft-deleted one. Every standard dataset and report reads this model, so this
      is where the standard side of the sensitivity partition is asserted.
    given: &facility_source
      - input: source('tamanu', 'facilities')
        format: sql
        rows: |
          select 'fac_std'::text as id, 'STD'::text as code, 'Standard Hospital'::text as name,
                 null::text as division, null::text as type, null::text as email,
                 null::text as contact_number, null::text as city_town, null::text as street_address,
                 null::text as catchment_id, 'current'::text as visibility_status,
                 null::text as sensitive_network_id, null::timestamptz as deleted_at
          union all
          select 'fac_sen', 'SEN', 'Sensitive Hospital', null, null, null, null, null, null, null,
                 'current', 'sn_001', null::timestamptz
          union all
          select 'fac_std_deleted', 'DEL', 'Closed Hospital', null, null, null, null, null, null, null,
                 'current', null, '2024-01-01 00:00:00+00'::timestamptz
          union all
          select 'fac_sen_deleted', 'SDEL', 'Closed Sensitive Hospital', null, null, null, null, null,
                 null, null, 'current', 'sn_001', '2024-01-01 00:00:00+00'::timestamptz
    expect:
      rows:
        - {id: fac_std}

  - name: test_sensitive_facilities_sensitive_only
    model: sensitive_facilities
    description: >
      The other half of the partition, on the same fixture: `sensitive_facilities` holds the
      sensitive facility and nothing else. Together the two show every live facility reaches
      exactly one of the two bases.
    given: *facility_source
    expect:
      rows:
        - {id: fac_sen}
