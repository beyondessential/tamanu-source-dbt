unit_tests:
  - name: test_vaccine_audit_line_list_facility_two_selected
    model: vaccine-audit-line-list
    description: >
      BL-005 of specs/reports/report-facility-options.md: two facilities selected return the rows of either and no others.
    overrides:
      vars:
        timezone: UTC  # to_user_selected_timezone is a no-op outside compile; see test_admissions_line_list_date_range_basic
        facilityId: [fac_001, fac_003]
    given:
      - input: ref('ds__vaccinations')
        format: sql
        rows: |
          select 'P001'::character varying(255) as display_id, null::character varying(255) as first_name, null::character varying(255) as last_name, null::character varying(255) as patient_id, null::date as date_of_birth, null::integer as age, null::character varying(255) as sex, null::character varying(255) as village_id, null::character varying(255) as village, 'fac_001'::character varying(255) as facility_id, null::character varying(255) as facility, null::character varying(255) as department_id, null::character varying(255) as department, null::character varying(255) as location_group_id, null::character varying(255) as location_group, null::character varying(255) as location_id, null::character varying(255) as location, null::character varying(255) as scheduled_vaccine_id, '2024-01-15 10:00:00'::timestamp as vaccination_date, null::character varying(255) as vaccine_category, null::text as vaccine_name, null::text as vaccine_brand, null::text as disease, 'Historical'::character varying(255) as vaccine_status, null::character varying(255) as vaccine_schedule, null::character varying(255) as batch, null::character varying(255) as recorded_by, null::character varying(255) as circumstances, null::character varying(255) as given_by, null::boolean as given_elsewhere_by, null::character varying(255) as not_given_clinician, null::character varying(255) as not_given_reason, null::character varying(255) as modified_by, null::timestamp as updated_at
