unit_tests:
  - name: test_audit_discharge_encounter_type_one
    model: audit-discharge-line-list
    description: One encounter type selected returns only the discharges of that type.
    overrides:
      vars:
        timezone: UTC  # to_user_selected_timezone is a no-op outside compile; see test_admissions_line_list_date_range_basic
        datetime_format: YYYY-MM-DD HH24:MI
        date_format: YYYY-MM-DD
        fromDate: '2024-03-01'
        toDate: '2024-03-31'
        encounterType: clinic
    given: &discharge_audit_given
      - input: ref('discharges')
        format: sql
        rows: |
          select 'dis_001' as id, 'Wound care follow up' as note, 'enc_001' as encounter_id, 'cli_001' as discharged_by_id, 'disp_001' as disposition_id
          union all
          select 'dis_002', 'Automatically discharged by outpatient discharger', 'enc_002', 'cli_001', null

      - input: ref('discharges_change_logs')
        format: sql
        rows: |
          select 'chg_001'::text as changelog_id, 'dis_001'::text as discharge_id, 'enc_001'::text as encounter_id, '2024-03-14 08:05:00'::timestamp as logged_at, '2024-03-14 08:05:00'::timestamp as record_updated_at, '2024-03-14 08:05:00'::timestamp as logged_at_utc, '2024-03-14 08:05:00'::timestamp as record_updated_at_utc, 'usr_001'::text as updated_by_user_id, '{}'::jsonb as record_data
          union all
          select 'chg_002', 'dis_001', 'enc_001', '2024-03-15 09:30:00'::timestamp, '2024-03-15 09:30:00'::timestamp, '2024-03-15 09:30:00'::timestamp, '2024-03-15 09:30:00'::timestamp, 'usr_002', '{}'::jsonb
          union all
          select 'chg_003', 'dis_002', 'enc_002', '2024-03-11 22:00:00'::timestamp, '2024-03-11 22:00:00'::timestamp, '2024-03-11 22:00:00'::timestamp, '2024-03-11 22:00:00'::timestamp, '00000000-0000-0000-0000-000000000000', '{}'::jsonb

      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_001' as id, 'pat_001' as patient_id, 'admission' as encounter_type, '2024-03-08 11:00:00'::timestamp as start_datetime, '2024-03-10 16:00:00'::timestamp as end_datetime, 'dept_001' as department_id, 'loc_001' as location_id
          union all
          select 'enc_002', 'pat_002', 'clinic', '2024-03-11 09:00:00'::timestamp, '2024-03-11 17:00:00'::timestamp, 'dept_001', 'loc_001'

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'Room 1' as name, 'fac_001' as facility_id

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'Central Hospital' as name, null::text as sensitive_network_id

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_001' as id, 'General Medicine' as name

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-05-15'::date as date_of_birth, 'male' as sex, 'vil_001' as village_id
          union all
          select 'pat_002', 'P002', 'Jane', 'Smith', '1985-08-22'::date, 'female', null

      - input: ref('reference_data')
        format: sql
        rows: |
          select 'vil_001' as id, 'Village A' as name, 'villageA' as code
          union all
          select 'disp_001', 'Home', 'home'
          union all
          select 'diag_001', 'Malaria', 'B54'
          union all
          select 'diag_002', 'Anaemia', 'D64.9'
          union all
          select 'diag_003', 'Pneumonia', 'J18.9'

      - input: ref('encounter_diagnoses')
        format: sql
        rows: |
          select 'edx_001' as id, 'enc_001' as encounter_id, 'diag_002' as diagnosis_id, false as is_primary, '2024-03-09 10:00:00'::timestamp as datetime
          union all
          select 'edx_002', 'enc_001', 'diag_001', true, '2024-03-09 12:00:00'::timestamp
          union all
          select 'edx_003', 'enc_001', 'diag_003', false, '2024-03-09 08:00:00'::timestamp

      - input: ref('users')
        format: sql
        rows: |
          select 'cli_001' as id, 'Dr Alice Wilson' as display_name
          union all
          select 'usr_001', 'Nurse Bob Martinez'
          union all
          select 'usr_002', 'Nurse Carol Reid'
    expect:
      format: csv
      rows: |
        Patient ID
        P002

  - name: test_audit_discharge_encounter_type_two
    model: audit-discharge-line-list
    description: Two encounter types selected return the discharges of either type.
    overrides:
      vars:
        timezone: UTC  # to_user_selected_timezone is a no-op outside compile; see test_admissions_line_list_date_range_basic
        datetime_format: YYYY-MM-DD HH24:MI
        date_format: YYYY-MM-DD
        fromDate: '2024-03-01'
        toDate: '2024-03-31'
        encounterType: [admission, clinic]
    given: *discharge_audit_given
    expect:
      format: csv
      rows: |
        Patient ID
        P001
        P002

  - name: test_audit_discharge_encounter_type_empty
    model: audit-discharge-line-list
    description: An empty selection, which is what the form sends when nothing is picked, returns every discharge.
    overrides:
      vars:
        timezone: UTC  # to_user_selected_timezone is a no-op outside compile; see test_admissions_line_list_date_range_basic
        datetime_format: YYYY-MM-DD HH24:MI
        date_format: YYYY-MM-DD
        fromDate: '2024-03-01'
        toDate: '2024-03-31'
        encounterType: []
    given: *discharge_audit_given
    expect:
      format: csv
      rows: |
        Patient ID
        P001
        P002
