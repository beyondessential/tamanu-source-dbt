unit_tests:
  - name: test_lab_tests_line_list_facility_filter_selected
    model: lab-tests-line-list
    description: >
      BL-002 of specs/reports/report-facility-options.md: a selected facility returns only that facility's rows.
    overrides:
      vars:
        timezone: UTC  # to_user_selected_timezone is a no-op outside compile; see test_admissions_line_list_date_range_basic
        facilityId: fac_002
