      - input: ref('ds__lab_tests')
        format: sql
        rows: |
          select null::character varying(255) as patient_id, 'P001'::character varying(255) as display_id, null::character varying(255) as first_name, null::character varying(255) as last_name, null::date as date_of_birth, null::integer as age, null::character varying(255) as sex, null::character varying(255) as village_id, null::character varying(255) as village, 'fac_001'::character varying(255) as facility_id, null::character varying(255) as facility, null::character varying(255) as department_id, null::character varying(255) as department, null::character varying(255) as location_group_id, null::character varying(255) as location_group, null::character varying(255) as location_id, null::character varying(255) as location, null::character varying(255) as lab_request_id, null::character varying(255) as status_id, null::character varying(255) as status, null::character varying(255) as lab_test_panel_id, null::character varying(255) as lab_test_panel, null::character varying(255) as lab_test_category_id, null::character varying(255) as lab_test_category, '2024-01-15 10:00:00'::timestamp as requested_datetime, null::character varying(255) as requested_by_id, null::character varying(255) as requested_by, null::timestamp as lab_request_published_datetime, null::date as lab_test_date, null::character varying(255) as result, null::character varying(255) as lab_test_type_id, null::character varying(255) as lab_test_type, null::timestamp as lab_test_completed_datetime, null::text as concat_ws, null::text as requesting_department, null::text as verification
