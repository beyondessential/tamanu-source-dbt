unit_tests:
  - name: test_hospital_admissions_by_department_facility_filter
    model: hospital-admissions-by-department-summary
    description: >
      Two facilities each hold one admission in the same month. With facilityId set, only
      that facility's department row is reported (BL-015).
    overrides:
      vars:
        timezone: UTC
        yearmonth_format: YYYY-MM
        fromDate: '2024-01-01'
        toDate: '2024-01-31'
        facilityId: fac_001
    given:
      - input: ref('int__admission_history_department')
        format: sql
        rows: |
          select
            'enc_001'::text          as encounter_id,
            'dep_med'::text          as department_id,
            'General Medicine'::text as department,
            'fac_001'::text          as facility_id,
            'Central Hospital'::text as facility,
            '2024-01-10 09:00:00'::timestamp as start_datetime,
            '2024-01-12 09:00:00'::timestamp as end_datetime,
            2::integer               as length_of_stay,
            true                     as admission,
            true                     as discharge,
            false                    as transfer_in,
            false                    as transfer_out,
            false                    as death
          union all
          select
            'enc_002', 'dep_med', 'General Medicine', 'fac_002', 'North Clinic',
            '2024-01-10 09:00:00'::timestamp, '2024-01-12 09:00:00'::timestamp,
            2, true, true, false, false, false
    expect:
      format: sql
      rows: |
        select
          '2024-01'           as "Month",
          'Central Hospital'  as "Facility",
          'General Medicine'  as "Department",
          1::bigint           as "Number of admissions",
          1::bigint           as "Number of discharges",
          0::bigint           as "Number of deaths",
          0::bigint           as "Number of transfers into department",
          0::bigint           as "Number of transfers out of department",
          2.0::numeric        as "Average length of stay"
  - name: test_hospital_admissions_by_area_facility_filter
    model: hospital-admissions-by-area-summary
    description: >
      Two facilities each hold one admission in the same month. With facilityId set, only
      that facility's row is reported (BL-015).
    overrides:
      vars:
        timezone: UTC
        yearmonth_format: YYYY-MM
        fromDate: '2024-01-01'
        toDate: '2024-01-31'
        facilityId: fac_001
    given:
      - input: ref('int__admission_history_location')
        format: sql
        rows: |
          select
            'enc_001'::text          as encounter_id,
            'lg_001'::text           as location_group_id,
            'Ward A'::text           as location_group,
            'loc_001'::text          as location_id,
            'Room 1'::text           as location,
            'fac_001'::text          as facility_id,
            'Central Hospital'::text as facility,
            '2024-01-10 09:00:00'::timestamp as start_datetime,
            '2024-01-12 09:00:00'::timestamp as end_datetime,
            2::integer               as length_of_stay,
            true                     as admission,
            true                     as discharge,
            false                    as transfer_in,
            false                    as transfer_out,
            false                    as death
          union all
          select
            'enc_002', 'lg_002', 'Ward B', 'loc_002', 'Room 2', 'fac_002', 'North Clinic',
            '2024-01-10 09:00:00'::timestamp, '2024-01-12 09:00:00'::timestamp,
            2, true, true, false, false, false
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001'::text as id, 'Room 1'::text as name, 'lg_001'::text as location_group_id, 'fac_001'::text as facility_id, 10::integer as max_occupancy
          union all
          select 'loc_002', 'Room 2', 'lg_002', 'fac_002', 10
    expect:
      format: sql
      rows: |
        select
          '2024-01'          as "Month",
          'Central Hospital' as "Facility",
          'Ward A'           as "Area",
          1                  as "Number of admissions",
          1                  as "Number of discharges",
          0                  as "Number of deaths",
          0                  as "Number of transfers into location",
          0                  as "Number of transfers out of location",
          2.0                as "Average length of stay",
          2                  as "Number of patient days",
          '0.6%'             as "Bed occupancy (%)"
