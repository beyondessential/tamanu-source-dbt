unit_tests:
  - name: test_emergency_triage_line_list_status_none
    model: emergency-triage-line-list
    description: >
      Nothing selected returns every row. Unset, the parameter renders as a null, the same empty list the form's [] produces.
    overrides:
      vars:
        timezone: UTC  # to_user_selected_timezone is a no-op outside compile; see test_admissions_line_list_date_range_basic
    given:
      - input: ref('ds__emergency_triage')
        format: sql
        rows: |
          select 'x_triage_id'::text as triage_id, 'x_encounter_id'::text as encounter_id, 'x_patient_id'::text as patient_id, 'P001'::text as display_id, 'x_first_name'::text as first_name, 'x_last_name'::text as last_name, 'x_sex'::text as sex, 'x_village_id'::text as village_id, 'x_village'::text as village, '1990-01-01'::date as date_of_birth, 'x_age'::text as age, 'fac_001'::text as facility_id, '2024-01-15 10:00:00'::timestamp as arrival_datetime, 'x_arrival_mode'::text as arrival_mode, '2024-01-15 10:00:00'::timestamp as triage_datetime, '1'::text as score, 'x_triage_category'::text as triage_category, 'x_chief_complaint'::text as chief_complaint, 'x_secondary_complaint'::text as secondary_complaint, 'x_clinician_id'::text as clinician_id, 'x_clinician'::text as clinician, 'x_diagnoses'::text as diagnoses, 'x_medications'::text as medications, '2024-01-15 10:00:00'::timestamp as active_care_datetime, 'x_waiting_time_seconds'::text as waiting_time_seconds, 'x_target_wait_minutes'::text as target_wait_minutes, 'x_encounter_type'::text as encounter_type, 'x_is_admitted_from_ed'::text as is_admitted_from_ed, 'x_ed_outcome'::text as ed_outcome, 'x_discharge_disposition_id'::text as discharge_disposition_id, 'x_discharge_disposition'::text as discharge_disposition, '2024-01-15 10:00:00'::timestamp as discharge_datetime, 'x_length_of_stay_seconds'::text as length_of_stay_seconds, 'x_target_time_met'::text as target_time_met
          union all
          select 'x_triage_id'::text as triage_id, 'x_encounter_id'::text as encounter_id, 'x_patient_id'::text as patient_id, 'P002'::text as display_id, 'x_first_name'::text as first_name, 'x_last_name'::text as last_name, 'x_sex'::text as sex, 'x_village_id'::text as village_id, 'x_village'::text as village, '1990-01-01'::date as date_of_birth, 'x_age'::text as age, 'fac_001'::text as facility_id, '2024-01-15 10:00:00'::timestamp as arrival_datetime, 'x_arrival_mode'::text as arrival_mode, '2024-01-15 10:00:00'::timestamp as triage_datetime, '3'::text as score, 'x_triage_category'::text as triage_category, 'x_chief_complaint'::text as chief_complaint, 'x_secondary_complaint'::text as secondary_complaint, 'x_clinician_id'::text as clinician_id, 'x_clinician'::text as clinician, 'x_diagnoses'::text as diagnoses, 'x_medications'::text as medications, '2024-01-15 10:00:00'::timestamp as active_care_datetime, 'x_waiting_time_seconds'::text as waiting_time_seconds, 'x_target_wait_minutes'::text as target_wait_minutes, 'x_encounter_type'::text as encounter_type, 'x_is_admitted_from_ed'::text as is_admitted_from_ed, 'x_ed_outcome'::text as ed_outcome, 'x_discharge_disposition_id'::text as discharge_disposition_id, 'x_discharge_disposition'::text as discharge_disposition, '2024-01-15 10:00:00'::timestamp as discharge_datetime, 'x_length_of_stay_seconds'::text as length_of_stay_seconds, 'x_target_time_met'::text as target_time_met
          union all
          select 'x_triage_id'::text as triage_id, 'x_encounter_id'::text as encounter_id, 'x_patient_id'::text as patient_id, 'P003'::text as display_id, 'x_first_name'::text as first_name, 'x_last_name'::text as last_name, 'x_sex'::text as sex, 'x_village_id'::text as village_id, 'x_village'::text as village, '1990-01-01'::date as date_of_birth, 'x_age'::text as age, 'fac_001'::text as facility_id, '2024-01-15 10:00:00'::timestamp as arrival_datetime, 'x_arrival_mode'::text as arrival_mode, '2024-01-15 10:00:00'::timestamp as triage_datetime, '5'::text as score, 'x_triage_category'::text as triage_category, 'x_chief_complaint'::text as chief_complaint, 'x_secondary_complaint'::text as secondary_complaint, 'x_clinician_id'::text as clinician_id, 'x_clinician'::text as clinician, 'x_diagnoses'::text as diagnoses, 'x_medications'::text as medications, '2024-01-15 10:00:00'::timestamp as active_care_datetime, 'x_waiting_time_seconds'::text as waiting_time_seconds, 'x_target_wait_minutes'::text as target_wait_minutes, 'x_encounter_type'::text as encounter_type, 'x_is_admitted_from_ed'::text as is_admitted_from_ed, 'x_ed_outcome'::text as ed_outcome, 'x_discharge_disposition_id'::text as discharge_disposition_id, 'x_discharge_disposition'::text as discharge_disposition, '2024-01-15 10:00:00'::timestamp as discharge_datetime, 'x_length_of_stay_seconds'::text as length_of_stay_seconds, 'x_target_time_met'::text as target_time_met
    expect:
      format: csv
      rows: |
        Patient ID
        P001
        P002
        P003

