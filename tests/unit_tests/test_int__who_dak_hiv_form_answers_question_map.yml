unit_tests:
  - name: test_int__who_dak_hiv_form_answers_question_map
    model: int__who_dak_hiv_form_answers
    description: >
      AC-024 (specs/dbt-model/metric__who_dak_hiv_indicators.md). An answer reaches its DAK element
      through the question map, by its program data element's code and the survey it is on: a Care
      visit's ART answers fill on_art and art_start_date, and an HTS visit's HIV status fills
      hiv_status. A Care visit question answered on the HTS visit is not in the map for that survey,
      so it is not read.
    given:
      - input: ref('map__who_dak_hiv_questions')
        format: sql
        rows: |
          select
            'program-whodakhiv-carevisit'::text as survey_id, 'whodakhiv-d-de38'::text as question_code,
            null::text as option, 'HIV.D.DE38'::text as element_id, null::text as role
          union all
          select 'program-whodakhiv-carevisit', 'whodakhiv-d-de39', null, 'HIV.D.DE39', null
          union all
          select 'program-whodakhiv-htsvisit', 'whodakhiv-b-de115', null, 'HIV.B.DE115', null
      - input: ref('program_data_elements')
        format: sql
        rows: |
          select 'pde-whodakhiv-d-de38'::text as id, 'whodakhiv-d-de38'::text as code
          union all
          select 'pde-whodakhiv-d-de39', 'whodakhiv-d-de39'
          union all
          select 'pde-whodakhiv-b-de115', 'whodakhiv-b-de115'
      - input: ref('surveys')
        format: sql
        rows: |
          select 'program-whodakhiv-carevisit'::text as id, 'carevisit'::text as code
          union all
          select 'program-whodakhiv-htsvisit', 'htsvisit'
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_1'::text as id, 'fac_1'::text as facility_id
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_1'::text as id, 'pat_1'::text as patient_id, 'loc_1'::text as location_id
          union all
          select 'enc_2', 'pat_2', 'loc_1'
      - input: ref('survey_responses')
        format: sql
        rows: |
          select
            'r_1'::text as id, 'program-whodakhiv-carevisit'::text as survey_id, 'enc_1'::text as encounter_id,
            '2026-03-04 09:10:00'::timestamp as end_datetime
          union all
          select 'r_2', 'program-whodakhiv-htsvisit', 'enc_2', '2026-03-05 09:10:00'::timestamp
      - input: ref('survey_response_answers')
        format: sql
        rows: |
          select 'r_1'::text as response_id, 'pde-whodakhiv-d-de38'::text as data_element_id, 'Yes'::text as body
          union all
          select 'r_1', 'pde-whodakhiv-d-de39', '2026-01-05'
          union all
          select 'r_2', 'pde-whodakhiv-b-de115', 'Positive'
          union all
          select 'r_2', 'pde-whodakhiv-d-de38', 'Yes'
      - input: ref('clinical__person')
        format: sql
        rows: |
          select
            'pat_1'::text as person_id, 'female'::text as gender_source_value, 1990 as year_of_birth,
            1 as month_of_birth, 1 as day_of_birth
          union all
          select 'pat_2', 'male', 1985, 6, 15
    expect:
      rows:
        - {response_id: r_1, survey_code: carevisit, on_art: true, art_start_date: '2026-01-05', hiv_status: null}
        - {response_id: r_2, survey_code: htsvisit, on_art: null, art_start_date: null, hiv_status: Positive}
