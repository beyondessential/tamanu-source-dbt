unit_tests:
  - name: test_ref__care_site_department_denormalises_facility
    model: ref__care_site
    description: >-
      A department becomes a care_site_type='department' row, denormalised with its
      parent facility name and place-of-service source value (BL-001, BL-002, BL-003,
      BL-005).
    config:
      enabled: "{{ 'example' in var('sensitive_networks', []) }}"
    given:
      - input: ref('departments')
        format: sql
        rows: |
          select 'dep1' as id, 'DEP1' as code, 'Emergency Dept' as name, 'fac1' as facility_id

      - input: ref('sn_example_departments')
        format: sql
        rows: |
          select fx.* from (
            select 'dep1' as id, 'DEP1' as code, 'Emergency Dept' as name, 'fac1' as facility_id
          ) fx
          where false
      - input: ref('ref__care_site_location')
        format: sql
        rows: |
          select null::varchar as care_site_id, null::text as care_site_type, null::varchar as care_site_name,
            null::varchar as care_site_source_value, null::varchar as place_of_service_source_value,
            null::varchar as facility_id, null::varchar as facility_name where false
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type

      - input: ref('sn_example_facilities')
        format: sql
        rows: |
          select fx.* from (
            select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type
          ) fx
          where false
    expect:
      format: sql
      rows: |
        select
          'dep1' as care_site_id, 'department' as care_site_type,
          'Emergency Dept' as care_site_name, 'DEP1' as care_site_source_value,
          'hospital' as place_of_service_source_value,
          'fac1' as facility_id, 'General Hospital' as facility_name
        union all
        select
          'fac1', 'facility',
          'General Hospital', 'FAC1',
          'hospital',
          'fac1', 'General Hospital'

  - name: test_ref__care_site_orphan_care_site_yields_nulls
    model: ref__care_site
    description: >-
      A care site whose facility is absent from bases/facilities is still emitted; the
      facility-derived columns come through NULL rather than dropping the row (BL-003).
    config:
      enabled: "{{ 'example' in var('sensitive_networks', []) }}"
    given:
      - input: ref('departments')
        format: sql
        rows: |
          select 'dep2' as id, 'DEP2' as code, 'Roving Clinic' as name, 'fac_gone' as facility_id

      - input: ref('sn_example_departments')
        format: sql
        rows: |
          select fx.* from (
            select 'dep2' as id, 'DEP2' as code, 'Roving Clinic' as name, 'fac_gone' as facility_id
          ) fx
          where false
      - input: ref('ref__care_site_location')
        format: sql
        rows: |
          select null::varchar as care_site_id, null::text as care_site_type, null::varchar as care_site_name,
            null::varchar as care_site_source_value, null::varchar as place_of_service_source_value,
            null::varchar as facility_id, null::varchar as facility_name where false
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type

      - input: ref('sn_example_facilities')
        format: sql
        rows: |
          select fx.* from (
            select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type
          ) fx
          where false
    expect:
      format: sql
      rows: |
        select
          'dep2' as care_site_id, 'department' as care_site_type,
          'Roving Clinic' as care_site_name, 'DEP2' as care_site_source_value,
          null::varchar as place_of_service_source_value,
          'fac_gone' as facility_id, null::varchar as facility_name
        union all
        select
          'fac1', 'facility',
          'General Hospital', 'FAC1',
          'hospital',
          'fac1', 'General Hospital'

  - name: test_ref__care_site_facility_is_its_own_care_site
    model: ref__care_site
    description: >-
      A facility becomes a care_site_type='facility' row in its own right, denormalised
      against itself so facility_id points at the care site and place-of-service comes
      through. This is the grain clinical__episode.care_site_id resolves to: an enrolment
      is registered at a facility and never at a room (BL-001, BL-002, BL-007).
    config:
      enabled: "{{ 'example' in var('sensitive_networks', []) }}"
    given:
      - input: ref('departments')
        format: sql
        rows: |
          select null::varchar as id, null::varchar as code, null::varchar as name, null::varchar as facility_id where false

      - input: ref('sn_example_departments')
        format: sql
        rows: |
          select fx.* from (
            select null::varchar as id, null::varchar as code, null::varchar as name, null::varchar as facility_id where false
          ) fx
          where false
      - input: ref('ref__care_site_location')
        format: sql
        rows: |
          select null::varchar as care_site_id, null::text as care_site_type, null::varchar as care_site_name,
            null::varchar as care_site_source_value, null::varchar as place_of_service_source_value,
            null::varchar as facility_id, null::varchar as facility_name where false
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type

      - input: ref('sn_example_facilities')
        format: sql
        rows: |
          select fx.* from (
            select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type
          ) fx
          where false
    expect:
      format: sql
      rows: |
        select
          'fac1' as care_site_id, 'facility' as care_site_type,
          'General Hospital' as care_site_name, 'FAC1' as care_site_source_value,
          'hospital' as place_of_service_source_value,
          'fac1' as facility_id, 'General Hospital' as facility_name

  - name: test_ref__care_site_unions_location_care_sites
    model: ref__care_site
    description: >-
      Every ref__care_site_location row comes through unchanged, alongside the department and
      facility rows (BL-005, BL-009).
    config:
      enabled: "{{ 'example' in var('sensitive_networks', []) }}"
    given:
      - input: ref('departments')
        format: sql
        rows: |
          select 'dep1' as id, 'DEP1' as code, 'Emergency Dept' as name, 'fac1' as facility_id

      - input: ref('sn_example_departments')
        format: sql
        rows: |
          select fx.* from (
            select 'dep1' as id, 'DEP1' as code, 'Emergency Dept' as name, 'fac1' as facility_id
          ) fx
          where false
      - input: ref('ref__care_site_location')
        format: sql
        rows: |
          select 'loc1' as care_site_id, 'location' as care_site_type, 'Room 4 Bed 2' as care_site_name,
            'LOC1' as care_site_source_value, 'clinic' as place_of_service_source_value,
            'fac9' as facility_id, 'Outreach Clinic' as facility_name
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type

      - input: ref('sn_example_facilities')
        format: sql
        rows: |
          select fx.* from (
            select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type
          ) fx
          where false
    expect:
      format: sql
      rows: |
        select
          'dep1' as care_site_id, 'department' as care_site_type,
          'Emergency Dept' as care_site_name, 'DEP1' as care_site_source_value,
          'hospital' as place_of_service_source_value,
          'fac1' as facility_id, 'General Hospital' as facility_name
        union all
        select
          'loc1', 'location',
          'Room 4 Bed 2', 'LOC1',
          'clinic',
          'fac9', 'Outreach Clinic'
        union all
        select
          'fac1', 'facility',
          'General Hospital', 'FAC1',
          'hospital',
          'fac1', 'General Hospital'
