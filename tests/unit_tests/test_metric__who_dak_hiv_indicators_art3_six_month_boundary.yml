unit_tests:
  - name: test_metric__who_dak_hiv_indicators_art3_six_month_boundary
    model: metric__who_dak_hiv_indicators
    description: >
      BL-012, ART.3. "More than six months before the reporting period end date" is measured
      against the end of the month the sample falls in -- 2026-06-30 for a June sample, so the
      cutoff is 2025-12-30. A client who started ART on 2025-12-29 qualifies and one who
      started on 2025-12-31 does not: at the period end that client has been on treatment 181
      days, which is not six months. Truncating to the month start instead would admit both.
    given:
      - input: ref('int__who_dak_hiv_form_answers')
        format: sql
        rows: |
          select 'resp_in' as response_id, 'pat_in' as patient_id, 'fac_001' as facility_id, 'carevisit' as survey_code, '2026-06-15 09:00:00'::timestamp as submitted_datetime, 'male' as sex, 1985 as year_of_birth, 1 as month_of_birth, 1 as day_of_birth, null::text as hiv_status, null::text as hiv_test_result, 'Routine viral load test' as viral_load_reason, null::text as art_stopped_reason, null::text as regimen_substitution_reason, null::text as key_population_hts_json, null::text as key_population_pmtct_json, null::date as hiv_test_date, null::date as hiv_test_result_returned_date, null::date as hiv_diagnosis_date, '2025-12-29'::date as art_start_date, null::date as baseline_cd4_test_date, '2026-06-15'::date as viral_load_sample_date, null::date as dsd_eligibility_assessed_date, null::date as dsd_start_date, null::date as art_stopped_date, null::date as substitution_first_line_date, null::date as substitution_second_line_date, null::date as substitution_third_line_date, null::numeric as baseline_cd4_count, 45::numeric as viral_load_result, true as on_art, null::boolean as dsd_eligible, null::boolean as dsd_enrolled
          union all
          select 'resp_out', 'pat_out', 'fac_001', 'carevisit', '2026-06-15 09:00:00'::timestamp, 'male', 1985, 1, 1, null::text, null::text, 'Routine viral load test', null::text, null::text, null::text, null::text, null::date, null::date, null::date, '2025-12-31'::date, null::date, '2026-06-15'::date, null::date, null::date, null::date, null::date, null::date, null::date, null::numeric, 45::numeric, true, null::boolean, null::boolean

      - input: ref('int__who_dak_hiv_client_month_state')
        format: sql
        rows: |
          select null::date as month_start, null::date as month_end, null::text as patient_id, null::text as facility_id, null::boolean as on_art, null::boolean as on_art_recorded, null::date as art_stopped_date, null::date as art_start_date, null::boolean as dsd_enrolled, null::date as dsd_start_date, null::int as months_on_art, null::int as months_on_dsd, null::text as sex, null::int as age_years where false

      - input: ref('int__who_dak_hiv_key_populations')
        format: sql
        rows: |
          select null::text as patient_id, null::text as key_population where false

    expect:
      format: sql
      rows: |
        select 'who_dak_hiv_art_initiated' as metric_id, null::text as variant_id, 'pat_in' as subject_id, 'patient' as subject_grain, '2025-12-01'::date as period_start, '2025-12-31'::date as period_end, 'month' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac_001' as facility_id, 'male' as sex, 40 as age_years, null::int as months_on_dsd, null::text as key_population
        union all
        select 'who_dak_hiv_art_initiated', null::text, 'pat_out', 'patient', '2025-12-01'::date, '2025-12-31'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'male', 40, null::int, null::text
        union all
        select 'who_dak_hiv_art_routine_viral_load', null::text, 'pat_in', 'patient', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'male', 41, null::int, null::text
        union all
        select 'who_dak_hiv_art_viral_suppression', null::text, 'pat_in', 'patient', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'male', 41, null::int, null::text
