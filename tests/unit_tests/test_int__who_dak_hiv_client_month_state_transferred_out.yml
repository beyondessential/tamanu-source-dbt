unit_tests:
  - name: test_int__who_dak_hiv_client_month_state_transferred_out
    model: int__who_dak_hiv_client_month_state
    description: >
      BL-055 to BL-057. A client recorded as transferred out is not on ART from the month of the recording,
      unless a period on ART starts after it, and is not counted as lost to follow-up when their supply
      runs out. A recorded Lost to follow-up outcome changes nothing, since loss to follow-up comes from
      supply.
      
      pat_t is transferred out on 2026-03-10 inside an open period: on ART in January and February only.
      pat_back is transferred out on 2026-03-10, so off ART in March and April, and is not lost to
      follow-up when that period ends on 2026-04-30. A second period starts on 2026-05-05, so they are on
      ART again in May and June, re-initiated in May. pat_l is recorded as lost to follow-up in February but
      is supplied ART throughout, so they stay on ART.
    overrides:
      vars:
        who_dak_hiv_spine_end: '2026-06-30'
    given:
      - input: ref('int__who_dak_hiv_form_answers')
        format: sql
        rows: |
          select 'r1' as response_id, 'pat_t' as patient_id, 'fac_a' as facility_id, '2026-01-10 09:00:00'::timestamp as submitted_datetime, true as on_art, '2026-01-05'::date as art_start_date, null::date as art_stopped_date, null::date as dsd_start_date, null::boolean as dsd_enrolled, null::text as hiv_treatment_outcome
          union all
          select 'r2', 'pat_t', 'fac_a', '2026-03-10 09:00:00'::timestamp, null::boolean, null::date, null::date, null::date, null::boolean, 'Transferred out'
          union all
          select 'r3', 'pat_back', 'fac_a', '2026-01-10 09:00:00'::timestamp, true, '2026-01-05'::date, null::date, null::date, null::boolean, null::text
          union all
          select 'r4', 'pat_back', 'fac_a', '2026-03-10 09:00:00'::timestamp, null::boolean, null::date, null::date, null::date, null::boolean, 'Transferred out'
          union all
          select 'r5', 'pat_l', 'fac_a', '2026-01-10 09:00:00'::timestamp, true, '2026-01-05'::date, null::date, null::date, null::boolean, null::text
          union all
          select 'r6', 'pat_l', 'fac_a', '2026-02-10 09:00:00'::timestamp, null::boolean, null::date, null::date, null::date, null::boolean, 'Lost to follow-up'

      - input: ref('derived__episode_art')
        format: sql
        rows: |
          select 'pat_t' as subject_id, '2026-01-10'::date as episode_start_date, '2026-12-31'::date as last_day_on_art, null::text as closure_reason, false as is_reinitiation
          union all
          select 'pat_back', '2026-01-10'::date, '2026-04-30'::date, 'Lost to follow-up', false
          union all
          select 'pat_back', '2026-05-05'::date, '2026-12-31'::date, null::text, true
          union all
          select 'pat_l', '2026-01-10'::date, '2026-12-31'::date, null::text, false

      - input: ref('int__art_supply')
        format: sql
        rows: |
          select null::text as subject_id, null::date as supply_date, null::int as supply_days, null::text as facility_id where false

      - input: ref('int__who_dak_hiv_art_lapse')
        format: sql
        rows: |
          select null::text as patient_id, null::date as art_start_date, null::date as lapse_date where false

      - input: ref('int__who_dak_hiv_registry_outcomes')
        format: sql
        rows: |
          select null::text as response_id, null::text as patient_id, null::timestamp as submitted_datetime, null::text as hiv_treatment_outcome where false

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'pat_back' as person_id, 'male' as gender_source_value, 1985 as year_of_birth, 1 as month_of_birth, 1 as day_of_birth
          union all
          select 'pat_l', 'male', 1985, 1, 1
          union all
          select 'pat_t', 'male', 1985, 1, 1

    expect:
      format: sql
      rows: |
        select '2026-01-01'::date as month_start, '2026-01-31'::date as month_end, 'pat_back' as patient_id, 'fac_a' as facility_id, true as on_art, true as on_art_recorded, null::date as art_stopped_date, '2026-01-05'::date as art_start_date, null::boolean as dsd_enrolled, null::date as dsd_start_date, 0 as months_on_art, null::int as months_on_dsd, 'male' as sex, 41 as age_years, false as ltfu_in_month, false as reinitiated_in_month
        union all
        select '2026-01-01'::date, '2026-01-31'::date, 'pat_l', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 0, null::int, 'male', 41, false, false
        union all
        select '2026-01-01'::date, '2026-01-31'::date, 'pat_t', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 0, null::int, 'male', 41, false, false
        union all
        select '2026-02-01'::date, '2026-02-28'::date, 'pat_back', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 1, null::int, 'male', 41, false, false
        union all
        select '2026-02-01'::date, '2026-02-28'::date, 'pat_l', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 1, null::int, 'male', 41, false, false
        union all
        select '2026-02-01'::date, '2026-02-28'::date, 'pat_t', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 1, null::int, 'male', 41, false, false
        union all
        select '2026-03-01'::date, '2026-03-31'::date, 'pat_back', 'fac_a', false, true, null::date, '2026-01-05'::date, null::boolean, null::date, 2, null::int, 'male', 41, false, false
        union all
        select '2026-03-01'::date, '2026-03-31'::date, 'pat_l', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 2, null::int, 'male', 41, false, false
        union all
        select '2026-03-01'::date, '2026-03-31'::date, 'pat_t', 'fac_a', false, true, null::date, '2026-01-05'::date, null::boolean, null::date, 2, null::int, 'male', 41, false, false
        union all
        select '2026-04-01'::date, '2026-04-30'::date, 'pat_back', 'fac_a', false, true, null::date, '2026-01-05'::date, null::boolean, null::date, 3, null::int, 'male', 41, false, false
        union all
        select '2026-04-01'::date, '2026-04-30'::date, 'pat_l', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 3, null::int, 'male', 41, false, false
        union all
        select '2026-04-01'::date, '2026-04-30'::date, 'pat_t', 'fac_a', false, true, null::date, '2026-01-05'::date, null::boolean, null::date, 3, null::int, 'male', 41, false, false
        union all
        select '2026-05-01'::date, '2026-05-31'::date, 'pat_back', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 4, null::int, 'male', 41, false, true
        union all
        select '2026-05-01'::date, '2026-05-31'::date, 'pat_l', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 4, null::int, 'male', 41, false, false
        union all
        select '2026-05-01'::date, '2026-05-31'::date, 'pat_t', 'fac_a', false, true, null::date, '2026-01-05'::date, null::boolean, null::date, 4, null::int, 'male', 41, false, false
        union all
        select '2026-06-01'::date, '2026-06-30'::date, 'pat_back', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 5, null::int, 'male', 41, false, false
        union all
        select '2026-06-01'::date, '2026-06-30'::date, 'pat_l', 'fac_a', true, true, null::date, '2026-01-05'::date, null::boolean, null::date, 5, null::int, 'male', 41, false, false
        union all
        select '2026-06-01'::date, '2026-06-30'::date, 'pat_t', 'fac_a', false, true, null::date, '2026-01-05'::date, null::boolean, null::date, 5, null::int, 'male', 41, false, false
