unit_tests:
  - name: test_metric__procedure_segment_scope
    model: metric__procedure
    description: >
      BL-001, BL-003 (metric__procedure). What this metric decides for itself over the segment clinical__procedure_occurrence
      resolves (its BL-005). proc1 and proc2 sit on segments of different types and both
      appear, each carrying its own segment's encounter_type -- so a consumer filtering to
      one setting gets that setting's procedures.

      BL-010. proc4's segment is vaccination-typed, which map__omop_visit_type puts under
      OMOP 9202 alongside clinic and imaging, so it carries 9202 Outpatient Visit while
      encounter_type is 'vaccination' -- 9202 is wider than encounter_type = 'clinic'.
      proc5's segment is triage-typed and carries 9203 Emergency Room Visit. proc3's FK is NULL, which
      clinical__procedure_occurrence emits where an encounter has no mapped segment, and is
      dropped rather than surfaced without a setting. img1 is the imaging branch and is not
      this metric's population (BL-001).

      The as-of match and the first-segment clamp are not this model's behaviour and are
      covered once, upstream, by
      test_clinical__procedure_occurrence_visit_detail_resolution. Facility attribution is
      covered by test_metric__procedure_facility_attribution.
    given:
      - input: ref('clinical__procedure_occurrence')
        format: sql
        rows: |
          select 'proc1' as procedure_occurrence_id, 'p1' as person_id, '2026-02-01'::date as procedure_date, '2026-02-01 10:00:00'::timestamp as procedure_datetime, 32817 as procedure_type_concept_id, 'procedure' as procedure_type_source_value, 'u1' as provider_id, 'e10' as visit_occurrence_id, 'vd10a' as visit_detail_id, 'loc1' as location_id, 'code1' as procedure_source_value, 'Procedure One' as procedure_source_name, true as is_completed
          union all
          select 'proc2', 'p1', '2026-02-02'::date, '2026-02-02 10:00:00'::timestamp, 32817, 'procedure', 'u1', 'e11', 'vd11a', 'loc1', 'code2', 'Procedure Two', true
          union all
          select 'proc3', 'p1', '2026-02-03'::date, '2026-02-03 08:00:00'::timestamp, 32817, 'procedure', 'u1', 'e12', null::varchar, 'loc1', 'code3', 'Procedure Three', true
          union all
          select 'img1', 'p1', '2026-02-04'::date, '2026-02-04 08:00:00'::timestamp, 32817, 'imaging request', 'u1', 'e10', 'vd10a', 'loc1', 'xRay', 'X-Ray', true
          union all
          select 'proc4', 'p1', '2026-02-05'::date, '2026-02-05 10:00:00'::timestamp, 32817, 'procedure', 'u1', 'e13', 'vd13a', 'loc1', 'code4', 'Procedure Four', true
          union all
          select 'proc5', 'p1', '2026-02-06'::date, '2026-02-06 10:00:00'::timestamp, 32817, 'procedure', 'u1', 'e14', 'vd14a', 'loc1', 'code5', 'Procedure Five', true

      - input: ref('clinical__visit_detail')
        format: sql
        rows: |
          select 'vd10a' as visit_detail_id, 'e10' as visit_occurrence_id, 'p1' as person_id, 9202 as visit_detail_concept_id, 'Outpatient Visit' as visit_detail_concept_name, '2026-02-01'::date as visit_detail_start_date, '2026-02-01 08:00:00'::timestamp as visit_detail_start_datetime, null::date as visit_detail_end_date, null::timestamp as visit_detail_end_datetime, 'loc1' as care_site_id, 'dep1' as department_id, 'prov1' as provider_id, 'clinic' as visit_detail_source_value, null::varchar as preceding_visit_detail_id
          union all
          select 'vd11a', 'e11', 'p1', 9201, 'Inpatient Visit', '2026-02-02'::date, '2026-02-02 08:00:00'::timestamp, null::date, null::timestamp, 'loc1', null::varchar, 'prov1', 'admission', null::varchar
          union all
          select 'vd13a', 'e13', 'p1', 9202, 'Outpatient Visit', '2026-02-05'::date, '2026-02-05 08:00:00'::timestamp, null::date, null::timestamp, 'loc1', null::varchar, 'prov1', 'vaccination', null::varchar
          union all
          select 'vd14a', 'e14', 'p1', 9203, 'Emergency Room Visit', '2026-02-06'::date, '2026-02-06 08:00:00'::timestamp, null::date, null::timestamp, 'loc1', null::varchar, 'prov1', 'triage', null::varchar

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'p1' as person_id, 'MRN1' as person_source_value, null::int as gender_concept_id, 'female' as gender_source_value, 1996 as year_of_birth, 1 as month_of_birth, 1 as day_of_birth, null::timestamp as birth_datetime, null::varchar as ethnicity_source_value, null::varchar as location_id

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc1' as id, 'LOC1' as code, 'Location 1' as name, null::int as max_occupancy, null::varchar as location_group_id, 'fac1' as facility_id, 'current' as visibility_status

      - input: ref('departments')
        format: sql
        rows: |
          select 'dep1' as id, 'DEP1' as code, 'Dental' as name, 'fac1' as facility_id, 'current' as visibility_status

    expect:
      format: sql
      rows: |
        select 'procedure' as metric_id, null::text as variant_id, 'proc1' as subject_id, '2026-02-01'::date as period_start, null::date as period_end, 'day' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac1' as facility_id, 'clinic' as encounter_type, 9202 as visit_detail_concept_id, 'Outpatient Visit' as visit_detail_concept_name, 'female' as sex, 'Procedure One' as procedure, 'code1' as procedure_code, true as is_completed, 30 as age_years, 'Dental' as department
        union all
        select 'procedure', null::text, 'proc2', '2026-02-02'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'admission', 9201, 'Inpatient Visit', 'female', 'Procedure Two', 'code2', true, 30, 'Not recorded'
        union all
        select 'procedure', null::text, 'proc4', '2026-02-05'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'vaccination', 9202, 'Outpatient Visit', 'female', 'Procedure Four', 'code4', true, 30, 'Not recorded'
        union all
        select 'procedure', null::text, 'proc5', '2026-02-06'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'triage', 9203, 'Emergency Room Visit', 'female', 'Procedure Five', 'code5', true, 30, 'Not recorded'
