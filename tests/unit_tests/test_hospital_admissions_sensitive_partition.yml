unit_tests:
  - name: test_int__admission_history_location_partition
    model: int__admission_history_location
    description: >
      Pins BL-012 on the standard variant: it reads `facilities`, so an episode at a facility
      absent from that base is dropped. The partition reaches the three reports through this
      intermediate, and a report-level unit test must stub this model, so the intermediate's
      choice of base is asserted here instead. The bases' own split is
      test_facilities_partition.
    overrides:
      vars:
        timezone: UTC
    given:
      - input: ref('encounter_history')
        format: sql
        rows: |
          select 'eh_std'::text as id, 'enc_std'::text as encounter_id, '2024-01-10 09:00:00'::timestamp as datetime,
                 'loc_std'::text as location_id, null::text[] as change_type, 'admission'::text as encounter_type
          union all
          select 'eh_sen', 'enc_sen', '2024-01-10 09:00:00'::timestamp, 'loc_sen', null::text[], 'admission'
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_std'::text as id, 'pat_001'::text as patient_id,
                 '2024-01-10 09:00:00'::timestamp as start_datetime,
                 '2024-01-12 09:00:00'::timestamp as end_datetime
          union all
          select 'enc_sen', 'pat_001', '2024-01-10 09:00:00'::timestamp, '2024-01-12 09:00:00'::timestamp
      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001'::text as id, null::timestamp as date_of_death
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_std'::text as id, 'Std Room'::text as name, 'lg_std'::text as location_group_id, 'fac_std'::text as facility_id
          union all
          select 'loc_sen', 'Sen Room', 'lg_sen', 'fac_sen'
      - input: ref('location_groups')
        format: sql
        rows: |
          select 'lg_std'::text as id, 'Standard Ward'::text as name
          union all
          select 'lg_sen', 'Sensitive Ward'
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_std'::text as id, 'Standard Hospital'::text as name, null::text as sensitive_network_id
    expect:
      format: sql
      rows: |
        select
          'enc_std'::text     as encounter_id,
          'lg_std'::text      as location_group_id,
          'Standard Ward'::text as location_group,
          'loc_std'::text     as location_id,
          'Std Room'::text    as location,
          'fac_std'::text     as facility_id,
          'Standard Hospital'::text as facility,
          '2024-01-10 09:00:00'::timestamp as start_datetime,
          '2024-01-12 09:00:00'::timestamp as end_datetime,
          2                   as length_of_stay,
          true                as admission,
          true                as discharge,
          false               as transfer_in,
          false               as transfer_out,
          false               as death

  - name: test_int__sensitive_admission_history_location_partition
    model: int__sensitive_admission_history_location
    description: >
      The other half of BL-012: the sensitive variant reads `sensitive_facilities`, so it
      carries the sensitive facility's episode and drops the one at a facility absent from that
      base. A sensitive variant reading `facilities` fails here, as that input is not stubbed.
    overrides:
      vars:
        timezone: UTC
    given:
      - input: ref('encounter_history')
        format: sql
        rows: |
          select 'eh_std'::text as id, 'enc_std'::text as encounter_id, '2024-01-10 09:00:00'::timestamp as datetime,
                 'loc_std'::text as location_id, null::text[] as change_type, 'admission'::text as encounter_type
          union all
          select 'eh_sen', 'enc_sen', '2024-01-10 09:00:00'::timestamp, 'loc_sen', null::text[], 'admission'
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_std'::text as id, 'pat_001'::text as patient_id,
                 '2024-01-10 09:00:00'::timestamp as start_datetime,
                 '2024-01-12 09:00:00'::timestamp as end_datetime
          union all
          select 'enc_sen', 'pat_001', '2024-01-10 09:00:00'::timestamp, '2024-01-12 09:00:00'::timestamp
      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001'::text as id, null::timestamp as date_of_death
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_std'::text as id, 'Std Room'::text as name, 'lg_std'::text as location_group_id, 'fac_std'::text as facility_id
          union all
          select 'loc_sen', 'Sen Room', 'lg_sen', 'fac_sen'
      - input: ref('location_groups')
        format: sql
        rows: |
          select 'lg_std'::text as id, 'Standard Ward'::text as name
          union all
          select 'lg_sen', 'Sensitive Ward'
      - input: ref('sensitive_facilities')
        format: sql
        rows: |
          select 'fac_sen'::text as id, 'Sensitive Hospital'::text as name, 'sn_001'::text as sensitive_network_id
    expect:
      format: sql
      rows: |
        select
          'enc_sen'::text     as encounter_id,
          'lg_sen'::text      as location_group_id,
          'Sensitive Ward'::text as location_group,
          'loc_sen'::text     as location_id,
          'Sen Room'::text    as location,
          'fac_sen'::text     as facility_id,
          'Sensitive Hospital'::text as facility,
          '2024-01-10 09:00:00'::timestamp as start_datetime,
          '2024-01-12 09:00:00'::timestamp as end_datetime,
          2                   as length_of_stay,
          true                as admission,
          true                as discharge,
          false               as transfer_in,
          false               as transfer_out,
          false               as death

  - name: test_int__admission_history_department_partition
    model: int__admission_history_department
    description: >
      BL-012 on the department intermediate's standard variant. The department intermediate
      picks its facility base in a separate line of SQL from the location one, so it needs its
      own assertion: without this, a wrong base there would leave the suite green while a
      sensitive facility's named death counts returned to the standard -by-department report.
    overrides:
      vars:
        timezone: UTC
    given:
      - input: ref('encounter_history')
        format: sql
        rows: |
          select 'eh_std'::text as id, 'enc_std'::text as encounter_id, '2024-01-10 09:00:00'::timestamp as datetime,
                 'dep_std'::text as department_id, null::text[] as change_type, 'admission'::text as encounter_type
          union all
          select 'eh_sen', 'enc_sen', '2024-01-10 09:00:00'::timestamp, 'dep_sen', null::text[], 'admission'
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_std'::text as id, 'pat_001'::text as patient_id,
                 '2024-01-10 09:00:00'::timestamp as start_datetime,
                 '2024-01-12 09:00:00'::timestamp as end_datetime
          union all
          select 'enc_sen', 'pat_001', '2024-01-10 09:00:00'::timestamp, '2024-01-12 09:00:00'::timestamp
      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001'::text as id, null::timestamp as date_of_death
      - input: ref('departments')
        format: sql
        rows: |
          select 'dep_std'::text as id, 'Std Dept'::text as name, 'fac_std'::text as facility_id
          union all
          select 'dep_sen', 'Sen Dept', 'fac_sen'
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_std'::text as id, 'Standard Hospital'::text as name, null::text as sensitive_network_id
    expect:
      format: sql
      rows: |
        select
          'enc_std'::text     as encounter_id,
          'dep_std'::text     as department_id,
          'Std Dept'::text    as department,
          'fac_std'::text     as facility_id,
          'Standard Hospital'::text as facility,
          '2024-01-10 09:00:00'::timestamp as start_datetime,
          '2024-01-12 09:00:00'::timestamp as end_datetime,
          2                   as length_of_stay,
          true                as admission,
          true                as discharge,
          false               as transfer_in,
          false               as transfer_out,
          false               as death

