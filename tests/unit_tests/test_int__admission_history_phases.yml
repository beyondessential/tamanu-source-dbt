unit_tests:
  - name: test_int__admission_history_location_phases
    model: int__admission_history_location
    description: >
      Pins BL-014: consecutive rows that did not move the patient are one episode, and the
      two event flags are aggregated differently because the two events differ in shape.

      enc_stay has two history rows in Bed 1 — an arrival, then an encounter_type change
      that converted the encounter to an admission without moving anyone. Both qualify for
      the log, because it admits encounter_type changes as well as location changes, so
      before the collapse this produced two episodes in the same bed and the first read as
      a transfer OUT of a bed the patient never left.

      It is now one episode carrying both events: the patient was transferred in and was
      admitted, in that bed. Keeping only the opening row's type would have discarded the
      admission, which is why `admission` is true if ANY row in the run carried one.

      enc_restated is the case that stops `transfer_in` being aggregated the same way. It
      is created in Bed 1 — so its first episode is an arrival, not a transfer — and then
      carries a later `location` change that names Bed 1 again, moving nobody. The log
      types that row `transfer-in` because it did not change the encounter type, so a
      `bool_or` would flag the encounter's FIRST episode as a transfer into a bed the
      patient was admitted to directly, with no transfer out anywhere to match it. Taking
      the opening row's type instead, `transfer_in` is false and `admission` is true.

      enc_move is the control — a genuine move from Bed 1 to Bed 2 still yields two
      episodes, the first with transfer_out set.

      enc_stay and enc_move both open on a bare `location` change rather than a creation
      row, which reaches the mid-run shape in fewer rows but is not the well-formed
      history BL-006's transfer identity is stated over. See the note under BL-006.
    overrides:
      vars:
        timezone: UTC
    given:
      - input: ref('encounter_history')
        format: sql
        rows: |
          select 'h1'::text as id, 'enc_stay'::text as encounter_id,
                 '2024-01-10 09:00:00'::timestamp as datetime, 'loc_1'::text as location_id,
                 array['location'] as change_type, 'admission'::text as encounter_type
          union all
          select 'h2', 'enc_stay', '2024-01-11 09:00:00'::timestamp, 'loc_1',
                 array['encounter_type'], 'admission'
          union all
          select 'h3', 'enc_move', '2024-02-10 09:00:00'::timestamp, 'loc_1',
                 array['location'], 'admission'
          union all
          select 'h4', 'enc_move', '2024-02-12 09:00:00'::timestamp, 'loc_2',
                 array['location'], 'admission'
          union all
          select 'h5', 'enc_restated', '2024-03-05 09:00:00'::timestamp, 'loc_1',
                 null::text[], 'admission'
          union all
          select 'h6', 'enc_restated', '2024-03-06 09:00:00'::timestamp, 'loc_1',
                 array['location'], 'admission'
      - &phases_encounters
        input: ref('encounters')
        format: sql
        rows: |
          select 'enc_stay'::text as id, 'pat_1'::text as patient_id,
                 '2024-01-10 09:00:00'::timestamp as start_datetime,
                 '2024-01-13 09:00:00'::timestamp as end_datetime
          union all
          select 'enc_move', 'pat_1', '2024-02-10 09:00:00'::timestamp, '2024-02-14 09:00:00'::timestamp
          union all
          select 'enc_restated', 'pat_1', '2024-03-05 09:00:00'::timestamp, '2024-03-08 09:00:00'::timestamp
      - &phases_patients
        input: ref('patients')
        format: sql
        rows: |
          select 'pat_1'::text as id, null::timestamp as date_of_death
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_1'::text as id, 'Bed 1'::text as name, 'lg_1'::text as location_group_id,
                 'fac_1'::text as facility_id
          union all
          select 'loc_2', 'Bed 2', 'lg_1', 'fac_1'
      - input: ref('location_groups')
        format: sql
        rows: |
          select 'lg_1'::text as id, 'Ward'::text as name
      - &phases_facilities
        input: ref('facilities')
        format: sql
        rows: |
          select 'fac_1'::text as id, 'Hospital'::text as name, false as is_sensitive

    expect:
      format: sql
      rows: |
        select
          'enc_stay'::text  as encounter_id,
          'lg_1'::text      as location_group_id,
          'Ward'::text      as location_group,
          'loc_1'::text     as location_id,
          'Bed 1'::text     as location,
          'fac_1'::text     as facility_id,
          'Hospital'::text  as facility,
          '2024-01-10 09:00:00'::timestamp as start_datetime,
          '2024-01-13 09:00:00'::timestamp as end_datetime,
          3                 as length_of_stay,
          true              as admission,
          true              as discharge,
          true              as transfer_in,
          false             as transfer_out,
          false             as death
        union all
        select 'enc_move', 'lg_1', 'Ward', 'loc_1', 'Bed 1', 'fac_1', 'Hospital',
               '2024-02-10 09:00:00'::timestamp, '2024-02-12 09:00:00'::timestamp,
               2, false, false, true, true, false
        union all
        select 'enc_move', 'lg_1', 'Ward', 'loc_2', 'Bed 2', 'fac_1', 'Hospital',
               '2024-02-12 09:00:00'::timestamp, '2024-02-14 09:00:00'::timestamp,
               2, false, true, true, false, false
        union all
        select 'enc_restated', 'lg_1', 'Ward', 'loc_1', 'Bed 1', 'fac_1', 'Hospital',
               '2024-03-05 09:00:00'::timestamp, '2024-03-08 09:00:00'::timestamp,
               3, true, true, false, false, false

  - name: test_int__admission_history_department_phases
    model: int__admission_history_department
    description: >
      The department spine's half of BL-014. It collapses on `department_id` where the
      location spine collapses on `location_id`, and the two are independent — a patient
      can change bed without changing department and the reverse — so the department
      collapse needs its own fixture rather than riding on the location one. The
      encounters, patients and facilities fixtures are shared with the location test
      above; only the history and the dimension tables differ.

      enc_stay is admitted to General Medicine and then converted in place, which qualifies
      for the log without moving anyone. One episode, carrying both events.

      enc_restated pins why `transfer_in` is the opening row's type and not a `bool_or`
      over the run: it is created in General Medicine, so its first episode is an arrival,
      then carries a later `department` change naming General Medicine again. That row is
      typed `transfer-in` by the log because it left the encounter type alone, and
      aggregating it would report a transfer into a department the patient was admitted to
      directly, with no transfer out to match.

      enc_move is the control — a real move to Surgery still yields two episodes.
    overrides:
      vars:
        timezone: UTC
    given:
      - input: ref('encounter_history')
        format: sql
        rows: |
          select 'h1'::text as id, 'enc_stay'::text as encounter_id,
                 '2024-01-10 09:00:00'::timestamp as datetime, 'dep_1'::text as department_id,
                 array['department'] as change_type, 'admission'::text as encounter_type
          union all
          select 'h2', 'enc_stay', '2024-01-11 09:00:00'::timestamp, 'dep_1',
                 array['encounter_type'], 'admission'
          union all
          select 'h3', 'enc_move', '2024-02-10 09:00:00'::timestamp, 'dep_1',
                 array['department'], 'admission'
          union all
          select 'h4', 'enc_move', '2024-02-12 09:00:00'::timestamp, 'dep_2',
                 array['department'], 'admission'
          union all
          select 'h5', 'enc_restated', '2024-03-05 09:00:00'::timestamp, 'dep_1',
                 null::text[], 'admission'
          union all
          select 'h6', 'enc_restated', '2024-03-06 09:00:00'::timestamp, 'dep_1',
                 array['department'], 'admission'
      - *phases_encounters
      - *phases_patients
      - input: ref('departments')
        format: sql
        rows: |
          select 'dep_1'::text as id, 'General Medicine'::text as name, 'fac_1'::text as facility_id
          union all
          select 'dep_2', 'Surgery', 'fac_1'
      - *phases_facilities

    expect:
      format: sql
      rows: |
        select
          'enc_stay'::text          as encounter_id,
          'dep_1'::text             as department_id,
          'General Medicine'::text  as department,
          'fac_1'::text             as facility_id,
          'Hospital'::text          as facility,
          '2024-01-10 09:00:00'::timestamp as start_datetime,
          '2024-01-13 09:00:00'::timestamp as end_datetime,
          3                 as length_of_stay,
          true              as admission,
          true              as discharge,
          true              as transfer_in,
          false             as transfer_out,
          false             as death
        union all
        select 'enc_move', 'dep_1', 'General Medicine', 'fac_1', 'Hospital',
               '2024-02-10 09:00:00'::timestamp, '2024-02-12 09:00:00'::timestamp,
               2, false, false, true, true, false
        union all
        select 'enc_move', 'dep_2', 'Surgery', 'fac_1', 'Hospital',
               '2024-02-12 09:00:00'::timestamp, '2024-02-14 09:00:00'::timestamp,
               2, false, true, true, false, false
        union all
        select 'enc_restated', 'dep_1', 'General Medicine', 'fac_1', 'Hospital',
               '2024-03-05 09:00:00'::timestamp, '2024-03-08 09:00:00'::timestamp,
               3, true, true, false, false, false
