unit_tests:
  - name: ac_003_int__patient_address_resolution
    model: int__patient_address
    description: >-
      AC-003 to AC-007 of specs/dbt-model/ref__location.md. p1 resolves every level from its
      village's hierarchy. p2's recorded subdivision and division are kept over its village's.
      p3 has only a recorded subdivision and takes that subdivision's division. p4's village
      reaches its subdivision through a settlement. p5 and p6 record no address and get no key.
    given:
      - input: ref('reference_data')
        format: sql
        rows: |
          select 'v1' as id, 'village' as type
          union all select 'v2', 'village'
          union all select 'st1', 'settlement'
          union all select 'sd1', 'subdivision'
          union all select 'sd2', 'subdivision'
          union all select 'sd3', 'subdivision'
          union all select 'dv1', 'division'
          union all select 'dv2', 'division'
          union all select 'c1', 'country'
          union all select 'eth1', 'ethnicity'
      - input: ref('reference_data_relations')
        format: sql
        rows: |
          select 'v1' as reference_data_id, 'sd1' as reference_data_parent_id
          union all select 'sd1', 'dv1'
          union all select 'dv1', 'c1'
          union all select 'v2', 'st1'
          union all select 'st1', 'sd2'
          union all select 'sd2', 'dv1'
          union all select 'sd3', 'dv2'
          union all select 'v1', 'eth1'
      - input: ref('patients')
        format: sql
        rows: |
          select 'p1' as id, 'v1' as village_id
          union all select 'p2', 'v1'
          union all select 'p3', null
          union all select 'p4', 'v2'
          union all select 'p5', null
          union all select 'p6', null
      - input: ref('patient_additional_data')
        format: sql
        rows: |
          select 'p2' as patient_id, 'sd3' as subdivision_id, 'dv2' as division_id
          union all select 'p3', 'sd1', null
          union all select 'p5', null, null
    expect:
      format: sql
      rows: |
        select 'p1' as patient_id, 'v1' as village_id, 'sd1' as subdivision_id, 'dv1' as division_id, 'c1' as country_id, 'v1_sd1_dv1' as location_id
        union all select 'p2', 'v1', 'sd3', 'dv2', 'c1', 'v1_sd3_dv2'
        union all select 'p3', null, 'sd1', 'dv1', 'c1', 'unknown_sd1_dv1'
        union all select 'p4', 'v2', 'sd2', 'dv1', 'c1', 'v2_sd2_dv1'
        union all select 'p5', null, null, null, null, null
        union all select 'p6', null, null, null, null, null

  - name: ac_008_ref__location_one_row_per_address
    model: ref__location
    description: >-
      AC-008 of specs/dbt-model/ref__location.md. Two patients at the same address collapse to
      one row, a patient with no address emits none, and each row carries the names and ids of
      its levels.
    given:
      - input: ref('int__patient_address')
        format: sql
        rows: |
          select 'p1' as patient_id, 'v1' as village_id, 'sd1' as subdivision_id, 'dv1' as division_id, 'c1' as country_id, 'v1_sd1_dv1' as location_id
          union all select 'p2', 'v1', 'sd1', 'dv1', 'c1', 'v1_sd1_dv1'
          union all select 'p3', null, 'sd1', 'dv1', 'c1', 'unknown_sd1_dv1'
          union all select 'p4', null, null, null, null, null
      - input: ref('reference_data')
        format: sql
        rows: |
          select 'v1' as id, 'Vila' as name
          union all select 'sd1', 'Subdistrict'
          union all select 'dv1', 'Division One'
          union all select 'c1', 'Countryland'
    expect:
      format: sql
      rows: |
        select
          'v1_sd1_dv1' as location_id,
          'v1_sd1_dv1' as location_source_value,
          'Vila' as city,
          'Subdistrict' as county,
          'Division One' as state,
          'Countryland' as country_source_value,
          'v1' as village_id,
          'sd1' as subdivision_id,
          'dv1' as division_id,
          'c1' as country_id
        union all select
          'unknown_sd1_dv1', 'unknown_sd1_dv1', null, 'Subdistrict', 'Division One', 'Countryland',
          null, 'sd1', 'dv1', 'c1'
