unit_tests:
  - name: test_ref__care_site_location_denormalises_facility
    model: ref__care_site_location
    description: >-
      A location becomes a care_site_type='location' row, denormalised with its parent
      facility and place-of-service concept (BL-001, BL-002, BL-003, BL-006).
    given:
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc1' as id, 'LOC1' as code, 'Room 4 Bed 2' as name, 'fac1' as facility_id, null::varchar as location_group_id
      - input: ref('location_groups')
        format: sql
        rows: |
          select null::varchar as id, null::varchar as facility_id where false
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type
    expect:
      format: sql
      rows: |
        select
          'loc1' as care_site_id, 'location' as care_site_type,
          'Room 4 Bed 2' as care_site_name, 'LOC1' as care_site_source_value,
          'hospital' as place_of_service_source_value,
          'fac1' as facility_id, 'General Hospital' as facility_name

  - name: test_ref__care_site_location_group_facility_fallback
    model: ref__care_site_location
    description: >-
      A location with no facility of its own takes its location group's facility (BL-008).
    given:
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc2' as id, 'LOC2' as code, 'Ward 3 Bed 1' as name, null::varchar as facility_id, 'lg1' as location_group_id
      - input: ref('location_groups')
        format: sql
        rows: |
          select 'lg1' as id, 'fac1' as facility_id
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type
    expect:
      format: sql
      rows: |
        select
          'loc2' as care_site_id, 'location' as care_site_type,
          'Ward 3 Bed 1' as care_site_name, 'LOC2' as care_site_source_value,
          'hospital' as place_of_service_source_value,
          'fac1' as facility_id, 'General Hospital' as facility_name

  - name: test_ref__care_site_location_own_facility_wins
    model: ref__care_site_location
    description: >-
      A location whose own facility differs from its location group's keeps its own
      facility (BL-008).
    given:
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc3' as id, 'LOC3' as code, 'Clinic Room 1' as name, 'fac1' as facility_id, 'lg2' as location_group_id
      - input: ref('location_groups')
        format: sql
        rows: |
          select 'lg2' as id, 'fac2' as facility_id
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac1' as id, 'FAC1' as code, 'General Hospital' as name, 'hospital' as type
          union all select 'fac2', 'FAC2', 'Health Centre', 'health_centre'
    expect:
      format: sql
      rows: |
        select
          'loc3' as care_site_id, 'location' as care_site_type,
          'Clinic Room 1' as care_site_name, 'LOC3' as care_site_source_value,
          'hospital' as place_of_service_source_value,
          'fac1' as facility_id, 'General Hospital' as facility_name
