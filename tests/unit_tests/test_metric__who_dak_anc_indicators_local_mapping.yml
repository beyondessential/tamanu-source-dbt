unit_tests:
  - name: test_metric__who_dak_anc_indicators_local_mapping
    model: metric__who_dak_anc_indicators
    description: >
      AC-009 (specs/dbt-model/metric__who_dak_anc_indicators.md). A local antenatal chart mapped
      as a contact form is a contact on its mapped contact date, carrying gestational age from a
      mapped local booking form the same day. A mapped form without is_contact, a native
      non-contact form, and an unmapped survey carrying a mapped question code each yield
      nothing on their own.
    overrides:
      vars:
        who_dak_anc_local_surveys:
          program-local-antenatalchart:
            is_contact: true
            data_elements:
              ANC.A7.DE4: LocalChartDate
          program-local-booking:
            data_elements:
              ANC.B6.DE17: LocalGestation
    given:
      - input: ref('program_data_elements')
        format: sql
        rows: |
          select 'pde-LocalChartDate'::text as id, 'LocalChartDate'::text as code
          union all
          select 'pde-LocalGestation', 'LocalGestation'
          union all
          select 'pde-whodakanc-b6-de17', 'whodakanc-b6-de17'
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_1'::text as id, 'fac_1'::text as facility_id
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_1'::text as id, 'pat_1'::text as patient_id, 'loc_1'::text as location_id
          union all
          select 'enc_2', 'pat_1', 'loc_1'
          union all
          select 'enc_3', 'pat_2', 'loc_1'
          union all
          select 'enc_4', 'pat_3', 'loc_1'
          union all
          select 'enc_5', 'pat_4', 'loc_1'
      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'pat_1'::text as person_id, 1990::int as year_of_birth, 1::int as month_of_birth, 1::int as day_of_birth
          union all
          select 'pat_2', 1990, 1, 1
          union all
          select 'pat_3', 1990, 1, 1
          union all
          select 'pat_4', 1990, 1, 1
      - input: ref('survey_responses')
        format: sql
        rows: |
          select
            'r_1'::text as id, 'program-local-antenatalchart'::text as survey_id, 'enc_1'::text as encounter_id,
            '2026-05-07 09:00:00'::timestamp as start_datetime, '2026-05-07 09:05:00'::timestamp as end_datetime
          union all
          select 'r_2', 'program-local-booking', 'enc_2', '2026-05-06 08:00:00'::timestamp, '2026-05-06 08:30:00'::timestamp
          union all
          select 'r_3', 'program-local-booking', 'enc_3', '2026-05-06 08:00:00'::timestamp, '2026-05-06 08:30:00'::timestamp
          union all
          select 'r_4', 'program-whodakanc-profile', 'enc_4', '2026-05-06 08:00:00'::timestamp, '2026-05-06 08:30:00'::timestamp
          union all
          select 'r_5', 'program-unmapped', 'enc_5', '2026-05-06 08:00:00'::timestamp, '2026-05-06 08:30:00'::timestamp
      - input: ref('survey_response_answers')
        format: sql
        rows: |
          select 'a_1'::text as id, 'r_1'::text as response_id, 'pde-LocalChartDate'::text as data_element_id, '2026-05-06'::text as body
          union all
          select 'a_2', 'r_2', 'pde-LocalGestation', '24.5'
          union all
          select 'a_3', 'r_3', 'pde-LocalGestation', '18'
          union all
          select 'a_4', 'r_4', 'pde-whodakanc-b6-de17', '12'
          union all
          select 'a_5', 'r_5', 'pde-LocalChartDate', '2026-05-06'
    expect:
      rows:
        - {subject_id: 'pat_1;2026-05-06', period_start: '2026-05-06', facility_id: fac_1, person_id: pat_1, gestational_age_weeks: 24.5}
