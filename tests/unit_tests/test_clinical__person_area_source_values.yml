unit_tests:
  - name: ac_013_clinical__person_area_source_values
    model: clinical__person
    description: >-
      AC-013 (BL-009): the division, subdivision and medical area ids recorded on a patient's
      additional data are carried as-is. pat_1 has all three, pat_2 has a division only, and pat_3
      has no additional-data record at all, so all three are NULL and the patient is still
      returned (BL-005).
    given:
      - input: ref('patients')
        format: sql
        rows: |
          select
            'pat_1' as id, 'P1' as display_id, 'female' as sex,
            '1990-01-01'::date as date_of_birth, null::text as village_id
          union all
          select 'pat_2', 'P2', 'male', '1985-06-15'::date, null
          union all
          select 'pat_3', 'P3', 'male', '2000-03-03'::date, null
      - input: ref('patient_additional_data')
        format: sql
        rows: |
          select
            'pat_1' as patient_id, null::text as ethnicity_id, 'div_central' as division_id,
            'subdiv_rewa' as subdivision_id, 'ma_suva' as medical_area_id
          union all
          select 'pat_2', null, 'div_western', null, null
      - input: ref('patient_birth_data')
        format: sql
        rows: |
          select null::text as patient_id, null::time as birth_time where false
      - input: ref('map__omop_sex')
        format: sql
        rows: |
          select 'female' as local_code, 8532 as concept_id
          union all
          select 'male', 8507
      - input: ref('map__omop_ethnicity')
        format: sql
        rows: |
          select null::text as local_code, null::int as concept_id where false
    expect:
      rows:
        - person_id: pat_1
          division_source_value: div_central
          subdivision_source_value: subdiv_rewa
          medical_area_source_value: ma_suva
        - person_id: pat_2
          division_source_value: div_western
          subdivision_source_value: null
          medical_area_source_value: null
        - person_id: pat_3
          division_source_value: null
          subdivision_source_value: null
          medical_area_source_value: null
