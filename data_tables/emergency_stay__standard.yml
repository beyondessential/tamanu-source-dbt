# Standard presentation of the ed_stay metric. See README.md for the schema.

data_table: emergency_stay__standard
model: metric__emergency_stay
description: >-
  Emergency department stays, one row per attendance from arrival in the department to
  departure from it, banded by the WHO primary age classification and split at four hours in
  the department.

metrics:
  # BL-011: one stay per row, so the sum is a stay count at every grain.
  - column: value_numeric
    aggregation: sum

columns:
  - name: metric_id
    filter: array
  # Minute-grained timestamp, ranged as a date. period_end is deliberately not exposed: a
  # patient still in the department has none, and an array filter would drop them.
  - name: period_start
    filter: date
  - name: facility_id
    filter: array
  - name: sex
    filter: array
  - name: triage_score
    filter: array
  - name: discharge_disposition
    filter: array

  # BL-004: the model emits age in whole years; the classification is this data table's.
  # Bands and labels match macros/age_group__who_primary_classification.sql, including its
  # treatment of an age over 120 as unknown.
  - name: age_group__who_primary_classification
    filter: array
    derived_from:
      column: age_years
      unmatched_label: Unknown age
      bands:
        - { label: '0-14 years', gte: 0, lt: 15 }
        - { label: '15-24 years', gte: 15, lt: 25 }
        - { label: '25-44 years', gte: 25, lt: 45 }
        - { label: '45-59 years', gte: 45, lt: 60 }
        - { label: '60-74 years', gte: 60, lt: 75 }
        - { label: '75+ years', gte: 75, lt: 121 }

  # BL-015: time in the emergency department, split at four hours. 'Unknown' is a patient
  # still in the department with no transfer booked, so their stay has no length yet.
  - name: ed_time__4_hours_band
    filter: array
    derived_from:
      column: ed_time__minutes
      unmatched_label: Unknown
      bands:
        - { label: '< 4 hours', lt: 240 }
        - { label: '4 or more hours', gte: 240 }
