      name: was_pregnant
    was_stillborn:
      data_type: character varying(255)
      description: Whether the deceased was themselves stillborn.
      name: was_stillborn
    was_within_day_of_birth:
      data_type: boolean
      description: If the deceased was a foetus, stillborn, or infant, whether their
        passing was on the day of their birth.
      name: was_within_day_of_birth
