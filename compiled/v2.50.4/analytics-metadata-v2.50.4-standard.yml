        In Tamanu, this is set by a supervisor after review, and cannot be reversed;
        it causes all fields to

        become read-only. The only way to undo this record is through a `death_revert_logs`.'
      name: is_final
    last_surgery_date:
      data_type: date
      description: Datetime of the most recent surgery the patient received, if any.
      name: last_surgery_date
    last_surgery_reason_id:
      data_type: character varying(255)
      description: 'Reference to a `diagnosis` ([Reference Data](#!/source/source.tamanu.tamanu.reference_data))
        for the

        reason of the most recent surgery the patient received, if any.'
      name: last_surgery_reason_id
