      data_type: character varying(255)
      description: Tamanu internal identifier (generally a UUID) in imaging_request_areas.
      name: id
    imaging_request_id:
      data_type: character varying
      description: The [imaging request](#!/source/source.tamanu.tamanu.imaging_requests).
      name: imaging_request_id
  config:
    tags:
    - base
    - clinical
  description: Areas to be imaged as part of an [imaging request](#!/source/source.tamanu.tamanu.imaging_requests).
