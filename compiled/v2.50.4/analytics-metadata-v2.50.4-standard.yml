    \n- Catch-all for simple reference data types - there are a LOT of kinds of reference\
    \ data that exist as just an ID, a \nstring label, and occasionally a code; these\
    \ are all grouped into this table to avoid overcomplicating the schema.\n- Occasionally\
    \ a type of simple reference data will gain some complexity, at which point it\
    \ will be refactored/migrated \nout to use its own table.\n- Simple reference\
