        \  on the User Interface.\n- `historical` indicates that the record is no\
        \ longer in use and should not be visible nor\n  accessible to users. However,\
        \ the record may still be present in Reporting.\n- `merged` indicates that\
        \ the record has been merged, is no longer in use and should not be visible\n\
        \  nor accessible to users.\n\nThe default value is `current`. in notes."
      name: visibility_status
  config:
    tags:
    - base
    - clinical
  description: 'Notes recorded by clinicians or system generated.


    Also see the deprecated [`note_items`](#!/source/source.tamanu.tamanu.note_items),

    [`note_pages`](#!/source/source.tamanu.tamanu.note_pages), and the even older

    [`notes_legacy`](#!/source/source.tamanu.tamanu.notes_legacy).


    This is the current version (3) of the notes system.'
  name: notes
  tags:
  - base
  - clinical
- columns:
    appointment_type_id:
      data_type: character varying(255)
      description: 'Reference to a [Reference Data](#!/source/source.tamanu.tamanu.reference_data)

        (`type=appointmentType`).'
      name: appointment_type_id
    cancelled_at_date:
      data_type: character(10)
      description: The date from which appointments in a schedule have been cancelled,
        this is set when cancelling 'this and all future appointments'.
      name: cancelled_at_date
    clinician_id:
      data_type: character varying(255)
      description: Reference to the [clinician](#!/source/source.tamanu.tamanu.users)
        recording that appointment.
      name: clinician_id
    days_of_week:
      data_type: array
      description: "Stores an array of ISO weekday abbreviations. \nGiven `WEEKLY`\
        \ frequency `days_of_week` determines the weekday that the repeated appointment\
        \ occurs on. \nGiven `MONTHLY` frequency `days_of_week` is combined with `nth_weekday`\
        \ to determine the date in each month that the repeated appointment occurs\
        \ on.\n\nOne of: \n- `MO`\n- `TU`\n- `WE`\n- `TH`\n- `FR`\n- `SA`\n- `SU`"
      name: days_of_week
    encounter_id:
      data_type: character varying(255)
      description: Reference to the [encounter](#!/source/source.tamanu.tamanu.encounters)
        linked to this appointment
      name: encounter_id
    end_datetime:
      data_type: timestamp
      description: When the appointment ends.
      name: end_datetime
    frequency:
      data_type: character varying(255)
      description: 'How often the the recurrence occurs.


        One of:

        - `WEEKLY`

        - `MONTHLY`'
      name: frequency
    generated_until_date:
      data_type: character(10)
      description: The date of the most recent appointment in a schedule, this is
        set after generation of the repeated appointment and then updated if it is
        necessary to generate further appointments.
      name: generated_until_date
    id:
      data_type: character varying(255)
      description: Tamanu internal identifier (generally a UUID) in appointments.
      name: id
    interval:
      data_type: integer
      description: 'The recurrence interval. For example:

        - For a `frequency` of `WEEKLY`, an `interval` of 1 means "Once a week."

        - For a `frequency` of `MONTHLY`, an `interval` of 3 means "Every 3 months."'
      name: interval
    is_fully_generated:
      data_type: boolean
      description: Whether or not all repeating appointments have been created for
        a schedule
      name: is_fully_generated
    is_high_priority:
      data_type: boolean
      description: Boolean specify if the appointment is high priority.
      name: is_high_priority
    location_group_id:
      data_type: character varying(255)
      description: The [location group](#!/source/source.tamanu.tamanu.location_groups)
        where the appointment will take place.
      name: location_group_id
    nth_weekday:
      data_type: integer
      description: 'Ordinal weekday for monthly recurrence interpreted with `days_of_week`
        for example:

        - `1` with `days_of_week = [''MO'']` =  First Monday of the month

        - `2` with `days_of_week = [''TU'']` =  Second Tuesday of the month

        - `-1` with `days_of_week = [''FR'']` = Last Friday of the month'
      name: nth_weekday
    occurrence_count:
      data_type: integer
      description: 'When this value is set, the recurrence ends after generating the
        specified number of occurrences

        At least one of `occurrence_count` or `until_date` must be set.'
      name: occurrence_count
    patient_id:
      data_type: character varying(255)
      description: Reference to the [patient](#!/source/source.tamanu.tamanu.patients).
      name: patient_id
    schedule_id:
      data_type: uuid
      description: Reference to the [appointment schedule](#!/source/source.tamanu.tamanu.appointment_schedules)
        in the case of repeating appointments.
      name: schedule_id
    start_datetime:
      data_type: timestamp
      description: When the appointment starts.
      name: start_datetime
    status:
      data_type: character varying(255)
      description: 'The current status of the appointment record.


        One of:

        - `Confirmed`

        - `Arrived`

        - `No-show`

        - `Cancelled`'
      name: status
    until_date:
      data_type: date
      description: "The end date for the recurrence. No occurrences will be generated\
        \ beyond this date. \nBoth `until_date` and `occurrence_count` cannot be null\
        \ at the same time to ensure the recurrence has an end condition."
      name: until_date
