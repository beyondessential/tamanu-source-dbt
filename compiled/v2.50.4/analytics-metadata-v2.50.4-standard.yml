      name: survey_response_id
  config:
    tags:
    - base
    - clinical
  description: "[Referrals](https://en.wikipedia.org/wiki/Referral_(medicine)).\n\n\
    Referrals use a confusing mix of data in the `referrals` table and\n[`survey_response_answers`](#!/source/source.tamanu.tamanu.survey_response_answers)\
    \ identified by\nthe text of the question they are for. \n\nSome additional data\
    \ is captured in\n[survey response answers](#!/source/source.tamanu.tamanu.survey_response_answers),\
    \ but this is\nvariable and not enforced through any validation:\n- Where the\
    \ person is being referred to can be captured by a range of questions, sometimes\
    \ with a\n  list of hard coded facility name options, or location groups, or departments.\n\
    - Who the referral is \"completed by\" can be captured by a question either the\
    \ name\n  'Referring doctor' or 'Referral completed by'.\n- Some referrals are\
    \ the product of a previous screening survey. In some cases (e.g. Samoa) there\
    \ is\n  a SurveyLink question that captures which survey led to this referral,\
    \ in others (e.g. Nauru)\n  there is no such question so the two survey responses\
    \ cannot be reliably linked."
