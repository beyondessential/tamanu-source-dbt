    id:
      data_type: text
      description: Tamanu internal identifier (generally a UUID) in vaccine_administrations
        from history.
      name: id
    injection_site:
      data_type: text
      description: Injection site of the vaccine administrations recorded from history.
      name: injection_site
    is_consented:
      data_type: boolean
      description: Consent of the vaccine administrations recorded from history.
      name: is_consented
    is_given_elsewhere:
      data_type: boolean
      description: Checks if the vaccine was given elsewhere from history.
      name: is_given_elsewhere
    location_id:
      data_type: text
      description: 'Reference to the [Location](#!/source/source.tamanu.tamanu.locations)
        at which the vaccine was

        given. from history.'
      name: location_id
    logged_at:
