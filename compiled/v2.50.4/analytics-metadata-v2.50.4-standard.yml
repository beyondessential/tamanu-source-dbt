      description: Physical location of external cause of death, if applicable.
      name: external_cause_location
    external_cause_notes:
      data_type: text
      description: Free-form description of the location of external cause of death,
        if applicable.
      name: external_cause_notes
    facility_id:
      data_type: character varying(255)
      description: Reference to the [facility](#!/source/source.tamanu.tamanu.facilities)
        where this death is being recorded.
      name: facility_id
    had_recent_surgery:
      data_type: character varying(255)
      description: Whether the deceased patient had a recent surgery, if any.
      name: had_recent_surgery
    hours_survived_since_birth:
      data_type: integer
      description: If the deceased was an infant, how many days since the birth passed
