        applicable, notes of poisoning agent.
      name: manner_of_death_description
    mother_condition_description:
      data_type: text
      description: A text description stating the conditions of mother that affected
        the fetus/newborn, if the death was perinatal.
      name: mother_condition_description
    multiple_pregnancy:
      data_type: character varying(255)
      description: Whether the deceased infant happened in a multiple pregnancy.
      name: multiple_pregnancy
    patient_id:
      data_type: character varying(255)
      description: The [patient](#!/source/source.tamanu.tamanu.patients) who died.
      name: patient_id
    pregnancy_contributed:
      data_type: character varying(255)
      description: Whether the pregnancy contributed to the death.
      name: pregnancy_contributed
    pregnancy_moment:
      data_type: character varying(255)
      description: The status of the pregnancy of the deceased, if applicable.
      name: pregnancy_moment
    primary_cause_condition_id:
      data_type: character varying(255)
