  tags:
  - base
  - clinical
- columns:
    completed_by_id:
      data_type: character varying(255)
      description: Reference to the [user](#!/source/source.tamanu.tamanu.users) who
        completed this imaging.
      name: completed_by_id
    datetime:
      data_type: timestamp
      description: When the imaging was requested.
      name: datetime
    display_id:
      data_type: character varying(255)
      description: Short unique identifier used on the frontend.
      name: display_id
    encounter_id:
      data_type: character varying(255)
      description: Reference to the [encounter](#!/source/source.tamanu.tamanu.encounters)
        this imaging request is a part of.
      name: encounter_id
    id:
      data_type: character varying
      description: Tamanu internal identifier (generally a UUID) in imaging_requests.
      name: id
    imaging_type:
      data_type: character varying(31)
      description: 'Type of imaging.


        One of:

        - `angiogram`

        - `colonoscopy`

        - `ctScan`

        - `ecg`

        - `echocardiogram`

        - `endoscopy`

        - `fluroscopy`

        - `holterMonitor`

        - `mammogram`

        - `orthopantomography`

        - `mri`

        - `stressTest`

        - `ultrasound`

        - `vascularStudy`

        - `xRay`'
      name: imaging_type
    location_group_id:
      data_type: character varying(255)
      description: Reference to the [location group](#!/source/source.tamanu.tamanu.location_groups)
        for this imaging request.
      name: location_group_id
    location_id:
      data_type: character varying(255)
      description: Reference to the [location](#!/source/source.tamanu.tamanu.locations)
        for this imaging request.
      name: location_id
    priority:
      data_type: character varying(255)
      description: 'Priority of the request.


        This is a customisable list; by default the values are `routine`, `urgent`,
        `asap`, `stat`.'
      name: priority
    reason_for_cancellation:
      data_type: character varying(1024)
      description: 'If the request is cancelled, why that is.


        This is a customisable list; by default the values are `duplicate` and `entered-in-error`.


        The 31-character limit was [arbitrary to avoid extremely long values set in
        error](https://github.com/beyondessential/tamanu/pull/3512/files#r1102169113).'
      name: reason_for_cancellation
    requested_by_id:
      data_type: character varying(255)
      description: Reference to the [user](#!/source/source.tamanu.tamanu.users) who
        requested this imaging.
      name: requested_by_id
    status:
      data_type: character varying(255)
      description: 'The status of the request.


        One of:

        - `pending`

        - `in_progress`

        - `completed`

        - `cancelled`

        - `deleted`

        - `entered_in_error`'
      name: status
  config:
    tags:
    - base
    - clinical
  description: 'Imaging requests are the entrypoint of imaging workflows in Tamanu.


    Each row is a request for radiology to perform one or more imagings on a patient.


    Imagings can have one or more [request areas](#!/source/source.tamanu.tamanu.imaging_request_areas)

    attached, and when completed will have [results](#!/source/source.tamanu.tamanu.imaging_results).'
  name: imaging_requests
  tags:
  - base
  - clinical
- columns:
    completed_by_id:
      data_type: character varying(255)
      description: Reference to the [user](#!/source/source.tamanu.tamanu.users) who
        completed this imaging.
      name: completed_by_id
    datetime:
      data_type: timestamp
      description: When this result was completed.
      name: datetime
    description:
      data_type: text
      description: Free-form description / notes about this imaging.
      name: description
    external_code:
      data_type: text
      description: External code for this result, used with PACS integration (generally
        via FHIR).
      name: external_code
    id:
      data_type: uuid
      description: Tamanu internal identifier (generally a UUID) in imaging_results.
      name: id
    imaging_request_id:
      data_type: character varying
      description: Reference to the [imaging request](#!/source/source.tamanu.tamanu.imaging_requests).
      name: imaging_request_id
    visibility_status:
      data_type: text
      description: "The visibility status of the record.\n\n- `current` indicates\
        \ the record is currently in use and should be visible and accessible to users\n\
        \  on the User Interface.\n- `historical` indicates that the record is no\
        \ longer in use and should not be visible nor\n  accessible to users. However,\
        \ the record may still be present in Reporting.\n- `merged` indicates that\
        \ the record has been merged, is no longer in use and should not be visible\n\
        \  nor accessible to users.\n\nThe default value is `current`. in imaging_results."
      name: visibility_status
  config:
    tags:
    - base
    - clinical
  description: 'Result of an [imaging request](#!/source/source.tamanu.tamanu.imaging_requests).


    In practice, there is usually one or two results per request:

    - one containing a reference to a PACS image, when imaging integrations are enabled;

    - one containing notes from a doctor who analysed the image.


    However there is no limit; for example there may be multiple notes from multiple
    doctors.'
  name: imaging_results
  tags:
  - base
  - clinical
