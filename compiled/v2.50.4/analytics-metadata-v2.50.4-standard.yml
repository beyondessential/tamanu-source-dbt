    - clinical
    - log
  description: 'Change logs of Table of vaccines administered to patients.


    Vaccinations are recorded via the Vaccinations modal; they are selected

    from a list of Scheduled Vaccines and linked to a Patient via an Encounter.'
  name: vaccine_administrations_change_logs
  tags:
  - base
  - clinical
  - log
- columns:
    category:
      data_type: character varying(255)
      description: Vaccine category [Routine, Catch-up, Campaign, Other]
      name: category
    dose_label:
      data_type: character varying(255)
      description: "Dose label indicates what will appear on the front end of Tamanu\
        \ re when the dose is due. It can be a time in a child's \nlife (e.g. 'Birth',\
        \ '6 weeks') or a dose of vaccine (e.g. 'Dose 1', 'Dose 2')"
      name: dose_label
    id:
      data_type: character varying(255)
      description: Tamanu internal identifier (generally a UUID) in vaccine_schedules.
      name: id
    index:
      data_type: integer
      description: "This column is used to show when a second dose is due in relation\
        \ to the first dose. For example, if dose 1 is due at 6 \nweeks and dose 2\
        \ is due at 10 weeks, this column would read '4' against the 10 week dose\
        \ as dose 2 is due 4 weeks after \ndose 1 is given."
      name: index
    label:
      data_type: character varying(255)
      description: "Contents of the label column is what will be displayed on the\
        \ front end of Tamanu \nunder fields labelled 'Vaccine'. This is where the\
        \ vaccine name is listed. E.g. 'BCG'."
      name: label
    sort_index:
      data_type: integer
      description: Sort index defaults to 0
      name: sort_index
    vaccine_id:
      data_type: character varying(255)
      description: "Use the vaccineId column to link the id column of the Reference\
        \ Data sheet Drug to the vaccine schedule. Copy the exact \nid from the id\
        \ column in the reference data sheet Drug and paste it in the vaccineId column\
        \ in the Scheduled Vaccine \nsheet."
      name: vaccine_id
    visibility_status:
      data_type: text
      description: "The visibility status of the record.\n\n- `current` indicates\
        \ the record is currently in use and should be visible and accessible to users\n\
        \  on the User Interface.\n- `historical` indicates that the record is no\
        \ longer in use and should not be visible nor\n  accessible to users. However,\
        \ the record may still be present in Reporting.\n- `merged` indicates that\
        \ the record has been merged, is no longer in use and should not be visible\n\
        \  nor accessible to users.\n\nThe default value is `current`. in vaccine_schedules."
      name: visibility_status
    weeks_from_birth_due:
      data_type: integer
      description: "This column is used to tell Tamanu how many weeks from the child's\
        \ date of birth a vaccine is due. This will populate \nthe front end within\
        \ the Vaccine schedule section in the column 'Due date'. For a vaccine to\
        \ appear in the Vaccine \nschedule a dose must have a `weeksFromBirthDue`\
        \ entered into the reference data. \n\nThis field should be used only for\
        \ the first dose of the vaccine. Subsequent doses should use \n`weeks_from_last_vaccination_due`"
      name: weeks_from_birth_due
    weeks_from_last_vaccination_due:
      data_type: integer
      description: "This column is used to show when a second dose is due in relation\
        \ to the first dose. For example, if dose 1 is due at 6 \nweeks and dose 2\
        \ is due at 10 weeks, this column would read '4' against the 10 week dose\
        \ as dose 2 is due 4 weeks after \ndose 1 is given. The order of a vaccine\
        \ dose is defined at the `index` field. \n\nThis field should not be used\
        \ for the first dose but for subsequent doses. First dose should use `weeks_from_birth_due`"
      name: weeks_from_last_vaccination_due
  config:
    tags:
    - base
    - clinical
  description: "A vaccine schedule listing all vaccines expected to be given to a\
    \ child as part of a country wide Expanded Program of \nImmunisation can be incorporated\
    \ into Tamanu to show each dose and due date on the front end of the system. \n\
    \nFirst dose of a vaccine should use `weeks_from_birth_due` whilst subsequent\
    \ doses should use \n`weeks_from_last_vaccination_due`."
  name: vaccine_schedules
  tags:
  - base
  - clinical
