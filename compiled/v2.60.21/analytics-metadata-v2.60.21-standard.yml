      data_type: character varying(255)
      description: "Dose label indicates what will appear on the front end of Tamanu\
        \ re when the dose is due. It can be a time in a child's \r\nlife (e.g. 'Birth',\
        \ '6 weeks') or a dose of vaccine (e.g. 'Dose 1', 'Dose 2')"
      name: dose_label
    id:
      data_type: character varying(255)
      description: Tamanu internal identifier (generally a UUID) in vaccine_schedules.
      name: id
    index:
      data_type: integer
      description: "This column is used to show when a second dose is due in relation\
        \ to the first dose. For example, if dose 1 is due at 6 \r\nweeks and dose\
        \ 2 is due at 10 weeks, this column would read '4' against the 10 week dose\
        \ as dose 2 is due 4 weeks after \r\ndose 1 is given."
      name: index
    label:
      data_type: character varying(255)
      description: "Contents of the label column is what will be displayed on the\
        \ front end of Tamanu \r\nunder fields labelled 'Vaccine'. This is where the\
        \ vaccine name is listed. E.g. 'BCG'."
      name: label
    sort_index:
      data_type: integer
      description: Sort index defaults to 0
      name: sort_index
    vaccine_id:
      data_type: character varying(255)
      description: "Use the vaccineId column to link the id column of the Reference\
        \ Data sheet Drug to the vaccine schedule. Copy the exact \r\nid from the\
        \ id column in the reference data sheet Drug and paste it in the vaccineId\
        \ column in the Scheduled Vaccine \r\nsheet."
      name: vaccine_id
    visibility_status:
