  description: 'Thin projection of appointment rows in the change log, carrying the
    source filters but no window functions, so consumers can filter it with predicate
    pushdown. The windowed reconstruction of previous values and change numbering
    sits downstream in outpatient_appointments_change_log_events().

    '
  meta:
    classification: restricted
    domain: clinical
    owner: bes-maui
    pii: false
    tier: silver
  name: outpatient_appointments_change_events
  tags:
  - base
  - clinical
  - audit
- columns:
    appointment_id:
      description: Reference to the [appointment](#!/model/model.tamanu_source_dbt.outpatient_appointments)
        that was modified.
      name: appointment_id
    appointment_type_id:
      description: Current [appointment type](#!/model/model.tamanu_source_dbt.reference_data)
        ID (after the change).
      name: appointment_type_id
    change_id:
      description: Unique identifier for the change log entry (UUID from logs.changes).
      name: change_id
    change_sequence:
      description: "Sequential number of this change for the appointment.\r\n- 1 =\
        \ initial creation event\r\n- 2+ = subsequent modifications\r\n\r\nUses ROW_NUMBER()\
        \ partitioned by appointment_id and ordered by logged_at."
      name: change_sequence
    clinician_id:
      description: Current [clinician](#!/model/model.tamanu_source_dbt.users) ID
        (after the change).
      name: clinician_id
    created_by_user_id:
      description: Reference to the [user](#!/model/model.tamanu_source_dbt.users)
        who originally created the appointment.
      name: created_by_user_id
    end_datetime:
      description: Current appointment end date and time (after the change).
      name: end_datetime
    is_high_priority:
      description: Current priority status (after the change). Boolean indicating
        if the appointment is high priority.
      name: is_high_priority
    location_group_id:
      description: Current [location group](#!/model/model.tamanu_source_dbt.location_groups)/area
        ID (after the change).
      name: location_group_id
    modified_by_user_id:
      description: Reference to the [user](#!/model/model.tamanu_source_dbt.users)
        who made the modification.
      name: modified_by_user_id
    modified_datetime:
      description: Timestamp when the change was logged (from logs.changes.logged_at).
      name: modified_datetime
    patient_id:
      description: Reference to the [patient](#!/model/model.tamanu_source_dbt.patients)
        associated with the appointment.
      name: patient_id
    prev_appointment_type_id:
      description: Previous appointment type ID (before the change). Null for creation
        events (change_sequence = 1).
      name: prev_appointment_type_id
    prev_clinician_id:
      description: Previous clinician ID (before the change). Null for creation events
        (change_sequence = 1).
      name: prev_clinician_id
    prev_end_datetime:
      description: Previous appointment end date and time (before the change). Null
        for creation events (change_sequence = 1).
      name: prev_end_datetime
    prev_is_high_priority:
      description: Previous priority status (before the change). Null for creation
        events (change_sequence = 1).
      name: prev_is_high_priority
    prev_location_group_id:
      description: Previous location group/area ID (before the change). Null for creation
        events (change_sequence = 1).
      name: prev_location_group_id
    prev_start_datetime:
      description: Previous appointment start date and time (before the change). Null
        for creation events (change_sequence = 1).
      name: prev_start_datetime
    prev_status:
      description: Previous appointment status (before the change). Null for creation
        events (change_sequence = 1).
      name: prev_status
    schedule_id:
      description: Current recurring schedule ID (after the change). References appointment_schedules
        table.
      name: schedule_id
    start_datetime:
      description: Current appointment start date and time (after the change).
      name: start_datetime
    status:
      description: "Current appointment status (after the change).\r\n\r\nOne of:\r\
        \n- `Confirmed`\r\n- `Arrived`\r\n- `No-show`\r\n- `Cancelled`"
      name: status
    updated_at_sync_tick:
      description: Last tick that the record was updated. Used to figure out old vs
        new data when syncing in logs.changes.
      name: updated_at_sync_tick
