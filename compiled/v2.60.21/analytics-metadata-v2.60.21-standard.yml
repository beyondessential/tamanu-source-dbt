      description: "The visibility status of the record.\r\n\r\n- `current` indicates\
        \ the record is currently in use and should be visible and accessible to users\r\
        \n  on the User Interface.\r\n- `historical` indicates that the record is\
        \ no longer in use and should not be visible nor\r\n  accessible to users.\
        \ However, the record may still be present in Reporting.\r\n- `merged` indicates\
        \ that the record has been merged, is no longer in use and should not be visible\r\
        \n  nor accessible to users.\r\n\r\nThe default value is `current`. in vaccine_schedules."
      name: visibility_status
    weeks_from_birth_due:
      data_type: integer
      description: "This column is used to tell Tamanu how many weeks from the child's\
        \ date of birth a vaccine is due. This will populate \r\nthe front end within\
        \ the Vaccine schedule section in the column 'Due date'. For a vaccine to\
        \ appear in the Vaccine \r\nschedule a dose must have a `weeksFromBirthDue`\
        \ entered into the reference data. \r\n\r\nThis field should be used only\
        \ for the first dose of the vaccine. Subsequent doses should use \r\n`weeks_from_last_vaccination_due`"
      name: weeks_from_birth_due
    weeks_from_last_vaccination_due:
      data_type: integer
      description: "This column is used to show when a second dose is due in relation\
        \ to the first dose. For example, if dose 1 is due at 6 \r\nweeks and dose\
        \ 2 is due at 10 weeks, this column would read '4' against the 10 week dose\
        \ as dose 2 is due 4 weeks after \r\ndose 1 is given. The order of a vaccine\
        \ dose is defined at the `index` field. \r\n\r\nThis field should not be used\
        \ for the first dose but for subsequent doses. First dose should use `weeks_from_birth_due`"
      name: weeks_from_last_vaccination_due
