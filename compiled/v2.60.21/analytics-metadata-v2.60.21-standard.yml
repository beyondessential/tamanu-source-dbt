      name: logged_at
    record_data:
      description: "The full row data of the change.\r\n\r\nNote that as this is `JSONB`,\
        \ some type information may be lost. However, row\r\ndata in a Tamanu system\
        \ is transported using JSON via the sync system anyway, so\r\nit is expected\
        \ that all data trivially round-trips via JSON."
      name: record_data
    record_id:
      description: "The value of the `id` field of the change data.\r\n\r\nThis is\
        \ extracted from the data to make it easier to query on."
      name: record_id
    record_updated_at:
      description: The `updated_at` metadata from record the changelog was recorded
        against
      name: record_updated_at
    updated_at_sync_tick:
      description: Last tick that the record was updated. Used to figure out old vs
        new data when syncing in logs.changes.
      name: updated_at_sync_tick
    updated_by_user_id:
      description: "The value of the `updated_by_user_id` field of the change data.\r\
        \n\r\nThis is extracted from the data to make it easier to query on."
      name: updated_by_user_id
