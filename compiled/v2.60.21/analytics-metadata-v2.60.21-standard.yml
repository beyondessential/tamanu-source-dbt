        \ multiple \"screens\" or pages, this index sets where this particular question\
        \ sits."
      name: screen_index
    survey_id:
      data_type: character varying(255)
      description: The [survey](#!/source/source.tamanu.tamanu.surveys).
      name: survey_id
    text:
      data_type: character varying(255)
      description: Description or question of this component.
      name: text
    validation_criteria:
      data_type: text
      description: JSON criteria that determines whether the value entered in this
        component is accepted.
      name: validation_criteria
    visibility_criteria:
      data_type: character varying(255)
      description: "JSON criteria that determines when this component is visible.\r\
        \n\r\nA criteria is a list of other components' codes and the value that will\
        \ make this question show up:\r\n\r\n```json\r\n{\r\n  \"otherQuestion\":\
        \ \"Yes\"\r\n}\r\n```\r\n\r\nThere can also be the special criterium `{\"\
        hidden\": true}` which always hides the question, and the\r\nspecial key `\"\
        _conjunction\": \"or\"` which makes it so _any one_ item in the list is sufficient\
        \ to\r\nshow the question, instead of the default where _all_ items must match."
      name: visibility_criteria
    visibility_status:
      data_type: character varying(255)
      description: "The visibility status of the record.\r\n\r\n- `current` indicates\
        \ the record is currently in use and should be visible and accessible to users\r\
        \n  on the User Interface.\r\n- `historical` indicates that the record is\
        \ no longer in use and should not be visible nor\r\n  accessible to users.\
        \ However, the record may still be present in Reporting.\r\n- `merged` indicates\
        \ that the record has been merged, is no longer in use and should not be visible\r\
        \n  nor accessible to users.\r\n\r\nThe default value is `current`. in survey_screen_components."
      name: visibility_status
