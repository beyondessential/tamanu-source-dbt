name: tamanu_source_dbt
version: 2.61.0
config-version: 2
profile: tamanu_source_dbt

vars:
  has_sensitive_facility: false
  language: default
  timezone: Australia/Sydney
  date_format: YYYY-MM-DD
  time_format: HH24:MI
  datetime_format: YYYY-MM-DD HH24:MI:SS
  datetime_without_seconds_format: YYYY-MM-DD HH24:MI
  yearmonth_format: YYYY-MM
  translation_prefix: report.reporting
  test_patient: h1627394-3778-4c31-a510-9fcb88efdbf3
  supported_languages:
    - default

model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - data_tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots
clean-targets:
  - dbt_packages
  - target

models:
  tamanu_source_dbt:
    bases:
      +docs:
        show: true
      +materialized: view
      +tags:
        - base
    intermediate:
      +materialized: ephemeral
    ref:
      +docs:
        show: true
      +materialized: view
      +tags:
        - reference
    maps:
      +docs:
        show: true
      +materialized: view
      +tags:
        - reference
      # MSF OCA DHIS2 shared mappings -- disabled by default. Keeps
      # MSF-instance-specific UIDs out of non-MSF builds.
      msf_oca:
        +enabled: false
        +materialized: view
        +tags:
          - msf-oca-dhis2
    clinical:
      +docs:
        show: true
      +materialized: "{{ 'view' if target.name.startswith('reporting_') else 'table' }}"
      +tags:
        - clinical
    datasets:
      +docs:
        show: true
      +materialized: view
      +tags:
        - datasets
      sensitive:
        +tags:
          - restricted
    reports:
      +docs:
        show: false
      +tags:
        - reports
      sql:
        sensitive:
          +tags:
            - restricted

data_tests:
  +severity: warn
