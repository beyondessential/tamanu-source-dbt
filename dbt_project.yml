name: tamanu_source_dbt
version: 2.55.8
config-version: 2
profile: tamanu_source_dbt

vars:
  has_sensitive_facility: false
  # Enable the MSF OCA DHIS2 shared mappings (models/maps/msf_oca). Off by
  # default -- only MSF OCA deployments set this true. The UIDs are global to the
  # MSF OCA DHIS2 instance and meaningless for other deployments.
  msf_oca_dhis2: false
  # reference_data id of the deployment's home country. Used by the
  # upcoming-vaccinations report's "Exclude overseas patients" parameter
  # (excludeNonHomeCountry) to drop patients recorded as resident elsewhere.
  # Overridden per deployment (e.g. Samoa sets country-Samoa).
  home_country_id: country-Australia
  language: default
  timezone: Australia/Sydney
  date_format: YYYY-MM-DD
  time_format: HH24:MI
  datetime_format: YYYY-MM-DD HH24:MI:SS
  datetime_without_seconds_format: YYYY-MM-DD HH24:MI
  yearmonth_format: YYYY-MM
  translation_prefix: report.reporting
  test_patient: h1627394-3778-4c31-a510-9fcb88efdbf3
  supported_languages:
    - default

model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - data_tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots
clean-targets:
  - dbt_packages
  - target

models:
  tamanu_source_dbt:
    bases:
      +docs:
        show: true
      +materialized: view
      +tags:
        - base
    intermediate:
      +materialized: ephemeral
    maps:
      # MSF OCA DHIS2 shared mappings -- disabled unless the deployment sets
      # var('msf_oca_dhis2'). Keeps MSF-instance-specific UIDs out of non-MSF builds.
      msf_oca:
        +enabled: "{{ var('msf_oca_dhis2', false) }}"
        +materialized: view
        +tags:
          - msf-oca-dhis2
    datasets:
      +docs:
        show: true
      +materialized: view
      +tags:
        - datasets
      sensitive:
        +tags:
          - restricted
    reports:
      # Reports are the in-product (reporting-schema) surface. Don't build them
      # on an analytics target -- that build feeds Tupaia from the `analytics`
      # schema (D9) and reports would be dead weight / need report-only vars.
      # Report/clone/prod targets (not starting with `analytics`) keep them.
      +enabled: "{{ not target.name.startswith('analytics') }}"
      +docs:
        show: false
      +tags:
        - reports
      sql:
        sensitive:
          +tags:
            - restricted

data_tests:
  +severity: warn
