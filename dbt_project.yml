name: tamanu_source_dbt
version: 2.45.4
config-version: 2
profile: tamanu_source_dbt

vars:
  language: default
  timezone: Australia/Sydney
  date_format: YYYY-MM-DD
  time_format: HH24:MI
  datetime_format: YYYY-MM-DD HH24:MI:SS
  datetime_without_seconds_format: YYYY-MM-DD HH24:MI
  yearmonth_format: YYYY-MM
  translation_prefix: report.reporting
  test_patient: h1627394-3778-4c31-a510-9fcb88efdbf3
  supported_languages:
    - default

model-paths: 
  - models
analysis-paths: 
  - analyses
test-paths: 
  - tests
seed-paths: 
  - seeds
macro-paths: 
  - macros
snapshot-paths: 
  - snapshots
clean-targets:
  - dbt_packages
  - target
models:
  tamanu_source_dbt:
    bases:
      +docs:
        show: true
      +materialized: view
      +tags:
        - base

    intermediate:
      +materialized: ephemeral

    datasets:
      +docs:
        show: true
      +materialized: view
      +tags:
        - datasets

    reconstructs:
      +incremental_strategy: merge
      +materialized: incremental
      +tags:
        - reconstructed

    reports:
      +docs:
        show: false
      +tags: 
        - reports

data_tests:
  +severity: warn
