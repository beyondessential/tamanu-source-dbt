name: tamanu_source_dbt
version: 2.67.0
config-version: 2
profile: tamanu_source_dbt
# dbt enforces this on every project that installs this package, so it states what the package's
# YAML needs, not this repo's own pin (pyproject.toml). 1.10.8 is the first dbt that reads generic
# test parameters nested under `arguments:` by default. The cap keeps out dbt Fusion (2.x).
require-dbt-version: [">=1.10.8", "<2.0.0"]

# Every dbt deprecation is an error here, so a change that brings one back fails `dbt parse` in
# CI (checks.yml). dbt reads `flags` from the root project only, so deployment repos installing
# this package are unaffected.
flags:
  warn_error_options:
    error:
      - Deprecations
    # models/sources/ is copied from tamanu's database/model/public/, where some generic test
    # parameters still sit outside `arguments:`. That one deprecation stays a warning until tamanu
    # nests them; remove both entries once a refresh brings the fix in. The end-of-run summary
    # would otherwise still fail on it, and every other deprecation already fails on its own event.
    warn:
      - MissingArgumentsPropertyInGenericTestDeprecation
      - DeprecationsSummary

vars:
  has_sensitive_facility: false
  # reference_data id of the deployment's home country. Used by the
  # upcoming-vaccinations report's "Exclude overseas patients" parameter
  # (excludeNonHomeCountry) to drop patients recorded as resident elsewhere.
  # Overridden per deployment (e.g. Samoa sets country-Samoa).
  home_country_id: country-Australia
  language: default
  timezone: Australia/Sydney
  date_format: YYYY-MM-DD
  time_format: HH24:MI
  datetime_format: YYYY-MM-DD HH24:MI:SS
  datetime_without_seconds_format: YYYY-MM-DD HH24:MI
  yearmonth_format: YYYY-MM
  translation_prefix: report.reporting
  # Target waiting time in minutes by triage category, used by the emergency triage
  # line list's "Target time met" column. Australasian Triage Scale intervals, except that
  # Category 1 allows 2 minutes rather than literal 'immediate' -- a zero target marks every
  # measurable wait a miss, which tells an emergency department nothing. A deployment whose
  # policy differs overrides the whole map in its own dbt_project.yml.
  triage_target_minutes:
    "1": 2
    "2": 10
    "3": 30
    "4": 60
    "5": 120
  # A deployment's own antenatal forms, mapped to WHO DAK ANC data elements for
  # metric__who_dak_anc_indicators. Keyed by survey id: is_contact marks a form whose
  # submission is an antenatal contact, and data_elements maps a DAK element id (ANC.A7.DE4)
  # to the local question's program data element code. Empty here, so a deployment that sets
  # nothing reads only the who-dak-anc forms; a deployment overrides the whole map in its own
  # dbt_project.yml.
  who_dak_anc_local_surveys: {}
  test_patient: h1627394-3778-4c31-a510-9fcb88efdbf3
  supported_languages:
    - default

model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots
clean-targets:
  - dbt_packages
  - target

models:
  tamanu_source_dbt:
    bases:
      +docs:
        show: true
      +materialized: view
      +tags:
        - base
      # Tupaia data tables resolve location_group_name via a two-hop join through
      # these two models (metric__outpatient_visit emits location_id only, per its
      # BL-006/BL-007), so they need to sit in `public_tupaia` alongside the metrics
      # on the analytics replica, same reasoning and same mechanism as the metrics:
      # block below. Every other base model stays untouched -- this is scoped to just
      # the two models Tupaia actually joins on.
      locations:
        +schema: "{{ 'public_tupaia' if target.name.startswith('analytics') else '' }}"
      location_groups:
        +schema: "{{ 'public_tupaia' if target.name.startswith('analytics') else '' }}"
    intermediate:
      +materialized: ephemeral
      # generate_reporting_schema_script() creates no `reporting` view for an
      # ephemeral model. `restricted` also keeps a sensitive intermediate out of the
      # schema unless has_sensitive_facility is set, so changing its materialisation
      # cannot expose episode-grain rows to `tamanu_reporting` on every deployment.
      # It is the same mechanism datasets/sensitive and reports/sql/sensitive use below.
      sensitive:
        +tags:
          - restricted
    ref:
      +docs:
        show: true
      +materialized: view
      +tags:
        - reference
    maps:
      +docs:
        show: true
      +materialized: view
      +tags:
        - reference
      # MSF OCA DHIS2 shared mappings -- disabled here (MSF-instance-specific
      # UIDs). An MSF OCA deployment repo re-enables msf_oca via +enabled: true
      # in its own dbt_project.yml.
      msf_oca:
        +enabled: false
        +materialized: view
        +tags:
          - msf-oca-dhis2
    clinical:
      +docs:
        show: true
      +materialized: "{{ 'table' if target.name.startswith('analytics') else 'view' }}"
      +tags:
        - clinical
    metrics:
      +docs:
        show: true
      # BL-008 (metric__emergency_care): env-aware per dbt-conventions / D5 -- a table on
      # the analytics replica so dashboard
      # queries do not re-aggregate the full history on every read, a view everywhere else
      # (the reporting bundle must stay production-safe). The test names the target that
      # earns the heavier materialisation, so an unrecognised target falls through to view
      # rather than materialising a table by default.
      # BL-015: the same rule for the billing metrics (see specs/dbt-model/metric__billing.md)
      +materialized: "{{ 'table' if target.name.startswith('analytics') else 'view' }}"
      # Tupaia reads the metrics from `public_tupaia`, so that is where they build on the
      # analytics replica. Absolute, not a suffix -- see macros/generate_schema_name.sql,
      # without which dbt resolves this to `analytics_public_tupaia`. Empty on every other
      # target, which leaves them in the target's own schema: metric views ship in the
      # compiled reporting bundle, and production Tamanu must not gain a `public_tupaia`
      # schema of metric tables.
      +schema: "{{ 'public_tupaia' if target.name.startswith('analytics') else '' }}"
      +tags:
        - metrics
    datasets:
      +docs:
        show: true
      +materialized: view
      +tags:
        - datasets
      sensitive:
        +tags:
          - restricted
    reports:
      # Reports are the in-product (reporting-schema) surface. Don't build them
      # on an analytics target -- that build feeds Tupaia from the `analytics`
      # schema (D9) and reports would be dead weight / need report-only vars.
      # Report/clone/prod targets (not starting with `analytics`) keep them.
      +enabled: "{{ not target.name.startswith('analytics') }}"
      +docs:
        show: false
      +tags:
        - reports
      sql:
        sensitive:
          +tags:
            - restricted

seeds:
  tamanu_source_dbt:
    # cohort_definitions allocates cohort_definition_id and is never read at run time: a
    # derived__cohort_* model carries its id as a literal, because the compiled reporting bundle
    # ships views only and a seed cannot reach a deployment through it.
    #
    # Disabled so it materialises nowhere. Left enabled it puts a seed node, and any schema tests
    # on it, into every consuming deployment's graph, where `dbt test` fails with
    # "relation cohort_definitions does not exist" because a deployment never runs `dbt seed`.
    # Uniqueness is enforced by scripts/tests/test_cohort_definitions.py instead, which runs in
    # CI here and costs a deployment nothing.
    cohort_definitions:
      +enabled: false

# Reports are disabled on an analytics target, so the unit tests that mock them are too.
# Every unit test that targets a report lives under tests/unit_tests/reports/.
unit_tests:
  tamanu_source_dbt:
    unit_tests:
      reports:
        +enabled: "{{ not target.name.startswith('analytics') }}"

data_tests:
  +severity: warn
  tamanu_source_dbt:
    metrics:
      # Metrics are views off analytics, so each test re-runs the whole metric (minutes on a
      # full database). Run them where metrics are tables; force with --vars '{metric_data_tests: true}'.
      +enabled: "{{ target.name.startswith('analytics') or var('metric_data_tests', false) }}"
    # Singular tests are tagged by kind, so each kind runs on its own with
    # `dbt test --select tag:<tag>`. A singular test's path follows its folder under test-paths,
    # so this `data_tests` is tests/data_tests/, not the resource type above.
    data_tests:
      model_invariants:
        +tags:
          - model_invariant
      logical_integrity:
        +tags:
          - logical_integrity
      source:
        +tags:
          - source_assert
