tamanu_source_dbt:
  target: demoland
  outputs:
    aspen:
      type: postgres
      threads: 1
      host: "{{ env_var('TAMANU_ASPEN_DB_URL') }}"
      port: 5432
      user: "{{ env_var('TAMANU_ASPEN_DB_USER') }}"
      pass: "{{ env_var('TAMANU_ASPEN_DB_PASSWORD') }}"
      dbname: "{{ env_var('TAMANU_ASPEN_DB_DATABASE') }}"
      schema: reporting
    demoland:
      type: postgres
      threads: 1
      host: "{{ env_var('TAMANU_DL_DB_URL') }}"
      port: 5432
      user: "{{ env_var('TAMANU_DL_DB_USER') }}"
