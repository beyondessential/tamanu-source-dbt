name: Build Schema Image

# Builds the container image pgro runs to produce a deployment's reporting
# schema. Callable as a reusable workflow from any tamanu-dbt-* deployment repo:
#
#   jobs:
#     image:
#       uses: beyondessential/tamanu-source-dbt/.github/workflows/build-schema-image.yml@main
#       permissions:
#         contents: read
#         packages: write
#
# The image carries the calling deployment's models and config, so the build
# context is that repo. The Containerfile and the build scripts come from this
# one, at the revision the deployment's packages.yml pins, so what builds the
# image and what runs inside it are the same release.
#
# Published as ghcr.io/<calling repo>, tagged with the commit and `latest`. A
# group's declaration in Canopy names one of those in its builder_image.

on:
  workflow_call:
    inputs:
      source_ref:
        description: Revision of tamanu-source-dbt to take the Containerfile from. Defaults to the pin in packages.yml.
        type: string
        required: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the deployment
        uses: actions/checkout@v5
        with:
          path: deployment

      - name: Read the pinned package revision
        id: pin
        # Through the environment rather than interpolated into the script: an
        # input written into a shell line is run by it.
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [ -n "$SOURCE_REF" ]; then
            echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref=$(sed -n 's/^[[:space:]]*revision:[[:space:]]*//p' deployment/packages.yml | head -1 | tr -d "\"'" | xargs)
          if [ -z "$ref" ]; then
            echo "packages.yml names no revision to build from" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Beside the build context rather than inside it: the Containerfile copies
      # the whole context, and a copy of this repo in the image would sit next
      # to the vendored package as a second one for a reader to confuse it with.
      - name: Checkout the package
        uses: actions/checkout@v5
        with:
          repository: beyondessential/tamanu-source-dbt
          ref: ${{ steps.pin.outputs.ref }}
          path: package

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deployment
          file: package/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
