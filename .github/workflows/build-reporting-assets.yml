name: Build Reporting Assets

# Manually triggered for a specific tag.
# Checks out the X.Y maintenance branch matching the release (falls back to main if the
# branch doesn't exist yet), migrates an empty database with the Tamanu central image of
# that minor, runs build_reporting_assets.py, then attaches the compiled assets to the
# GitHub release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v2.50.5)'
        required: true
        type: string

jobs:
  build:
    name: Build and publish reporting assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Determine version and branch
        id: version
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          MINOR_VERSION="$(echo "$VERSION" | cut -d. -f1,2)"

          # Use the X.Y branch if it exists, otherwise fall back to main
          if gh api "repos/${{ github.repository }}/branches/$MINOR_VERSION" --silent 2>/dev/null; then
            REF="$MINOR_VERSION"
            echo "Using branch '$MINOR_VERSION'"
          else
            REF="main"
            echo "Branch '$MINOR_VERSION' does not exist yet — using main"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/beyondessential/tamanu-central:v$MINOR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.ref }}

      # An empty database rather than a deployment's: the standard bundle compiles from the
      # version's table shape, which the migrations alone produce, and reads no data.
      - name: Prepare the Tamanu database
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          # The version check reads local_system_facts before the migrations create it.
          docker run --rm --network host \
            -e NODE_CONFIG='{"db":{"skipVersionCompatibilityCheck":true}}' \
            -e CONFIG_SYNC_DB_HOST=127.0.0.1 \
            -e CONFIG_SYNC_DB_PORT=5432 \
            -e CONFIG_SYNC_DB_NAME=app \
            -e CONFIG_SYNC_DB_USERNAME=app \
            -e CONFIG_SYNC_DB_PASSWORD=app \
            "$IMAGE" upgrade

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Build reporting assets
        env:
          TAMANU_RL_DB_URL: 127.0.0.1
          TAMANU_RL_DB_PORT: 5432
          TAMANU_RL_DB_USER: app
          TAMANU_RL_DB_PASSWORD: app
          TAMANU_RL_DB_DATABASE: app
        run: python scripts/build_reporting_assets.py

      - name: Attach compiled assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            compiled/v${{ steps.version.outputs.version }}/* \
            --clobber
