name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          prompt: "/review"
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr *),Bash(gh api*),Bash(git diff*),Bash(git log*)"
            --append-system-prompt "First, review the PR title and update it if needed to accurately reflect the changes using 'gh pr edit ${{ github.event.pull_request.number }} --title <new-title>'. Then review the PR and provide feedback in two ways: 1) Post inline comments on specific lines where you find critical issues using 'gh pr review ${{ github.event.pull_request.number }} --comment --path <file> --line <number> --body <comment>', 2) Post a summary comment using 'gh pr review ${{ github.event.pull_request.number }} --comment --body <summary>'. Focus on: potential bugs, performance, security, and correctness. In your summary, list critical issues briefly and reference inline comments if posted. Sign off with ✅ (approved) or ⚠️ (issues found). Keep responses concise. Use CLAUDE.md for style and conventions guidance."

