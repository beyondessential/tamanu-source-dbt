name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          prompt: "/review"
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr *),Bash(gh api*),Bash(git diff*),Bash(git log*)"
            --append-system-prompt "Focus on potential bugs, performance, security, and correctness. Keep the sticky summary comment brief: just the overall verdict, sign-off (✅ approved or ⚠️ issues found), and the regression testing checklist. All specific feedback belongs in inline comments — do not repeat issue details in the summary.

            BLOCK and request immediate changes if any of the following are found:
            - Hardcoded credentials, API keys, passwords, or tokens
            - Committed .env or secrets files
            - PII in code or examples
            - Unmasked secrets in log statements

            PR TITLE: Review the current PR title. If it is vague or auto-generated, update it to a clear conventional commit title (feat/fix/chore/refactor/docs) using: gh pr edit ${{ github.event.pull_request.number }} --title 'improved title here'

            REGRESSION TESTING: Include in the summary a checklist of what needs testing. For model changes: dbt build --select +<changed_model>. For report config or translation changes: run the validation scripts (validate_report_configs.py, check_translations.py). List only what needs to be tested and the commands — no explanations.

            INLINE COMMENTS: Post all specific code feedback as inline review comments on the relevant lines — not in the summary. Use: gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --method POST --field body='your comment' --field commit_id='${{ github.event.pull_request.head.sha }}' --field path='relative/file/path' --field line=LINE_NUMBER --field side='RIGHT'."

