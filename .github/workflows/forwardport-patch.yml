name: Forward-port Patch

# When a patch release (vX.Y.Z, Z > 0) is published for a minor version older
# than the current one on main, cherry-picks the patch commits onto all branches
# with a higher minor version and opens a PR for each.
#
# Example: publishing v2.49.9 when main is on 2.51 will open PRs against
#   the '2.50' branch (bumping to 2.50.next) and main (bumping to 2.51.next).
#
# Requires: GITHUB_TOKEN with contents:write and pull-requests:write.
#
# Note: GHA release events don't support tag-pattern filters. This triggers on
# every release; the script exits early if the tag is not an older-minor patch.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Patch tag to forward-port (e.g. v2.49.9)'
        required: true
        type: string

jobs:
  forwardport:
    name: Forward-port patch to higher-minor branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Forward-port patch to higher-minor branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: python scripts/forwardport_patch.py
