name: Tamanu Version Upgrade

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tamanu version to upgrade to (e.g., 2.47). Leave empty to auto-detect latest release branch.'
        required: false
        type: string
  repository_dispatch:
    types: [tamanu-release-created]

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv pip install --system -r scripts/requirements.txt

      - name: Determine version to upgrade to
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manually specified version: $VERSION"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            BRANCH_NAME="${{ github.event.client_payload.branch }}"
            if [ -z "$BRANCH_NAME" ]; then
              echo "Error: No branch name provided in repository_dispatch payload"
              exit 1
            fi
            VERSION="${BRANCH_NAME#release/}"
            echo "Using version from repository_dispatch: $VERSION"
          else
            echo "Auto-detecting latest Tamanu release branch..."
            LATEST_RELEASE=$(gh api repos/beyondessential/tamanu/branches \
              --jq '[.[] | select(.name | startswith("release/")) | .name]' | sort -V | tail -1)

            if [ -z "$LATEST_RELEASE" ]; then
              echo "Error: Could not find any release branches in tamanu repo"
              exit 1
            fi

            VERSION="${LATEST_RELEASE#release/}"
            echo "Auto-detected version: $VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Upgrading to Tamanu version: $VERSION"

      - name: Update dbt_project.yml version
        id: normalize
        run: |
          RELEASE_VERSION="${{ steps.version.outputs.version }}"
          DBT_VERSION="$RELEASE_VERSION"

          # Normalize version to X.Y.0 format if only X.Y is provided
          if [[ "$DBT_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            DBT_VERSION="${DBT_VERSION}.0"
            echo "Normalized version to three-part format: $DBT_VERSION"
          fi

          echo "Updating dbt_project.yml to version $DBT_VERSION"

          # Update version in dbt_project.yml
          sed -i "s/^version: .*/version: $DBT_VERSION/" dbt_project.yml

          echo "Version updated in dbt_project.yml:"
          grep "^version:" dbt_project.yml

          # Export both versions for use in later steps
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "dbt_version=$DBT_VERSION" >> $GITHUB_OUTPUT

      - name: Run refresh_tamanu_source.py
        run: |
          echo "Running refresh_tamanu_source.py to pull latest source models..."
          python scripts/refresh_tamanu_source.py

      - name: Check report config schema drift
        id: schema_drift
        # Non-blocking: a drift warning (or a transient clone/parse failure) must
        # never stop the upgrade PR from being created. Surfaced in the PR body.
        continue-on-error: true
        run: |
          echo "Checking report-config-schema.json against Tamanu constants..."
          mkdir -p .temp
          python scripts/report_validation/check_schema_drift.py \
            --github-output --report-file .temp/schema_drift_report.md

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected after upgrade"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT

            echo "Changed files:"
            git status --short
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_VERSION="${{ steps.normalize.outputs.release_version }}"
          DBT_VERSION="${{ steps.normalize.outputs.dbt_version }}"
          BRANCH="feature/tamanu-upgrade-v$RELEASE_VERSION"

          # Build an optional schema-drift section for the PR body.
          # The drift check is continue-on-error, so distinguish three outcomes:
          # it failed to run (treat as unknown), it found drift, or it's in sync.
          SCHEMA_DRIFT_SECTION=""
          if [ "${{ steps.schema_drift.outcome }}" = "failure" ]; then
            SCHEMA_DRIFT_SECTION="## ⚠️ Action required: schema drift check did not complete

          The report config schema drift check failed to run (see the workflow logs — likely a Tamanu layout change or a transient clone failure). Verify \`scripts/report_validation/report-config-schema.json\` and \`documentations/tamanu-report-configuration-schema.md\` against Tamanu manually.
          "
          elif [ "${{ steps.schema_drift.outputs.schema_drift }}" = "true" ]; then
            SCHEMA_DRIFT_SECTION="## ⚠️ Action required: report config schema drift

          $(cat .temp/schema_drift_report.md)

          Update \`scripts/report_validation/report-config-schema.json\` and \`documentations/tamanu-report-configuration-schema.md\` to match before merging.
          "
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete branch if it already exists (locally and remotely)
          if git show-ref --verify --quiet refs/heads/"$BRANCH"; then
            echo "Branch $BRANCH exists locally, deleting..."
            git branch -D "$BRANCH"
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH exists on remote, deleting..."
            git push origin --delete "$BRANCH"
          fi

          git checkout -b "$BRANCH"
          git add .

          git commit -m "Upgrade Tamanu version to $DBT_VERSION

          - Updated dbt_project.yml to version $DBT_VERSION
          - Refreshed Tamanu source tables from release/$RELEASE_VERSION

          Related: MAUI-6163

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin "$BRANCH"

          gh pr create \
            --title "feat: Upgrade Tamanu version to $DBT_VERSION" \
            --body "## Summary
          Automated upgrade for Tamanu version \`$DBT_VERSION\`

          ## Changes
          - ✅ Updated \`dbt_project.yml\` to version \`$DBT_VERSION\`
          - ✅ Ran \`refresh_tamanu_source.py\` to pull source models from \`release/$RELEASE_VERSION\`

          ## Related
          - Tamanu release branch: [\`release/$RELEASE_VERSION\`](https://github.com/beyondessential/tamanu/tree/release/$RELEASE_VERSION)

          ${SCHEMA_DRIFT_SECTION}
          ## Next Steps
          After merging this PR, you'll need to build the reporting assets locally:
          \`\`\`bash
          python scripts/build_reporting_assets.py
          \`\`\`

          ## Testing
          - [ ] Verify source models are up to date
          - [ ] Run \`build_reporting_assets.py\` locally to prepare models and build compiled assets
          - [ ] Check compiled reporting assets in \`compiled/v$DBT_VERSION/\`
          - [ ] Run tests: \`dbt test\`
          - [ ] Resolve any report config schema drift flagged above (\`check_schema_drift.py\`)

          ---
          🤖 _This PR was automatically generated by [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_" \
            --base main \
            --head "$BRANCH"

          echo "✅ Pull request created successfully!"
          echo "PR URL:"
          gh pr view "$BRANCH" --json url --jq '.url'

      - name: No changes summary
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "ℹ️ No changes detected. The repository is already up to date with version ${{ steps.version.outputs.version }}"
