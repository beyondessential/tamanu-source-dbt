name: Release Reporting Assets

# Runs when a release is published, for the release's tag, and can be started by hand
# for a tag to rebuild and republish it.
#
# build: checks out the X.Y maintenance branch matching the release (falls back to main
#   if the branch doesn't exist yet), migrates an empty database with the Tamanu central
#   image of that minor, provisions it with that image's default reference data, runs
#   build_reporting_assets.py, and attaches the compiled assets to the GitHub release.
# publish: uploads the bundle the build produced to S3 and registers it with the
#   meta-server. The committed compiled/ folder is not used.
# list-reports: regenerates list_tamanu_reports.md for the latest release cut from main.
#
# S3 layout (standard):
#   M.m.x/<artifact>-vM.m.x-standard.<ext>   (reporting-schema, reporting-docs)
#   M.m.x/reporting-standard/                (reports)
#
# The workflow file that runs for a release is the one at the release's tag, so a change
# to it reaches a release only when it is on the branch before the tag is cut.
# tamanu-dbt-* repos publish through publish-artifacts.yml, which this workflow does not
# call.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v2.50.5)'
        required: true
        type: string

jobs:
  build:
    name: Build reporting assets
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    # A release branch's images are built for arm64 alone.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Determine version and branch
        id: version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          MINOR_VERSION="$(echo "$VERSION" | cut -d. -f1,2)"

          # Use the X.Y branch if it exists, otherwise fall back to main
          if gh api "repos/${{ github.repository }}/branches/$MINOR_VERSION" --silent 2>/dev/null; then
            REF="$MINOR_VERSION"
            echo "Using branch '$MINOR_VERSION'"
          else
            REF="main"
            echo "Branch '$MINOR_VERSION' does not exist yet — using main"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

          # A minor still in release candidates has no version tag yet, so take its
          # release branch's latest image.
          IMAGE="ghcr.io/beyondessential/tamanu-central:v$MINOR_VERSION"
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            SHA="$(gh api "repos/beyondessential/tamanu/commits/release/$MINOR_VERSION" --jq .sha)"
            IMAGE="ghcr.io/beyondessential/tamanu-central:sha-$SHA"
          fi
          echo "Using $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.ref }}

      # The build reads its version from the checkout, so stamp the entered version
      # into both files. The change stays in the runner and is never committed.
      - name: Set version in dbt_project.yml and pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not X.Y.Z"
            exit 1
          fi

          # The checkout must sit on the minor being released.
          CHECKOUT_MINOR="$(sed -nE 's/^version: *"?([0-9]+\.[0-9]+)\..*/\1/p' dbt_project.yml)"
          if [ "$CHECKOUT_MINOR" != "${VERSION%.*}" ]; then
            echo "::error::Checked-out branch is at $CHECKOUT_MINOR, not ${VERSION%.*}"
            exit 1
          fi

          sed -i -E "s/^version: .*/version: $VERSION/" dbt_project.yml
          # The project version is the first top-level version key, inside [project].
          sed -i -E "/^\[project\]/,/^\[/ s/^version = .*/version = \"$VERSION\"/" pyproject.toml

          grep -qx "version: $VERSION" dbt_project.yml
          grep -qx "version = \"$VERSION\"" pyproject.toml
          grep -n '^version' dbt_project.yml pyproject.toml

      # A fresh database rather than a release deployment's. ds__invoice_products and its
      # report pivot on the price lists and insurance plans present at compile time, which
      # the image's default reference data supplies as a release deployment's does.
      - name: Prepare the Tamanu database
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          # The version check reads local_system_facts before the migrations create it.
          tamanu() {
            docker run -i --rm --network host --entrypoint bash \
              -e NODE_CONFIG='{"db":{"skipVersionCompatibilityCheck":true}}' \
              -e CONFIG_SYNC_DB_HOST=127.0.0.1 \
              -e CONFIG_SYNC_DB_PORT=5432 \
              -e CONFIG_SYNC_DB_NAME=app \
              -e CONFIG_SYNC_DB_USERNAME=app \
              -e CONFIG_SYNC_DB_PASSWORD=app \
              "$IMAGE" -c "$1"
          }

          tamanu 'exec /entrypoint upgrade' </dev/null
          echo '{ referenceData: [{ defaultSpreadsheet: true }] }' \
            | tamanu 'cat > /tmp/provisioning.json5 && exec /entrypoint provision /tmp/provisioning.json5'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Build reporting assets
        env:
          TAMANU_RL_DB_URL: 127.0.0.1
          TAMANU_RL_DB_PORT: 5432
          TAMANU_RL_DB_USER: app
          TAMANU_RL_DB_PASSWORD: app
          TAMANU_RL_DB_DATABASE: app
        run: python scripts/build_reporting_assets.py

      - name: Upload the bundle for publishing
        uses: actions/upload-artifact@v4
        with:
          name: reporting-assets
          path: compiled/v${{ steps.version.outputs.version }}/
          if-no-files-found: error

      - name: Attach compiled assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            compiled/v${{ steps.version.outputs.version }}/* \
            --clobber

  publish:
    name: Publish reporting assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      # The S3 folder and report folder name. A deployment build would set its own.
      DEPLOYMENT: standard
    steps:
      - name: Fetch the built bundle
        uses: actions/download-artifact@v4
        with:
          name: reporting-assets
          path: compiled/v${{ needs.build.outputs.version }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::491618206332:role/gha-s3-tamanu-translations
          role-session-name: TamanuDbt-${{ env.DEPLOYMENT }}
          audience: sts.amazonaws.com

      - name: Publish to S3 and meta-server
        env:
          META_CERT: ${{ secrets.META_CERT }}
          META_KEY: ${{ secrets.META_KEY }}
          META_URL: ${{ vars.META_URL }}
        run: |
          set -euxo pipefail
          VX=${VERSION%.*}.x
          BUCKET=s3://bes-data-tamanu-translations
          S3_DIR="$VX"
          REPORTS_FOLDER="reporting-$DEPLOYMENT"

          # Canonical artifacts go in the top-level folder
          for artifact in reporting-schema reporting-docs; do
            file=$(ls compiled/v$VERSION/$artifact-* 2>/dev/null | head -1 || true)
            [ -z "$file" ] && continue
            filename=$(basename "$file")
            renamed="${filename//v$VERSION/v$VX}"
            aws s3 cp "$file" "$BUCKET/$S3_DIR/$renamed"
          done

          # Reports go in the reporting-<deployment>/ subfolder
          for file in compiled/v$VERSION/*; do
            filename=$(basename "$file")
            case "$filename" in
              reporting-schema-*|reporting-docs-*) continue ;;
            esac
            renamed="${filename//v$VERSION/v$VX}"
            aws s3 cp "$file" "$BUCKET/$S3_DIR/$REPORTS_FOLDER/$renamed"
          done

          echo "$META_CERT" > meta.crt
          echo "$META_KEY" > meta.key

          BASE_URL="https://tamanu-translations.data.bes.au/$S3_DIR"

          curl -fv "$META_URL/artifacts/$S3_DIR/reporting-schema/any" \
            --cert meta.crt --key meta.key \
            --data-binary "$BASE_URL/reporting-schema-v$VX-$DEPLOYMENT.sql"

          curl -fv "$META_URL/artifacts/$S3_DIR/reporting-docs/any" \
            --cert meta.crt --key meta.key \
            --data-binary "$BASE_URL/reporting-docs-v$VX-$DEPLOYMENT.html"

          curl -fv "$META_URL/artifacts/$S3_DIR/$REPORTS_FOLDER/any" \
            --cert meta.crt --key meta.key \
            --data-binary "$BASE_URL/$REPORTS_FOLDER/"

  # Only for a release cut from main, and only when it is the highest version
  # release. The regenerated list is committed straight back to main.
  list-reports:
    name: List Tamanu Reports
    needs: publish
    if: github.event_name == 'release' && github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check if latest version release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THIS_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess

          this_tag = os.environ['THIS_TAG']
          repo = os.environ['REPO']

          result = subprocess.run(
              ['gh', 'release', 'list', '--repo', repo,
               '--json', 'tagName,isPrerelease,isDraft', '--limit', '250'],
              capture_output=True, text=True, check=True,
          )
          releases = json.loads(result.stdout)
          tags = [
              r['tagName'] for r in releases
              if not r.get('isPrerelease') and not r.get('isDraft')
          ]

          def semver(tag):
              try:
                  return tuple(int(x) for x in tag.lstrip('v').split('.')[:3])
              except ValueError:
                  return (0, 0, 0)

          is_latest = not tags or semver(this_tag) >= max(semver(t) for t in tags)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"is_latest={'true' if is_latest else 'false'}\n")
          PYEOF

      - name: Checkout repository
        if: steps.check.outputs.is_latest == 'true'
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        if: steps.check.outputs.is_latest == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check.outputs.is_latest == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas PyYAML

      - name: List Tamanu Reports
        if: steps.check.outputs.is_latest == 'true'
        run: python scripts/list_tamanu_reports.py

      - name: Commit updated report list
        if: steps.check.outputs.is_latest == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- list_tamanu_reports.md; then
            echo "list_tamanu_reports.md already up to date"
          else
            git add list_tamanu_reports.md
            git commit -m "chore: update list_tamanu_reports.md [skip ci]"
            git push origin HEAD:main
          fi

