name: Generate Translations

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
    tags:
      - v*

jobs:
  generate-translations:
    name: Generate and deploy translations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 
    env:
      BUCKET: s3://bes-data-tamanu-translations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::491618206332:role/gha-s3-tamanu-translations
          role-session-name: GithubActionsTamanuSourceDBT

      - name: Configure boto3
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/config
          echo "s3 = {" >> ~/.aws/config
          echo "    use_accelerate_endpoint = false" >> ~/.aws/config
          echo "    addressing_style = path" >> ~/.aws/config
          echo "    payload_signing_enabled = true" >> ~/.aws/config
          echo "    use_dualstack_endpoint = false" >> ~/.aws/config
          echo "    use_ssl = true" >> ~/.aws/config
          echo "    use_verify_ssl = true" >> ~/.aws/config
          echo "    use_acl = false" >> ~/.aws/config
          echo "}" >> ~/.aws/config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl boto3 PyYAML

      - name: Generate translations
        run: python scripts/generate_translation_file.py
