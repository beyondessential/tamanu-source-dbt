name: Build Reporting Assets on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-reporting-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r scripts/requirements.txt

      - name: Run build_reporting_assets.py
        env:
          TAMANU_DEMO_DB_URL: ${{ secrets.TAMANU_DEMO_DB_URL }}
          TAMANU_DEMO_DB_USER: ${{ secrets.TAMANU_DEMO_DB_USER }}
          TAMANU_DEMO_DB_PASSWORD: ${{ secrets.TAMANU_DEMO_DB_PASSWORD }}
          TAMANU_DEMO_DB_DATABASE: ${{ secrets.TAMANU_DEMO_DB_DATABASE }}
        run: |
          python scripts/build_reporting_assets.py

      - name: Commit and push compiled assets
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add compiled/
          git diff --staged --quiet || git commit -m "chore: update compiled reporting assets [skip ci]"
          git push

      - name: Summary
        if: success()
        run: |
          VERSION=$(grep '^version:' dbt_project.yml | awk '{print $2}')
          echo "Built completed successfully for version $VERSION"
          echo "Built completed successfully for version $VERSION" >> $GITHUB_STEP_SUMMARY

