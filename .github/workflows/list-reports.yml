name: List Tamanu Reports

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
    tags:
      - v*

jobs:
  list-reports:
    name: List Tamanu Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl boto3 PyYAML

      - name: List Tamanu Reports
        run: python scripts/list_tamanu_reports.py 