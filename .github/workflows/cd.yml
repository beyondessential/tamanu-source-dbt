name: Release

on:
  release:
    types: [published]

jobs:
  list-reports:
    name: List Tamanu Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl boto3 PyYAML

      - name: List Tamanu Reports
        run: python scripts/list_tamanu_reports.py 

  generate:
    name: Generate translations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 
    env:
      BUCKET: s3://bes-data-tamanu-translations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::491618206332:role/gha-s3-tamanu-translations
          role-session-name: GithubActionsTamanuSourceDBT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl boto3 PyYAML

      - name: Generate translations
        run: python scripts/generate_translation_file.py

  publish:
    name: Publish to meta server
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        run: |
          set -x
          VERSION=${GITHUB_REF#refs/tags/v}
          
          cat << EOF > meta.crt
          ${{ secrets.META_CERT }}
          EOF
          cat << EOF > meta.key
          ${{ secrets.META_KEY }}
          EOF
          
          curl -v "${{ vars.META_URL }}/artifacts/$VERSION/report-translations/any" \
            --cert meta.crt --key meta.key \
            --data-binary "s3://bes-data-tamanu-translations/$VERSION/report_translations_v$VERSION.csv"