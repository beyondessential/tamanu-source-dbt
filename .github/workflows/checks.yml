name: Checks

# Runs on every PR and every push to main: unit tests for the helper scripts,
# plus a guard that the committed generated macros (translation +
# metric-definition) are still in sync with their source CSVs. Both are
# generated but committed, so they can silently drift if someone edits a CSV
# and forgets to regenerate.
#
# list_tamanu_reports.md is NOT guarded here -- it's regenerated and committed
# to main automatically by release-reporting-assets.yml's list-reports job on every
# release cut from main, so it can't drift for long.
#
# dbt-unit-tests runs against an ephemeral Postgres on the lowest supported version, so a
# model using newer syntax fails `dbt parse` here. It first runs a full `dbt parse`, which
# fails on any dbt deprecation, then lints the SQL, validates the report configs and
# translation labels, and runs the dbt unit tests. sqlfluff's dbt templater needs a
# reachable database but queries no tables, and the unit tests mock every input, so none
# of it needs Tamanu data -- no secrets, no live database, no access to a deployment. Data
# tests are deliberately not run here: they assert over real rows and need a live database
# with credentials (#427).
#
# These steps mirror `make check` (the .maui submodule is private, so CI cannot run it).
# Keep the two in step.
#
# Why it exists: nothing was executing dbt's own unit tests, and a fixture whose
# UNION arms had mismatched column counts reached a release through seven green PRs
# before a deployment hit it at runtime (#850).
#
# A report model's column names are its translated labels, so these tests hold only
# against this repo's standard translations and are excluded from deployment runs --
# see specs/testing/package-unit-test-execution.md.

on:
  pull_request:
  # A pull request can restore a uv cache saved on main but cannot save one there, so a run on
  # main is what leaves a warm cache, holding the built dbt-core-experimental-parser wheel, for
  # every new pull request to start from.
  push:
    branches:
      - main

jobs:
  checks:
    name: Unit tests and generated-macro sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # boto3 + pandas + pyyaml cover the scripts/utils import chain used by the
        # generators; pytest runs the unit tests. dbt/sqlfluff are not needed here.
        run: pip install boto3 pandas pyyaml pytest

      - name: Run script unit tests
        run: pytest scripts/tests -q

      - name: Regenerate committed artefacts
        run: |
          python scripts/generate_translation_macro.py
          python scripts/generate_metric_definitions_macro.py

      - name: Fail if generated macros drift from their CSVs
        run: |
          if ! git diff --quiet -- macros/default_translations.sql macros/metric_definitions.sql; then
            echo "::error::Generated macros are out of sync with their source CSVs."
            echo "Run the generators and commit the result:"
            echo "  python scripts/generate_translation_macro.py"
            echo "  python scripts/generate_metric_definitions_macro.py"
            git diff -- macros/default_translations.sql macros/metric_definitions.sql
            exit 1
          fi
          echo "Generated macros are in sync."

  dbt-unit-tests:
    name: dbt unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # The lowest Postgres version these models support (see AGENT.md).
        image: postgres:12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tamanu_source_dbt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # config/profiles.yml resolves its connection from these; the default target
      # is reporting_release.
      TAMANU_RL_DB_URL: localhost
      TAMANU_RL_DB_PORT: '5432'
      TAMANU_RL_DB_USER: postgres
      TAMANU_RL_DB_PASSWORD: postgres
      TAMANU_RL_DB_DATABASE: tamanu_source_dbt_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # pyproject.toml is the one place this project's dependencies are declared. dbt-core needs
        # dbt-core-experimental-parser, which PyPI ships as source only: building it downloads the
        # wheel from dbt-labs' GitHub releases, so a cold cache retries a failed or stalled download.
        run: |
          for attempt in 1 2 3; do
            timeout 10m uv pip install --system -e . && exit 0
            echo "::warning::Dependency install failed (attempt $attempt of 3)"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      - name: Generate the translation macro
        # macros/default_translations.sql is gitignored in this repo, so it has to be
        # generated before anything calling translate_label() can parse.
        run: python scripts/generate_translation_macro.py

      - name: Install dbt packages
        run: dbt deps

      - name: Fail on dbt deprecations
        # dbt_project.yml promotes every deprecation to an error, and some are only raised
        # during a full parse.
        run: dbt parse --no-partial-parse --show-all-deprecations --profiles-dir config --target reporting_release

      - name: Lint SQL
        run: sqlfluff lint .

      - name: Validate report configs
        run: python scripts/validate_report_configs.py

      - name: Check report translations
        run: python scripts/check_translations.py

      - name: Run dbt unit tests
        run: dbt test --select "unit_test:*" --profiles-dir config --target reporting_release
