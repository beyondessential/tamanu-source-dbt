name: Checks

# Runs on every PR: unit tests for the helper scripts, plus a guard that the
# committed generated macros (translation + metric-definition) are still in
# sync with their source CSVs. Both are generated but committed, so they can
# silently drift if someone edits a CSV and forgets to regenerate.
#
# list_tamanu_reports.md is guarded the same way: tamanu-dbt-* repos copy it out
# of dbt_packages, so a report added or renamed here must ship an updated list.
#
# dbt-unit-tests runs the dbt unit tests against an ephemeral Postgres. They mock
# every input, so they need a database connection but no Tamanu data -- no secrets,
# no live database, no access to a deployment. Data tests are deliberately not run
# here: they assert over real rows and need a live database with credentials (#427).
#
# Why it exists: nothing was executing dbt's own unit tests, and a fixture whose
# UNION arms had mismatched column counts reached a release through seven green PRs
# before a deployment hit it at runtime (#850).
#
# A report model's column names are its translated labels, so these tests hold only
# against this repo's standard translations and are excluded from deployment runs --
# see specs/testing/package-unit-test-execution.md.

on:
  pull_request:

jobs:
  checks:
    name: Unit tests and generated-macro sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # boto3 + pandas + pyyaml cover the scripts/utils import chain used by the
        # generators; pytest runs the unit tests. dbt/sqlfluff are not needed here.
        run: pip install boto3 pandas pyyaml pytest

      - name: Run script unit tests
        run: pytest scripts/tests -q

      - name: Regenerate committed artefacts
        run: |
          python scripts/generate_translation_macro.py
          python scripts/generate_metric_definitions_macro.py

      - name: Fail if generated macros drift from their CSVs
        run: |
          if ! git diff --quiet -- macros/default_translations.sql macros/metric_definitions.sql; then
            echo "::error::Generated macros are out of sync with their source CSVs."
            echo "Run the generators and commit the result:"
            echo "  python scripts/generate_translation_macro.py"
            echo "  python scripts/generate_metric_definitions_macro.py"
            git diff -- macros/default_translations.sql macros/metric_definitions.sql
            exit 1
          fi
          echo "Generated macros are in sync."

      - name: Fail if the report list drifts from the report configs
        run: |
          python scripts/list_tamanu_reports.py
          if ! git diff --quiet -- list_tamanu_reports.md; then
            echo "::error::list_tamanu_reports.md is out of sync with models/reports/config."
            echo "Run the generator and commit the result:"
            echo "  python scripts/list_tamanu_reports.py"
            git diff -- list_tamanu_reports.md
            exit 1
          fi
          echo "Report list is in sync."

  dbt-unit-tests:
    name: dbt unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tamanu_source_dbt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # config/profiles.yml resolves its connection from these; the default target
      # is reporting_release.
      TAMANU_RL_DB_URL: localhost
      TAMANU_RL_DB_PORT: '5432'
      TAMANU_RL_DB_USER: postgres
      TAMANU_RL_DB_PASSWORD: postgres
      TAMANU_RL_DB_DATABASE: tamanu_source_dbt_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # pyproject.toml is the one place this project's dependencies are declared.
        run: uv pip install --system -e .

      - name: Generate the translation macro
        # macros/default_translations.sql is gitignored in this repo, so it has to be
        # generated before anything calling translate_label() can parse.
        run: python scripts/generate_translation_macro.py

      - name: Install dbt packages
        run: dbt deps

      - name: Run dbt unit tests
        run: dbt test --select "unit_test:*" --profiles-dir config --target reporting_release
