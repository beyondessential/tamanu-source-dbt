name: Checks

# Runs on every PR: unit tests for the helper scripts, plus a guard that the
# committed generated macros (translation + metric-definition) are still in
# sync with their source CSVs. Both are generated but committed, so they can
# silently drift if someone edits a CSV and forgets to regenerate.
#
# list_tamanu_reports.md is NOT guarded here -- it's regenerated and committed
# to main automatically by publish-artifacts.yml's list-reports job on every
# release cut from main, so it can't drift for long.

on:
  pull_request:

jobs:
  checks:
    name: Unit tests and generated-macro sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # boto3 + pandas + pyyaml cover the scripts/utils import chain used by the
        # generators; pytest runs the unit tests. dbt/sqlfluff are not needed here.
        run: pip install boto3 pandas pyyaml pytest

      - name: Run script unit tests
        run: pytest scripts/tests -q

      - name: Regenerate committed artefacts
        run: |
          python scripts/generate_translation_macro.py
          python scripts/generate_metric_definitions_macro.py
          python scripts/generate_report_docs.py

      - name: Fail if generated macros drift from their CSVs
        run: |
          if ! git diff --quiet -- macros/default_translations.sql macros/metric_definitions.sql; then
            echo "::error::Generated macros are out of sync with their source CSVs."
            echo "Run the generators and commit the result:"
            echo "  python scripts/generate_translation_macro.py"
            echo "  python scripts/generate_metric_definitions_macro.py"
            git diff -- macros/default_translations.sql macros/metric_definitions.sql
            exit 1
          fi
          echo "Generated macros are in sync."

      - name: Fail if the report catalogue drifts from the report definitions
        # The catalogue is a pure function of the report configs, report SQL and the
        # translation CSV, so a rebuild is byte-identical unless one of those changed
        # without the catalogue being regenerated -- which would ship documentation
        # that no longer matches the reports it describes.
        #
        # Checks tracked changes AND untracked files: a version bump writes the
        # catalogue to a brand new compiled/v<version>/ directory, which `git diff`
        # alone would not see.
        run: |
          DRIFT=$(git status --porcelain -- 'compiled/*/report-catalogue-*')
          if [ -n "$DRIFT" ]; then
            echo "::error::The report catalogue is out of sync with the report definitions."
            echo "Run the generator and commit the result:"
            echo "  python scripts/generate_report_docs.py"
            echo "$DRIFT"
            exit 1
          fi
          echo "Report catalogue is in sync."
