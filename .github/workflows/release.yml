name: Build and Publish Release

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    env:
      BUCKET: s3://bes-data-tamanu-translations
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-secret: ${{ secrets.TAILSCALE_DBPROXY_ACCESS_OAUTH }}
          tags: tag:infra,tag:infra-gha-deploy

      - name: Install dependencies
        run: |
          uv sync

      - name: Extract version from dbt_project.yml
        id: get_version
        run: |
          VERSION=$(uv run python -c "import yaml; print(yaml.safe_load(open('dbt_project.yml'))['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          VERSION_WITH_ZERO_PATCH="${VERSION%.*}.0"
          echo "VERSION_WITH_ZERO_PATCH=$VERSION_WITH_ZERO_PATCH" >> $GITHUB_ENV
          echo "Extracted version: $VERSION (zero patch: $VERSION_WITH_ZERO_PATCH)"

      - name: Build reporting assets
        env:
          TAMANU_DEMO_DB_URL: ${{ secrets.TAMANU_DEMO_DB_URL }}
          TAMANU_DEMO_DB_USER: ${{ secrets.TAMANU_DEMO_DB_USER }}
          TAMANU_DEMO_DB_PASSWORD: ${{ secrets.TAMANU_DEMO_DB_PASSWORD }}
          TAMANU_DEMO_DB_DATABASE: ${{ secrets.TAMANU_DEMO_DB_DATABASE }}
        run: |
          uv run python scripts/build_reporting_assets.py

      - name: List Tamanu Reports
        run: |
          uv run python scripts/list_tamanu_reports.py

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2
          role-to-assume: arn:aws:iam::491618206332:role/gha-s3-tamanu-translations
          role-session-name: GithubActionsTamanuSourceDBT
          audience: sts.amazonaws.com

      - name: Convert CSV to Excel
        run: |
          set -x
          uv run python scripts/convert_translations_to_excel_file.py report_translations_standard.csv

      - name: Publish translations to S3
        run: |
          set -x
          aws s3 cp report_translations_standard.xlsx s3://bes-data-tamanu-translations/${{ env.VERSION_WITH_ZERO_PATCH }}/report-translations-v${{ env.VERSION_WITH_ZERO_PATCH }}-standard.xlsx

      - name: Publish analytics metadata to S3
        run: |
          set -x
          aws s3 cp compiled/v${{ env.VERSION }}/analytics-metadata-v${{ env.VERSION }}-standard.yml s3://bes-data-tamanu-translations/${{ env.VERSION_WITH_ZERO_PATCH }}/analytics-metadata-v${{ env.VERSION_WITH_ZERO_PATCH }}-standard.yml

      - name: Publish reporting schema to S3
        run: |
          set -x
          aws s3 cp compiled/v${{ env.VERSION }}/reporting-schema-v${{ env.VERSION }}-standard.sql s3://bes-data-tamanu-translations/${{ env.VERSION_WITH_ZERO_PATCH }}/reporting-schema-v${{ env.VERSION_WITH_ZERO_PATCH }}-standard.sql

      - name: Publish dbt docs to S3
        run: |
          set -x
          aws s3 cp compiled/v${{ env.VERSION }}/reporting-docs-v${{ env.VERSION }}-standard.html s3://bes-data-tamanu-translations/${{ env.VERSION_WITH_ZERO_PATCH }}/reporting-docs-v${{ env.VERSION_WITH_ZERO_PATCH }}-standard.html

      - name: Publish to meta-server
        run: |
          set -x
          
          echo "${{ secrets.META_CERT }}" > meta.crt
          echo "${{ secrets.META_KEY }}" > meta.key
          
          curl -v "${{ vars.META_URL }}/artifacts/${{ env.VERSION_WITH_ZERO_PATCH }}/report-translations/any" \
            --cert meta.crt --key meta.key \
            --data-binary "https://tamanu-translations.data.bes.au/${{ env.VERSION_WITH_ZERO_PATCH }}/report-translations-v${{ env.VERSION_WITH_ZERO_PATCH }}-standard.xlsx"
          
          curl -v "${{ vars.META_URL }}/artifacts/${{ env.VERSION_WITH_ZERO_PATCH }}/analytics-metadata/any" \
            --cert meta.crt --key meta.key \
            --data-binary "https://tamanu-translations.data.bes.au/${{ env.VERSION_WITH_ZERO_PATCH }}/analytics-metadata-v${{ env.VERSION_WITH_ZERO_PATCH }}-standard.yml"
          
          curl -v "${{ vars.META_URL }}/artifacts/${{ env.VERSION_WITH_ZERO_PATCH }}/reporting-schema/any" \
            --cert meta.crt --key meta.key \
            --data-binary "https://tamanu-translations.data.bes.au/${{ env.VERSION_WITH_ZERO_PATCH }}/reporting-schema-v${{ env.VERSION_WITH_ZERO_PATCH }}-standard.sql"
          
          curl -v "${{ vars.META_URL }}/artifacts/${{ env.VERSION_WITH_ZERO_PATCH }}/reporting-docs/any" \
            --cert meta.crt --key meta.key \
            --data-binary "https://tamanu-translations.data.bes.au/${{ env.VERSION_WITH_ZERO_PATCH }}/reporting-docs-v${{ env.VERSION_WITH_ZERO_PATCH }}-standard.html"

