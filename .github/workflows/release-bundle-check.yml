name: Release bundle check

# Fails when a declared version has no compiled report bundle behind it.
#
# compiled/v<version>/ IS the distribution here - publishing is unreliable, so
# the built bundle is committed by design. .gitignore carries compiled/*/*.json,
# so a plain `git add -A` drops the bundle from a release commit silently.
# Release commits need `git add -f compiled/v<version>`.
#
# INLINED DELIBERATELY - keep in sync with .maui/.github/workflows/release-bundle-check.yml.
# This repo is public and maui-team is private, and GitHub does not let a public
# repo call a reusable workflow in a private repo: the call fails at resolution
# with "workflow was not found", before any job runs. claude-code-review.yml and
# publish-artifacts.yml are inlined here for the same reason. Checking maui-team
# out with a minted App token is permitted, which is how the script is fetched.
#
# Branches with no compiled/ directory at all predate the convention (it first
# appears on 2.39) and are skipped by the script as NOT APPLICABLE, so this runs
# safely on every branch without a branches: filter.
#
# tag-depth is 1 because this repo carries 25 historical phantom tags - tagged
# with no version bump and no bundle. Depth 1 audits only the newest tag on each
# branch, which passes everywhere today while still catching any NEW phantom on
# the next PR. Raise it once those tags are deleted or age out; until then a
# higher depth fails on 2.55, 2.56, 2.57, 2.59 and 2.60.

on: pull_request

jobs:
  bundle:
    name: Compiled bundle present for declared version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Mint maui-team read token
        id: maui-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MAUI_APP_ID }}
          private-key: ${{ secrets.MAUI_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: maui-team

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: the tag audit needs reachable tags, and telling
          # a never-built bundle from a deliberately pruned one needs all history.
          fetch-depth: 0

      - name: Checkout maui-team scripts
        uses: actions/checkout@v4
        with:
          repository: beyondessential/maui-team
          path: .maui-team-tools
          ref: main
          token: ${{ steps.maui-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check compiled bundle
        run: python .maui-team-tools/scripts/check_release_bundle.py --check-tags --tag-depth 1
