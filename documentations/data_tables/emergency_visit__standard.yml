# Standard presentation of the ed_visit metric. See README.md for the schema.

data_table: emergency_visit__standard
model: metric__emergency_visit
description: >-
  Emergency department visits, one row per visit from arrival to hospital discharge, banded by
  the WHO primary age classification and split at four hours of total length of stay.

metrics:
  # BL-011: one visit per row, so the sum is a visit count at every grain.
  - column: value_numeric
    aggregation: sum

columns:
  - name: metric_id
    filter: array
  # Minute-grained timestamp, ranged as a date. period_end is deliberately not exposed: a
  # visit still open has none, and an array filter would drop it.
  - name: period_start
    filter: date
  - name: facility_id
    filter: array
  - name: sex
    filter: array
  - name: triage_score
    filter: array
  - name: principal_diagnosis__icd10_chapter
    filter: array
  - name: ed_start__hour
    filter: array
  - name: is_admitted
    filter: array

  # BL-019: the model emits age in whole years; the classification is this data table's.
  # Bands and labels match macros/age_group__who_primary_classification.sql, including its
  # treatment of an age over 120 as unknown.
  - name: age_group__who_primary_classification
    filter: array
    derived_from:
      column: age_years
      unmatched_label: Unknown age
      bands:
        - { label: '0-14 years', gte: 0, lt: 15 }
        - { label: '15-24 years', gte: 15, lt: 25 }
        - { label: '25-44 years', gte: 25, lt: 45 }
        - { label: '45-59 years', gte: 45, lt: 60 }
        - { label: '60-74 years', gte: 60, lt: 75 }
        - { label: '75+ years', gte: 75, lt: 121 }

  # BL-019: total length of stay, arrival to hospital discharge, split at four hours.
  # 'Unknown' is a visit whose encounter is still open, so its stay has no length yet.
  - name: length_of_stay__4_hours_band
    filter: array
    derived_from:
      column: length_of_stay__minutes
      unmatched_label: Unknown
      bands:
        - { label: '< 4 hours', lt: 240 }
        - { label: '4 or more hours', gte: 240 }
