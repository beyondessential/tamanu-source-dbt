# NCD registry cohorts and indicators.
#
# Part of the canonical registry of `metric__` indicators and `der__` derived elements:
# every documentations/metrics/*.yml file is merged by metric_id.
#
# Compiled into macros/metric_definitions.sql by
#   python scripts/generate_metric_definitions_macro.py
# Run that after editing, and commit the regenerated macro -- CI fails on drift.

metrics:
- metric_id: cohort_ncd_diabetes
  kind: cohort
  name: Diabetes registry cohort
  description: >-
    Patients on the diabetes and hypertension registry with type 1 or type 2 diabetes. A cohort
    entry runs from registration, or from the condition record when that is later, to the day
    before the patient was deactivated or the condition was disproven, recorded in error or deleted,
    or to the patient's date of death, whichever is earliest.
  numerator_description: null
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: Registry membership by condition, so indicators asked at different dates share one definition
  unit: null
  subject_grain: patient
  disaggregations: null
  variant_of: null
  owner: bes-maui
  status: approved
  spec_path: specs/dbt-model/derived__cohort_ncd.md
- metric_id: cohort_ncd_hypertension
  kind: cohort
  name: Hypertension registry cohort
  description: >-
    Patients on the diabetes and hypertension registry with hypertension. A cohort entry runs from
    registration, or from the condition record when that is later, to the day before the patient
    was deactivated or the condition was disproven, recorded in error or deleted, or to the patient's
    date of death, whichever is earliest.
  numerator_description: null
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: Registry membership by condition, so indicators asked at different dates share one definition
  unit: null
  subject_grain: patient
  disaggregations: null
  variant_of: null
  owner: bes-maui
  status: approved
  spec_path: specs/dbt-model/derived__cohort_ncd.md
- metric_id: dli7_dm_bmi_365d
  kind: metric
  name: DLI 7 diabetic patients with a BMI in the past year
  description: >-
    Patients in the diabetes registry cohort at a quarter's evaluation date with a BMI recorded in
    the 365 days up to it.
  numerator_description: >-
    Patients in cohort_ncd_diabetes at the evaluation date with a BMI recorded in the 365 days up to
    and including it
  denominator_description: null
  data_source: tamanu
  definition_source: SAMOA_MOH
  definition_source_code: DLI 7
  definition_rationale: >-
    Disbursement-linked indicator 7, diabetes protocol-compliant follow-up. Annual care checks are
    judged over the past year at each quarter end, and a visit over the past 180 days, a 90-day
    medication supply plus 90 days' grace
  unit: count
  subject_grain: patient
  disaggregations:
  - facility_id
  - sex
  variant_of: null
  owner: bes-maui
  status: approved
  spec_path: specs/dbt-model/metric__ncd_dli7_protocol_compliance.md
