    Patients in the diabetes registry cohort at a quarter's evaluation date with an HbA1c test in
    the 365 days up to it.
  numerator_description: >-
    Patients in cohort_ncd_diabetes at the evaluation date with an HbA1c test that was not
    cancelled, or an HbA1c result recorded on a clinical form, in the 365 days up to and including
