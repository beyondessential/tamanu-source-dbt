- metric_id: dli7_dm_protocol_compliant
  kind: metric
  name: DLI 7 diabetic patients receiving protocol-compliant follow-up
  description: >-
    Patients in the diabetes registry cohort at a quarter's evaluation date who had a visit in the
    180 days up to it, and an HbA1c test, a BMI, and nutrition and health education in the 365 days
    up to it. Divided by dli7_dm_registered for the same quarter, it is the DLI 7 rate.
  numerator_description: >-
    Patients in cohort_ncd_diabetes at the evaluation date meeting all of dli7_dm_visit_180d,
    dli7_dm_hba1c_365d, dli7_dm_bmi_365d and dli7_dm_nutrition_365d
  denominator_description: null
  data_source: tamanu
  definition_source: SAMOA_MOH
  definition_source_code: DLI 7
  definition_rationale: >-
    Disbursement-linked indicator 7, diabetes protocol-compliant follow-up. Annual care checks are
    judged over the past year at each quarter end, and a visit over the past 180 days, a 90-day
    medication supply plus 90 days' grace
  unit: count
  subject_grain: patient
  disaggregations:
  - facility_id
  - sex
  variant_of: null
  owner: bes-maui
  status: approved
  spec_path: specs/dbt-model/metric__ncd_dli7_protocol_compliance.md
