    medication supply plus 90 days' grace
  unit: count
  subject_grain: patient
  disaggregations:
  - facility_id
  - sex
  variant_of: null
  owner: bes-maui
  status: approved
  spec_path: specs/dbt-model/metric__ncd_dli7_protocol_compliance.md
- metric_id: dli7_dm_lost_to_follow_up
  kind: metric
  name: DLI 7 diabetic patients lost to follow-up
  description: >-
    Patients in the diabetes registry cohort at a quarter's evaluation date with no visit in the 180
