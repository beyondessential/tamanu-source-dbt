# MSF NCD programme metrics and cohorts.
#
# Part of the canonical registry of `metric__` indicators and `der__` derived elements:
# every documentations/metrics/*.yml file is merged by metric_id.
#
# Compiled into macros/metric_definitions.sql by
#   python scripts/generate_metric_definitions_macro.py
# Run that after editing, and commit the regenerated macro -- CI fails on drift.

metrics:
- metric_id: cohort_6m_diabetes_active
  kind: metric
  name: 6-month cohort — active diabetic patients
  description: >-
    Cohort diabetic patients still active at the 6-month evaluation point in the reporting month.
  numerator_description: Distinct cohort patients with a diabetes diagnosis still active at month
    end
  denominator_description: null
  data_source: tamanu
  definition_source: MSF
  definition_source_code: null
  definition_rationale: MSF NCD program operational definition
  unit: count
  subject_grain: patient
  disaggregations:
  - age_group
  - sex
  - facility_id
  variant_of: null
  owner: bes-maui
  status: approved
  spec_path: specs/dbt-model/ncd-indicators.md
