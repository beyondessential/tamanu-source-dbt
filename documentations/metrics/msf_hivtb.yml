# MSF HIV/TB standard indicators.
#
# Part of the canonical registry of `metric__` indicators and `der__` derived elements:
# every documentations/metrics/*.yml file is merged by metric_id.
#
# Compiled into macros/metric_definitions.sql by
#   python scripts/generate_metric_definitions_macro.py
# Run that after editing, and commit the regenerated macro -- CI fails on drift.

metrics:
- metric_id: hiv_plhiv_1st_line_art_0_14y
  kind: metric
  name: PLHIV on 1st-line ART (0-14y)
  description: People living with HIV aged 0-14 on first-line ART.
  numerator_description: >-
    Distinct HIV-cohort patients with an HIV Visit in the reporting month recording a first-line ART
    regimen, aged 0-14 at the visit date
  denominator_description: null
  data_source: tamanu
  definition_source: MSF
  definition_source_code: null
  definition_rationale: MSF OCA Standard Indicators Report (HIV/TB/PMTCT) operational definition
  unit: count
  subject_grain: patient
  disaggregations:
  - facility_id
  variant_of: null
  owner: bes-maui
  status: approved
