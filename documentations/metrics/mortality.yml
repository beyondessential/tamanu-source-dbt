# Recorded deaths.
#
# Part of the canonical registry of `metric__` indicators and `der__` derived elements:
# every documentations/metrics/*.yml file is merged by metric_id.
#
# Compiled into macros/metric_definitions.sql by
#   python scripts/generate_metric_definitions_macro.py
# Run that after editing, and commit the regenerated macro -- CI fails on drift.

metrics:
- metric_id: death
  kind: metric
  name: Deaths
  description: >-
    Recorded deaths, one row per deceased patient, on the date of death, with the primary cause
    and place of death from the patient's death record, and the record's facility or else that
    of the encounter the patient died in.
  numerator_description: >-
    Patients with a recorded date of death, counted on that date
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: >-
    A count of patients Tamanu records as deceased. The population and attribution follow
    ds__deaths, the dataset behind the deceased patients line list, so a dashboard count and
    that report agree: every patient with a date of death and the latest current death record
    for each. Where the record names no facility and does not say the death was outside a
    health facility, the facility is that of the encounter the patient died in, so a death can
    be placed on a facility-rooted dashboard.
  unit: count
  subject_grain: patient
  disaggregations:
  - facility_id
  - facility_source
  - sex
  - primary_cause
  - primary_cause_code
  - place_of_death
  - manner_of_death
  - department
  variant_of: null
  owner: bes-maui
  status: draft
  spec_path: specs/dbt-model/metric__death.md
