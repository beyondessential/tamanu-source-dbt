# Laboratory metrics: tests ordered, their turnaround, and their results.
#
# Part of the canonical registry of `metric__` indicators and `der__` derived elements:
# every documentations/metrics/*.yml file is merged by metric_id.
#
# Compiled into macros/metric_definitions.sql by
#   python scripts/generate_metric_definitions_macro.py
# Run that after editing, and commit the regenerated macro -- CI fails on drift.

metrics:
- metric_id: lab_test
  kind: metric
  name: Lab tests
  description: >-
    Laboratory tests ordered, whether or not they were completed. One row per test, not per lab
    request -- a request can bundle several tests (e.g. a panel), and is_panel_request preserves
    the order-level view. A test counts as completed when it carries its own completion
    timestamp, and turnaround runs from the request being placed to that moment. Completion is
    a property of the test alone and does not imply the result still stands -- a request
    published and later withdrawn leaves its tests completed with their result dropped -- so
    request_status is emitted for a consumer that needs delivered results rather than
    throughput.
  numerator_description: >-
    Lab tests ordered, counted on the date the request was placed, excluding requests marked
    deleted or entered-in-error -- cancelled, invalidated, rejected and sample-not-collected
    requests are counted, each having been genuinely ordered
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: >-
    No external indicator anchor (AIHW/WHO/DHIS2) defines a plain lab-test-count concept --
    AIHW's pathology reporting is built on Medicare Benefits Schedule item counts, which carry
    neither an unfulfilled order nor a turnaround time, so neither requested-versus-completed
    nor turnaround can be anchored to it. This is a BES composition over Tamanu's own
    laboratory workflow (MAUI-6837). The unit counted is the individual test, the same
    "bundle vs. line" distinction pharmacy_order draws against pharmacy orders. The order side
    is read from bases/ rather than a clinical__ model, per the decision that the OMOP clinical
    models record what has clinically happened and an order is an intent, not an occurrence
    (Juliana, 2026-09-23). Test type, category and result are emitted as recorded and
    ungrouped, the same approach encounter_diagnosis takes. Positivity is not materialised and not
    classified: which recorded values mean "positive" is a deployment vocabulary question, so
    the result is emitted raw and both the classification and the ratio are the consumer's --
    a stored proportion sums incorrectly wherever a disaggregation is collapsed. Pending
    alignment with the deploying country's national HMIS definition.
  unit: count
  subject_grain: lab_test
  disaggregations:
  - facility_id
  - encounter_type
  - encounter_setting
  - sex
  - is_completed
  - request_status
  - is_panel_request
  - department
  - lab_test_type
  - lab_test_type_code
  - lab_test_category
  - result
  variant_of: null
  owner: bes-maui
  status: draft
  spec_path: specs/dbt-model/metric__lab_test.md
