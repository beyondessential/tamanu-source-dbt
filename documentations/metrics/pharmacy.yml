# Pharmacy dispensing activity: ordered drug lines and their dispensing status.
#
# Part of the canonical registry of `metric__` indicators and `der__` derived elements:
# every documentations/metrics/*.yml file is merged by metric_id.
#
# Compiled into macros/metric_definitions.sql by
#   python scripts/generate_metric_definitions_macro.py
# Run that after editing, and commit the regenerated macro -- CI fails on drift.

metrics:
- metric_id: pharmacy_order
  kind: metric
  name: Pharmacy orders
  description: >-
    Ordered drug lines placed to pharmacy, and whether each has been fully dispensed. One row
    per ordered drug line, not per pharmacy order and not per physical dispense event.
  numerator_description: >-
    Ordered drug lines, counted on the date the pharmacy order was placed
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: >-
    No external indicator anchor (AIHW/WHO/DHIS2) defines "dispensing status" as a standard
    concept -- this is a BES composition over Tamanu's own pharmacy workflow. The unit counted
    is the ordered drug line (pharmacy_order_prescriptions), the grain the pharmacy queue is
    actually worked against, rather than the pharmacy order (which can bundle several lines) or
    the physical dispense event (an ordered line can be partially filled across 0..n dispenses).
    is_completed splits the total into dispensed vs pending; a consumer forms the dispensing
    rate downstream as sum(value_numeric) filter (where is_completed) / sum(value_numeric),
    never stored as a percentage, matching the rate convention fixed for metric__emergency_visit
    (MAUI-6787). Flag for realignment if a national HMIS or WHO essential-medicines indicator
    for dispensing surfaces later.
  unit: count
  subject_grain: pharmacy_order_prescription
  disaggregations:
  - facility_id
  - encounter_type
  - visit_detail_concept_id
  - visit_detail_concept_name
  - sex
  - is_completed
  - has_dispense
  - drug_source_value
  - drug_source_name
  - department
  variant_of: null
  owner: bes-maui
  status: draft
  spec_path: specs/dbt-model/metric__pharmacy_order.md
- metric_id: medication_dispense
  kind: metric
  name: Medications dispensed
  description: >-
    Medication handed over by pharmacy against an ordered drug line, one row per dispense, dated
    to the day it was dispensed. A drug line dispensed in several partial fills counts once per
    fill.
  numerator_description: >-
    Medication dispenses, counted on the date each was dispensed
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: >-
    The dispensing counterpart of pharmacy_order, which counts ordered drug lines on the day they
    were ordered. Dated to the dispense so a period's figure is what pharmacy handed out in that
    period. The setting is the OMOP Visit concept of the segment the patient was in when it was
    dispensed, id and name, so the date and the place describe the same moment, and an
    emergency card scopes this metric on 9203 rather than reading a separate one. No external indicator anchor
    (AIHW/WHO/DHIS2) defines medication dispensing as a standard count; flag for realignment if a
    national HMIS or WHO essential-medicines indicator surfaces later.
  unit: count
  subject_grain: medication_dispense
  disaggregations:
  - facility_id
  - encounter_type
  - visit_detail_concept_id
  - visit_detail_concept_name
  - sex
  - drug_source_value
  - drug_source_name
  - department
  variant_of: null
  owner: bes-maui
  status: draft
  spec_path: specs/dbt-model/metric__medication_dispense.md
- metric_id: prescription
  kind: metric
  name: Prescriptions
  description: >-
    Drug prescriptions written against an encounter, one row per encounter prescription, dated to the day the prescription was written.
  numerator_description: >-
    Encounter prescriptions, counted on the date each was written
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: >-
    BES composition over Tamanu's prescribing workflow; no external indicator anchor (AIHW/WHO/DHIS2) defines a prescription count. Dated to the day written, with the setting of the segment the patient was in at that moment, so the date and the place describe the same moment. The upstream of pharmacy_order: a prescription becomes a pharmacy order only when it is sent to pharmacy.
  unit: count
  subject_grain: encounter_prescription
  disaggregations:
  - facility_id
  - encounter_type
  - visit_detail_concept_id
  - visit_detail_concept_name
  - sex
  - drug_source_value
  - drug_source_name
  - department
  variant_of: null
  owner: bes-maui
  status: draft
  spec_path: specs/dbt-model/metric__prescription.md
- metric_id: medication_administration
  kind: metric
  name: Medication doses given
  description: >-
    Medication doses recorded as given on the medication administration record (MAR), one row per given dose, dated to the day it was given.
  numerator_description: >-
    MAR doses recorded as given, counted on the date each was given
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: >-
    BES composition over Tamanu's MAR; no external indicator anchor defines doses given as a standard count. The unit is the dose (medication_administration_record_doses), because one scheduled administration can be given in several doses. Doses removed in error, and administrations flagged as errors, are not counted. Dated to when the dose was given, with the setting of the segment the patient was in at that moment.
  unit: count
  subject_grain: medication_administration_dose
  disaggregations:
  - facility_id
  - encounter_type
  - visit_detail_concept_id
  - visit_detail_concept_name
  - sex
  - drug_source_value
  - drug_source_name
  - department
  variant_of: null
  owner: bes-maui
  status: draft
  spec_path: specs/dbt-model/metric__medication_administration.md
- metric_id: prescription_discontinuation
  kind: metric
  name: Prescriptions discontinued
  description: >-
    Prescriptions discontinued by a clinician, one row per discontinued encounter prescription, dated to the day it was discontinued, with the reason recorded.
  numerator_description: >-
    Encounter prescriptions discontinued, counted on the date each was discontinued
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: >-
    BES composition over Tamanu's prescribing workflow; no external indicator anchor defines prescription discontinuation as a standard count. Dated to the discontinuation, with the setting of the segment the patient was in at that moment. The reason is carried as recorded, ungrouped, so a consumer ranks or groups it as it sees fit.
  unit: count
  subject_grain: encounter_prescription
  disaggregations:
  - facility_id
  - encounter_type
  - visit_detail_concept_id
  - visit_detail_concept_name
  - sex
  - drug_source_value
  - drug_source_name
  - department
  - discontinuing_reason
  variant_of: null
  owner: bes-maui
  status: draft
  spec_path: specs/dbt-model/metric__prescription_discontinuation.md
