- metric_id: sti_syphilis_test_key_population
  kind: metric
  name: Syphilis testing, by key population
  description: >-
    sti_syphilis_test disaggregated by key population: one row per patient per reporting month per key
    population they are recorded as belonging to.
  numerator_description: >-
    COUNT of patient-population pairs where the patient has at least one countable syphilis test dated in
    the reporting month. A patient belonging to two key populations contributes to both, so summing across
    populations double-counts that patient -- group by key_population, do not total it
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: >-
    Registered separately from sti_syphilis_test rather than added to it as a column, because one patient
    can hold several key populations and a column would make the base metric's own total wrong.
  unit: count
  subject_grain: patient
  disaggregations:
  - facility_id
  - sex
  - is_positive
  - treatment_status
  - key_population
  variant_of: null
  owner: bes-maui
  status: draft
  spec_path: specs/dbt-model/metric__sti_screening.md
