- metric_id: sti_syphilis_screening_coverage
  kind: metric
  name: Syphilis screening coverage
  description: >-
    Key population patients attending STI services and whether each was tested for syphilis. One
    row per patient per reporting month per key population they belong to, carrying tested, so a
    coverage rate is the tested rows over all of them.
  numerator_description: >-
    COUNT of patient-population pairs attending an STI service in the reporting month where the patient
    was tested for syphilis
  denominator_description: >-
    COUNT of patient-population pairs attending an STI service in the reporting month, a patient counted
    once for the month however many times they attended. Which attendance counts is bound by the
    deployment, including whether the patient must be enrolled in the programme the service runs, so the
    denominator may be the enrolled cohort attending rather than everyone through the door. The binding
    narrows the tested rows with it, so it cannot push the rate above 100%. A patient belonging to two
    key populations contributes to both, so summing across populations double-counts them -- group by
    key_population, do not total it
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: >-
    Registered as one metric carrying tested rather than as an attendance denominator divided by the
    sti_syphilis_test_key_population numerator. Those are two independently scoped populations:
    the testing metrics apply no facility filter, so a patient tested away from an STI service is in
    the numerator and not in the denominator, and the rate can exceed 100%. Holding both sides in one
    row makes containment structural rather than a promise, and matches the indicator's own wording
    -- the share of those attending who were tested, where a tested non-attendee is out of scope.
    The rate is still not stored: value_numeric is 1 per row and the consumer divides.
  unit: count
  subject_grain: patient
  disaggregations:
  - facility_id
  - sex
  - key_population
  - tested
  variant_of: null
  owner: bes-maui
  status: draft
  spec_path: specs/dbt-model/metric__sti_screening_coverage.md
