# STI screening metrics (MAUI-6637).
#
# Part of the canonical registry of `metric__` indicators and `der__` derived elements:
# every documentations/metrics/*.yml file is merged by metric_id.
#
# Compiled into macros/metric_definitions.sql by
#   python scripts/generate_metric_definitions_macro.py
# Run that after editing, and commit the regenerated macro -- CI fails on drift.

metrics:
- metric_id: sti_syphilis_test
  kind: metric
  name: Syphilis testing
  description: >-
    Patients tested for syphilis. One row per patient per reporting month, carrying the result and the
    treatment outcome for that month.
  numerator_description: >-
    Distinct patients with at least one countable syphilis test dated in the reporting month
  denominator_description: null
  data_source: tamanu
  definition_source: BES
  definition_source_code: null
  definition_rationale: >-
    Shaped to the tested / positive / treated cascade WHO STI surveillance guidance reports against,
    without claiming a specific registered indicator. Registered per infection rather than as one STI
    metric with an infection column because a single specimen can screen for more than one infection,
    so a patient would contribute several rows and an unfiltered total would double-count them.
  unit: count
  subject_grain: patient
  disaggregations:
  - facility_id
  - sex
  - is_positive
  - treatment_status
  variant_of: null
  owner: bes-maui
  status: draft
  spec_path: specs/dbt-model/metric__sti_screening.md
