# WHO SMART guidelines antenatal care Digital Adaptation Kit indicators (MAUI-6838).
#
# The DAK (2021) gives every data element a portable id in Web Annex A and defines its indicators
# in Web Annex C, ANC.IND.1 onwards, in terms of those elements. Registered here are the counts
# metric__who_dak_anc_indicators computes from DAK elements, whether a deployment captures them on
# the generated who-dak-anc forms or maps its own forms to them. `definition_source_code` carries
# Annex C's indicator code on a row that implements an Annex C indicator, and is NULL on a count
# that underlies one, such as the contact count.
#
# Part of the canonical registry of `metric__` indicators and `der__` derived elements:
# every documentations/metrics/*.yml file is merged by metric_id.
#
# Compiled into macros/metric_definitions.sql by
#   python scripts/generate_metric_definitions_macro.py
# Run that after editing, and commit the regenerated macro -- CI fails on drift.

metrics:
- metric_id: who_dak_anc_contact
  kind: metric
  name: Antenatal care contacts
  description: >-
    Antenatal care contacts -- a pregnant woman seen for antenatal care on a day, recorded on the
    WHO DAK ANC Registration form or a local form mapped to it.
  numerator_description: >-
    COUNT of (woman, day) pairs with at least one antenatal contact form, dated by the form's
    Contact date (ANC.A7.DE4) or, where that is blank, by its submission.
  denominator_description: null
  data_source: tamanu
  definition_source: WHO_SMART_ANC
  definition_source_code: null
  definition_rationale: >-
    WHO SMART guidelines antenatal care DAK (2021), data element ANC.A7.DE4 Contact date, following
    WHO recommendations on antenatal care for a positive pregnancy experience (2016). A contact
    count is not itself an Annex C indicator; it is what ANC.IND.4 and ANC.IND.5 (at least four and
    eight contacts) count per pregnancy. Numerator only -- coverage needs an expected-pregnancies
    estimate Tamanu does not hold, so it is formed downstream.
  unit: count
  subject_grain: visit
  disaggregations:
  - facility_id
  variant_of: null
  owner: bes-maui
  status: approved
  spec_path: specs/dbt-model/metric__who_dak_anc_indicators.md
- metric_id: who_dak_anc_contact_samoa
  kind: metric
  name: Antenatal care contacts (Samoa)
  description: >-
    Antenatal care contacts under Samoa Ministry of Health's definition (variant samoa_moh_2026) --
    a pregnant woman seen for antenatal care on a day, recorded on an antenatal contact form or as a
    visit to an antenatal clinic location group, with gestational age and gravida worked out where
    they are not recorded. A patient younger than 10 on the day is not counted.
  numerator_description: >-
    COUNT of (woman, day) pairs with at least one antenatal contact form, dated by the form's
    Contact date (ANC.A7.DE4) or, where that is blank, by its submission, or at least one encounter
    at a named antenatal clinic location group, dated by its start, for women aged 10 or over that day.
  denominator_description: null
  data_source: tamanu
  definition_source: SAMOA_MOH
  definition_source_code: null
  definition_rationale: >-
    Samoa Ministry of Health records antenatal care on its own forms and at antenatal clinic visits
    rather than on the DAK forms, so it counts clinic visits as contacts and works out what its forms
    do not record. A variant of who_dak_anc_contact, so the DAK definition stays as the DAK states it.
  unit: count
  subject_grain: visit
  disaggregations:
  - facility_id
  variant_of: who_dak_anc_contact
  owner: bes-maui
  status: approved
  spec_path: specs/dbt-model/metric__who_dak_anc_indicators.md
- metric_id: episode_pregnancy_samoa
  kind: episode
  name: Pregnancy episode (Samoa)
  description: >-
    One pregnancy of a woman in antenatal care under Samoa Ministry of Health's definition (variant
    samoa_moh_2026), assembled from her who_dak_anc_contact_samoa contacts. It
    starts at her first contact and takes in each later contact until a pregnancy outcome or more
    than 140 days pass with no contact. A contact in the 42 days after a delivery or a child's birth
    is postnatal and belongs to no pregnancy. It ends at the outcome recorded on an end-of-pregnancy
    form, else a child's birth, else her death, else her last contact once 140 days have passed with
    no contact, and is open otherwise.
  numerator_description: null
  denominator_description: null
  data_source: tamanu
  definition_source: SAMOA_MOH
  definition_source_code: null
  definition_rationale: >-
    Samoa Ministry of Health's definition, for its Antenatal Care Log Book. Samoa records antenatal
    care on its own forms and at antenatal clinic visits rather than on the DAK registration and
    end forms, so the pregnancy is assembled from those, mapped to DAK data elements. It stands in
    for the DAK's ANC record, opened at registration and closed by ANC.End.1 Reason for closing ANC
    record, which the DAK's pregnancy indicators count. The 140-day gap, the 42-day postnatal window
    and the closure order are Samoa's rules, not the DAK's.
  unit: null
  subject_grain: episode
  disaggregations: null
  variant_of: null
  owner: bes-maui
  status: approved
  spec_path: specs/dbt-model/derived__episode_pregnancy_samoa.md
