# Don't build this as a package - it's a dbt project; hatchling is used only to
# satisfy `uv pip install -e .` without the default build backend mis-discovering dbt directories.
[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "tamanu-source-dbt"
version = "2.51.2"
description = "A dbt project that transforms Tamanu healthcare system data into optimised reporting datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core",
    "dbt-postgres",
    "great-expectations==1.15.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.28.0",
    "chardet>=3.0.2,<6",
    "jsonschema",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "numpy>=2.2.6",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = []
