# Where tamanu-source-dbt's database credentials come from. Names only: never put a password,
# token or connection string here. Values are loaded when a command runs and never written to
# disk. See .maui/knowledge/standards/secrets-conventions.md.
#   uv run python .maui/scripts/with_secrets.py --check          # what resolves, and from where
#   uv run python .maui/scripts/with_secrets.py -- dbt build
#
# Identical on every version branch: the release server follows the version being worked on.

[env]
# config/profiles.yml, without a --profiles-dir flag.
DBT_PROFILES_DIR = config

[bitwarden]
# Exact item names in the organisation vault: the reporting_demo target (TAMANU_DEMO_DB_*).
notes =
    tamanu-source-dbt.env

[releases]
# The reporting_release and analytics targets (TAMANU_RL_DB_*): the release server on the main
# cluster for the series in dbt_project.yml's `version:` (tamanu-release-2-66 at 2.66.0), the
# same series prepare_release.py checks the host against. To build against another version
# deliberately, set MAUI_RELEASE_SERIES=2.64 for the run.
tamanu-release-{series} = TAMANU_RL
