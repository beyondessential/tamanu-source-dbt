version: 2

models:
  - name: program-ncdassessment-ncdreferral001
    description: "Dataset containing responses for 'NCD Referral الإحالة' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: NCDRef001
        description: "Date of Referral - تاريخ الزيارة"
      - name: NCDRef002
        description: "Referring health facility  - المنشأة الصحية المُحيلة"
      - name: NCDRef003
        description: "Referral completed by - أُنجز التحويل بواسطة"
      - name: NCDRef004
        description: "Reason for referral - سبب الإحالة"
      - name: NCDRef005
        description: "Referred to health facility - أُحيل إلى منشأة صحية"
      - name: NCDRef006
        description: "Referral to specialist/s - أُحيل إلى أخصائي/أخصائيين"
      - name: NCDRef007
        description: "Referral to other - أخرى"
