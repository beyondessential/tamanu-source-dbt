version: 2

models:
  - name: program-ncdassessment-aexitsurvey002
    description: "Dataset containing responses for 'Exit Survey الخروج' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: ExiSur001
        description: "Date of Exit - تاريخ الخروج"
      - name: ExiSur001a
        description: "Registry Status - الخروج"
      - name: ExiSur002
        description: "Exit Status - حالة الخروج"
      - name: ExiSur003
        description: "Reason for voluntary exit? - سبب الخروج الطوعي"
      - name: ExiSur004
        description: "Reason for loss to follow up? - لماذا فقد المتابعة؟"
      - name: ExiSur005
        description: "Reason for transfer? - لماذا تم تحويله/إحالته إلى جهة أخرى؟"
      - name: ExiSur006
        description: "Reason for clinical discharge? - لماذا تم تخريجه سريريًا؟"
      - name: ExiSur007
        description: "Other - أخرى"
      - name: ExiSur008
        description: "Support package provided? - حزمة الدعم المقدمة"
