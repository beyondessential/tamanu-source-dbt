        description: "Creatinine, spot (mg/dL) - الكرياتين (ملغ / ديسيليتر)"
      - name: DiabAnnRev021
        description: "Urine protein - بروتين البول"
      - name: DiabAnnRev022
        description: "Cardiovascular complications - مضاعفات القلب و الأوعية الدموية"
      - name: DiabAnnRev023
        description: "Cerbrovascular complications - مضاعفات القلب و الأوعية الدموية"
      - name: DiabAnnRev024
        description: "Neurological complications - المضاعفات العصبية"
