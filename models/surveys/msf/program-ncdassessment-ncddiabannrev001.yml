        description: "Skin (left) - الجلد ( اليسار)"
      - name: DiabAnnRev005
        description: "Skin (right) - الجلد ( اليمين )"
      - name: DiabAnnRev006
        description: "Deformities (left) - التشوهات (اليسار )"
      - name: DiabAnnRev007
        description: "Deformities (right) - التشوهات ( اليمين )"
      - name: DiabAnnRev008
        description: "Vibration (left) - الاهتزاز ( اليسار )"
      - name: DiabAnnRev009
        description: "Vibration (right) - الاهتزاز ( اليمين )"
      - name: DiabAnnRev010
        description: "Touch sensation (left) - الإحساس باللمس ( اليسار)"
      - name: DiabAnnRev011
        description: "Touch sensation (right) - الإحساس باللمس ( اليمين)"
      - name: DiabAnnRev012
        description: "Dorsalis pedis pulse (left) - نبض ظهر القدم ( اليسار )"
      - name: DiabAnnRev013
        description: "Dorsalis pedis pulse (right) - نبض ظهر القدم ( اليمين )"
      - name: DiabAnnRev014
        description: "Posterior tibial pulse (left) - النبض الظنبوبي الخلفي ( الايسر )"
