version: 2

models:
  - name: program-ncdassessment-ncddiabannrev001
    description: "Dataset containing responses for 'Diabetic Annual Review المراجعة السنوية لمرض السكري' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: DiabAnnRev001
        description: "Date - تاريخ الفحص"
      - name: DiabAnnRev002
        description: "Status - ضبط الحالة"
      - name: DiabAnnRev003
        description: "Foot exam performed - تم إجراء فحص القدم"
