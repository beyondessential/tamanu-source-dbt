version: 2

models:
  - name: program-patientvitals-patientvitals
    description: "Dataset containing responses for 'Vitals' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: PatientVitalsDate
        description: "Date"
      - name: PatientVitalsRespiratoryRate
        description: "Respiratory rate (bpm)"
      - name: PatientVitalsSPO2
        description: "SpO2 (%)"
      - name: PatientVitalsHeartRate
        description: "Heart rate (bpm)"
      - name: PatientVitalsSBP
        description: "SBP (mmHg)"
      - name: PatientVitalsDBP
        description: "DBP (mmHg)"
      - name: PatientVitalsMAP
        description: "Mean arterial pressure (MAP)"
      - name: PatientVitalsTemperature
        description: "Temperature (°C)"
      - name: PatientVitalsPainScale
        description: "Pain Scale"
      - name: PatientVitalsBSLFasting
        description: "Fasting BSL (mg/dL)"
      - name: PatientVitalsBSLNonfast
        description: "Non-fasting BSL (mg/dL)"
      - name: PatientVitalsHeight
        description: "Height (cm)"
      - name: PatientVitalsWeight
        description: "Weight (kg)"
      - name: PatientVitalsBMI
        description: "BMI (kg/m2)"
      - name: PatientVitalsMUAC
        description: "MUAC (cm)"
      - name: PatientVitalsMalnourished
        description: "Malnourished"
      - name: PatientVitalsAVPU
        description: "AVPU"
