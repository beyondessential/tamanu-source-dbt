version: 2

models:
  - name: program-demncdprimaryscreening-cvdscreeningref
    description: "Dataset containing responses for 'CVD Primary Screening Referral' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: DemCVDRef2
        description: "Referral date"
      - name: DemCVDRef3
        description: "Referring health facility"
      - name: DemCVDRef4
        description: "Referral completed by"
      - name: DemCVDRef5
        description: "Referred to health facility"
      - name: DemCVDRef7
        description: "Relevant screening history"
      - name: DemCVDRef8
        description: "CVD risk level"
      - name: DemCVDRef9
        description: "Diagnosis"
      - name: DemCVDRef10
        description: "Diagnosis certainty"
      - name: DemCVDRef11
        description: "Reason for referral"
