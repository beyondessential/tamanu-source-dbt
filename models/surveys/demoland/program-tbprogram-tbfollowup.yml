version: 2

models:
  - name: program-tbprogram-tbfollowup
    description: "Dataset containing responses for 'TB Follow Up' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: PHTBFU001
        description: "Initial screening survey"
      - name: PHTBFU001a
        description: "Current village"
      - name: PHTBFU002
        description: "Follow up period"
      - name: PHTBFU002a
        description: "Date of follow up"
      - name: PHTBFU003
        description: "TB drug resistance"
      - name: PHTBFU003a
        description: "Any overseas drug sensitivity testing?"
      - name: PHTBFU003c
        description: "Date of overseas result"
      - name: PHTBFU004
        description: "Overseas result"
      - name: PHTBFU005
        description: "Diagnosis method"
      - name: PHTBFU006
        description: "Smear date"
      - name: PHTBFU007
        description: "Smear results"
      - name: PHTBFU008
        description: "Culture date"
      - name: PHTBFU009
        description: "Culture results"
      - name: PHTBFU010
        description: "Explain"
      - name: PHTBFU011
        description: "GeneXpert date"
      - name: PHTBFU012
        description: "GeneXpert results"
      - name: PHTBFU013
        description: "Treatment outcome"
      - name: PHTBFU013a
        description: "Clinical status"
      - name: PHTBFU014
        description: "Comments"
