version: 2

models:
  - name: program-maternityregistry-antenatalnext
    description: "Dataset containing responses for 'Antenatal 24 weeks' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: antenatalnext001
        description: "Date"
      - name: antenatalnext002
        description: "Urine protein"
      - name: antenatalnext003
        description: "Urine sugar"
      - name: antenatalnext004
        description: "Weight (kg)"
      - name: antenatalnext005
        description: "Oedematous"
      - name: antenatalnext006
        description: "Comment"
      - name: antenatalnext007
        description: "Calculated maturity"
      - name: antenatalnext008
        description: "Clinical Maturity"
      - name: antenatalnext009
        description: "Presentation"
      - name: antenatalnext010
        description: "Position"
      - name: antenatalnext011
        description: "Engagement"
      - name: antenatalnext012
        description: "Fetal heart rate"
      - name: antenatalnext013
        description: "Comments"
      - name: antenatalnext014
        description: "Date of next appointment"
      - name: antenatalnext015
        description: "Submitted by"
      - name: antenatalnext016
        description: "Assessed by"
