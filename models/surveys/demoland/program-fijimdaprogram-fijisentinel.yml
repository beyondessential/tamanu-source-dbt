version: 2

models:
  - name: program-fijimdaprogram-fijisentinel
    description: "Dataset containing responses for '(Demo Land) Lymphatic Filariasis Sentinel Survey - Part A - Registration' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: fijisentinel003
        description: "Date"
      - name: fijisentinel004
        description: "Division"
      - name: fijisentinel005
        description: "Subdivision"
      - name: fijisentinel006
        description: "Medical Area"
      - name: fijisentinel007
        description: "Nursing Zone"
      - name: fijisentinel008
        description: "Catchment Area"
      - name: fijisentinel014
        description: "Catchment Area not available in list"
      - name: fijisentinel009
        description: "Year of MDA 1"
      - name: fijisentinel010
        description: "Year of MDA 2"
      - name: fijisentinel011
        description: "Age"
      - name: fijisentinel012
        description: "Gender"
      - name: fijisentinel013
        description: "Ethnicity"
