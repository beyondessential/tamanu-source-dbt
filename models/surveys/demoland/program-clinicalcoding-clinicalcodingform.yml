version: 2

models:
  - name: program-clinicalcoding-clinicalcodingform
    description: "Dataset containing responses for '(Demo 2) Clinical Coding Form' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: clinicalcodingform-001
        description: "Date of coding"
      - name: clinicalcodingform-002
        description: "ICD10 Code 1"
      - name: clinicalcodingform-003
        description: "ICD10 Code 2"
      - name: clinicalcodingform-004
        description: "ICD10 Code 3"
      - name: clinicalcodingform-005
        description: "ICD10 Code 4"
      - name: clinicalcodingform-006
        description: "ICD10 Code 5"
      - name: clinicalcodingform-007
        description: "Any additional  notes"
