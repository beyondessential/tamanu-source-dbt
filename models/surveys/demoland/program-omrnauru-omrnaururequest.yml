version: 2

models:
  - name: program-omrnauru-omrnaururequest
    description: "Dataset containing responses for 'OMR Request' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: NauruOMRRequest1
        description: "Date"
      - name: NauruOMRRequest2
        description: "Diagnosis"
      - name: NauruOMRRequest3
        description: "Specialty"
      - name: NauruOMRRequest4
        description: "Practitioner name"
      - name: NauruOMRRequest5
        description: "Type of referral"
      - name: NauruOMRRequest6
        description: "Treatment Centre"
      - name: NauruOMRRequest7
        description: "Medical escort"
      - name: NauruOMRRequest8
        description: "Name of medical escort"
      - name: NauruOMRRequest9
        description: "Family escort"
      - name: NauruOMRRequest10
        description: "Name of family member"
      - name: NauruOMRRequest11
        description: "Additional comments"
