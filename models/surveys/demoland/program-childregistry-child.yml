version: 2

models:
  - name: program-childregistry-child
    description: "Dataset containing responses for 'child screening' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: child001
        description: "Age range"
      - name: child002
        description: "Next of kin name"
      - name: child003
        description: "Next of kin address"
      - name: child004
        description: "Has breakfast daily"
      - name: child005
        description: "Has lunch daily"
      - name: child006
        description: "Has dinner daily"
      - name: child007
        description: "Goes to school"
      - name: child008
        description: "Mother's age at delivery (years)"
      - name: child009
        description: "Father's age at delivery (years)"
      - name: child010
        description: "Mother's occupation"
      - name: child011
        description: "Father's occupation"
