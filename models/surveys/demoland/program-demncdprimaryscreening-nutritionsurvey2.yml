version: 2

models:
  - name: program-demncdprimaryscreening-nutritionsurvey2
    description: "Dataset containing responses for 'Nutrition Assessment Tool' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: nutsurv03
        description: "Has consumed an alcoholic drink such as beer, wine, spirits, or home brew within the past 30 days"
      - name: nutsurv05
        description: "Number of types of fruits and vegetables eaten yesterday"
      - name: nutsurv06
        description: "Days per week eats processed or fried foods, canned meat or instant noodles"
      - name: nutsurv07
        description: "30 mins of moderate-intense physical activity 5 days of the week"
      - name: nutsurv09
        description: "Parent, sister or brother who was diagnosed with premature heart disease, stroke, DM , cancer or kidney disease"
      - name: nutsurv10
        description: "Any additional notes"
