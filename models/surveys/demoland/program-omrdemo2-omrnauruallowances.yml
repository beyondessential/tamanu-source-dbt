version: 2

models:
  - name: program-omrdemo2-omrnauruallowances
    description: "Dataset containing responses for 'OMR Patient Allowances' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: NauruOMRallow2
        description: "Actual date of travel"
      - name: NauruOMRallow3
        description: "Final date overseas"
      - name: NauruOMRallow4
        description: "Weekly allowance ($)"
      - name: NauruOMRallow5
        description: "Weeks spent overseas"
      - name: NauruOMRallow6
        description: "Total weekly allowance"
      - name: NauruOMRallow7
        description: "Money distributed directly to patient"
      - name: NauruOMRallow8
        description: "Direct payment approved by"
      - name: NauruOMRallow9
        description: "Payment ID"
      - name: NauruOMRallow10
        description: "Date of direct payment"
      - name: NauruOMRallow11
        description: "Additional comments"
