version: 2

models:
  - name: program-omrnauru-omrnauruinitial
    description: "Dataset containing responses for 'OMR Planning' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: NauruOMR1
        description: "Date"
      - name: NauruOMR2
        description: "Date of Travel"
      - name: NauruOMR3
        description: "Medical Department"
      - name: NauruOMR4
        description: "Treatment Centre"
      - name: NauruOMR5
        description: "Airfare Cost"
      - name: NauruOMR6
        description: "Estimated treatment cost"
      - name: NauruOMR7
        description: "Other medical costs"
      - name: NauruOMR8
        description: "Accommodation allowance"
      - name: NauruOMR9
        description: "Estimated number of months"
      - name: NauruOMR10
        description: "Total allowance"
      - name: NauruOMR11
        description: "Total cost"
      - name: NauruOMR12
        description: "Treating clinician in Nauru"
      - name: NauruOMR13
        description: "Diagnosis"
      - name: NauruOMR14
        description: "Additional comments"
