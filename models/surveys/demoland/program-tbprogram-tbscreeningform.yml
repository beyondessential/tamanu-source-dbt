version: 2

models:
  - name: program-tbprogram-tbscreeningform
    description: "Dataset containing responses for 'TB Screening Form' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: tbscreen02
        description: "In the last 2 years, have you lived with or spent time with someone who has been sick with TB?"
      - name: tbscreen03
        description: "Do you have (or have you had) any of these medical conditions?"
      - name: tbscreen04
        description: "Are you taking any medications that your doctor said could weaken your immune system or increase your risk of infection?"
      - name: tbscreen05
        description: "In the past year, have you injected drugs that your doctor did not prescribe?"
      - name: tbscreen06
        description: "Have you ever lived or worked in a prison, jail, homeless shelter or long-term care facility?"
      - name: tbscreen08
        description: "Coughing for more than 2-3 weeks?"
      - name: tbscreen09
        description: "Coughing up blood?"
      - name: tbscreen10
        description: "Weight loss of more than 10 pounds for no known reason?"
      - name: tbscreen11
        description: "Fever of 38°C for over 2 weeks?"
      - name: tbscreen12
        description: "Unusual or heavy sweating at night?"
      - name: tbscreen13
        description: "Unusual weakness or extreme fatigue?"
      - name: tbscreen15
        description: "Has the person had a TB test?"
      - name: tbscreen16
        description: "TB test result"
      - name: tbscreen17
        description: "TB test date"
      - name: tbscreen18
        description: "Test facility"
      - name: tbscreen19
        description: "Did the person get a chest x-ray after the TB test?"
      - name: tbscreen20
        description: "x-Ray result"
      - name: tbscreen21
        description: "x-Ray date"
      - name: tbscreen22
        description: "Did the person take medication for TB infection?"
      - name: tbscreen23
        description: "Does the person remember being sick with TB?"
      - name: tbscreen24
        description: "If yes, when"
      - name: tbscreen25
        description: "Where"
