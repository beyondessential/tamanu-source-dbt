version: 2

models:
  - name: program-demncdprimaryscreening-nutrscreeningref
    description: "Dataset containing responses for 'Nutrition Referral' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: DemNutrRef4
        description: "Referral date"
      - name: DemNutrRef2
        description: "Referring health facility"
      - name: DemNutrRef3
        description: "Referral completed by"
      - name: DemNutrRef5
        description: "Referred to health facility"
      - name: DemNutrRef7
        description: "Relevant screening history"
      - name: DemNutrRef8
        description: "Reason for referral"
