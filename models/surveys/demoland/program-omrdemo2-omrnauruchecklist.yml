version: 2

models:
  - name: program-omrdemo2-omrnauruchecklist
    description: "Dataset containing responses for 'OMR Travel Checklist' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: NauruOMRCheck1
        description: "Date"
      - name: NauruOMRCheck2
        description: "Flights booked"
      - name: NauruOMRCheck3
        description: "Medical clearance family"
      - name: NauruOMRCheck4
        description: "Visa"
      - name: NauruOMRCheck5
        description: "Visa number"
      - name: NauruOMRCheck6
        description: "Health travel requirements"
      - name: NauruOMRCheck7
        description: "Additional comments"
      - name: NauruOMRCheck8
        description: "Fully ready for travel"
