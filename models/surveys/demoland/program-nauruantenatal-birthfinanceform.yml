version: 2

models:
  - name: program-nauruantenatal-birthfinanceform
    description: "Dataset containing responses for 'Birth finance form' survey"
    columns:
      - name: encounter_id
        description: '{{ doc("survey_responses__encounter_id") }}'
      - name: response_id
        description: '{{ doc("generic__id") }} in survey_responses.'
      - name: patient_id
        description: '{{ doc("encounters__patient_id") }}'
      - name: start_datetime
        description: '{{ doc("survey_responses__start_time") }}'
      - name: result_text
        description: '{{ doc("survey_responses__result_text") }}'
      - name: birthfinanceform001
        description: "Patient name"
      - name: birthfinanceform002
        description: "Patient date of birth"
      - name: birthfinanceform003
        description: "Date form completed"
      - name: birthfinanceform004
        description: "Occupation"
      - name: birthfinanceform005
        description: "Title"
      - name: birthfinanceform006
        description: "Company name"
      - name: birthfinanceform007
        description: "The above mentioned patient has been admitted into RON Hospital since:"
      - name: birthfinanceform008
        description: "Time of hospital admission"
      - name: birthfinanceform009
        description: "During this admission, the patient gave birth to an infant, details as follow:"
      - name: birthfinanceform010
        description: "Date of birth (infant)"
      - name: birthfinanceform011
        description: "Time of birth"
      - name: birthfinanceform012
        description: "Form completed by Health information / Medical records Unit Manager"
