        description: "Urgent priority"
      - name: FijBCRef06
        description: "Referred to health facility"
      - name: FijBCRef07
        description: "Expected date of attendance"
      - name: FijBCRef09
        description: "Relevant screening history"
      - name: FijBCRef10
        description: "Reason for referral"
      - name: FijBCRef11
        description: "Other reason for referral"
      - name: FijBCRef12
        description: "Additional information"
