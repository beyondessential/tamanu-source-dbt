version: 2

models:
  - name: clinical__procedure_occurrence
    description: >-
      OMOP-lite PROCEDURE_OCCURRENCE domain. Two sources, unioned: recorded procedures
      (bases/procedures) and imaging requests (bases/imaging_requests) -- OMOP has no
      dedicated domain for medical imaging, so by the Standardized Vocabulary's own domain
      assignment it is classified under Procedure, distinguishable here via
      procedure_type_source_value. Free-text note/completed_note stay behind at
      bases/procedures, which is why this model can be unrestricted where that one is
      restricted.
    config:
      tags:
        - clinical
    meta:
      owner: bes-maui
      domain: clinical
      pii: false
      classification: internal
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: ac_001_clinical__procedure_occurrence_grain
          arguments:
            combination_of_columns:
              - procedure_occurrence_id
          config:
            severity: error
    columns:
      - name: procedure_occurrence_id
        data_type: character varying(255)
        description: The Tamanu procedure id.
        data_tests:
          - not_null:
              name: ac_001_clinical__procedure_occurrence_id_not_null
          - unique:
              name: ac_001_clinical__procedure_occurrence_id_unique
      - name: person_id
        data_type: character varying(255)
        description: The patient the row is recorded against, reached through the encounter.
        data_tests:
          - relationships:
              name: ac_002_clinical__procedure_occurrence_person_id_in_clinical__person
              arguments:
                to: ref('clinical__person')
                field: person_id
      - name: procedure_date
        data_type: date
        description: >-
          The date the procedure was performed, or (imaging branch) the date the imaging
          request was raised -- not a completion date.
        data_tests:
          - not_null:
              name: ac_005_clinical__procedure_occurrence_procedure_date_not_null
      - name: procedure_datetime
        data_type: timestamp
        description: >-
          The date and, where recorded, the time of day the procedure started, or (imaging
          branch) when the request was raised. Midnight where no start time was recorded
          (procedure branch only -- the imaging branch always carries a time).
        data_tests:
          - not_null:
              name: ac_005_clinical__procedure_occurrence_procedure_datetime_not_null
      - name: procedure_type_concept_id
        data_type: integer
        description: >-
          Constant 32817 (EHR administrative record) -- provenance, not the procedure's own
          type. The procedure itself is procedure_source_value/procedure_source_name;
          procedure_concept_id is deferred to the future vocab__ layer.
      - name: procedure_type_source_value
        data_type: character varying(255)
        description: >-
          Branch discriminator: 'procedure' for bases/procedures, 'imaging request' for
          bases/imaging_requests. Distinguishes imaging from procedures in this shared
          table.
        data_tests:
          - not_null:
              name: ac_006_clinical__procedure_occurrence_procedure_type_source_value_not_null
          - accepted_values:
              name: ac_006_clinical__procedure_occurrence_procedure_type_source_value_values
              arguments:
                values:
                  - procedure
                  - imaging request
      - name: provider_id
        data_type: character varying(255)
        description: >-
          The clinician who performed the procedure, or (imaging branch) who requested the
          imaging -- this branch carries no completion-side clinician.
        data_tests:
          - relationships:
              name: ac_004_clinical__procedure_occurrence_provider_id_in_ref__provider
              arguments:
                to: ref('ref__provider')
                field: provider_id
      - name: visit_occurrence_id
        data_type: character varying(255)
        description: The encounter the procedure was recorded against.
        data_tests:
          - relationships:
              name: ac_003_clinical__procedure_occurrence_visit_occurrence_id_in_clinical__visit_occurrence
              arguments:
                to: ref('clinical__visit_occurrence')
                field: visit_occurrence_id
      - name: location_id
        data_type: character varying(255)
        description: >-
          The Tamanu location the row's own record carries -- not necessarily the encounter's
          care_site_id (e.g. a theatre rather than the admission ward). Carried raw for both
          branches; not reliably populated for imaging in practice. Resolving a facility is a
          consumer-layer concern, the same convention clinical__visit_occurrence's care_site_id
          uses.
        data_tests:
          # relationships only checks populated values, so this doesn't require the column
          # be filled -- it catches a populated value that isn't a real location, the same
          # protection clinical__visit_occurrence.care_site_id has against ref__care_site.
          - relationships:
              name: ac_007_clinical__procedure_occurrence_location_id_in_locations
              arguments:
                to: ref('locations')
                field: id
              config:
                severity: warn
      - name: procedure_source_value
        data_type: character varying(255)
        description: >-
          The procedure type's reference-data code (procedure branch), or the raw Tamanu
          imaging_type value (imaging branch). NULL where unresolved (procedure branch only).
      - name: procedure_source_name
        data_type: character varying(255)
        description: >-
          The procedure type's reference-data name (procedure branch), or the imaging
          modality's readable label (imaging branch). NULL where unresolved (procedure branch
          only).
      - name: is_completed
        data_type: boolean
        description: >-
          Whether the procedure was marked completed, or (imaging branch) whether the
          request's own status is 'completed' -- not derived from imaging_results. Never NULL.
