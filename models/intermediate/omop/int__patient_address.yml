version: 2

models:
  - name: int__patient_address
    description: >
      One row per patient: the village, subdivision, division and country their address
      resolves to, and the address key shared by ref__location and clinical__person. A level
      the patient's registration details record is taken as recorded; a level left blank is
      filled from the village's place in the reference-data hierarchy.
    config:
      tags:
        - clinical
      meta:
        owner: bes-maui
        domain: clinical
        pii: true
        classification: restricted
    columns:
      - name: patient_id
        description: The patient.
      - name: village_id
        description: The patient's village.
      - name: subdivision_id
        description: The recorded subdivision, else the village's.
      - name: division_id
        description: The recorded division, else the subdivision's, else the village's.
      - name: country_id
        description: The country above the division, subdivision or village.
      - name: location_id
        description: >
          The address key, the village, subdivision and division ids joined by underscores
          with unknown for a level that is not known. Blank when none of the three is known.
