unit_tests:
  - name: test_int__encounter_invoice_amounts_exact_age_match
    model: int__encounter_invoice_amounts
    description: >
      A price list with an exact numeric patientAge rule (34) matches only the
      patient who is 34 at the invoice date. Patient A (born 1990-01-01) is 34
      and gets the $100 price-list price. Patient B (born 1989-01-01) is 35, the
      price list is skipped, and the item falls through to $0.
    given:
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_001' as id, '2024-01-14 09:00:00'::timestamp as start_datetime, '2024-01-15 11:00:00'::timestamp as end_datetime, 'pat_001' as patient_id, 'loc_001' as location_id, 'dept_001' as department_id, null::text as clinician_id, null::text as patient_billing_type_id
          union all
          select 'enc_002', '2024-01-14 09:00:00'::timestamp, '2024-01-14 16:00:00'::timestamp, 'pat_002', 'loc_001', 'dept_001', null::text, null::text

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'fac_001' as facility_id

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'General Hospital' as name, false as is_sensitive

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'Alice' as first_name, 'Young' as last_name, '1990-01-01'::date as date_of_birth, 'female' as sex
          union all
          select 'pat_002', 'P002', 'Bob', 'Elder', '1989-01-01'::date, 'male'

      - input: ref('patient_additional_data')
        format: sql
        rows: |
          select null::text as patient_id, null::text as patient_billing_type_id where false

      - input: ref('invoices')
        format: sql
        rows: |
          select '00000000-0000-0000-0000-000000000001' as id, 'enc_001' as encounter_id, 'in_progress' as status, '2024-01-14 09:00:00'::timestamp as datetime
          union all
          select '00000000-0000-0000-0000-000000000002', 'enc_002', 'in_progress', '2024-01-14 09:00:00'::timestamp

      - input: ref('invoices_change_logs')
        format: sql
        rows: |
          select null::uuid as invoice_id, null::timestamptz as logged_at, null::text as status, null::text as previous_status where false

      - input: ref('invoice_items')
        format: sql
        rows: |
          select 'item_001'::text as id, '00000000-0000-0000-0000-000000000001' as invoice_id, 'Consultation' as product_name_final, '2024-01-14'::date as date, 'prod_001' as product_id, null::numeric as price_final, null::numeric as manual_entry_price, 1::integer as quantity, null::text as source_record_type, null::text as source_record_id
          union all
          select 'item_002'::text, '00000000-0000-0000-0000-000000000002', 'Consultation', '2024-01-14'::date, 'prod_001', null::numeric, null::numeric, 1::integer, null::text, null::text

      - input: ref('invoice_products')
        format: sql
        rows: |
          select 'prod_001' as id, null::text as category, false as insurable, null::text as name

      - input: ref('invoice_payments')
        format: sql
        rows: |
          select null::uuid as id, null::uuid as invoice_id, null::numeric as amount, null::uuid as original_payment_id where false

      - input: ref('invoice_insurer_payments')
        format: sql
        rows: |
          select null::uuid as id, null::uuid as invoice_payment_id where false

      - input: ref('invoice_patient_payments')
        format: sql
        rows: |
          select null::uuid as id, null::uuid as invoice_payment_id where false

      - input: ref('invoice_item_finalised_insurances')
        format: sql
        rows: |
          select null::text as invoice_item_id, null::text as invoice_insurance_plan_id, null::numeric as coverage_value_final where false

      - input: ref('invoices_invoice_insurance_plans')
        format: sql
        rows: |
          select null::text as id, null::uuid as invoice_id, null::text as invoice_insurance_plan_id where false

      - input: ref('invoice_insurance_plan_items')
        format: sql
        rows: |
          select null::text as invoice_insurance_plan_id, null::text as invoice_product_id, null::numeric as coverage_value where false

      - input: ref('invoice_insurance_plans')
        format: sql
        rows: |
          select null::text as id, null::numeric as default_coverage where false

      - input: ref('invoice_item_discounts')
        format: sql
        rows: |
          select null::uuid as invoice_item_id, null::numeric as amount, null::text as type, null::uuid as id where false

      - input: ref('invoice_discounts')
        format: sql
        rows: |
          select null::uuid as invoice_id, null::numeric as percentage, null::timestamp as applied_time, null::uuid as id where false

      - input: ref('invoice_price_lists')
        format: sql
        rows: |
          -- Exact age match: only 34-year-olds qualify
          select 'pl_001' as id, 'pl_001' as code, '{"facilityId": "fac_001", "patientAge": 34}'::jsonb as rules, null::integer as evaluation_order, null::timestamp as created_at, 'current' as visibility_status

      - input: ref('invoice_price_list_items')
        format: sql
        rows: |
          select 'pl_001' as invoice_price_list_id, 'prod_001' as invoice_product_id, 100.00::numeric as price, false as is_hidden

    expect:
      format: sql
      rows: |
        -- enc_001 (Alice, age 34): price list matches, invoice_total = 100
        select
          '00000000-0000-0000-0000-000000000001' as invoice_id,
          'enc_001' as encounter_id,
          'in_progress' as status,
          '2024-01-14 09:00:00'::timestamp as invoice_datetime,
          null::timestamp as invoice_finalised_datetime,
          100.00::numeric as invoice_total,
          null::numeric as insurance_coverage,
          0.00::numeric as invoice_discount,
          null::numeric as patient_payment,
          null::numeric as insurer_payment,
          'Consultation' as products_no_category
        union all
        -- enc_002 (Bob, age 35): price list skipped, invoice_total = 0
        select
          '00000000-0000-0000-0000-000000000002',
          'enc_002',
          'in_progress',
          '2024-01-14 09:00:00'::timestamp,
          null::timestamp,
          0::numeric,
          null::numeric,
          0.00::numeric,
          null::numeric,
          null::numeric,
          'Consultation'
