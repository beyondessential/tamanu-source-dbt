unit_tests:
  - name: test_encounter_invoice_audit_sensitive_partition
    model: sensitive-audit-encounter-invoice
    description: >
      BL-001 of encounters_in_scope, asserted from the sensitive side. The same two
      facilities are in scope as the standard-variant tests -- one sensitive, one not --
      and each carries an encounter that would otherwise qualify. The sensitive variant
      must return the encounter at the sensitive facility and only that one.

      This is the inverse of what test_encounter_invoice_audit_aggregation asserts, and
      the two together pin both halves of the partition. Without this test, changing
      `f.is_sensitive = {{ is_sensitive }}` to a constant `= false` would still pass
      every other test in the repo, because no other unit test targets a sensitive
      variant.
    overrides:
      vars:
        timezone: Australia/Sydney
        date_format: 'YYYY-MM-DD'
        time_format: 'HH24:MI'
        datetime_format: 'YYYY-MM-DD HH24:MI:SS'
        datetime_without_seconds_format: 'YYYY-MM-DD HH24:MI'
        yearmonth_format: 'YYYY-MM'
        language: default
    given:
      - input: ref('encounters')
        format: sql
        rows: |
          -- at the SENSITIVE facility: the only row this variant should return
          select 'enc_sen' as id, '2024-01-18 09:00:00'::timestamp as start_datetime, '2024-01-18 17:00:00'::timestamp as end_datetime, 'pat_001' as patient_id, 'loc_002' as location_id, 'dept_001' as department_id, null::text as clinician_id, null::text as patient_billing_type_id, 'clinic' as encounter_type, null::text as reason_for_encounter
          union all
          -- at the NON-sensitive facility: must not appear in the sensitive variant
          select 'enc_std', '2024-01-19 09:00:00'::timestamp, '2024-01-19 17:00:00'::timestamp, 'pat_002', 'loc_001', 'dept_001', null::text, null::text, 'clinic', null::text

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'fac_001' as facility_id
          union all
          select 'loc_002', 'fac_002'

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'General Hospital' as name, false as is_sensitive
          union all
          select 'fac_002', 'Sensitive Clinic', true

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-01-01'::date as date_of_birth, 'male' as sex
          union all
          select 'pat_002', 'P002', 'Jane', 'Smith', '1985-06-15'::date, 'female'

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_001' as id, 'Medicine' as name

      - input: ref('users')
        format: sql
        rows: |
          select null::text as id, null::text as display_name where false

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as name where false

      - input: ref('ds__encounter_invoices')
        format: sql
        rows: |
          select
            null::text as invoice_id, null::text as encounter_id, null::text as status,
            null::timestamp as invoice_datetime, null::timestamp as invoice_finalised_datetime,
            null::numeric as invoice_total, null::numeric as insurance_coverage,
            null::numeric as invoice_discount, null::numeric as patient_payment,
            null::numeric as patient_subtotal, null::text as products_no_category
          where false

    expect:
      format: sql
      rows: |
        -- enc_sen only. enc_std is at a non-sensitive facility and is filtered out.
        select
          'P001' as "Patient ID",
          'John' as "First name",
          'Doe' as "Last name",
          '1990-01-01' as "Date of birth",
          34 as "Age",
          'male' as "Sex",
          null::text as "Billing type",
          '2024-01-18 09:00:00' as "Encounter start date and time",
          '2024-01-18 17:00:00' as "Encounter end date and time",
          1 as "Length of stay (days)",
          'Sensitive Clinic' as "Facility",
          'Medicine' as "Discharging department",
          null::text as "Supervising clinician",
          null::text as "Invoice finalised date and time",
          null::numeric as "Invoice total",
          null::numeric as "Insurance coverage",
          null::numeric as "Patient subtotal",
          null::numeric as "Patient payment",
          null::numeric as "Patient total",
          null::text as "Invoice products with no category"
