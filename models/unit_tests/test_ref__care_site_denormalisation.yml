unit_tests:
  - name: test_ref__care_site_department_denormalises_facility
    model: ref__care_site
    description: >-
      A department becomes a care_site_type='department' row, denormalised with its
      parent facility name and place-of-service source value (BL-001, BL-002, BL-003,
      BL-005).
    given:
      - input: ref('departments')
        format: sql
        rows: |
          select 'dep1' as id, 'DEP1' as code, 'Emergency Dept' as name, 'fac1' as facility_id
      - input: ref('locations')
        format: sql
        rows: |
          select null::varchar as id, null::varchar as code, null::varchar as name, null::varchar as facility_id where false
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac1' as id, 'General Hospital' as name, 'hospital' as type
    expect:
      format: sql
      rows: |
        select
          'dep1' as care_site_id, 'department' as care_site_type,
          'Emergency Dept' as care_site_name, 'DEP1' as care_site_source_value,
          'hospital' as place_of_service_source_value,
          'fac1' as facility_id, 'General Hospital' as facility_name

  - name: test_ref__care_site_location_denormalises_facility
    model: ref__care_site
    description: >-
      A location becomes a care_site_type='location' row, denormalised with its parent
      facility and place-of-service concept (BL-001, BL-002, BL-003, BL-005).
    given:
      - input: ref('departments')
        format: sql
        rows: |
          select null::varchar as id, null::varchar as code, null::varchar as name, null::varchar as facility_id where false
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc1' as id, 'LOC1' as code, 'Paediatric Ward Bed 3' as name, 'fac1' as facility_id
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac1' as id, 'General Hospital' as name, 'hospital' as type
    expect:
      format: sql
      rows: |
        select
          'loc1' as care_site_id, 'location' as care_site_type,
          'Paediatric Ward Bed 3' as care_site_name, 'LOC1' as care_site_source_value,
          'hospital' as place_of_service_source_value,
          'fac1' as facility_id, 'General Hospital' as facility_name

  - name: test_ref__care_site_orphan_care_site_yields_nulls
    model: ref__care_site
    description: >-
      A care site whose facility is absent from bases/facilities is still emitted; the
      facility-derived columns come through NULL rather than dropping the row (BL-003).
    given:
      - input: ref('departments')
        format: sql
        rows: |
          select 'dep2' as id, 'DEP2' as code, 'Roving Clinic' as name, 'fac_gone' as facility_id
      - input: ref('locations')
        format: sql
        rows: |
          select null::varchar as id, null::varchar as code, null::varchar as name, null::varchar as facility_id where false
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac1' as id, 'General Hospital' as name, 'hospital' as type
    expect:
      format: sql
      rows: |
        select
          'dep2' as care_site_id, 'department' as care_site_type,
          'Roving Clinic' as care_site_name, 'DEP2' as care_site_source_value,
          null::varchar as place_of_service_source_value,
          'fac_gone' as facility_id, null::varchar as facility_name
