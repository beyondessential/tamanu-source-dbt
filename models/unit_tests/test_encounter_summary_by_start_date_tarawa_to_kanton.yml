unit_tests:
  - name: test_encounter_summary_by_start_date_tarawa_to_kanton
    model: encounter-summary-by-start-date
    description: >
      Test date boundary filtering with user-selected timezone (Pacific/Kanton, UTC+13) vs server
      timezone (Pacific/Tarawa, UTC+12). enc_001 starts at 23:30 Jan 15 Tarawa (= 00:30 Jan 16
      Kanton) and is included with fromDate=Jan 16. enc_002 starts at 23:30 Jan 14 Tarawa (= 00:30
      Jan 15 Kanton) and is excluded. Without the Kanton conversion both would appear as Jan 15
      and Jan 14 Tarawa, demonstrating that the user-selected timezone shifts the date boundary.
    overrides:
      vars:
        timezone: Pacific/Tarawa
        datetime_format: YYYY-MM-DD HH24:MI
        date_format: YYYY-MM-DD
        fromDate: '2024-01-16'
      macros:
        to_user_selected_timezone: "(({{ field }} at time zone 'Pacific/Tarawa') at time zone 'Pacific/Kanton')"
    given:
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_001' as id, 'pat_001' as patient_id, '2024-01-15 23:30:00'::timestamp as start_datetime, null::timestamp as end_datetime, 'loc_001' as location_id, 'dept_001' as department_id, 'cli_002' as clinician_id, 'bill_001' as patient_billing_type_id, null::text as reason_for_encounter
          union all
          select 'enc_002', 'pat_001', '2024-01-14 23:30:00'::timestamp, null::timestamp, 'loc_001', 'dept_001', 'cli_002', null::text, null::text

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-05-15'::date as date_of_birth, 'male' as sex

      - input: ref('encounter_history')
        format: sql
        rows: |
          select 'enc_001' as encounter_id, '2024-01-15 23:30:00'::timestamp as datetime, null::text[] as change_type, 'cli_001' as updated_by_id, 'cli_001' as clinician_id, 'dept_001' as department_id, 'loc_001' as location_id, 'admission' as encounter_type

      - input: ref('users')
        format: sql
        rows: |
          select 'cli_001' as id, 'Dr. Alice Wilson' as display_name
          union all
          select 'cli_002', 'Dr. Bob Martinez'

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_001' as id, 'Emergency' as name

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'Room 101' as name, 'fac_001' as facility_id, 'lg_001' as location_group_id

      - input: ref('location_groups')
        format: sql
        rows: |
          select 'lg_001' as id, 'Emergency Ward' as name

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'Central Hospital' as name, false as is_sensitive

      - input: ref('reference_data')
        format: sql
        rows: |
          select 'bill_001' as id, 'Insurance' as name, null::text as code

      - input: ref('patient_additional_data')
        format: sql
        rows: |
          select null::text as patient_id, null::text as ethnicity_id
          where false

      - input: ref('triages')
        format: sql
        rows: |
          select null::text as encounter_id, null::text as score, null::timestamp as triage_datetime, null::timestamp as closed_datetime, null::text as arrival_mode_id
          where false

      - input: ref('discharges')
        format: sql
        rows: |
          select null::text as encounter_id, null::text as disposition_id
          where false

      - input: ref('encounter_diagnoses')
        format: sql
        rows: |
          select null::text as encounter_id, null::text as diagnosis_id, null::boolean as is_primary, null::text as certainty, null::timestamp as datetime
          where false

      - input: ref('encounter_prescriptions')
        format: sql
        rows: |
          select null::text as encounter_id, null::text as prescription_id
          where false

      - input: ref('prescriptions')
        format: sql
        rows: |
          select null::text as id, null::boolean as is_discontinued, null::text as discontinuing_reason, null::timestamp as datetime, null::text as medication_id
          where false

      - input: ref('vaccine_administrations')
        format: sql
        rows: |
          select null::text as encounter_id, null::timestamp as datetime, null::text as scheduled_vaccine_id
          where false

      - input: ref('vaccine_schedules')
        format: sql
        rows: |
          select null::text as id, null::text as label, null::text as dose_label, null::text as vaccine_id
          where false

      - input: ref('procedures')
        format: sql
        rows: |
          select null::text as encounter_id, null::date as date, null::text as procedure_type_id, null::text as location_id, null::text as note, null::text as completed_note
          where false

      - input: ref('lab_requests')
        format: sql
        rows: |
          select null::text as id, null::text as encounter_id, null::timestamp as collected_datetime, null::text as lab_test_panel_request_id, null::text as status
          where false

      - input: ref('lab_test_panel_requests')
        format: sql
        rows: |
          select null::text as id, null::text as lab_test_panel_id
          where false

      - input: ref('lab_test_panels')
        format: sql
        rows: |
          select null::text as id, null::text as name
          where false

      - input: ref('lab_tests')
        format: sql
        rows: |
          select null::text as lab_request_id, null::text as lab_test_type_id
          where false

      - input: ref('lab_test_types')
        format: sql
        rows: |
          select null::text as id, null::text as name
          where false

      - input: ref('notes')
        format: sql
        rows: |
          select null::text as id, null::timestamp as datetime, null::text as content, null::text as note_type, null::text as record_type, null::text as record_id, null::text as updated_note_id, null::text as visibility_status
          where false

      - input: ref('imaging_requests')
        format: sql
        rows: |
          select null::text as id, null::text as encounter_id, null::text as imaging_type, null::text as status
          where false

      - input: ref('imaging_request_areas')
        format: sql
        rows: |
          select null::text as imaging_request_id, null::text as area_id
          where false

      - input: ref('invoices')
        format: sql
        rows: |
          select null::text as id, null::text as encounter_id, null::text as status, null::timestamp as datetime
          where false

      - input: ref('invoice_items')
        format: sql
        rows: |
          select null::text as invoice_id, null::text as product_id
          where false

      - input: ref('invoice_products')
        format: sql
        rows: |
          select null::text as id, null::text as category
          where false

    expect:
      format: sql
      rows: |
        select
          'P001'               as "Patient ID",
          'John'               as "First name",
          'Doe'                as "Last name",
          '1990-05-15'         as "Date of birth",
          33                   as "Age",
          'male'               as "Sex",
          null::text           as "Ethnicity",
          'Insurance'          as "Billing type",
          '2024-01-16 00:30'   as "Encounter start date and time",
          null::text           as "Encounter end date and time",
          null::integer        as "Length of stay (days)",
          'Central Hospital'   as "Facility",
          null::text           as "Emergency encounter type",
          'Hospital admission' as "Inpatient encounter type",
          null::text           as "Outpatient encounter type",
          null::text           as "Discharge disposition",
          null::text           as "Triage category",
          null::text           as "Arrival mode",
          null::text           as "Time seen following triage/Waiting time (hh:mm:ss)",
          'Dr. Alice Wilson'   as "Clinician",
          'Dr. Bob Martinez'   as "Supervising clinician",
          'Emergency'          as "Discharging department",
          '2024-01-16 00:30'   as "Discharge date and time of Discharging department",
          'Emergency Ward'     as "Discharging area",
          '2024-01-16 00:30'   as "Discharge date and time of Discharging area",
          'Room 101'           as "Discharging location",
          '2024-01-16 00:30'   as "Discharge date and time of Discharging location",
          'Emergency'          as "Department history",
          '2024-01-16 00:30'   as "Department history date and times",
          'Emergency Ward'     as "Area history",
          '2024-01-16 00:30'   as "Area history date and times",
          'Room 101'           as "Location history",
          '2024-01-16 00:30'   as "Location history date and times",
          null::text           as "Reason for encounter",
          null::text           as "Diagnoses",
          null::text           as "Medications",
          null::text           as "Vaccinations",
          null::text           as "Procedures",
          null::text           as "Lab requests",
          null::text           as "Imaging requests",
          null::text           as "Notes",
          null::text           as "invoiceFinalisedDateTime",
          null::text           as "invoiceProductCategories"
