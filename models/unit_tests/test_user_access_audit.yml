version: 2

unit_tests:
  - name: test_user_access_audit_aggregates_designations_and_permissions
    model: ds__user_access_audit
    description: >
      Verifies that the user access audit dataset correctly:
      1. Aggregates multiple user designations into a comma-separated list (BL-003)
      2. Aggregates role permissions into a comma-separated list (verb:noun format) (BL-006)
      3. Joins users with their roles
      4. Filters to only current (active) users (BL-001)
      5. Exposes the user role id for parameter filtering (BL-011)
    given:
      - input: ref('users')
        format: sql
        rows: |
          select
            'user_001'::text as id,
            'U001'::text as display_id,
            'Alice Admin'::text as display_name,
            'alice@example.com'::text as email,
            'role_001'::text as role,
            'current'::text as visibility_status
          union all
          select 'user_002'::text, 'U002'::text, 'Bob Doctor'::text, 'bob@example.com'::text, 'role_002'::text, 'current'::text
          union all
          select 'user_003'::text, 'U003'::text, 'Charlie Nurse'::text, 'charlie@example.com'::text, 'role_003'::text, 'current'::text
          union all
          select 'user_005'::text, 'U005'::text, 'Inactive User'::text, 'inactive@example.com'::text, 'role_002'::text, 'historical'::text

      - input: ref('roles')
        format: sql
        rows: |
          select 'role_001'::text as id, 'Administrator'::text as name
          union all
          select 'role_002'::text, 'Clinician'::text
          union all
          select 'role_003'::text, 'Nurse'::text

      - input: ref('user_designations')
        format: sql
        rows: |
          select 'user_001'::text as user_id, 'desg_001'::text as designation_id
          union all
          select 'user_002'::text, 'desg_002'::text
          union all
          select 'user_002'::text, 'desg_003'::text
          union all
          select 'user_003'::text, 'desg_001'::text

      - input: ref('reference_data')
        format: sql
        rows: |
          select 'desg_001'::text as id, 'Surgeon'::text as name
          union all
          select 'desg_002'::text, 'General Practitioner'::text
          union all
          select 'desg_003'::text, 'Emergency Medicine'::text
          union all
          select 'desg_004'::text, 'Cardiologist'::text

      - input: ref('permissions')
        format: sql
        rows: |
          select 'role_001'::text as role_id, 'read'::text as verb, 'Patient'::text as noun
          union all
          select 'role_001'::text, 'write'::text, 'Patient'::text
          union all
          select 'role_001'::text, 'read'::text, 'Encounter'::text
          union all
          select 'role_001'::text, 'write'::text, 'Encounter'::text
          union all
          select 'role_002'::text, 'read'::text, 'Patient'::text
          union all
          select 'role_002'::text, 'write'::text, 'Encounter'::text
          union all
          select 'role_003'::text, 'read'::text, 'Patient'::text

    expect:
      format: sql
      rows: |
        select
          'user_001'::text as user_id,
          'U001'::text as user_display_id,
          'Alice Admin'::text as user_name,
          'alice@example.com'::text as user_email,
          'role_001'::text as user_role_id,
          'Administrator'::text as user_role,
          'Surgeon'::text as user_designations,
          'read:Encounter, read:Patient, write:Encounter, write:Patient'::text as role_permissions,
          'current'::text as visibility_status
        union all
        select 'user_002'::text, 'U002'::text, 'Bob Doctor'::text, 'bob@example.com'::text, 'role_002'::text, 'Clinician'::text, 'Emergency Medicine, General Practitioner'::text, 'read:Patient, write:Encounter'::text, 'current'::text
        union all
        select 'user_003'::text, 'U003'::text, 'Charlie Nurse'::text, 'charlie@example.com'::text, 'role_003'::text, 'Nurse'::text, 'Surgeon'::text, 'read:Patient'::text, 'current'::text

  - name: test_user_access_audit_handles_users_without_designations
    model: ds__user_access_audit
    description: >
      Verifies that users without any designations are still included in the
      report with NULL designation field, and that the LEFT JOIN works correctly.
    given:
      - input: ref('users')
        format: sql
        rows: |
          select
            'user_001'::text as id,
            'U001'::text as display_id,
            'No Designation User'::text as display_name,
            'nodesig@example.com'::text as email,
            'role_001'::text as role,
            'current'::text as visibility_status

      - input: ref('roles')
        format: sql
        rows: |
          select 'role_001'::text as id, 'Administrator'::text as name

      - input: ref('user_designations')
        format: sql
        rows: |
          select null::text as user_id, null::text as designation_id where false

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as name where false

      - input: ref('permissions')
        format: sql
        rows: |
          select 'role_001'::text as role_id, 'read'::text as verb, 'Patient'::text as noun

    expect:
      format: sql
      rows: |
        select
          'user_001'::text as user_id,
          'U001'::text as user_display_id,
          'No Designation User'::text as user_name,
          'nodesig@example.com'::text as user_email,
          'role_001'::text as user_role_id,
          'Administrator'::text as user_role,
          null::text as user_designations,
          'read:Patient'::text as role_permissions,
          'current'::text as visibility_status

  - name: test_user_access_audit_handles_roles_without_permissions
    model: ds__user_access_audit
    description: >
      Verifies that users with roles that have no permissions are still included
      with NULL permissions field, demonstrating the LEFT JOIN behavior.
    given:
      - input: ref('users')
        format: sql
        rows: |
          select
            'user_001'::text as id,
            'U001'::text as display_id,
            'No Perms User'::text as display_name,
            'noperms@example.com'::text as email,
            'role_001'::text as role,
            'current'::text as visibility_status

      - input: ref('roles')
        format: sql
        rows: |
          select 'role_001'::text as id, 'Guest'::text as name

      - input: ref('user_designations')
        format: sql
        rows: |
          select null::text as user_id, null::text as designation_id where false

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as name where false

      - input: ref('permissions')
        format: sql
        rows: |
          select null::text as role_id, null::text as verb, null::text as noun where false

    expect:
      format: sql
      rows: |
        select
          'user_001'::text as user_id,
          'U001'::text as user_display_id,
          'No Perms User'::text as user_name,
          'noperms@example.com'::text as user_email,
          'role_001'::text as user_role_id,
          'Guest'::text as user_role,
          null::text as user_designations,
          null::text as role_permissions,
          'current'::text as visibility_status
