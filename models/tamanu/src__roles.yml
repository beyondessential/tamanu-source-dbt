version: 2

sources:
  - name: tamanu
    schema: public
    description: "Tamanu source database"
    tables:
      - name: roles
        description: "{{ doc('table__roles') }}"
        columns:
          - name: id
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('roles__id') }}"
            tests:
              - unique
              - not_null
          - name: created_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: "{{ doc('generic__created_at') }} in roles"
            tests:
              - not_null
          - name: updated_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: "{{ doc('generic__updated_at') }} in roles"
            tests:
              - not_null
          - name: deleted_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: "{{ doc('generic__deleted_at') }} in roles"
          - name: name
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('roles__name') }}"
            tests:
              - not_null
          - name: updated_at_sync_tick
            data_type: BIGINT
            description: "{{ doc('generic__updated_at_sync_tick') }} roles"
            tests: 
              - not_null
