version: 2

sources:
  - name: tamanu
    schema: public
    description: "Tamanu source database"
    tables:
      - name: location_groups
        description: "{{ doc('table__location_groups') }}"
        columns:
          - name: id
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('location_groups__id') }}"
            tests:
              - unique
              - not_null
          - name: created_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: "{{ doc('generic__created_at') }} in location groups"
            tests:
              - not_null
          - name: updated_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: "{{ doc('generic__updated_at') }} in location groups"
            tests:
              - not_null
          - name: deleted_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: "{{ doc('generic__deleted_at') }} in location groups"
          - name: visibility_status
            data_type: TEXT
            description: "{{ doc('generic__visibility_status') }} in location groups"
            tests: 
              - not_null
              - accepted_values:
                  values: [ 'current', 'historical' ]
          - name: name
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('location_groups__name') }}"
            tests:
              - not_null
          - name: code
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('location_groups__code') }}"
            tests:
              - not_null
          - name: facility_id
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('facilities__id') }}"
            tests: 
              - relationships:
                  to: source('tamanu', 'facilities')
                  field: id
          - name: updated_at_sync_tick
            data_type: BIGINT
            description: "{{ doc('generic__updated_at_sync_tick') }} location groups"
            tests: 
              - not_null
