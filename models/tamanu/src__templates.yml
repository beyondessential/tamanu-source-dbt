version: 2

sources:
  - name: tamanu
    schema: public
    description: "Tamanu source database"
    tables:
      - name: templates
        description: ""
        columns:
          - name: id
            data_type: UUID
            description: ""
          - name: created_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: ""
          - name: updated_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: ""
          - name: deleted_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: ""
          - name: name
            data_type: TEXT
            description: ""
          - name: date_created
            data_type: DATE_STRING
            description: ""
          - name: title
            data_type: TEXT
            description: ""
          - name: body
            data_type: TEXT
            description: ""
          - name: type
            data_type: TEXT
            description: ""
            tests:
              - accepted_values:
                  values: [ 'admission', 'dietary', 'discharge', 'handover', 'medical', 'nursing', 'other',
                            'patientLetter', 'pharmacy', 'physiotherapy', 'social', 'surgical',
                            'treatmentPlan' ]
          - name: visibility_status
            data_type: TEXT
            description: "Default value is 'current'"
          - name: created_by_id
            data_type: CHARACTER VARYING(255)
            description: ""
