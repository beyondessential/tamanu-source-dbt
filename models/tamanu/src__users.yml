version: 2

sources:
  - name: tamanu
    schema: public
    description: "Tamanu source database"
    tables:
      - name: users
        description: "{{ doc('table__users') }}"
        columns:
          - name: id
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('users__id') }}"
            data-tests:
              - unique
              - not_null
          - name: created_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: "{{ doc('generic__created_at') }} in users"
            data-tests:
              - not_null
          - name: updated_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: "{{ doc('generic__updated_at') }} in users"
            data-tests:
              - not_null
          - name: deleted_at
            data_type: TIMESTAMP WITH TIME ZONE
            description: "{{ doc('generic__deleted_at') }} in users"
          - name: email
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('users__email') }}"
            data-tests:
              - not_null
          - name: password
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('users__password') }}"
            data-tests:
              - not_null
          - name: display_name
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('users__display_name') }}"
          - name: role
            data_type: CHARACTER VARYING(255)
            description: "{{ doc('roles__id') }}, default value is 'practitioner'"
            data-tests:
              - relationships:
                  to: source('tamanu', 'roles')
                  field: id
                  config:
                    severity: warn
          - name: updated_at_sync_tick
            data_type: BIGINT
            description: "{{ doc('generic__updated_at_sync_tick') }} users"
            data-tests:
              - not_null
