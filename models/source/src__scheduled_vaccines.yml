version: 2

sources:
  - name: tamanu
    schema: public
    description: "Tamanu database"
    tables:
      - name: scheduled_vaccines
        description: "{{ doc('table__vaccine_schedules') }}"
        tags: ['reference']
        columns:
          - name: id
            data_type: character varying
            description: "{{ doc('vaccine_schedules__id') }}"
            data-tests:
              - unique
              - not_null
          - name: created_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__created_at') }} in scheduled_vaccines."
            data-tests:
              - not_null
          - name: updated_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__updated_at') }} in scheduled_vaccines."
            data-tests:
              - not_null
          - name: deleted_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__deleted_at') }} in scheduled_vaccines."
          - name: category
            data_type: character varying
            description: "{{ doc('vaccine_schedules__category') }}"
            data-tests:
              - not_null
              - accepted_values:
                  values: ['Campaign', 'Catch-up', 'Other', 'Routine']
          - name: label
            data_type: character varying
            description: "{{ doc('vaccine_schedules__label') }}"
            data-tests:
              - not_null
          - name: dose_label
            data_type: character varying
            description: "{{ doc('vaccine_schedules__dose_label') }}"
            data-tests:
              - not_null
          - name: weeks_from_birth_due
            data_type: integer
            description: "{{ doc('vaccine_schedules__weeks_from_birth_due') }}"
          - name: index
            data_type: integer
            description: ""
          - name: vaccine_id
            data_type: character varying
            description: ""
          - name: weeks_from_last_vaccination_due
            data_type: integer
            description: ""
          - name: visibility_status
            data_type: text
            description: ""
          - name: updated_at_sync_tick
            data_type: bigint
            description: ""
          - name: hide_from_certificate
            data_type: boolean
            description: ""
          - name: sort_index
            data_type: integer
            description: ""
