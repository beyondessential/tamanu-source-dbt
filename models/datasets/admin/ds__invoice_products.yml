version: 2

models:
  - name: ds__invoice_products
    description: Invoice products with their price list items and insurance plan items for the invoice products summary report.
    config:
      tags:
        - reference
    columns:
      - name: id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} in invoice_products."
      - name: name
        data_type: text
        description: "{{ doc('invoice_products__name') }}"
      - name: insurable
        data_type: boolean
        description: "{{ doc('invoice_products__insurable') }}"
      - name: category
        data_type: character varying(255)
        description: "{{ doc('invoice_products__category') }}"
      - name: source_record_id
        data_type: character varying(255)
        description: "{{ doc('invoice_products__source_record_id') }}"
      - name: visibility_status
        data_type: character varying(255)
        description: "{{ doc('generic__visibility_status') }} in invoice_products."
      - name: invoice_price_list_id
        data_type: text
        description: "{{ doc('invoice_price_list_items__invoice_price_list_id') }}"
      - name: price
        data_type: numeric
        description: "{{ doc('invoice_price_list_items__price') }}"
      - name: invoice_insurance_plan_id
        data_type: text
        description: "{{ doc('invoice_insurance_plan_items__invoice_insurance_plan_id') }}"
      - name: coverage_value
        data_type: numeric
        description: "{{ doc('invoice_insurance_plan_items__coverage_value') }}"
