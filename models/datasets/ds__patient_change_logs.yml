version: 2
models:
  - name: ds__audit_patient_details_edits
    description: Patient details edits tracking - lists all users that have edited patient personal details or additional data with timestamps.
    config:
      tags:
        - patient
        - history
    columns:
      - name: patient_id
        data_type: text
        description: "{{ doc('generic__id') }} of the patient whose details were edited."
      - name: display_id
        data_type: text
        description: "{{ doc('patients__display_id') }} of the patient whose details were edited."
      - name: first_name
        data_type: text
        description: "{{ doc('patients__first_name') }} at the time of edit."
      - name: last_name
        data_type: text
        description: "{{ doc('patients__last_name') }} at the time of edit."
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }} at the time of edit."
      - name: sex
        data_type: text
        description: "{{ doc('patients__sex') }} at the time of edit."
      - name: village_id
        data_type: text
        description: "{{ doc('patients__village_id') }} at the time of edit."
      - name: village
        data_type: text
        description: "Village name where the patient resides at the time of edit."
      - name: edited_by_user_id
        data_type: text
        description: "{{ doc('logs__changes__updated_by_user_id') }} of the user who edited the patient details."
      - name: edited_by_user
        data_type: text
        description: "Display name of the user who edited the patient details."
      - name: user_email
        data_type: text
        description: "Email address of the user who edited the patient details."
      - name: user_role
        data_type: text
        description: "Role of the user who edited the patient details."
      - name: edited_datetime
        data_type: timestamp
        description: "Date and time when the patient details were edited."
