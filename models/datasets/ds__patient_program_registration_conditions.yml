version: 2

models:
  - name: ds__patient_program_registration_conditions
    description: Patient program registration conditions
    config:
      tags:
        - clinical
    columns:
      - name: patient_program_registration_condition_id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} in patient_program_registration_conditions."
      - name: program_registry_condition_category_id
        data_type: character varying(255)
        description: "{{ doc('patient_program_registration_conditions__program_registry_condition_category_id') }}"
      - name: patient_program_registration_id
        data_type: uuid
        description: "{{ doc('patient_program_registration_conditions__patient_program_registration_id') }}"
      - name: program_registry_id
        data_type: character varying(255)
        description: "{{ doc('patient_program_registrations__program_registry_id') }}"
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('patient_program_registrations__patient_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: medical_area_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__medical_area_id') }}"
      - name: medical_area
        data_type: text
        description: "{{ doc('reference_data__name') }} of the medical area."
      - name: sub_division_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__subdivision_id') }}"
      - name: sub_division
        data_type: text
        description: "{{ doc('reference_data__name') }} of the sub division."
      - name: division_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__division_id') }}"
      - name: division
        data_type: text
        description: "{{ doc('reference_data__name') }} of the division."
      - name: condition
        data_type: text
        description: "{{ doc('program_registry_conditions__name') }}"
      - name: condition_category
        data_type: text
        description: "{{ doc('program_registry_conditions__name') }} for the condition category."
      - name: condition_recorded_date
        data_type: date
        description: "{{ doc('generic__date') }} when the condition was recorded."
      - name: condition_recorded_by_id
        data_type: character varying(255)
        description: "{{ doc('patient_program_registration_conditions__clinician_id') }}"
      - name: condition_recorded_by
        data_type: character varying(255)
        description: "{{ doc('users__display_name') }} who recorded the condition."
      - name: registration_status
        data_type: text
        description: "{{ doc('patient_program_registrations__registration_status') }}"
