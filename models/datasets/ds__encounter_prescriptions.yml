version: 2

models:
  - name: ds__encounter_prescriptions
    description: Encounter prescriptions
    config:
      tags:
        - clinical
    columns:
      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('encounter_prescriptions__encounter_id') }}"
      - name: prescription_id
        data_type: character varying(255)
        description: "{{ doc('prescriptions__id') }}"
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} where the encounter is currently active or has ended."
      - name: is_selected_for_discharge
        data_type: boolean
        description: "{{ doc('encounter_prescriptions__is_selected_for_discharge') }}"
      - name: medication_id
        data_type: character varying(255)
        description: "{{ doc('prescriptions__medication_id') }}"
      - name: medication
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} name of the prescribed medication."
      - name: quantity
        data_type: integer
        description: "{{ doc('prescriptions__quantity') }}"
