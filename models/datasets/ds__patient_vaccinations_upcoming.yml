version: 2

models:
  - name: ds__patient_vaccinations_upcoming
    description: Patient vaccinations upcoming
    tags:
      - clinical
    columns:
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
        meta:
          metrics:
            total_patients_count:
              type: count
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: age
        data_type: integer
        description: "{{ doc('generic__patients_age') }} when patient was vaccinated."
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: due_date
        data_type: date
        description: "{{ doc('upcoming_vaccinations__due_date') }}"
      - name: vaccine_category
        data_type: character varying(255)
        description: "{{ doc('scheduled_vaccines__category') }}"
      - name: vaccine_schedules_id
        data_type: character varying
        description: "{{ doc('upcoming_vaccinations__scheduled_vaccine_id') }}"
      - name: vaccine_name
        data_type: character varying(255)
        description: "{{ doc('scheduled_vaccines__label') }}"
      - name: vaccine_schedule
        data_type: character varying(255)
        description: "{{ doc('scheduled_vaccines__dose_label') }}"
      - name: vaccine_status
        data_type: text
        description: "{{ doc('upcoming_vaccinations__status') }}"
