version: 2

models:
  - name: ds__invoicing
    description: Invoicing
    config:
      tags:
        - administration
    columns:
      - name: status
        data_type: character varying(255)
        description: "{{ doc('invoices__status') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: invoice_id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} of invoice."
      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} of encounter."
      - name: invoice_number
        data_type: character varying(255)
        description: "{{ doc('invoices__display_id') }}"
      - name: nationality
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the nationality."
      - name: social_security_number
        data_type: character varying(255)
        description: "{{ doc('generic__social_security_number') }}"
      - name: insurance_policy_number
        data_type: character varying(255)
        description: "{{ doc('generic__insurance_policy_number') }}"
      - name: insurers
        data_type: text
        description: "{{ doc('generic__insurers') }}"
      - name: patient_name
        data_type: character varying(255)
        description: "{{ doc('generic__patients_name') }}"
      - name: discharge_datetime
        data_type: timestamp
        description: "{{ doc('encounters__end_date') }}"
      - name: admission_datetime
        data_type: timestamp
        description: "{{ doc('encounters__start_date') }}"
      - name: discharge_area_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_group_id') }} where the patient was discharged."
      - name: discharge_area
        data_type: character varying(255)
        description: "{{ doc('generic__location_group') }} where the patient was discharged."
      - name: total_invoice_amount
        data_type: double precision
        description: "{{ doc('generic__invoice_total_invoice_amount') }}"
      - name: total_insurer_amount
        data_type: double precision
        description: "{{ doc('generic__invoice_total_insurer_amount') }}"
      - name: total_patient_discount
        data_type: double precision
        description: "{{ doc('generic__invoice_total_patient_discount') }}"
      - name: total_patient_amount
        data_type: double precision
        description: "{{ doc('generic__invoice_total_patient_amount') }}"
      - name: remaining_patient_balance
        data_type: double precision
        description: "{{ doc('generic__invoice_remaining_patient_balance') }}"
      - name: is_deceased
        data_type: boolean
        description: "{{ doc('generic__patient_is_deceased') }}"
      - name: date_of_death
        data_type: timestamp
        description: "{{ doc('patients__date_of_death') }}"
