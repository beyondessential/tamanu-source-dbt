version: 2

models:
  - name: ds__encounter_summary
    description: Comprehensive encounter summary with patient details, clinical information, and encounter history
    config:
      tags:
        - clinical
        - encounter
    columns:
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: age
        data_type: integer
        description: "{{ doc('generic__patients_age') }} at the time of the encounter."
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: ethnicity
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's ethnicity."
      - name: patient_billing_type
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient billing type."
      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('generic__encounter_id') }}"
      - name: encounter_start_date
        data_type: timestamp
        description: "{{ doc('encounters__start_date') }}"
      - name: encounter_end_date
        data_type: timestamp
        description: "{{ doc('encounters__end_date') }}"
      - name: length_of_stay
        data_type: integer
        description: "Length of stay in days for the encounter."
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} where the encounter took place."
      - name: facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} where the encounter took place."
      - name: emergency_encounter
        data_type: character varying(255)
        description: "Emergency encounter types (Triage, Active ED care, Emergency short stay)."
      - name: inpatient_encounter
        data_type: character varying(255)
        description: "Inpatient encounter types (Hospital admission)."
      - name: outpatient_encounter
        data_type: character varying(255)
        description: "Outpatient encounter types (Clinic, Imaging, Survey response, Vaccination)."
      - name: triage_score
        data_type: integer
        description: "{{ doc('triages__score') }}"
      - name: arrival_mode
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the arrival mode."
      - name: triage_wait_time
        data_type: character varying(255)
        description: "Time between triage and being seen (HH:MM:SS format)."
      - name: discharged_department_id
        data_type: character varying(255)
        description: "{{ doc('generic__department_id') }} where the patient was discharged from."
      - name: discharged_department
        data_type: character varying(255)
        description: "{{ doc('generic__department') }} where the patient was discharged from."
      - name: discharged_location_group_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_group_id') }} where the patient was discharged from."
      - name: discharged_location_group
        data_type: character varying(255)
        description: "{{ doc('generic__location_group') }} where the patient was discharged from."
      - name: discharged_location_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_id') }} where the patient was discharged from."
      - name: discharged_location
        data_type: character varying(255)
        description: "{{ doc('generic__location') }} where the patient was discharged from."
      - name: time_assigned_to_discharging_department
        data_type: character varying(255)
        description: "{{ doc('generic__date') }} when assigned to the discharging department."
      - name: time_assigned_to_discharging_area
        data_type: character varying(255)
        description: "{{ doc('generic__date') }} when assigned to the discharging area."
      - name: time_assigned_to_discharging_location
        data_type: character varying(255)
        description: "{{ doc('generic__date') }} when assigned to the discharging location."
      - name: department_history
        data_type: text
        description: "History of all departments visited during the encounter."
      - name: department_datetime_history
        data_type: text
        description: "History of date/times for all department changes."
      - name: area_history
        data_type: text
        description: "History of all location groups (areas) visited during the encounter."
      - name: area_datetime_history
        data_type: text
        description: "History of date/times for all area changes."
      - name: location_history
        data_type: text
        description: "History of all locations visited during the encounter."
      - name: location_datetime_history
        data_type: text
        description: "History of date/times for all location changes."
      - name: reason_for_encounter
        data_type: text
        description: "{{ doc('encounters__reason_for_encounter') }}"
      - name: diagnoses
        data_type: text
        description: "All diagnoses associated with the encounter including name, code, primary status, and certainty."
      - name: medications
        data_type: text
        description: "All medications prescribed during the encounter including discontinuation status and reasons."
      - name: vaccinations
        data_type: text
        description: "All vaccinations administered during the encounter including vaccine name, label, and schedule."
      - name: procedures
        data_type: text
        description: "All procedures performed during the encounter including name, date, location, and notes."
      - name: lab_requests
        data_type: text
        description: "All lab requests made during the encounter including test names and panels."
      - name: imaging_requests
        data_type: text
        description: "All imaging requests made during the encounter including type, areas to be imaged, and notes."
      - name: notes
        data_type: text
        description: "All clinical notes associated with the encounter including note type, content, and date. Note: Cropped if exceeds 32,000 characters."