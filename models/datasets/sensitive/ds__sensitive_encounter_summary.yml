version: 2

models:
  - name: ds__sensitive_encounter_summary
    description: Encounter summary with patient details and encounter history from sensitive facilities
    config:
      tags:
        - clinical
    meta:
      owner: bes-maui
      domain: clinical
      tier: gold
      pii: true
      classification: restricted
    columns:
      - name: encounter_id
        data_type: text
        description: "{{ doc('generic__id') }} in encounters."
      - name: start_datetime
        data_type: timestamp
        description: "{{ doc('encounters__start_date') }}"
      - name: end_datetime
        data_type: timestamp
        description: "{{ doc('encounters__end_date') }}"
      - name: patient_id
        data_type: text
        description: "{{ doc('encounters__patient_id') }}"
      - name: display_id
        data_type: text
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: text
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: text
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: age
        data_type: integer
        description: "{{ doc('generic__patients_age') }} at the time of the encounter."
      - name: sex
        data_type: text
        description: "{{ doc('patients__sex') }}"
      - name: ethnicity
        data_type: text
        description: "{{ doc('generic__reference_data') }} of the patient's ethnicity."
      - name: patient_billing_type
        data_type: text
        description: "{{ doc('generic__reference_data') }} of the patient billing type."
      - name: length_of_stay
        data_type: integer
        description: "{{ doc('generic__length_of_stay') }}"
      - name: facility_id
        data_type: text
        description: "{{ doc('generic__facility_id') }} where the encounter took place."
      - name: facility
        data_type: text
        description: "{{ doc('generic__facility') }} where the encounter took place."
      - name: encounter_type_emergency
        data_type: text
        description: "{{ doc('generic__encounter_types') }} (Triage, Active ED care, Emergency short stay)"
      - name: encounter_type_inpatient
        data_type: text
        description: "{{ doc('generic__encounter_types') }} (Hospital admission)"
      - name: encounter_type_outpatient
        data_type: text
        description: "{{ doc('generic__encounter_types') }} (Clinic, Imaging, Survey response, Vaccination)"
      - name: discharge_disposition_id
        data_type: text
        description: "{{ doc('discharges__disposition_id') }}"
      - name: discharge_disposition
        data_type: text
        description: "{{ doc('generic__reference_data') }} of the discharge disposition."
      - name: triage_score
        data_type: integer
        description: "{{ doc('triages__score') }}"
      - name: arrival_mode_id
        data_type: text
        description: "{{ doc('triages__arrival_mode_id') }}"
      - name: arrival_mode
        data_type: text
        description: "{{ doc('generic__reference_data') }} of the arrival mode."
      - name: triage_wait_time
        data_type: text
        description: "{{ doc('generic__triage_wait_time') }}"
      - name: encountering_clinician_id
        data_type: text
        description: "{{ doc('generic__id') }} of the user who first encountered the patient."
      - name: encountering_clinician
        data_type: text
        description: "{{ doc('generic__user') }} who first encountered the patient."
      - name: supervising_clinician_id
        data_type: text
        description: "{{ doc('generic__id') }} of the user who discharged the patient."
      - name: supervising_clinician
        data_type: text
        description: "{{ doc('generic__user') }} who discharged the patient."
      - name: discharging_department_id
        data_type: text
        description: "{{ doc('generic__department_id') }} where the patient is being discharged from."
      - name: discharging_department
        data_type: text
        description: "{{ doc('generic__department') }} where the patient is being discharged from."
      - name: discharging_location_group_id
        data_type: text
        description: "{{ doc('generic__location_group_id') }} where the patient is being discharged from."
      - name: discharging_location_group
        data_type: text
        description: "{{ doc('generic__location_group') }} where the patient is being discharged from."
      - name: discharging_location_id
        data_type: text
        description: "{{ doc('generic__location_id') }} where the patient is being discharged from."
      - name: discharging_location
        data_type: text
        description: "{{ doc('generic__location') }} where the patient is being discharged from."
      - name: time_assigned_to_discharging_department
        data_type: text
        description: "{{ doc('generic__date') }} when assigned to the discharging department."
      - name: time_assigned_to_discharging_location_group
        data_type: text
        description: "{{ doc('generic__date') }} when assigned to the discharging location group."
      - name: time_assigned_to_discharging_location
        data_type: text
        description: "{{ doc('generic__date') }} when assigned to the discharging location."
      - name: department_ids
        data_type: array
        description: "{{ doc('generic__department_ids') }} the encounter is associated with."
      - name: departments
        data_type: text
        description: "{{ doc('generic__departments') }} the encounter is associated with."
      - name: department_datetimes
        data_type: text
        description: "{{ doc('generic__datetimes') }} of the departments associated with the encounter."
      - name: location_group_ids
        data_type: array
        description: "{{ doc('generic__location_group_ids') }} the encounter is associated with."
      - name: location_groups
        data_type: text
        description: "{{ doc('generic__location_groups') }} the encounter is associated with."
      - name: location_group_datetimes
        data_type: text
        description: "{{ doc('generic__datetimes') }} of the location groups associated with the encounter."
      - name: location_ids
        data_type: array
        description: "{{ doc('generic__location_ids') }} the encounter is associated with."
      - name: locations
        data_type: text
        description: "{{ doc('generic__locations') }} the encounter is associated with."
      - name: location_datetimes
        data_type: text
        description: "{{ doc('generic__datetimes') }} of the locations associated with the encounter."
      - name: reason_for_encounter
        data_type: text
        description: "{{ doc('encounters__reason_for_encounter') }}"
      - name: diagnoses
        data_type: text
        description: "{{ doc('generic__diagnoses') }}"
      - name: medications
        data_type: text
        description: "{{ doc('generic__medications') }}"
      - name: vaccinations
        data_type: text
        description: "{{ doc('generic__vaccinations') }}"
      - name: procedures
        data_type: text
        description: "{{ doc('generic__procedures') }}"
      - name: lab_requests
        data_type: text
        description: "{{ doc('generic__lab_requests') }}"
      - name: imaging_requests
        data_type: text
        description: "{{ doc('generic__imaging_requests') }}"
      - name: notes
        data_type: text
        description: "{{ doc('generic__notes') }}"