version: 2

models:
  - name: ds__sensitive_outpatient_appointments
    description: Sensitive facility appointments
    config:
      tags:
        - clinical
        - restricted
    columns:
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: age
        data_type: integer
        description: "{{ doc('generic__patients_age') }} at the time of the appointment."
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: contact_number
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__primary_contact_number') }} where available otherwise {{ doc('patient_additional_data__secondary_contact_number') }}"
      - name: village_id
        data_type: character varying(255)
        description: "{{ doc('patients__village_id') }}"
      - name: village
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's village."
      - name: billing_type_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__patient_billing_type_id') }}"
      - name: billing_type
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the billing type."
      - name: appointment_start_datetime
        data_type: timestamp
        description: "{{ doc('appointments__start_time') }}"
      - name: appointment_end_datetime
        data_type: timestamp
        description: "{{ doc('appointments__end_time') }}"
      - name: appointment_type_id
        data_type: character varying(255)
        description: "{{ doc('appointments__appointment_type_id') }}"
      - name: appointment_type
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the appointment type."
      - name: appointment_status
        data_type: character varying(255)
        description: "{{ doc('appointments__status') }}"
      - name: clinician_id
        data_type: character varying(255)
        description: "{{ doc('appointments__clinician_id') }}"
      - name: clinician
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who booked the appointment."
      - name: location_group_id
        data_type: character varying(255)
        description: "{{ doc('appointments__location_group_id') }}"
      - name: location_group
        data_type: character varying(255)
        description: "{{ doc('generic__location_group') }} where the appointment will take place."
      - name: priority
        data_type: boolean
        description: "{{ doc('appointments__is_high_priority') }}"
      - name: schedule_id
        data_type: uuid
        description: "{{ doc('appointments__schedule_id') }}"
      - name: until_date
        data_type: date
        description: "{{ doc('appointment_schedules__until_date') }}"
      - name: interval
        data_type: integer
        description: "{{ doc('appointment_schedules__interval') }}"
      - name: frequency
        data_type: character varying(255)
        description: "{{ doc('appointment_schedules__frequency') }}"
      - name: nth_weekday
        data_type: integer
        description: "{{ doc('appointment_schedules__nth_weekday') }}"
      - name: days_of_week
        data_type: array
        description: "{{ doc('appointment_schedules__days_of_week') }}"
