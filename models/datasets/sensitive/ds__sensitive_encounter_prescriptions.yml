version: 2

models:
  - name: ds__sensitive_encounter_prescriptions
    description: Sensitive facility encounter prescriptions
    config:
      tags:
        - clinical
        - restricted
    meta:
      owner: bes-maui
      domain: clinical
      tier: gold
      pii: true
      classification: restricted
    columns:
      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('encounter_prescriptions__encounter_id') }}"
      - name: prescription_id
        data_type: character varying(255)
        description: "{{ doc('encounter_prescriptions__prescription_id') }}"
      - name: datetime
        data_type: timestamp
        description: "{{ doc('generic__datetime') }} in prescriptions."
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: age
        data_type: integer
        description: "{{ doc('generic__patients_age') }} at the time of request"
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: village_id
        data_type: character varying(255)
        description: "{{ doc('patients__village_id') }}"
      - name: village
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's village."
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} where the encounter is currently active or has ended."
      - name: facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} where the encounter is currently active or has ended."
      - name: is_selected_for_discharge
        data_type: boolean
        description: "{{ doc('encounter_prescriptions__is_selected_for_discharge') }}"
      - name: medication_id
        data_type: character varying(255)
        description: "{{ doc('prescriptions__medication_id') }}"
      - name: medication_code
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} code of the prescribed medication."
      - name: medication
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} name of the prescribed medication."
      - name: quantity
        data_type: integer
        description: "{{ doc('prescriptions__quantity') }}"
