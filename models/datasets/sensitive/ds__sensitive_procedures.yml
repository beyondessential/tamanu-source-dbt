version: 2

models:
  - name: ds__sensitive_procedures
    description: Sensitive facility procedures
    config:
      tags:
        - clinical
        - restricted
    columns:
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: age
        data_type: integer
        description: "{{ doc('generic__patients_age') }} at the time of the procedure."
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: nationality
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__nationality_id') }}"
      - name: encounter_facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} where the encounter is currently active or has ended."
      - name: encounter_facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} where the encounter is currently active or has ended."
      - name: encounter_department_id
        data_type: character varying(255)
        description: "{{ doc('generic__department_id') }} where the encounter is currently active or has ended."
      - name: encounter_department
        data_type: character varying(255)
        description: "{{ doc('generic__department') }} where the encounter is currently active or has ended."
      - name: encounter_type
        data_type: character varying(31)
        description: "{{ doc('encounters__encounter_type') }}"
      - name: encounter_start_datetime
        data_type: timestamp
        description: "{{ doc('encounters__start_date') }}"
      - name: encounter_end_datetime
        data_type: timestamp
        description: "{{ doc('encounters__end_date') }}"
      - name: procedure_facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} where the procedure was performed."
      - name: procedure_facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} where the procedure was performed."
      - name: procedure_area_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_group_id') }} where the procedure was performed."
      - name: procedure_area
        data_type: character varying(255)
        description: "{{ doc('generic__location_group') }} where the procedure was performed."
      - name: procedure_location_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_id') }} where the procedure was performed."
      - name: procedure_location
        data_type: character varying(255)
        description: "{{ doc('generic__location') }} where the procedure was performed."
      - name: procedure_type_id
        data_type: character varying(255)
        description: "{{ doc('procedures__procedure_type_id') }}"
      - name: procedure_type
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the procedure type."
      - name: procedure_start_time
        data_type: time
        description: "{{ doc('procedures__start_time') }}"
      - name: procedure_end_time
        data_type: time
        description: "{{ doc('procedures__end_time') }}"
      - name: procedure_duration
        data_type: text
        description: "{{ doc('generic__duration') }} of the procedure."
      - name: procedure_clinician_id
        data_type: character varying(255)
        description: "{{ doc('procedures__physician_id') }}"
      - name: procedure_clinician
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who performed the procedure."
      - name: procedure_anaesthetist_id
        data_type: character varying(255)
        description: "{{ doc('procedures__anaesthetist_id') }}"
      - name: procedure_anaesthetist
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who administered anaesthesia."
      - name: procedure_assistant_anaesthetist_id
        data_type: character varying(255)
        description: "{{ doc('procedures__assistant_anaesthetist_id') }}"
      - name: procedure_assistant_anaesthetist
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who assisted the anaesthetist in the procedure."
      - name: is_completed
        data_type: boolean
        description: "{{ doc('procedures__completed') }}"
      - name: time_in
        data_type: character(19)
        description: "{{ doc('procedures__time_in') }}"
      - name: time_out
        data_type: character(19)
        description: "{{ doc('procedures__time_out') }}"
