version: 2

models:
  - name: ds__sensitive_encounters_emergency
    description: Emergency encounters with triage information from sensitive facilities
    config:
      tags:
        - clinical
        - restricted
    meta:
      owner: bes-maui
      domain: clinical
      pii: true
      classification: restricted
    columns:
      - name: triage_id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} in triages."
      - name: arrival_datetime
        data_type: timestamp
        description: "{{ doc('triages__arrival_time') }}"
      - name: triage_datetime
        data_type: timestamp
        description: "{{ doc('triages__triage_time') }}"
      - name: closed_datetime
        data_type: timestamp
        description: "{{ doc('triages__closed_time') }}"
      - name: score
        data_type: text
        description: "{{ doc('triages__score') }}"
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: village_id
        data_type: character varying(255)
        description: "{{ doc('patients__village_id') }}"
      - name: village
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's village."
      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('triages__encounter_id') }}"
      - name: encounter_type
        data_type: character varying(255)
        description: "{{ doc('encounters__encounter_type') }}"
      - name: arrival_mode
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the triage arrival mode."
      - name: chief_complaint
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the chief complaint."
      - name: secondary_complaint
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the secondary complaint."
      - name: clinician_id
        data_type: character varying(255)
        description: "{{ doc('triages__practitioner_id') }}"
      - name: clinician
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who triaged the patient."
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} the triage is associated with."
      - name: facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} the triage is associated with."
