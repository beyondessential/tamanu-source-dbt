version: 2

models:
  - name: ds__invoicing_pending
    description: Pending invoices
    config:
      tags:
        - administration
    columns:
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} of encounter."
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: discharge_datetime
        data_type: timestamp
        description: "{{ doc('encounters__end_date') }}"
      - name: patient_name
        data_type: character varying(255)
        description: "{{ doc('generic__patients_name') }}"
