version: 2

models:
  - name: ds__outpatient_visit
    description: "{{ doc('ds__outpatient_visit') }}"
    config:
      tags:
        - clinical
    meta:
      owner: bes-maui
      domain: clinical
      create_data_table: true
    columns:
      - name: visit_detail_start_date
        data_type: date
        description: "{{ doc('clinical__visit_detail__visit_detail_start_date') }}"
        meta:
          data_table_filter: date
      - name: yearmonth
        data_type: character varying(255)
        description: "{{ doc('ds__outpatient_visit__yearmonth') }}"
        meta:
          data_table_filter: yearmonth
      - name: tamanu_facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} of the visit's location."
      - name: location_group_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_group_id') }} (the area). 'locationgroup-unknown' when the visit's location has no area, or that area was soft-deleted (no longer resolves in location_groups)."
        meta:
          data_table_filter: array
      - name: location_group_name
        data_type: character varying(255)
        description: "{{ doc('generic__location_group') }} (the area)."
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
        meta:
          data_table_filter: array
      - name: age_group
        data_type: character varying(255)
        description: "{{ doc('ds__outpatient_visit__age_group') }}"
        meta:
          data_table_filter: array
      - name: total_outpatient_visits
        data_type: bigint
        description: "{{ doc('ds__outpatient_visit__total_outpatient_visits') }}"
        meta:
          data_table_metric: sum
