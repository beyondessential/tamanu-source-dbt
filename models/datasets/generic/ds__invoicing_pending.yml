version: 2

models:
  - name: ds__invoicing_pending
    description: Pending invoices
    tags:
      - administration
    columns:
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} of encounter."
      - name: start_datetime
        data_type: timestamp
        description: "{{ doc('encounters__start_date') }}"
      - name: end_datetime
        data_type: timestamp
        description: "{{ doc('encounters__end_date') }}"
      - name: department_id
        data_type: character varying(255)
        description: "{{ doc('encounters__department_id') }}"
      - name: location_id
        data_type: character varying(255)
        description: "{{ doc('encounters__location_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
        meta:
          metrics:
            total_patients_count:
              type: count
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: village_id
        data_type: character varying(255)
        description: "{{ doc('patients__village_id') }}"
