version: 2

models:
  - name: ds__lab_requests
    description: Lab requests
    tags:
      - clinical
    columns:
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
        meta:
          metrics:
            total_patients_count:
              type: count
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: age
        data_type: integer
        description: "{{ doc('generic__patients_age') }} at the time of request"
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: village_id
        data_type: character varying(255)
        description: "{{ doc('patients__village_id') }}"
      - name: village
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's village."
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} where the encounter is currently active or has ended."
      - name: facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} where the encounter is currently active or has ended."
      - name: department_id
        data_type: character varying(255)
        description: "{{ doc('generic__department_id') }} where the encounter is currently active or has ended."
      - name: department
        data_type: character varying(255)
        description: "{{ doc('generic__department') }} where the encounter is currently active or has ended."
      - name: location_group_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_group_id') }} where the encounter is currently active or has ended."
      - name: location_group
        data_type: character varying(255)
        description: "{{ doc('generic__location_group') }} where the encounter is currently active or has ended."
      - name: laboratory_id
        data_type: character varying(255)
        description: "{{ doc('lab_requests__lab_test_laboratory_id') }}"
      - name: laboratory
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the laboratory"
      - name: request_id
        data_type: character varying(255)
        description: "{{ doc('lab_requests__display_id') }}"
      - name: status
        data_type: character varying(255)
        description: "{{ doc('lab_requests__status') }}"
      - name: status_id
        data_type: character varying(255)
        description: "{{ doc('lab_requests__status') }}"
      - name: requested_datetime
        data_type: date
        description: "{{ doc('lab_requests__requested_date') }}"
      - name: requested_by_id
        data_type: character varying(255)
        description: "{{ doc('lab_requests__requested_by_id') }}"
      - name: clinician
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who requested the lab test."
      - name: requesting_department
        data_type: character varying(255)
        description: "{{ doc('generic__department') }} from which the lab test was requested."
      - name: priority
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the lab test priority."
      - name: category_id
        data_type: character varying(255)
        description: "{{ doc('lab_test_panels__category_id') }}"
      - name: category
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the lab test category."
      - name: non_sensitive_tests
        data_type: text
        description: "{{ doc('generic__non_sensitive_tests') }}"
      - name: sensitive_tests
        data_type: text
        description: "{{ doc('generic__sensitive_tests') }}"
      - name: collected_datetime
        data_type: timestamp
        description: "{{ doc('lab_requests__sample_time') }}"
      - name: collected_by
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who collected the specimen."
      - name: specimen_type
        data_type: boolean
        description: "{{ doc('lab_test_types__is_sensitive') }}"
      - name: site
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the specimen collection site."
      - name: non_sensitive_completed_datetime
        data_type: timestamp
        description: "{{ doc('lab_tests__completed_date') }}"
      - name: sensitive_completed_datetime
        data_type: timestamp
        description: "{{ doc('lab_tests__completed_date') }}"
      - name: reason_for_cancellation
        data_type: character varying(31)
        description: "{{ doc('lab_requests__reason_for_cancellation') }}"
