version: 2

models:
  - name: ds__diagnoses
    description: Diagnoses
    tags:
      - clinical
    columns:
      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('encounter_diagnoses__encounter_id') }}"
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: diagnosis_id
        data_type: character varying(255)
        description: "{{ doc('encounter_diagnoses__diagnosis_id') }}"
      - name: diagnosis
        data_type: character varying(255)
        description: "{{ doc('reference_data__name') }} of the diagnosis"
      - name: diagnosis_datetime
        data_type: timestamp
        description: "{{ doc('generic__date') }} in encounter_diagnoses."
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
        meta:
          metrics:
            total_patients_count:
              type: count
      - name: age
        data_type: integer
        description: "Age at the time of diagnosis."
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: contact_number
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__primary_contact_number') }}"
      - name: village_id
        data_type: character varying(255)
        description: "{{ doc('patients__village_id') }}"
      - name: village
        data_type: character varying(255)
        description: "Full readable name of the village."
      - name: clinician_id
        data_type: character varying(255)
        description: "{{ doc('encounters__examiner_id') }}"
      - name: clinician
        data_type: character varying(255)
        description: "{{ doc('users__display_name') }}"
      - name: department_id
        data_type: character varying(255)
        description: "{{ doc('encounters__department_id') }}"
      - name: department
        data_type: character varying(255)
        description: "{{ doc('departments__name') }}"
      - name: location_id
        data_type: character varying(255)
        description: "{{ doc('encounters__location_id') }}"
      - name: location
        data_type: character varying(255)
        description: "{{ doc('locations__name') }}"
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('locations__facility_id') }}"
      - name: facility
        data_type: character varying(255)
        description: "{{ doc('facilities__name') }}"
      - name: certainty
        data_type: character varying(255)
        description: "{{ doc('encounter_diagnoses__certainty') }}"
      - name: is_primary
        data_type: bool
        description: "{{ doc('encounter_diagnoses__is_primary') }}"
