version: 2

models:
  - name: ds__medication_dispenses
    description: Medication dispense records
    config:
      tags:
        - clinical
    meta:
      owner: bes-maui
      domain: clinical
      tier: gold
      pii: false
      classification: restricted
    columns:
      - name: id
        data_type: uuid
        description: "{{ doc('generic__id') }} in medication_dispenses."
      - name: quantity
        data_type: integer
        description: "{{ doc('medication_dispenses__quantity') }}"
      - name: dispensed_at
        data_type: timestamp
        description: "{{ doc('medication_dispenses__dispensed_at') }}"
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} where the medication was dispensed."
      - name: facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} where the medication was dispensed."
      - name: medication_id
        data_type: character varying(255)
        description: "{{ doc('prescriptions__medication_id') }}"
      - name: medication_code
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} code of the dispensed medication."
      - name: medication
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} name of the dispensed medication."
