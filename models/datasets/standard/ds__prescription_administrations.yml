version: 2

models:
  - name: ds__prescription_administrations
    description: Prescriptions with their medication administration records, one row per prescription per administration per dose given
    config:
      tags:
        - clinical
      meta:
        owner: bes-maui
        domain: clinical
        pii: true
        classification: restricted
    columns:
      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('encounter_prescriptions__encounter_id') }}"
      - name: prescription_id
        data_type: character varying(255)
        description: "{{ doc('medication_administration_records__prescription_id') }}"
      - name: administration_id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} in medication_administration_records. Null when the prescription has no administration record."
      - name: administration_dose_id
        data_type: uuid
        description: "{{ doc('generic__id') }} in medication_administration_record_doses. Null when no dose was given."
      - name: datetime
        data_type: timestamp
        description: "{{ doc('generic__datetime') }} in prescriptions."
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: encounter_type
        data_type: character varying(255)
        description: "{{ doc('encounters__encounter_type') }}"
      - name: department_id
        data_type: character varying(255)
        description: Department in effect when the dose was given (or, with no dose, when it was due or prescribed), from encounter history; the encounter's current value when no history entry precedes that time.
      - name: department
        data_type: character varying(255)
        description: Name of the department in `department_id`.
      - name: location_id
        data_type: character varying(255)
        description: Location in effect when the dose was given (or, with no dose, when it was due or prescribed), from encounter history; the encounter's current value when no history entry precedes that time.
      - name: location
        data_type: character varying(255)
        description: Name of the location in `location_id`.
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} of the encounter's location."
      - name: facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} of the encounter's location."
      - name: medication_id
        data_type: character varying(255)
        description: "{{ doc('prescriptions__medication_id') }}"
      - name: medication_code
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} code of the prescribed medication."
      - name: medication
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} name of the prescribed medication."
      - name: prescriber_id
        data_type: character varying(255)
        description: "{{ doc('prescriptions__prescriber_id') }}"
      - name: prescriber
        data_type: character varying(255)
        description: Display name of the prescriber. Null when none was recorded.
      - name: is_variable_dose
        data_type: boolean
        description: "{{ doc('prescriptions__is_variable_dose') }}"
      - name: dose_amount
        data_type: numeric
        description: "{{ doc('prescriptions__dose_amount') }}"
      - name: dosing_unit
        data_type: character varying(255)
        description: "{{ doc('prescriptions__dosing_unit') }}"
      - name: route
        data_type: character varying(255)
        description: "{{ doc('prescriptions__route') }}"
      - name: prescription_notes
        data_type: text
        description: "{{ doc('prescriptions__notes') }}"
      - name: administration_status
        data_type: character varying(255)
        description: "{{ doc('medication_administration_records__status') }}"
      - name: administration_due_datetime
        data_type: timestamp
        description: "{{ doc('medication_administration_records__due_at') }}"
      - name: administration_recorded_datetime
        data_type: timestamp
        description: "{{ doc('medication_administration_records__recorded_at') }}"
      - name: administration_dose_index
        data_type: integer
        description: "{{ doc('medication_administration_record_doses__dose_index') }}"
      - name: administered_dose_amount
        data_type: numeric
        description: "{{ doc('medication_administration_record_doses__dose_amount') }}"
      - name: administered_datetime
        data_type: timestamp
        description: "{{ doc('medication_administration_record_doses__given_time') }}"
      - name: administered_by_id
        data_type: character varying(255)
        description: "{{ doc('medication_administration_record_doses__given_by_user_id') }}"
      - name: administered_by
        data_type: character varying(255)
        description: Display name of the user who gave the dose.
      - name: administration_notes
        data_type: text
        description: "{{ doc('medication_administration_records__changing_status_reason') }}"
