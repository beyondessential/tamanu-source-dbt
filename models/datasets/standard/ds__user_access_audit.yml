version: 2

models:
  - name: ds__user_access_audit
    description: User access audit dataset containing all active users with their roles, designations, email addresses, and permissions
    config:
      tags:
        - administration
    meta:
      owner: bes-maui
      domain: admin
      pii: true
      classification: restricted
    columns:
      - name: user_id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} in users."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('users')
                field: id
      - name: user_display_id
        data_type: character varying(255)
        description: "{{ doc('ds__user_access_audit__user_display_id') }}"
        data_tests:
          - not_null
      - name: user_name
        data_type: character varying(255)
        description: "{{ doc('users__display_name') }}"
        data_tests:
          - not_null
      - name: user_email
        data_type: character varying(255)
        description: "{{ doc('users__email') }}"
      - name: user_role_id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} in roles. Used by the report parameter filter."
      - name: user_role
        data_type: character varying(255)
        description: "{{ doc('roles__name') }}"
      - name: user_designations
        data_type: text
        description: "{{ doc('ds__user_access_audit__user_designations') }}"
      - name: role_permissions
        data_type: text
        description: "{{ doc('ds__user_access_audit__role_permissions') }}"
      - name: visibility_status
        data_type: character varying(255)
        description: "{{ doc('generic__visibility_status') }} in users."
