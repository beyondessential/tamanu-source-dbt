version: 2

models:
  - name: ds__encounter_invoice_items
    description: "{{ doc('ds__encounter_invoice_items') }}"
    config:
      tags:
        - administration
    meta:
      owner: bes-maui
      domain: admin
      pii: false
      classification: confidential
    columns:
      - name: invoice_item_id
        data_type: character varying(255)
        description: "{{ doc('ds__encounter_invoice_items__invoice_item_id') }}"
        data_tests:
          - not_null:
              name: ac_001_ds__encounter_invoice_items_invoice_item_id_not_null
          - unique:
              name: ac_001_ds__encounter_invoice_items_invoice_item_id_unique
          - relationships:
              name: ac_001_ds__encounter_invoice_items_invoice_item_id_in_invoice_items
              arguments:
                to: ref('invoice_items')
                field: id
      - name: invoice_id
        data_type: character varying(255)
        description: "{{ doc('ds__encounter_invoice_items__invoice_id') }}"
        data_tests:
          - not_null:
              name: ac_002_ds__encounter_invoice_items_invoice_id_not_null
          - relationships:
              name: ac_002_ds__encounter_invoice_items_invoice_id_in_invoices
              arguments:
                to: ref('invoices')
                field: id
      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('ds__encounter_invoice_items__encounter_id') }}"
        data_tests:
          - not_null
      - name: invoice_status
        data_type: character varying(255)
        description: "{{ doc('ds__encounter_invoice_items__invoice_status') }}"
        data_tests:
          - accepted_values:
              name: ac_006_ds__encounter_invoice_items_invoice_status_accepted
              arguments:
                values: ["in_progress", "finalised", "cancelled"]
      - name: item_date
        data_type: date
        description: "{{ doc('ds__encounter_invoice_items__item_date') }}"
      - name: product_id
        data_type: character varying(255)
        description: "{{ doc('ds__encounter_invoice_items__product_id') }}"
      - name: product_name
        data_type: text
        description: "{{ doc('ds__encounter_invoice_items__product_name') }}"
      - name: category
        data_type: text
        description: "{{ doc('ds__encounter_invoice_items__category') }}"
      - name: quantity
        data_type: integer
        description: "{{ doc('ds__encounter_invoice_items__quantity') }}"
      - name: unit_price
        data_type: numeric
        description: "{{ doc('ds__encounter_invoice_items__unit_price') }}"
      - name: item_adjustment
        data_type: numeric
        description: "{{ doc('ds__encounter_invoice_items__item_adjustment') }}"
      - name: discounted_total
        data_type: numeric
        description: "{{ doc('ds__encounter_invoice_items__discounted_total') }}"
        data_tests:
          - not_null:
              name: ac_007_ds__encounter_invoice_items_discounted_total_not_null
      - name: insurance_coverage
        data_type: numeric
        description: "{{ doc('ds__encounter_invoice_items__insurance_coverage') }}"
      - name: source_record_type
        data_type: text
        description: "{{ doc('ds__encounter_invoice_items__source_record_type') }}"
      - name: source_record_id
        data_type: character varying(255)
        description: "{{ doc('ds__encounter_invoice_items__source_record_id') }}"
