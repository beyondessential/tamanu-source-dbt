version: 2

models:
  - name: ds__opd_visits
    description: "{{ doc('ds__opd_visits') }}"
    config:
      tags:
        - clinical
    meta:
      owner: bes-maui
      domain: clinical
      create_data_table: true
    columns:
      - name: date
        data_type: date
        description: "{{ doc('generic__date') }} of the OPD visit."
        meta:
          data_table_filter: date
      - name: tamanu_facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} of the visit's location."
      - name: tupaia_facility_id
        data_type: character varying(255)
        description: "{{ doc('ds__opd_visits__tupaia_facility_id') }}"
        meta:
          data_table_filter: array
      - name: location_group_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_group_id') }} (the clinic). 'locationgroup-unknown' when the visit's location has no area, or that area no longer resolves in ref__care_site."
        meta:
          data_table_filter: array
      - name: location_group_name
        data_type: character varying(255)
        description: "{{ doc('generic__location_group') }} (the clinic)."
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
        meta:
          data_table_filter: array
      - name: age_group
        data_type: character varying(255)
        description: "{{ doc('ds__opd_visits__age_group') }}"
        meta:
          data_table_filter: array
      - name: total_opd_visits
        data_type: bigint
        description: "{{ doc('ds__opd_visits__total_opd_visits') }}"
        meta:
          data_table_metric: sum
