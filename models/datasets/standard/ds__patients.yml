version: 2
models:
  - name: ds__patients
    description: Patients
    config:
      tags:
        - patient
    meta:
      owner: bes-maui
      domain: clinical
      tier: gold
      pii: true
      classification: restricted
    columns:
      - name: registration_date
        data_type: date
        description: "{{ doc('generic__created_at') }} from the patients_metadata."
      - name: registered_by
        data_type: character varying(255)
        description: "{{ doc('users__display_id') }} the patient record is registered by."
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: middle_name
        data_type: character varying(255)
        description: "{{ doc('patients__middle_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: cultural_name
        data_type: character varying(255)
        description: "{{ doc('patients__cultural_name') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
        meta:
          metrics:
            total_patients_count:
              type: count
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: village
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the village"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: birth_certificate
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__birth_certificate') }}"
      - name: driving_license
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__driving_license') }}"
      - name: passport
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__passport') }}"
      - name: blood_type
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__blood_type') }}"
      - name: title
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__title') }}"
      - name: marital_status
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__marital_status') }}"
      - name: primary_contact_number
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__primary_contact_number') }}"
      - name: secondary_contact_number
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__secondary_contact_number') }}"
      - name: country_of_birth
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the country of birth."
      - name: nationality
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the nationality."
      - name: ethnicity
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the ethnicity."
      - name: occupation
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the occupation."
      - name: religion
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the religion."
      - name: village_id
        data_type: character varying(255)
        description: "{{ doc('patients__village_id') }}"
      - name: patient_billing_type
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient billing type."
      - name: subdivision_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__subdivision_id') }}"
      - name: subdivision
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's subdivision."
      - name: division_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__division_id') }}"
      - name: division
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's division."
      - name: mother_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__mother_id') }}"
      - name: father_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__father_id') }}"
      - name: street_village
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__street_village') }}"
      - name: registration_type
        data_type: character varying(255)
        description: "Indicates whether the patient was registered as a birth or patient."
      - name: age
        data_type: integer
        description: "{{ doc('generic__patients_age') }}"
      - name: status
        data_type: character varying(255)
        description: "Indicates whether the patient is alive or deceased."

