version: 2

models:
  - name: ds__patient_program_registrations
    description: Patient program registrations
    config:
      tags:
        - clinical
    meta:
      owner: bes-maui
      domain: clinical
      pii: true
      classification: restricted
    columns:
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: village_id
        data_type: character varying(255)
        description: "{{ doc('patients__village_id') }}"
      - name: village
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's village."
      - name: registering_facility_id
        data_type: character varying(255)
        description: "{{ doc('patient_program_registrations__registering_facility_id') }}"
      - name: registering_facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} where the patient was registered."
      - name: registered_by_id
        data_type: character varying(255)
        description: "{{ doc('patient_program_registrations__clinician_id') }}"
      - name: registered_by
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who registered the patient."
      - name: currently_at
        data_type: text
        description: "{{ doc('program_registries__currently_at_type') }}"
      - name: currently_at_type
        data_type: text
        description: "{{ doc('program_registries__currently_at_type') }}"
      - name: related_conditions
        data_type: text
        description: "{{ doc('generic__patient_conditions') }}"
      - name: clinical_status_id
        data_type: character varying(255)
        description: "{{ doc('patient_program_registrations__clinical_status_id') }}"
      - name: clinical_status
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the clinical status."
      - name: registration_status
        data_type: text
        description: "{{ doc('patient_program_registrations__registration_status') }}"
      - name: program_registry_id
        data_type: character varying(255)
        description: "{{ doc('patient_program_registrations__program_registry_id') }}"
      - name: subdivision_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__subdivision_id') }}"
      - name: subdivision
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's subdivision."
      - name: division_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__division_id') }}"
      - name: division
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's division."
      - name: registration_datetime
        data_type: timestamp
        description: "{{ doc('generic__date') }}"
      - name: deactivated_by_id
        data_type: character varying(255)
        description: "{{ doc('patient_program_registrations__deactivated_clinician_id') }}"
      - name: deactivated_by
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who deactivated the patient program registration."
      - name: deactivated_datetime
        data_type: timestamp
        description: "{{ doc('patient_program_registrations__deactivated_date') }}"
      - name: primary_contact_number
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__primary_contact_number') }}"
      - name: secondary_contact_number
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__secondary_contact_number') }}"
      - name: emergency_contact_name
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__emergency_contact_name') }}"
      - name: emergency_contact_number
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__emergency_contact_number') }}"
