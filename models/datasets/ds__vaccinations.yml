version: 2

models:
  - name: ds__vaccinations
    description: Vaccinations
    config:
      tags:
        - clinical
    columns:
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: age
        data_type: integer
        description: "{{ doc('generic__patients_age') }} at the time of vaccination."
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: village_id
        data_type: character varying(255)
        description: "{{ doc('patients__village_id') }}"
      - name: village
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's village."
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} at which the vaccine was given."
      - name: facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} at which the vaccine was given."
      - name: department_id
        data_type: character varying(255)
        description: "{{ doc('administered_vaccines__department_id') }}"
      - name: department
        data_type: character varying(255)
        description: "{{ doc('generic__department') }} at which the vaccine was given."
      - name: location_group_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_group_id') }} at which the vaccine was given."
      - name: location_group
        data_type: character varying(255)
        description: "{{ doc('generic__location_group') }} at which the vaccine was given."
      - name: location_id
        data_type: character varying(255)
        description: "{{ doc('administered_vaccines__location_id') }}"
      - name: location
        data_type: character varying(255)
        description: "{{ doc('generic__location') }} at which the vaccine was given."
      - name: vaccination_date
        data_type: timestamp
        description: "{{ doc('generic__date') }}"
      - name: vaccine_category
        data_type: character varying(255)
        description: "{{ doc('scheduled_vaccines__category') }}"
      - name: vaccine_name
        data_type: text
        description: "{{ doc('administered_vaccines__vaccine_name') }}"
      - name: vaccine_brand
        data_type: text
        description: "{{ doc('administered_vaccines__vaccine_brand') }}"
      - name: disease
        data_type: text
        description: "{{ doc('administered_vaccines__disease') }}"
      - name: vaccine_status
        data_type: character varying(255)
        description: "{{ doc('administered_vaccines__status') }}"
      - name: vaccine_schedule
        data_type: character varying(255)
        description: "{{ doc('scheduled_vaccines__dose_label') }}"
      - name: batch
        data_type: character varying(255)
        description: "{{ doc('administered_vaccines__batch') }}"
      - name: recorded_by
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who recorded the vaccine."
      - name: circumstances
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the circumstances."
      - name: given_by
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who gave the vaccine."
      - name: given_elsewhere_by
        data_type: boolean
        description: "{{ doc('administered_vaccines__given_elsewhere') }}"
      - name: not_given_clinician
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who did not give the vaccine."
      - name: not_given_reason
        data_type: character varying(255)
        description: "{{ doc('administered_vaccines__not_given_reason_id') }}"
      - name: modified_by
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who modified the record."
      - name: updated_at
        data_type: timestamp
        description: "{{ doc('generic__updated_at') }} for the vaccine administration record, sourced from the change logs."
   