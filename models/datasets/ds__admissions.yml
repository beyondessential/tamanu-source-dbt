version: 2

models:
  - name: ds__admissions
    description: Admissions
    config:
      tags:
        - clinical
    columns:
      - name: patient_id
        data_type: character varying(255)
        description: "{{ doc('encounters__patient_id') }}"
      - name: display_id
        data_type: character varying(255)
        description: "{{ doc('patients__display_id') }}"
      - name: first_name
        data_type: character varying(255)
        description: "{{ doc('patients__first_name') }}"
      - name: last_name
        data_type: character varying(255)
        description: "{{ doc('patients__last_name') }}"
      - name: date_of_birth
        data_type: date
        description: "{{ doc('patients__date_of_birth') }}"
      - name: age
        data_type: integer
        description: "{{ doc('generic__patients_age') }} at the time of the appointment."
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: village_id
        data_type: character varying(255)
        description: "{{ doc('patients__village_id') }}"
      - name: village
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the patient's village."
      - name: billing_type_id
        data_type: character varying(255)
        description: "{{ doc('patient_additional_data__patient_billing_type_id') }}"
      - name: billing_type
        data_type: character varying(255)
        description: "{{ doc('generic__reference_data') }} of the billing type."
      - name: admitting_clinician_id
        data_type: character varying(255)
        description: "{{ doc('encounters__examiner_id') }}"
      - name: admitting_clinician
        data_type: character varying(255)
        description: "{{ doc('generic__user') }} who admitted the patient."
      - name: admission_datetime
        data_type: timestamp
        description: "{{ doc('generic__date') }} on admission."
      - name: admission_status
        data_type: character varying(255)
        description: "{{ doc('generic__admission_status') }}"
      - name: discharge_datetime
        data_type: timestamp
        description: "{{ doc('generic__date') }} on discharge."
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} the admission is associated with."
      - name: facility
        data_type: character varying(255)
        description: "{{ doc('generic__facility') }} the admission is associated with."
      - name: department_ids
        data_type: array
        description: "{{ doc('generic__department_ids') }} the admission is associated with."
      - name: departments
        data_type: character varying(255)
        description: "{{ doc('generic__departments') }} the admission is associated with."
      - name: department_datetimes
        data_type: character varying(255)
        description: "{{ doc('generic__datetimes') }} of the departments associated with the admission."
      - name: location_group_ids
        data_type: array
        description: "{{ doc('generic__location_group_ids') }} the admission is associated with."
      - name: location_groups
        data_type: character varying(255)
        description: "{{ doc('generic__location_groups') }} the admission is associated with."
      - name: location_group_datetimes
        data_type: character varying(255)
        description: "{{ doc('generic__datetimes') }} of the location groups associated with the admission."
      - name: location_ids
        data_type: array
        description: "{{ doc('generic__location_ids') }} the admission is associated with."
      - name: locations
        data_type: character varying(255)
        description: "{{ doc('generic__locations') }} the admission is associated with."
      - name: location_datetimes
        data_type: character varying(255)
        description: "{{ doc('generic__datetimes') }} of the locations associated with the admission."
      - name: primary_diagnoses
        data_type: character varying(255)
        description: "{{ doc('generic__diagnoses') }} that are primary for the admission."
      - name: secondary_diagnoses
        data_type: character varying(255)
        description: "{{ doc('generic__diagnoses') }} that are secondary for the admission."

unit_tests:
  - name: test_ds_admissions_basic_functionality
    model: ds__admissions
    description: "Test basic functionality of ds__admissions model with sample data"
    given:
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_001' as id, 'pat_001' as patient_id, '2024-01-15 10:00:00'::timestamp as start_datetime, null::timestamp as end_datetime, 'loc_001' as location_id, 'bill_001' as patient_billing_type_id, 'admission' as encounter_type
          union all
          select 'enc_002', 'pat_002', '2024-01-16 14:30:00'::timestamp, '2024-01-20 09:00:00'::timestamp, 'loc_002', 'bill_002', 'admission'
          union all
          select 'enc_003', 'pat_003', '2024-01-17 08:15:00'::timestamp, null::timestamp, 'loc_001', null, 'outpatient'
      
      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-05-15'::date as date_of_birth, 'male' as sex, 'vil_001' as village_id
          union all
          select 'pat_002', 'P002', 'Jane', 'Smith', '1985-08-22'::date, 'female', 'vil_002'
          union all
          select 'pat_003', 'P003', 'Bob', 'Johnson', '1975-12-10'::date, 'male', null
      
      - input: ref('encounter_history')
        format: sql
        rows: |
          select 'enc_001' as encounter_id, '2024-01-15 10:00:00'::timestamp as datetime, null as change_type, 'cli_001' as clinician_id, 'dept_001' as department_id, 'loc_001' as location_id, 'admission' as encounter_type
          union all
          select 'enc_002', '2024-01-16 14:30:00'::timestamp, null, 'cli_002', 'dept_002', 'loc_002', 'admission'
          union all
          select 'enc_002', '2024-01-18 10:00:00'::timestamp, 'department', 'cli_002', 'dept_003', 'loc_002', 'admission'
      
      - input: ref('users')
        format: sql
        rows: |
          select 'cli_001' as id, 'Dr. Alice Wilson' as display_name
          union all
          select 'cli_002', 'Dr. Bob Martinez'
      
      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_001' as id, 'Emergency' as name
          union all
          select 'dept_002', 'Internal Medicine'
          union all
          select 'dept_003', 'Surgery'
      
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'Room 101' as name, 'fac_001' as facility_id, 'lg_001' as location_group_id
          union all
          select 'loc_002', 'Room 201', 'fac_001', 'lg_002'
      
      - input: ref('location_groups')
        format: sql
        rows: |
          select 'lg_001' as id, 'Emergency Ward' as name
          union all
          select 'lg_002', 'Medical Ward'
      
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'Central Hospital' as name
      
      - input: ref('reference_data')
        format: sql
        rows: |
          select 'vil_001' as id, 'Village A' as name, null as code
          union all
          select 'vil_002', 'Village B', null
          union all
          select 'bill_001', 'Insurance', null
          union all
          select 'bill_002', 'Private Pay', null
          union all
          select 'diag_001', 'Hypertension', 'I10'
      
      - input: ref('encounter_diagnoses')
        format: sql
        rows: |
          select 'enc_001' as encounter_id, 'diag_001' as diagnosis_id, true as is_primary, 'confirmed' as certainty, '2024-01-15 11:00:00'::timestamp as datetime
          union all
          select 'enc_002', 'diag_001', false, 'confirmed', '2024-01-16 15:00:00'::timestamp
    
    expect:
      format: sql
      rows: |
        select 'pat_001' as patient_id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-05-15'::date as date_of_birth, 33 as age, 'Male' as sex, 'vil_001' as village_id, 'Village A' as village, 'bill_001' as billing_type_id, 'Insurance' as billing_type, 'cli_001' as admitting_clinician_id, 'Dr. Alice Wilson' as admitting_clinician, '2024-01-15 10:00:00'::timestamp as admission_datetime, 'active' as admission_status, null::timestamp as discharge_datetime, 'fac_001' as facility_id, 'Central Hospital' as facility, array['dept_001'] as department_ids, 'Emergency' as departments, '2024-01-15 10:00' as department_datetimes, array['lg_001'] as location_group_ids, 'Emergency Ward' as location_groups, '2024-01-15 10:00' as location_group_datetimes, array['loc_001'] as location_ids, 'Room 101' as locations, '2024-01-15 10:00' as location_datetimes, 'Hypertension (I10)' as primary_diagnoses, null as secondary_diagnoses
        union all
        select 'pat_002', 'P002', 'Jane', 'Smith', '1985-08-22'::date, 38, 'Female', 'vil_002', 'Village B', 'bill_002', 'Private Pay', 'cli_002', 'Dr. Bob Martinez', '2024-01-16 14:30:00'::timestamp, 'discharged', '2024-01-20 09:00:00'::timestamp, 'fac_001', 'Central Hospital', array['dept_002', 'dept_003'], 'Internal Medicine, Surgery', '2024-01-16 14:30; 2024-01-18 10:00', array['lg_002'], 'Medical Ward', '2024-01-16 14:30', array['loc_002'], 'Room 201', '2024-01-16 14:30', null, 'Hypertension (I10)'

  - name: test_ds_admissions_filters_admission_encounters_only
