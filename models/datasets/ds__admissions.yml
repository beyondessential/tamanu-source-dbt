      - input: ref('reference_data')
        format: sql
        rows: |
          select 'vil_001' as id, 'Village A' as name, null as code
          union all
          select 'vil_002', 'Village B', null
          union all
          select 'bill_001', 'Insurance', null
          union all
          select 'bill_002', 'Private Pay', null
      
      - input: ref('encounter_diagnoses')
        format: sql
        rows: |
          select null::text as encounter_id, null::text as diagnosis_id, null::boolean as is_primary, null::text as certainty, null::timestamp as datetime
          where false
    
    expect:
      format: sql
      rows: |
        select 'pat_001' as patient_id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-05-15'::date as date_of_birth, 33 as age, 'Male' as sex, 'vil_001' as village_id, 'Village A' as village, 'bill_001' as billing_type_id, 'Insurance' as billing_type, 'cli_001' as admitting_clinician_id, 'Dr. Alice Wilson' as admitting_clinician, '2024-01-15 10:00:00'::timestamp as admission_datetime, 'active' as admission_status, null::timestamp as discharge_datetime, 'fac_001' as facility_id, 'Central Hospital' as facility, array['dept_001'] as department_ids, 'Emergency' as departments, '2024-01-15 10:00' as department_datetimes, array['lg_001'] as location_group_ids, 'Emergency Ward' as location_groups, '2024-01-15 10:00' as location_group_datetimes, array['loc_001'] as location_ids, 'Room 101' as locations, '2024-01-15 10:00' as location_datetimes, null as primary_diagnoses, null as secondary_diagnoses

  - name: test_ds_admissions_age_calculation
    model: ds__admissions
