version: 2

models:
  - name: ref__care_site_location
    description: >
      One row per Tamanu location (the physical room/bed) as a care site, denormalised with its
      parent facility: the location rows of ref__care_site, with the same columns. Read it instead
      of ref__care_site when only location care sites are needed, such as a visit's care site.
    config:
      tags:
        - reference
      meta:
        owner: bes-maui
        domain: reference
    columns:
      - name: care_site_id
        data_type: character varying(255)
        description: "{{ doc('ref__care_site__care_site_id') }}"
        data_tests:
          - not_null:
              name: ac_012_ref__care_site_location_care_site_id_not_null
          - unique:
              name: ac_012_ref__care_site_location_care_site_id_unique
      - name: care_site_type
        data_type: text
        description: Always 'location'.
      - name: care_site_name
        data_type: character varying(255)
        description: "{{ doc('ref__care_site__care_site_name') }}"
      - name: care_site_source_value
        data_type: character varying(255)
        description: "{{ doc('ref__care_site__care_site_source_value') }}"
      - name: place_of_service_source_value
        data_type: character varying(255)
        description: "{{ doc('ref__care_site__place_of_service_source_value') }}"
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('ref__care_site__facility_id') }}"
      - name: facility_name
        data_type: character varying(255)
        description: "{{ doc('ref__care_site__facility_name') }}"
