version: 2
sources:
  - name: tamanu
    schema: public
    description: "{{ doc('generic__schema') }}"
    tables:
      - name: reference_data_relations
        description: "{{ doc('table__reference_data_relations') }}"
        config:
          tags:
            - reference
          meta:
            triggers:
              - notify_reference_data_relations_changed
              - record_reference_data_relations_changelog
              - set_reference_data_relations_updated_at
              - set_reference_data_relations_updated_at_sync_tick
        columns:
          - name: id
            data_type: uuid
            description: "{{ doc('generic__id') }} in reference_data_relations."
            data_tests:
              - unique
              - not_null
          - name: created_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__created_at') }} in reference_data_relations."
            data_tests:
              - not_null
          - name: updated_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__updated_at') }} in reference_data_relations."
            data_tests:
              - not_null
          - name: deleted_at
            data_type: timestamp with time zone
            description: "{{ doc('generic__deleted_at') }} in reference_data_relations."
          # A null endpoint is a malformed relation edge: ref__location joins both
          # ends with an inner join, so such an edge never matches and is discarded
          # whole (it was never a usable link). warn-only for now — validated clean on
          # one demo DB but not across every tamanu-dbt-* deployment; promote to error
          # once it has stayed clean for a release (Tamanu does not declare these
          # NOT NULL at the DB level).
          - name: reference_data_id
            data_type: text
            description: "{{ doc('reference_data_relations__reference_data_id') }}"
            data_tests:
              - not_null:
                  config:
                    severity: warn
          - name: reference_data_parent_id
            data_type: text
            description: "{{ doc('reference_data_relations__reference_data_parent_id') }}"
            data_tests:
              - not_null:
                  config:
                    severity: warn
          - name: type
            data_type: character varying(255)
            description: "{{ doc('reference_data_relations__type') }}"
            data_tests:
              - not_null
          - name: updated_at_sync_tick
            data_type: bigint
            description: "{{ doc('generic__updated_at_sync_tick') }} in reference_data_relations."
            data_tests:
              - not_null
