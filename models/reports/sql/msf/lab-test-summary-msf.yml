unit_tests:
  - name: test_lab_test_summary_msf_basic_functionality
    model: lab-test-summary-msf
    description: "Basic test for lab test summary functionality focusing on key metrics"
    given:
      - input: ref('ds__lab_tests_msf')
        format: sql
        rows: |
          select 2025 as epi_year, 1 as epi_week, 'patient_001' as patient_id, 'department-medicalnorth' as department_id, 'published' as status, 'req_001' as lab_request_id, null as lab_test_panel_id, 'labTestType-Haemoglobin' as lab_test_type_id, 1 as visit_rank
          union all
          select 2025 as epi_year, 1 as epi_week, 'patient_002' as patient_id, 'department-medicalnorth' as department_id, 'sample-not-collected' as status, 'req_002' as lab_request_id, null as lab_test_panel_id, 'labTestType-PregnancyTest' as lab_test_type_id, 1 as visit_rank
          union all
          select 2025 as epi_year, 2 as epi_week, 'patient_003' as patient_id, 'department-medicalsouth' as department_id, 'cancelled' as status, 'req_003' as lab_request_id, null as lab_test_panel_id, 'labTestType-GlucoseFasting' as lab_test_type_id, 1 as visit_rank
          union all
          select 2025 as epi_year, 3 as epi_week, 'patient_004' as patient_id, 'department-medicalsouth' as department_id, 'invalidated' as status, 'req_004' as lab_request_id, null as lab_test_panel_id, 'labTestType-Magnesium' as lab_test_type_id, 1 as visit_rank
          union all
          select 2025 as epi_year, 3 as epi_week, 'patient_004' as patient_id, 'department-medicalsouth' as department_id, 'published' as status, 'req_004' as lab_request_id, null as lab_test_panel_id, 'labTestType-HbA1c' as lab_test_type_id, 1 as visit_rank
          union all
          select 2025 as epi_year, 4 as epi_week, 'patient_005' as patient_id, 'department-medicalsouth' as department_id, 'published' as status, 'req_005' as lab_request_id, null as lab_test_panel_id, 'labTestType-HbA1c' as lab_test_type_id, 1 as visit_rank
          union all
          select 2025 as epi_year, 5 as epi_week, 'patient_006' as patient_id, 'department-medicalsouth' as department_id, 'published' as status, 'req_006' as lab_request_id, 'labTestPanel-Urinealysis' as lab_test_panel_id, null as lab_test_type_id, 1 as visit_rank
          union all
          select 2025 as epi_year, 6 as epi_week, 'patient_007' as patient_id, 'department-medicalsouth' as department_id, 'results_pending' as status, 'req_007' as lab_request_id, 'labTestPanel-CBC' as lab_test_panel_id, null as lab_test_type_id, 1 as visit_rank
          union all
          select 2025 as epi_year, 6 as epi_week, 'patient_007' as patient_id, 'department-medicalsouth' as department_id, 'published' as status, 'req_007' as lab_request_id, null as lab_test_panel_id, 'labTestType-Triglycerides' as lab_test_type_id, 1 as visit_rank
    expect:
      format: sql
      rows: |
        select 'Number of new patients tested (North facility)' as attribute, 2 as "1", 0 as "2", 0 as "3", 0 as "4", 0 as "5", 0 as "6"
        union all
        select 'Number of new patients tested (South facility)' as attribute, 0 as "1", 1 as "2", 1 as "3", 1 as "4", 1 as "5", 1 as "6"
        union all
        select 'Number of tests cancelled (South facility)' as attribute, 0 as "1", 1 as "2", 0 as "3", 0 as "4", 0 as "5", 0 as "6"
        union all
        select 'Number of tests pending without sample collected (North facility)' as attribute, 1 as "1", 0 as "2", 0 as "3", 0 as "4", 0 as "5", 0 as "6"
        union all
        select 'Number of tests pending (South facility)' as attribute, 0 as "1", 0 as "2", 0 as "3", 0 as "4", 0 as "5", 1 as "6"
        union all
        select 'Number of invalidated tests (South facility)' as attribute, 0 as "1", 0 as "2", 1 as "3", 0 as "4", 0 as "5", 0 as "6"
        union all
        select 'Number of test results published (North facility)' as attribute, 1 as "1", 0 as "2", 0 as "3", 0 as "4", 0 as "5", 0 as "6"
        union all
        select 'Number of test results published (South facility)' as attribute, 0 as "1", 0 as "2", 0 as "3", 1 as "4", 0 as "5", 0 as "6"
        union all
        select 'Number of unique patients (North facility)' as attribute, 1 as "1", 0 as "2", 0 as "3", 0 as "4", 0 as "5", 0 as "6"
        union all
        select 'Number of unique patients (South facility)' as attribute, 0 as "1", 0 as "2", 0 as "3", 0 as "4", 1 as "5", 0 as "6"
        union all
        select 'Hemoglobin' as attribute, 1 as "1", 0 as "2", 0 as "3", 0 as "4", 0 as "5", 0 as "6"
        union all
        select 'Urineanalysis' as attribute, 0 as "1", 0 as "2", 0 as "3", 0 as "4", 1 as "5", 0 as "6"
        union all
        select 'HbA1c' as attribute, 0 as "1", 0 as "2", 1 as "3", 1 as "4", 0 as "5", 0 as "6"
        union all
        select 'Triglycerides' as attribute, 0 as "1", 0 as "2", 0 as "3", 0 as "4", 0 as "5", 1 as "6"
  
