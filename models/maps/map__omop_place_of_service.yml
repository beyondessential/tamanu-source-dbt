version: 2

models:
  - name: map__omop_place_of_service
    description: >-
      Tamanu facilities.type codes mapped to an OMOP place-of-service classification,
      using the standard Visit-setting concepts (vocabulary 'Visit'). BASELINE DEFAULT
      shipped in the production bundle and expected to be overridden per deployment:
      facilities.type is free text in Tamanu core, so a deployment with real type values
      overrides this model in its tamanu-dbt-<deployment> project. Joined by
      ref__care_site to populate the place_of_service_concept_id shadow column; unmapped
      types yield a NULL concept there.
    config:
      tags:
        - reference
    meta:
      owner: bes-maui
      domain: reference
    columns:
      - name: local_code
        data_type: text
        description: Tamanu facilities.type value (free text; e.g. hospital, clinic).
        data_tests:
          - not_null
          - unique
      - name: local_name
        data_type: text
        description: Human-readable facility-type label.
        data_tests:
          - not_null
      - name: concept_id
        data_type: integer
        description: >-
          OMOP standard concept ID for the place-of-service classification (9201 =
          Inpatient Visit, 9202 = Outpatient Visit, 9203 = Emergency Room Visit).
        data_tests:
          - not_null
      - name: concept_name
        data_type: text
        description: OMOP concept name for the concept.
        data_tests:
          - not_null
      - name: vocabulary_id
        data_type: text
        description: OMOP vocabulary the concept belongs to.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Visit"]
