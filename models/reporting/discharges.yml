version: 2

models:
  - name: discharges
    description: "{{ doc('table__discharges') }}"
    tags: ['clinical']
    columns:
      - name: id
        data_type: character varying
        description: "{{ doc('discharges__id') }}"
      - name: note
        data_type: text
        description: "{{ doc('discharges__note') }}"
      - name: encounter_id
        data_type: character varying
        description: "{{ doc('encounters__id') }}"
      - name: discharged_by_id
        data_type: character varying
        description: "{{ doc('users__id') }} that discharged the patient"
      - name: disposition_id
        data_type: character varying
        description: "{{ doc('reference_data__discharge_disposition') }}"
