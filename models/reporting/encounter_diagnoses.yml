version: 2

models:
  - name: encounter_diagnoses
    description: "{{ doc('table__encounter_diagnoses') }}"
    tags: ['clinical']
    columns:
      - name: id
        data_type: character varying
        description: "{{ doc('encounter_diagnoses__id') }}"
      - name: datetime
        data_type: character
        description: "{{ doc('encounter_diagnoses__datetime') }}"
      - name: is_primary
        data_type: boolean
        description: "{{ doc('encounter_diagnoses__is_primary') }}"
      - name: encounter_id
        data_type: character varying
        description: "{{ doc('encounters__id') }}"
      - name: diagnosis_id
        data_type: character varying
        description: "{{ doc('reference_data__diagnosis') }}"
      - name: diagnosed_by_id
        data_type: character varying
        description: "{{ doc('users__id') }} that made the diagnosis"
