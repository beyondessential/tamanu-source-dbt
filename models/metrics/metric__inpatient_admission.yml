version: 2

models:
  - name: metric__inpatient_admission
    description: "{{ doc('metric__inpatient_admission') }}"
    config:
      tags:
        - clinical
    # BL-009: no data_table_* meta. The Tupaia data tables over this model, once one exists,
    # are configured in tupaia-data-product at tamanu/data_tables/, one file per data table --
    # see the spec's § Consumers.
    meta:
      owner: bes-maui
      domain: clinical
      # BL-010: per-admission rows, but the subject is an encounter id with no patient
      # identifier, name, birth date or diagnosis code alongside it -- no patient is
      # identifiable through a row, so this stays unrestricted and covers standard and
      # sensitive facilities alike.
      pii: false
      classification: internal
    data_tests:
      # One row per admission. A duplicate would double-count an admission in any consumer
      # that sums value_numeric -- error even though the repo default is warn.
      - dbt_utils.unique_combination_of_columns:
          name: ac_001_metric__inpatient_admission_grain
          arguments:
            combination_of_columns:
              - metric_id
              - subject_id
          config:
            severity: error
      # AC-012 (BL-002): length of stay is period_end - period_start, so a period_end before
      # its start would make it negative. Only closed admissions are in scope -- an open one
      # has no period_end.
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          name: ac_012_metric__inpatient_admission_period_end_at_or_after_start
          arguments:
            column_A: period_end
            column_B: period_start
            or_equal: true
            row_condition: "period_end is not null"
    columns:
      - name: metric_id
        data_type: text
        description: "{{ doc('metric__inpatient_admission__metric_id') }}"
        data_tests:
          - not_null:
              name: ac_002_metric__inpatient_admission_metric_id_not_null
          - accepted_values:
              name: ac_002_metric__inpatient_admission_metric_id_values
              arguments:
                values:
                  - inpatient_admission
          # Definition <-> implementation link: every metric__ view asserts its ids are
          # registered in the canonical registry.
          - relationships:
              name: ac_003_metric__inpatient_admission_metric_id_registered
              arguments:
                to: ref('metric_definitions')
                field: metric_id
              config:
                severity: error
      - name: variant_id
        data_type: text
        description: "{{ doc('metric__inpatient_admission__variant_id') }}"
      - name: subject_id
        data_type: character varying(255)
        description: "{{ doc('metric__inpatient_admission__subject_id') }}"
        data_tests:
          - not_null:
              name: ac_008_metric__inpatient_admission_subject_id_not_null
      - name: period_start
        data_type: timestamp
        description: "{{ doc('metric__inpatient_admission__period_start') }}"
        data_tests:
          - not_null:
              name: ac_004_metric__inpatient_admission_period_start_not_null
      - name: period_end
        data_type: timestamp
        description: "{{ doc('metric__inpatient_admission__period_end') }}"
        # BL-002: deliberately no not_null test -- NULL means the encounter is open, and
        # length of stay is undefined until it closes. Ordering is asserted by AC-012 on the
        # model, since a column-grain test cannot compare two columns.
      - name: period_granularity
        data_type: text
        description: "{{ doc('metric__inpatient_admission__period_granularity') }}"
        data_tests:
          - not_null:
              name: ac_005_metric__inpatient_admission_period_granularity_not_null
          - accepted_values:
              name: ac_005_metric__inpatient_admission_period_granularity_is_minute
              arguments:
                values: ['minute']
      - name: value_numeric
        data_type: numeric
        description: "{{ doc('metric__inpatient_admission__value_numeric') }}"
        data_tests:
          - not_null:
              name: ac_006_metric__inpatient_admission_value_numeric_not_null
          # BL-011: one admission per row, so the count contribution is always 1. A value
          # other than 1 would mean the model had silently re-aggregated.
          - accepted_values:
              name: ac_006_metric__inpatient_admission_value_numeric_is_one
              arguments:
                values: [1]
                quote: false
      - name: value_boolean
        data_type: boolean
        description: "{{ doc('metric__inpatient_admission__value_boolean') }}"
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} the admission is attributed to."
        data_tests:
          - not_null:
              name: ac_007_metric__inpatient_admission_facility_id_not_null
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: age_years
        data_type: integer
        description: "{{ doc('metric__inpatient_admission__age_years') }}"
        # BL-004: a measure, not a dimension -- the age classification is the consumer's, so
        # this is absent from the registry's disaggregations and is banded by the data table.
      - name: admission_ward_id
        data_type: character varying(255)
        description: "{{ doc('metric__inpatient_admission__admission_ward_id') }}"
      - name: admission_source
        data_type: text
        description: "{{ doc('metric__inpatient_admission__admission_source') }}"
        data_tests:
          # The model coalesces to 'Not recorded' precisely so this holds: Tupaia's array
          # filter drops NULL rows, so a NULL here would silently disappear the admission.
          - not_null:
              name: ac_011_metric__inpatient_admission_admission_source_not_null
      - name: is_admitted_via_emergency
        data_type: boolean
        description: "{{ doc('metric__inpatient_admission__is_admitted_via_emergency') }}"
        data_tests:
          # The model coalesces to false precisely so this holds: Tupaia's array filter drops
          # NULL rows, so a NULL here would silently disappear the admission.
          - not_null:
              name: ac_010_metric__inpatient_admission_is_admitted_via_emergency_not_null
      - name: principal_diagnosis__icd10_chapter
        data_type: text
        description: "{{ doc('metric__inpatient_admission__principal_diagnosis__icd10_chapter') }}"
        data_tests:
          # 'Not recorded' / 'Unclassified' rather than NULL, so a Tupaia array filter cannot
          # drop the admission.
          - not_null:
              name: ac_013_metric__inpatient_admission_diagnosis_chapter_not_null
      - name: discharge_disposition
        data_type: text
        description: "{{ doc('metric__inpatient_admission__discharge_disposition') }}"
        data_tests:
          # 'Not recorded' rather than NULL, so a Tupaia array filter cannot drop the
          # admission.
          - not_null:
              name: ac_014_metric__inpatient_admission_discharge_disposition_not_null
      - name: length_of_stay__minutes
        data_type: numeric
        description: "{{ doc('metric__inpatient_admission__length_of_stay__minutes') }}"
        # BL-015: a measure, not a dimension. NULL while the encounter is open.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: ac_015_metric__inpatient_admission_length_of_stay_non_negative
              arguments:
                min_value: 0
                row_condition: "length_of_stay__minutes is not null"
