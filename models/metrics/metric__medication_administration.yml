version: 2

models:
  - name: metric__medication_administration
    description: >-
      D5 metric view for the medication_administration indicator registered in
      documentations/metrics/pharmacy.yml: medication_administration. Medication doses recorded as given on the medication administration record (MAR), one row per given dose, dated to the day it was given. Facility, department and setting are
      those of the encounter segment active when the event happened.
    config:
      tags:
        - clinical
    # No data_table_* meta. The Tupaia data tables over this model are configured in
    # tupaia-data-product at tamanu/data_tables/, one file per data table.
    meta:
      owner: bes-maui
      domain: clinical
      # Per-event rows carrying sex and age alongside a record id -- no patient name or exact
      # birth date, the same pair the pharmacy order metrics carry while staying internal.
      pii: false
      classification: internal
    data_tests:
      # AC-001: one row per event. A duplicate would double-count in any consumer that sums
      # value_numeric -- error even though the repo default is warn.
      - dbt_utils.unique_combination_of_columns:
          name: ac_001_metric__medication_administration_grain
          arguments:
            combination_of_columns:
              - metric_id
              - subject_id
          config:
            severity: error
    columns:
      - name: metric_id
        data_type: text
        description: >-
          The registered indicator identifier. Always 'medication_administration'.
        data_tests:
          - not_null:
              name: ac_002_metric__medication_administration_metric_id_not_null
          - accepted_values:
              name: ac_002_metric__medication_administration_metric_id_values
              arguments:
                values:
                  - medication_administration
          - relationships:
              name: ac_002_metric__medication_administration_metric_id_registered
              arguments:
                to: ref('metric_definitions')
                field: metric_id
              config:
                severity: error
      - name: period_start
        data_type: date
        description: >-
          the date the dose was given (`given_time`).
        data_tests:
          - not_null:
              name: ac_003_metric__medication_administration_period_start_not_null
      - name: facility_id
        data_type: character varying(255)
        description: >-
          The Tamanu facility id the event is attributed to, from the patient's location when it happened.
        data_tests:
          - not_null:
              name: ac_003_metric__medication_administration_facility_id_not_null
      - name: encounter_type
        data_type: character varying(255)
        description: >-
          The segment's own encounter_type when the event happened -- finer than visit_detail_concept_id.
        data_tests:
          - not_null:
              name: ac_003_metric__medication_administration_encounter_type_not_null
      - name: visit_detail_concept_id
        data_type: integer
        description: >-
          The OMOP Visit concept of the segment active when the event happened: 9201 Inpatient
          Visit, 9202 Outpatient Visit, 9203 Emergency Room Visit or 0 No matching concept. A
          consumer scopes a setting on this id.
        data_tests:
          - not_null:
              name: ac_003_metric__medication_administration_visit_detail_concept_id_not_null
          - accepted_values:
              name: ac_004_metric__medication_administration_visit_detail_concept_id_values
              arguments:
                values: [9201, 9202, 9203, 0]
                quote: false
      - name: visit_detail_concept_name
        data_type: text
        description: >-
          The OMOP name of visit_detail_concept_id, the label to show.
        data_tests:
          - not_null:
              name: ac_003_metric__medication_administration_visit_detail_concept_name_not_null
      - name: sex
        data_type: character varying(255)
        description: >-
          The patient's sex.
      - name: drug_source_value
        data_type: text
        description: >-
          The code of the prescribed medication. Never NULL -- falls back to 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_003_metric__medication_administration_drug_source_value_not_null
      - name: drug_source_name
        data_type: text
        description: >-
          The name of the prescribed medication, the label to rank by. Never NULL -- falls back to 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_003_metric__medication_administration_drug_source_name_not_null
      - name: age_years
        data_type: integer
        description: >-
          Age in whole years on the day of the event. Not banded -- the consumer's data table bands it.
      - name: department
        data_type: text
        description: >-
          The department the patient was under when the event happened. Never NULL -- falls back to 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_003_metric__medication_administration_department_not_null
