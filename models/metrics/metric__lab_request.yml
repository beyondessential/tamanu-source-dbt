version: 2

models:
  - name: metric__lab_request
    description: >-
      D5 metric view for the lab_request indicator registered in
      documentations/metrics/lab.yml: lab_request. One row per completed lab test carrying a
      reading, sourced from clinical__measurement's lab branch -- per-test (subject) grain, so
      a consumer aggregates at whatever grain it needs.
    config:
      tags:
        - clinical
    # No data_table_* meta. The Tupaia data tables over this model are configured in
    # tupaia-data-product at tamanu/data_tables/, one file per data table, the same
    # convention metric__opd_procedure and metric__pharmacy_order use.
    meta:
      owner: bes-maui
      domain: clinical
      # Per-test rows, but the subject is a lab_tests id with no patient identifier, name or
      # birth date alongside it -- no patient is identifiable through a row, so this stays
      # unrestricted and covers standard and sensitive facilities alike.
      pii: false
      classification: internal
    data_tests:
      # One row per test. A duplicate would double-count it in any consumer that sums
      # value_numeric -- error even though the repo default is warn.
      - dbt_utils.unique_combination_of_columns:
          name: ac_metric__lab_request_grain
          arguments:
            combination_of_columns:
              - metric_id
              - subject_id
          config:
            severity: error
      # A lab test is point-in-time, so period_end is hardcoded NULL. Asserted as the null
      # invariant itself rather than as an end-after-start comparison, so a change that ever
      # populates it flags for a deliberate revisit instead of passing on an empty row set.
      - dbt_expectations.expect_column_values_to_be_null:
          name: ac_metric__lab_request_period_end_null
          arguments:
            column_name: period_end
    columns:
      - name: metric_id
        data_type: text
        description: The registered indicator identifier. Always 'lab_request'.
        data_tests:
          - not_null:
              name: ac_metric__lab_request_metric_id_not_null
          - accepted_values:
              name: ac_metric__lab_request_metric_id_values
              arguments:
                values:
                  - lab_request
          - relationships:
              name: ac_metric__lab_request_metric_id_registered
              arguments:
                to: ref('metric_definitions')
                field: metric_id
              config:
                severity: error
      - name: variant_id
        data_type: text
        description: NULL -- this is the standard definition, with no deployment-specific variant.
      - name: subject_id
        data_type: character varying(255)
        description: The Tamanu lab_tests id -- one completed test.
        data_tests:
          - not_null:
              name: ac_metric__lab_request_subject_id_not_null
      - name: period_start
        data_type: date
        description: >-
          The date the test completed, or (where that is absent) the date the request was
          published or requested -- clinical__measurement's own fallback order.
        data_tests:
          - not_null:
              name: ac_metric__lab_request_period_start_not_null
      - name: period_end
        data_type: date
        description: >-
          NULL -- a lab test is point-in-time and the model emits no resolution date for it.
      - name: period_granularity
        data_type: text
        description: Constant 'day'.
        data_tests:
          - not_null:
              name: ac_metric__lab_request_period_granularity_not_null
          - accepted_values:
              name: ac_metric__lab_request_period_granularity_is_day
              arguments:
                values: ['day']
      - name: value_numeric
        data_type: numeric
        description: Always 1 -- one test per row. Sum it to count tests over any grouping.
        data_tests:
          - not_null:
              name: ac_metric__lab_request_value_numeric_not_null
          - accepted_values:
              name: ac_metric__lab_request_value_numeric_is_one
              arguments:
                values: [1]
                quote: false
      - name: value_boolean
        data_type: boolean
        description: NULL -- unused by this metric.
      - name: facility_id
        data_type: character varying(255)
        description: The Tamanu facility id the test's encounter was recorded at.
        data_tests:
          - not_null:
              name: ac_metric__lab_request_facility_id_not_null
      - name: sex
        data_type: character varying(255)
        description: The patient's sex, from clinical__person.
      - name: lab_test_code
        data_type: text
        description: >-
          The test type's reference-data code, alongside lab_test so a card can scope to one
          test type by code, which survives a reference-data rename where the name does not.
          Never NULL -- falls back to 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_metric__lab_request_lab_test_code_not_null
      - name: lab_test
        data_type: text
        description: >-
          The test type as recorded, ungrouped -- the label to rank and trend by. No
          panel/category grouping is applied here. Never NULL -- falls back to
          lab_test_code, then 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_metric__lab_request_lab_test_not_null
      - name: age_years
        data_type: integer
        description: >-
          Age in whole years at the test date. Not banded -- an age classification is a
          presentation choice a deployment may set differently, so the consumer's data table
          bands it. A measure, not a dimension: absent from the registry's disaggregations.
      - name: department
        data_type: text
        description: >-
          The test's encounter's own department (e.g. Dental), resolved to a name so a
          consumer scopes to one department by metric_filters on a readable value. Never
          NULL -- falls back to 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_metric__lab_request_department_not_null
