version: 2

models:
  - name: metric__lab_test
    description: >-
      D5 metric view for the lab_test indicator registered in documentations/metrics/lab.yml:
      lab_test. One row per lab test ordered, whether or not it produced a result -- per-test
      (subject) grain, so a consumer aggregates at whatever grain it needs. The order side is
      read from bases/lab_requests and bases/lab_tests; the result, where one exists, is LEFT
      joined from clinical__measurement's lab branch. Renamed from metric__lab_request
      (MAUI-6909), which counted only resulted tests.
    config:
      tags:
        - clinical
    # No data_table_* meta. The Tupaia data tables over this model are configured in
    # tupaia-data-product at tamanu/data_tables/, one file per data table, the same
    # convention metric__opd_procedure and metric__pharmacy_order use.
    meta:
      owner: bes-maui
      domain: clinical
      # Per-test rows, but the subject is a lab_tests id with no patient identifier, name or
      # birth date alongside it -- no patient is identifiable through a row, so this stays
      # unrestricted and covers standard and sensitive facilities alike. Note lab_test_type is
      # NOT filtered on lab_test_types.is_sensitive (BL-012): suppressing a sensitive test type
      # is a deployment privacy decision taken at the data-table layer, not a definitional one.
      pii: false
      classification: internal
    data_tests:
      # One row per test. A duplicate would double-count it in any consumer that sums
      # value_numeric -- error even though the repo default is warn. This is also what guards
      # the results join: a fan-out from clinical__measurement would surface here.
      - dbt_utils.unique_combination_of_columns:
          name: ac_metric__lab_test_grain
          arguments:
            combination_of_columns:
              - metric_id
              - subject_id
          config:
            severity: error
      # BL-002: a completed test's period closes at its own completion, so period_end is no
      # longer hardcoded NULL as it was before the rename.
      #
      # EXPECTED TO WARN on deployments with backdated lab entry: period_end is the completion
      # as recorded, and a small number of tests are recorded as completing before they were
      # requested (22 of 2502 on Tokelau, the worst by about a day). Left at the project's
      # default warn severity rather than excluded or silenced, because the count is a genuine
      # data-quality signal worth surfacing to the country team. It does not affect any average:
      # turnaround__minutes is already NULL for exactly these rows (BL-007).
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          name: ac_metric__lab_test_period_end_after_start
          arguments:
            column_A: period_end
            column_B: period_start
            or_equal: true
            row_condition: period_end is not null
      # BL-006: period_end is populated if and only if the request published.
      - dbt_utils.expression_is_true:
          name: ac_metric__lab_test_period_end_only_when_completed
          arguments:
            expression: "(period_end is not null) = is_completed"
      # BL-007: turnaround exists exactly where the test completed. Equivalence, not
      # implication -- a backdated completion still yields a duration, just a negative one.
      - dbt_utils.expression_is_true:
          name: ac_metric__lab_test_turnaround_only_when_completed
          arguments:
            expression: "(turnaround__minutes is not null) = is_completed"
      # EXPECTED TO WARN wherever lab entry is backdated (22 of 2502 on Tokelau). A negative
      # turnaround means a test was recorded as completing before it was requested. The model
      # emits it as recorded rather than nulling or clamping it (BL-007), so this test is the
      # signal that says so, and the row count going to zero is what a cleaned deployment looks
      # like. The null branch is folded into the expression rather than passed as a
      # row_condition: dbt_utils.expression_is_true does not accept one as a test argument.
      - dbt_utils.expression_is_true:
          name: ac_metric__lab_test_turnaround_not_negative
          arguments:
            expression: "turnaround__minutes >= 0 or turnaround__minutes is null"
    columns:
      - name: metric_id
        data_type: text
        description: The registered indicator identifier. Always 'lab_test'.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_metric_id_not_null
          - accepted_values:
              name: ac_metric__lab_test_metric_id_values
              arguments:
                values:
                  - lab_test
          - relationships:
              name: ac_metric__lab_test_metric_id_registered
              arguments:
                to: ref('metric_definitions')
                field: metric_id
              config:
                severity: error
      - name: variant_id
        data_type: text
        description: NULL -- this is the standard definition, with no deployment-specific variant.
      - name: subject_id
        data_type: character varying(255)
        description: The Tamanu lab_tests id -- one ordered test.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_subject_id_not_null
      - name: period_start
        data_type: timestamp without time zone
        description: >-
          When the request was placed (lab_requests.requested_date). Request-level, so every
          test of a request shares it.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_period_start_not_null
      - name: period_end
        data_type: timestamp without time zone
        description: >-
          When the test itself completed (lab_tests.completed_date). NULL until then.
      - name: period_granularity
        data_type: text
        description: Constant 'minute' -- the model reports a request-to-publication interval.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_period_granularity_not_null
          - accepted_values:
              name: ac_metric__lab_test_period_granularity_is_minute
              arguments:
                values: ['minute']
      - name: value_numeric
        data_type: numeric
        description: Always 1 -- one test per row. Sum it to count tests over any grouping.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_value_numeric_not_null
          - accepted_values:
              name: ac_metric__lab_test_value_numeric_is_one
              arguments:
                values: [1]
                quote: false
      - name: value_boolean
        data_type: boolean
        description: NULL -- unused by this metric.
      - name: facility_id
        data_type: character varying(255)
        description: >-
          The facility of the segment the test was ordered in -- the segment's own location,
          not the encounter's current one.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_facility_id_not_null
      - name: encounter_setting
        data_type: text
        description: >-
          The setting the test was ordered in, from the resolved segment's OMOP Visit concept:
          Outpatient (9202 -- clinic, imaging, vaccination), Inpatient (9201), or Other.
          Coarser than encounter_type deliberately, so a consumer filters one stable value
          instead of a list that drifts with map__omop_visit_type. Emergency (9203) is
          deliberately not named -- it falls in Other, so no card can be built off this metric
          as though it were an emergency figure; emergency lab activity would be its own
          metric, as it is for procedures and imaging requests.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_encounter_setting_not_null
          - accepted_values:
              name: ac_metric__lab_test_encounter_setting_values
              arguments:
                values: ['Outpatient', 'Inpatient', 'Other']
      - name: encounter_type
        data_type: character varying(255)
        description: >-
          The segment's own encounter_type, as it stood when the test was ordered -- finer than
          visit_detail_concept_id, for a consumer wanting (say) vaccination encounters
          specifically. Segment-level, not the encounter's current type: Tamanu updates
          encounters.encounter_type in place, so a test ordered in clinic on a patient later
          admitted would otherwise read 'admission'.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_encounter_type_not_null
      - name: sex
        data_type: character varying(255)
        description: The patient's sex, from clinical__person.
      - name: is_completed
        data_type: boolean
        description: >-
          Whether the test has its own completion timestamp. Deliberately not the request
          reaching 'published': completion is a property of the individual test, and a request
          can be published while one of its tests was never run. Does NOT distinguish cancelled
          from still pending -- both are false. Nor does it mean the test has a result: a
          completed test can carry no reading, which is why "has a result" is read from the
          result column instead.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_is_completed_not_null
      - name: is_panel_request
        data_type: boolean
        description: >-
          Whether the test arrived as part of a bundled panel order. A five-test panel is five
          rows; this is what lets a consumer counting clinical acts rather than laboratory
          workload separate them from five single orders.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_is_panel_request_not_null
      - name: department
        data_type: text
        description: >-
          The department of the segment the test was ordered in (e.g. Dental), resolved to a
          name so a consumer scopes to one department by metric_filters on a readable value.
          Segment-level, not the encounter's current department. Never NULL -- falls back to
          'Not recorded'.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_department_not_null
      - name: lab_test_type_code
        data_type: text
        description: >-
          The test type's reference-data code, alongside lab_test_type so a card can scope to
          one test type by code, which survives a reference-data rename where the name does
          not. Never NULL -- falls back to 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_lab_test_type_code_not_null
      - name: lab_test_type
        data_type: text
        description: >-
          The test type as recorded, ungrouped -- the label to rank and trend by. No
          panel/category grouping is applied here. Never NULL -- falls back to
          lab_test_type_code, then 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_lab_test_type_not_null
      - name: lab_test_category
        data_type: text
        description: >-
          The request's category (e.g. Haematology), as recorded and ungrouped. Request-level:
          a Tamanu request carries exactly one category, so every test of a request shares it.
          Never NULL -- falls back to 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_lab_test_category_not_null
      - name: result
        data_type: text
        description: >-
          The result as recorded, ungrouped and unclassified. Carries the point-of-care
          encoded result too: clinical__measurement resolves a result-bearing test type into
          value_source_value, so those readings arrive here without a join of this model's own.
          'Not recorded' where the test has produced no result -- the ordinary state of a
          pending or cancelled test, not an anomaly. A consumer wanting a positivity rate
          classifies this column at the data-table layer and forms the ratio there; the metric
          stores neither a flag nor a rate.
        data_tests:
          - not_null:
              name: ac_metric__lab_test_result_not_null
      - name: age_years
        data_type: integer
        description: >-
          Age in whole years at the request. Not banded -- an age classification is a
          presentation choice a deployment may set differently, so the consumer's data table
          bands it. A measure, not a dimension: absent from the registry's disaggregations.
      - name: turnaround__minutes
        data_type: integer
        description: >-
          Request placed to test completed, in whole minutes. NULL unless is_completed -- a
          pending test has no turnaround, not a turnaround of zero, so it leaves a mean's
          denominator as well as its numerator. CAN BE NEGATIVE where a test was recorded as
          completing before it was requested: emitted as recorded rather than nulled or clamped,
          so the deployment can see and fix it. A consumer showing an average should decide
          explicitly whether to exclude negatives, rather than inheriting them unnoticed. A
          measure, not a dimension: averaged over is_completed rows, weighting by value_numeric
          rather than averaging per-facility averages.
