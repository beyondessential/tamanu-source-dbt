version: 2

models:
  - name: metric__ed_pharmacy_order
    description: >-
      D5 metric view for the ed_pharmacy_order indicator registered in
      documentations/metrics/emergency.yml: ed_pharmacy_order (MAUI-6907). One row per drug line
      ordered from the pharmacy while the patient was in the emergency department -- per-drug-line
      (subject) grain, so a consumer aggregates at whatever grain it needs.
    config:
      tags:
        - clinical
    # No data_table_* meta. The Tupaia data tables over this model are configured in
    # tupaia-data-product at tamanu/data_tables/, one file per data table.
    meta:
      owner: bes-maui
      domain: clinical
      # Per-subject rows carrying sex/age alongside a record id -- no patient name or exact
      # birth date, the same pair the other ED metrics carry while staying internal.
      pii: false
      classification: internal
    data_tests:
      # AC-001: one row per subject. A duplicate would double-count in any consumer that sums
      # value_numeric -- error even though the repo default is warn.
      - dbt_utils.unique_combination_of_columns:
          name: ac_001_metric__ed_pharmacy_order_grain
          arguments:
            combination_of_columns:
              - metric_id
              - subject_id
          config:
            severity: error
    columns:
      - name: metric_id
        data_type: text
        description: >-
          The registered indicator identifier. Always 'ed_pharmacy_order'.
        data_tests:
          - not_null:
              name: ac_002_metric__ed_pharmacy_order_metric_id_not_null
          - accepted_values:
              name: ac_002_metric__ed_pharmacy_order_metric_id_values
              arguments:
                values:
                  - ed_pharmacy_order
          - relationships:
              name: ac_002_metric__ed_pharmacy_order_metric_id_registered
              arguments:
                to: ref('metric_definitions')
                field: metric_id
              config:
                severity: error
      - name: variant_id
        data_type: text
        description: >-
          NULL -- this is the standard definition, with no deployment-specific variant.
      - name: subject_id
        data_type: character varying(255)
        description: >-
          The Tamanu pharmacy order drug line id.
      - name: period_start
        data_type: date
        description: >-
          The date the pharmacy order was placed.
        data_tests:
          - not_null:
              name: ac_003_metric__ed_pharmacy_order_period_start_not_null
      - name: period_end
        data_type: date
        description: >-
          NULL -- unused by this metric.
      - name: period_granularity
        data_type: text
        description: >-
          Constant 'day' -- a pharmacy order is reported against the date it was placed.
        data_tests:
          - not_null:
              name: ac_003_metric__ed_pharmacy_order_period_granularity_not_null
      - name: value_numeric
        data_type: numeric
        description: >-
          Always 1 -- one record per row. Sum it to count over any grouping.
        data_tests:
          - not_null:
              name: ac_003_metric__ed_pharmacy_order_value_numeric_not_null
      - name: value_boolean
        data_type: boolean
        description: >-
          NULL -- unused by this metric.
      - name: facility_id
        data_type: character varying(255)
        description: >-
          The Tamanu facility id the drug line is attributed to, from the patient's location when
          the order was placed.
        data_tests:
          - not_null:
              name: ac_003_metric__ed_pharmacy_order_facility_id_not_null
      - name: sex
        data_type: character varying(255)
        description: >-
          The patient's sex.
      - name: is_completed
        data_type: boolean
        description: >-
          Whether the drug line has been dispensed. Never NULL.
        data_tests:
          - not_null:
              name: ac_003_metric__ed_pharmacy_order_is_completed_not_null
      - name: drug_source_value
        data_type: text
        description: >-
          The medication's code. Never NULL -- falls back to 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_003_metric__ed_pharmacy_order_drug_source_value_not_null
      - name: drug_source_name
        data_type: text
        description: >-
          The medication's name, the label to rank by. Never NULL -- falls back to 'Not
          recorded'.
        data_tests:
          - not_null:
              name: ac_003_metric__ed_pharmacy_order_drug_source_name_not_null
      - name: age_years
        data_type: integer
        description: >-
          Age in whole years when the order was placed. Not banded -- the consumer's data table
          bands it.
      - name: department
        data_type: text
        description: >-
          The department the patient was under when the order was placed. Never NULL -- falls
          back to 'Not recorded'.
        data_tests:
          - not_null:
              name: ac_003_metric__ed_pharmacy_order_department_not_null
