version: 2

models:
  - name: metric__opd_visit_department
    description: "{{ doc('metric__opd_visit_department') }}"
    config:
      tags:
        - clinical
    # No data_table_* meta -- same convention as metric__outpatient_visit.yml.
    meta:
      owner: bes-maui
      domain: clinical
      # Same reasoning as metric__outpatient_visit.yml: an encounter id with no patient
      # identifier, name or birth date -- no patient is identifiable through a row. Carries a
      # clinician display name (staff-attributable, not patient-identifying), same as that
      # model's own clinician_name/admission_clinician_name.
      pii: false
      classification: internal
    data_tests:
      # BL-001: grain is (metric_id, subject_id, period_start), not (metric_id, subject_id)
      # like every sibling metric's own AC-001 -- a segment's own start time is what
      # distinguishes it from another segment of the same visit. department is deliberately
      # NOT part of this key: a visit that leaves and re-enters the same department produces
      # two rows sharing a department value, distinguished only by period_start.
      - dbt_utils.unique_combination_of_columns:
          name: ac_001_metric__opd_visit_department_grain
          arguments:
            combination_of_columns:
              - metric_id
              - subject_id
              - period_start
          config:
            severity: error
      # AC-004: period_end, where present, is at or after period_start.
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          name: ac_004_metric__opd_visit_department_period_end_at_or_after_start
          arguments:
            column_A: period_end
            column_B: period_start
            or_equal: true
            row_condition: "period_end is not null"
    columns:
      - name: metric_id
        data_type: text
        description: "{{ doc('metric__opd_visit_department__metric_id') }}"
        data_tests:
          - not_null:
              name: ac_002_metric__opd_visit_department_metric_id_not_null
          - accepted_values:
              name: ac_002_metric__opd_visit_department_metric_id_values
              arguments:
                values:
                  - opd_visit_department
          - relationships:
              name: ac_003_metric__opd_visit_department_metric_id_registered
              arguments:
                to: ref('metric_definitions')
                field: metric_id
              config:
                severity: error
      - name: variant_id
        data_type: text
        description: "{{ doc('metric__opd_visit_department__variant_id') }}"
      - name: subject_id
        data_type: character varying(255)
        description: "{{ doc('metric__opd_visit_department__subject_id') }}"
        data_tests:
          - not_null:
              name: ac_005_metric__opd_visit_department_subject_id_not_null
      - name: period_start
        data_type: date
        description: "{{ doc('metric__opd_visit_department__period_start') }}"
        data_tests:
          - not_null:
              name: ac_006_metric__opd_visit_department_period_start_not_null
      - name: period_end
        data_type: date
        description: "{{ doc('metric__opd_visit_department__period_end') }}"
        # BL-002: deliberately no not_null test -- NULL means the segment is still open.
      - name: period_granularity
        data_type: text
        description: "{{ doc('metric__opd_visit_department__period_granularity') }}"
        data_tests:
          - not_null:
              name: ac_007_metric__opd_visit_department_period_granularity_not_null
          - accepted_values:
              name: ac_007_metric__opd_visit_department_period_granularity_is_day
              arguments:
                values: ['day']
      - name: value_numeric
        data_type: numeric
        description: "{{ doc('metric__opd_visit_department__value_numeric') }}"
        data_tests:
          - not_null:
              name: ac_008_metric__opd_visit_department_value_numeric_not_null
          - accepted_values:
              name: ac_008_metric__opd_visit_department_value_numeric_is_one
              arguments:
                values: [1]
                quote: false
      - name: value_boolean
        data_type: boolean
        description: "{{ doc('metric__opd_visit_department__value_boolean') }}"
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} the visit is attributed to."
        data_tests:
          - not_null:
              name: ac_009_metric__opd_visit_department_facility_id_not_null
      - name: location_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_id') }} of the visit."
        data_tests:
          - not_null:
              name: ac_010_metric__opd_visit_department_location_id_not_null
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: age_years
        data_type: integer
        description: "{{ doc('metric__outpatient_visit__age_years') }}"
      - name: clinician_id
        data_type: character varying(255)
        description: "{{ doc('metric__opd_visit_department__clinician_id') }}"
        # BL-003: deliberately no not_null test -- a segment recorded with no clinician keeps
        # the row rather than being dropped.
      - name: clinician_name
        data_type: character varying(255)
        description: "{{ doc('metric__opd_visit_department__clinician_name') }}"
        data_tests:
          - not_null:
              name: ac_011_metric__opd_visit_department_clinician_name_not_null
      - name: is_admitted
        data_type: boolean
        description: "{{ doc('metric__outpatient_visit__is_admitted') }}"
        data_tests:
          - not_null:
              name: ac_012_metric__opd_visit_department_is_admitted_not_null
      - name: admission_clinician_id
        data_type: character varying(255)
        description: "{{ doc('metric__outpatient_visit__admission_clinician_id') }}"
      - name: admission_clinician_name
        data_type: character varying(255)
        description: "{{ doc('metric__outpatient_visit__admission_clinician_name') }}"
        data_tests:
          - not_null:
              name: ac_013_metric__opd_visit_department_admission_clinician_name_not_null
      - name: is_auto_discharge
        data_type: boolean
        description: "{{ doc('metric__outpatient_visit__is_auto_discharge') }}"
        data_tests:
          - not_null:
              name: ac_014_metric__opd_visit_department_is_auto_discharge_not_null
      - name: segment_time__minutes
        data_type: numeric
        description: "{{ doc('metric__opd_visit_department__segment_time__minutes') }}"
        data_tests:
          # BL-004: this segment cannot end before it starts. min_value: 0 with no max -- a
          # long-running segment is a real, if unusual, encounter.
          - dbt_expectations.expect_column_values_to_be_between:
              name: ac_015_metric__opd_visit_department_segment_time_non_negative
              arguments:
                min_value: 0
                row_condition: "segment_time__minutes is not null"
      - name: department
        data_type: text
        description: "{{ doc('metric__opd_visit_department__department') }}"
        data_tests:
          - not_null:
              name: ac_016_metric__opd_visit_department_department_not_null
