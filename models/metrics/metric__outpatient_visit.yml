version: 2

models:
  - name: metric__outpatient_visit
    description: "{{ doc('metric__outpatient_visit') }}"
    config:
      tags:
        - clinical
    # No data_table_* meta. The Tupaia data tables over this model are configured in
    # tupaia-data-product at tamanu/data_tables/, one file per data table (spec § Data
    # tables), so a deployment that bands a value differently adds a file there rather than
    # forking the metric.
    meta:
      owner: bes-maui
      domain: clinical
      # Per-visit rows, but the subject is an encounter id with no patient identifier, name
      # or birth date alongside it -- no patient is identifiable through a row, so this
      # stays unrestricted and covers standard and sensitive facilities alike.
      pii: false
      classification: internal
    data_tests:
      # One row per visit. A duplicate would double-count a visit in any consumer that
      # sums value_numeric -- error even though the repo default is warn.
      - dbt_utils.unique_combination_of_columns:
          name: ac_001_metric__outpatient_visit_grain
          arguments:
            combination_of_columns:
              - metric_id
              - subject_id
          config:
            severity: error
    columns:
      - name: metric_id
        data_type: text
        description: "{{ doc('metric__outpatient_visit__metric_id') }}"
        data_tests:
          - not_null:
              name: ac_002_metric__outpatient_visit_metric_id_not_null
          - accepted_values:
              name: ac_002_metric__outpatient_visit_metric_id_values
              arguments:
                values:
                  - opd_visit
          # Definition <-> implementation link: every metric__ view asserts its ids are
          # registered in the canonical registry.
          - relationships:
              name: ac_003_metric__outpatient_visit_metric_id_registered
              arguments:
                to: ref('metric_definitions')
                field: metric_id
              config:
                severity: error
      - name: variant_id
        data_type: text
        description: "{{ doc('metric__outpatient_visit__variant_id') }}"
      - name: subject_id
        data_type: character varying(255)
        description: "{{ doc('metric__outpatient_visit__subject_id') }}"
        data_tests:
          - not_null:
              name: ac_008_metric__outpatient_visit_subject_id_not_null
      - name: period_start
        data_type: date
        description: "{{ doc('metric__outpatient_visit__period_start') }}"
        data_tests:
          - not_null:
              name: ac_004_metric__outpatient_visit_period_start_not_null
      - name: period_end
        data_type: date
        description: "{{ doc('metric__outpatient_visit__period_end') }}"
        # Always NULL -- Tamanu tracks the visit date only, no departure event (BL-002).
      - name: period_granularity
        data_type: text
        description: "{{ doc('metric__outpatient_visit__period_granularity') }}"
        data_tests:
          - not_null:
              name: ac_005_metric__outpatient_visit_period_granularity_not_null
          - accepted_values:
              name: ac_005_metric__outpatient_visit_period_granularity_is_day
              arguments:
                values: ['day']
      - name: value_numeric
        data_type: numeric
        description: "{{ doc('metric__outpatient_visit__value_numeric') }}"
        data_tests:
          - not_null:
              name: ac_006_metric__outpatient_visit_value_numeric_not_null
          # BL-003: one visit per row, so the count contribution is always 1. A value
          # other than 1 would mean the model had silently re-aggregated.
          - accepted_values:
              name: ac_006_metric__outpatient_visit_value_numeric_is_one
              arguments:
                values: [1]
                quote: false
      - name: value_boolean
        data_type: boolean
        description: "{{ doc('metric__outpatient_visit__value_boolean') }}"
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} the visit is attributed to."
        data_tests:
          - not_null:
              name: ac_007_metric__outpatient_visit_facility_id_not_null
      - name: location_group_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_group_id') }} (the area). 'locationgroup-unknown' when the visit's location has no area, or that area was soft-deleted (no longer resolves in location_groups)."
        data_tests:
          - not_null:
              name: ac_009_metric__outpatient_visit_location_group_id_not_null
      - name: location_group_name
        data_type: character varying(255)
        description: "{{ doc('generic__location_group') }} (the area). 'Unknown' when the visit's location has no area."
        data_tests:
          - not_null:
              name: ac_010_metric__outpatient_visit_location_group_name_not_null
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: age_years
        data_type: integer
        description: "{{ doc('metric__outpatient_visit__age_years') }}"
        # BL-004: a measure, not a dimension -- the age classification is the consumer's, so
        # this is absent from the registry's disaggregations and is banded by the data table.
