version: 2

models:
  - name: metric__outpatient_visit
    description: "{{ doc('metric__outpatient_visit') }}"
    config:
      tags:
        - clinical
    # No data_table_* meta. The Tupaia data tables over this model are configured in
    # tupaia-data-product at tamanu/data_tables/, one file per data table (spec § Data
    # tables), so a deployment that bands a value differently adds a file there rather than
    # forking the metric.
    meta:
      owner: bes-maui
      domain: clinical
      # Per-visit rows, but the subject is an encounter id with no patient identifier, name
      # or birth date alongside it -- no patient is identifiable through a row, so this
      # stays unrestricted and covers standard and sensitive facilities alike.
      #
      # It does carry the attending and admitting clinician's display name (BL-008, BL-010),
      # which is staff-attributable but not patient-identifying: a row says a named clinician
      # saw someone, never who. Treated the same way ds__discharge_audit treats its
      # discharger_on_form column.
      pii: false
      classification: internal
    data_tests:
      # One row per visit. A duplicate would double-count a visit in any consumer that
      # sums value_numeric -- error even though the repo default is warn.
      - dbt_utils.unique_combination_of_columns:
          name: ac_001_metric__outpatient_visit_grain
          arguments:
            combination_of_columns:
              - metric_id
              - subject_id
          config:
            severity: error
      # AC-009 (BL-002): period_end, where present, is at or after period_start.
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          name: ac_009_metric__outpatient_visit_period_end_at_or_after_start
          arguments:
            column_A: period_end
            column_B: period_start
            or_equal: true
            row_condition: "period_end is not null"
    columns:
      - name: metric_id
        data_type: text
        description: "{{ doc('metric__outpatient_visit__metric_id') }}"
        data_tests:
          - not_null:
              name: ac_002_metric__outpatient_visit_metric_id_not_null
          - accepted_values:
              name: ac_002_metric__outpatient_visit_metric_id_values
              arguments:
                values:
                  - opd_visit
          # Definition <-> implementation link: every metric__ view asserts its ids are
          # registered in the canonical registry.
          - relationships:
              name: ac_003_metric__outpatient_visit_metric_id_registered
              arguments:
                to: ref('metric_definitions')
                field: metric_id
              config:
                severity: error
      - name: variant_id
        data_type: text
        description: "{{ doc('metric__outpatient_visit__variant_id') }}"
      - name: subject_id
        data_type: character varying(255)
        description: "{{ doc('metric__outpatient_visit__subject_id') }}"
        data_tests:
          - not_null:
              name: ac_008_metric__outpatient_visit_subject_id_not_null
      - name: period_start
        data_type: date
        description: "{{ doc('metric__outpatient_visit__period_start') }}"
        data_tests:
          - not_null:
              name: ac_004_metric__outpatient_visit_period_start_not_null
      - name: period_end
        data_type: date
        description: "{{ doc('metric__outpatient_visit__period_end') }}"
        # BL-002: deliberately no not_null test -- NULL means the encounter is still open.
      - name: period_granularity
        data_type: text
        description: "{{ doc('metric__outpatient_visit__period_granularity') }}"
        data_tests:
          - not_null:
              name: ac_005_metric__outpatient_visit_period_granularity_not_null
          - accepted_values:
              name: ac_005_metric__outpatient_visit_period_granularity_is_day
              arguments:
                values: ['day']
      - name: value_numeric
        data_type: numeric
        description: "{{ doc('metric__outpatient_visit__value_numeric') }}"
        data_tests:
          - not_null:
              name: ac_006_metric__outpatient_visit_value_numeric_not_null
          # BL-003: one visit per row, so the count contribution is always 1. A value
          # other than 1 would mean the model had silently re-aggregated.
          - accepted_values:
              name: ac_006_metric__outpatient_visit_value_numeric_is_one
              arguments:
                values: [1]
                quote: false
      - name: value_boolean
        data_type: boolean
        description: "{{ doc('metric__outpatient_visit__value_boolean') }}"
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} the visit is attributed to."
        data_tests:
          - not_null:
              name: ac_007_metric__outpatient_visit_facility_id_not_null
      - name: location_id
        data_type: character varying(255)
        description: "{{ doc('generic__location_id') }} of the visit."
        data_tests:
          - not_null:
              name: ac_010_metric__outpatient_visit_location_id_not_null
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
      - name: age_years
        data_type: integer
        description: "{{ doc('metric__outpatient_visit__age_years') }}"
        # BL-004: a measure, not a dimension -- the age classification is the consumer's, so
        # this is absent from the registry's disaggregations and is banded by the data table.
      - name: clinician_id
        data_type: character varying(255)
        description: "{{ doc('metric__outpatient_visit__clinician_id') }}"
        # BL-008: deliberately no not_null test -- an intake segment recorded with no
        # clinician keeps the visit rather than being dropped from the metric.
      - name: clinician_name
        data_type: character varying(255)
        description: "{{ doc('metric__outpatient_visit__clinician_name') }}"
        data_tests:
          # BL-008: 'Not recorded' rather than NULL, so the array filter the data tables
          # expose this through cannot drop the visit.
          - not_null:
              name: ac_015_metric__outpatient_visit_clinician_name_not_null
      - name: is_admitted
        data_type: boolean
        description: "{{ doc('metric__outpatient_visit__is_admitted') }}"
        data_tests:
          # BL-009: false, not NULL, for a visit that was not admitted. A NULL would be
          # dropped by the array filter the data tables expose this through, silently
          # shrinking the denominator of every admission rate.
          - not_null:
              name: ac_011_metric__outpatient_visit_is_admitted_not_null
      - name: admission_clinician_id
        data_type: character varying(255)
        description: "{{ doc('metric__outpatient_visit__admission_clinician_id') }}"
        # BL-010: deliberately no not_null test -- NULL is the ordinary case, a visit that
        # was never admitted.
      - name: admission_clinician_name
        data_type: character varying(255)
        description: "{{ doc('metric__outpatient_visit__admission_clinician_name') }}"
        data_tests:
          # BL-010: same reasoning as clinician_name.
          - not_null:
              name: ac_016_metric__outpatient_visit_admission_clinician_name_not_null
      - name: is_auto_discharge
        data_type: boolean
        description: "{{ doc('metric__outpatient_visit__is_auto_discharge') }}"
        data_tests:
          # BL-012: false, not NULL, for a clinician-recorded discharge and for an encounter
          # with no discharge at all -- same reasoning as is_admitted.
          - not_null:
              name: ac_012_metric__outpatient_visit_is_auto_discharge_not_null
      - name: opd_time__seconds
        data_type: bigint
        description: "{{ doc('metric__outpatient_visit__opd_time__seconds') }}"
        data_tests:
          # BL-011: the outpatient episode cannot end before it starts. `min_value: 0` with
          # no max: a long-running episode is a real, if unusual, encounter.
          - dbt_expectations.expect_column_values_to_be_between:
              name: ac_013_metric__outpatient_visit_opd_time_non_negative
              arguments:
                min_value: 0
                row_condition: "opd_time__seconds is not null"
      - name: opd_time__minutes
        data_type: numeric
        description: "{{ doc('metric__outpatient_visit__opd_time__minutes') }}"
        # BL-011: a measure, not a dimension -- unbanded and unaveraged, for the same reason
        # as age_years. Covered by AC-013 through opd_time__seconds, which it is derived
        # from.
