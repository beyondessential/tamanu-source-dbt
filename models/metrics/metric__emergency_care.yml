version: 2

models:
  - name: metric__emergency_care
    description: "{{ doc('metric__emergency_care') }}"
    config:
      tags:
        - clinical
    meta:
      owner: bes-maui
      domain: clinical
      # Pre-aggregated counts with no subject: covers standard and sensitive facilities
      # alike, and carries no PII, so it is not restricted despite its clinical domain.
      pii: false
      classification: internal
      create_data_table: true
    data_tests:
      # Grain violation would double-count a month in any consumer that sums
      # value_numeric -- error even though the repo default is warn.
      - dbt_utils.unique_combination_of_columns:
          name: ac_001_metric__emergency_care_grain
          arguments:
            combination_of_columns:
              - metric_id
              - period_start
              - facility_id
              - sex
              - age_group__who_primary_classification
          config:
            severity: error
    columns:
      - name: metric_id
        data_type: text
        description: "{{ doc('metric__emergency_care__metric_id') }}"
        meta:
          data_table_filter: array
        data_tests:
          - not_null:
              name: ac_002_metric__emergency_care_metric_id_not_null
          - accepted_values:
              name: ac_002_metric__emergency_care_metric_id_values
              arguments:
                values:
                  - ed_attendance
                  - ed_attendance_admitted
          # Definition <-> implementation link: every metric__ view asserts its
          # ids are registered in the canonical registry.
          - relationships:
              name: ac_003_metric__emergency_care_metric_id_registered
              arguments:
                to: ref('metric_definitions')
                field: metric_id
              config:
                severity: error
      - name: variant_id
        data_type: text
        description: "{{ doc('metric__emergency_care__variant_id') }}"
      - name: subject_id
        data_type: character varying(255)
        description: "{{ doc('metric__emergency_care__subject_id') }}"
      - name: period_start
        data_type: date
        description: "{{ doc('metric__emergency_care__period_start') }}"
        meta:
          data_table_filter: date
        data_tests:
          - not_null:
              name: ac_004_metric__emergency_care_period_start_not_null
      - name: period_end
        data_type: date
        description: "{{ doc('metric__emergency_care__period_end') }}"
        data_tests:
          - not_null:
              name: ac_004_metric__emergency_care_period_end_not_null
      - name: period_granularity
        data_type: text
        description: "{{ doc('metric__emergency_care__period_granularity') }}"
        data_tests:
          - not_null:
              name: ac_005_metric__emergency_care_period_granularity_not_null
          - accepted_values:
              name: ac_005_metric__emergency_care_period_granularity_is_month
              arguments:
                values: ['month']
      - name: value_numeric
        data_type: numeric
        description: "{{ doc('metric__emergency_care__value_numeric') }}"
        meta:
          data_table_metric: sum
        data_tests:
          - not_null:
              name: ac_006_metric__emergency_care_value_numeric_not_null
      - name: value_boolean
        data_type: boolean
        description: "{{ doc('metric__emergency_care__value_boolean') }}"
      - name: facility_id
        data_type: character varying(255)
        description: "{{ doc('generic__facility_id') }} the attendance is attributed to."
        meta:
          data_table_filter: array
        data_tests:
          - not_null:
              name: ac_007_metric__emergency_care_facility_id_not_null
      - name: tupaia_facility_id
        data_type: text
        description: "{{ doc('metric__emergency_care__tupaia_facility_id') }}"
        meta:
          data_table_filter: array
        data_tests:
          # The model coalesces to 'Not available' precisely so this holds: Tupaia's array
          # filter drops NULL rows, so a NULL here would silently disappear a facility.
          - not_null:
              name: ac_008_metric__emergency_care_tupaia_facility_id_not_null
      - name: sex
        data_type: character varying(255)
        description: "{{ doc('patients__sex') }}"
        meta:
          data_table_filter: array
      - name: age_group__who_primary_classification
        data_type: character varying(255)
        description: "{{ doc('metric__emergency_care__age_group__who_primary_classification') }}"
        meta:
          data_table_filter: array
