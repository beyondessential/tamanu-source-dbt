version: 2

models:
  - name: invoices_change_logs
    description: "Change logs for {{ doc('table__invoices') }}"
    config:
      tags:
        - administration
        - log
    meta:
      owner: bes-maui
      domain: admin
      tier: silver
      pii: false
      classification: restricted
    columns:
      - name: change_id
        data_type: uuid
        description: "{{ doc('logs__changes__id') }}"

      - name: invoice_id
        data_type: text
        description: "{{ doc('logs__changes__record_id') }} in invoices."

      - name: logged_at
        data_type: timestamptz
        description: "{{ doc('logs__changes__logged_at') }} in invoices history."

      - name: updated_by_user_id
        data_type: text
        description: "{{ doc('logs__changes__updated_by_user_id') }} in invoices history."

      - name: status
        data_type: text
        description: "{{ doc('invoices__status') }} from history."

      - name: encounter_id
        data_type: character varying(255)
        description: "{{ doc('invoices__encounter_id') }} Sourced from the invoices table."

      - name: previous_status
        data_type: text
        description: Invoice status from the immediately preceding change event. Null for the initial creation (change_sequence = 1).

      - name: change_sequence
        data_type: integer
        description: Sequential number of this change for the invoice, ordered by logged_at. 1 = initial creation event.

unit_tests:
  - name: test_invoices_change_logs_window_functions
    model: invoices_change_logs
    description: >
      Verifies that previous_status (LAG) and change_sequence (ROW_NUMBER) are
      computed correctly across two change events for the same invoice, and that
      invoices belonging to the test patient are excluded.
    given:
      - input: source('logs__tamanu', 'changes')
        format: csv
        rows: |
          id,logged_at,updated_by_user_id,record_id,table_name,record_deleted_at,record_data
          00000000-0000-0000-0000-000000000001,2025-01-10 09:00:00,user_001,00000000-0000-0000-0000-000000000011,invoices,,"{""status"": ""in_progress""}"
          00000000-0000-0000-0000-000000000002,2025-01-15 14:00:00,user_002,00000000-0000-0000-0000-000000000011,invoices,,"{""status"": ""finalised""}"
          00000000-0000-0000-0000-000000000003,2025-01-12 10:00:00,user_003,00000000-0000-0000-0000-000000000022,invoices,,"{""status"": ""in_progress""}"
          00000000-0000-0000-0000-000000000004,2025-01-11 08:00:00,user_004,00000000-0000-0000-0000-000000000033,invoices,,"{""status"": ""in_progress""}"

      - input: source('tamanu', 'invoices')
        format: csv
        rows: |
          id,encounter_id,deleted_at
          00000000-0000-0000-0000-000000000011,00000000-0000-0000-0000-000000000111,
          00000000-0000-0000-0000-000000000022,00000000-0000-0000-0000-000000000222,
          00000000-0000-0000-0000-000000000033,00000000-0000-0000-0000-000000000333,

      - input: source('tamanu', 'encounters')
        format: csv
        rows: |
          id,patient_id,deleted_at
          00000000-0000-0000-0000-000000000111,00000000-0000-0000-0000-000000001111,
          00000000-0000-0000-0000-000000000222,00000000-0000-0000-0000-000000002222,
          00000000-0000-0000-0000-000000000333,h1627394-3778-4c31-a510-9fcb88efdbf3,

    expect:
      format: csv
      rows: |
        change_id,invoice_id,logged_at,updated_by_user_id,status,encounter_id,previous_status,change_sequence
        00000000-0000-0000-0000-000000000001,00000000-0000-0000-0000-000000000011,2025-01-10 09:00:00,user_001,in_progress,00000000-0000-0000-0000-000000000111,,1
        00000000-0000-0000-0000-000000000002,00000000-0000-0000-0000-000000000011,2025-01-15 14:00:00,user_002,finalised,00000000-0000-0000-0000-000000000111,in_progress,2
        00000000-0000-0000-0000-000000000003,00000000-0000-0000-0000-000000000022,2025-01-12 10:00:00,user_003,in_progress,00000000-0000-0000-0000-000000000222,,1
