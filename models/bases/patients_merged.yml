version: 2
models:
- name: patients_merged
  description: 'Only includes patients that have been merged. {{ doc("table__patients") }}'
  config:
    tags:
    - patient
    meta:
      owner: bes-maui
      domain: clinical
      pii: true
      classification: restricted
  columns:
  - name: id
    data_type: character varying(255)
    description: "{{ doc('generic__id') }} in patients."
  - name: display_id
    data_type: character varying(255)
    description: "{{ doc('patients__display_id') }}"
    config:
      tags:
      - direct_identifier
  - name: first_name
    data_type: character varying(255)
    description: "{{ doc('patients__first_name') }}"
    config:
      tags:
      - direct_identifier
  - name: middle_name
    data_type: character varying(255)
    description: "{{ doc('patients__middle_name') }}"
    config:
      tags:
      - direct_identifier
  - name: last_name
    data_type: character varying(255)
    description: "{{ doc('patients__last_name') }}"
    config:
      tags:
      - direct_identifier
  - name: cultural_name
    data_type: character varying(255)
    description: "{{ doc('patients__cultural_name') }}"
    config:
      tags:
      - direct_identifier
  - name: email
    data_type: character varying(255)
    description: "{{ doc('patients__email') }}"
    config:
      tags:
      - direct_identifier
  - name: sex
    data_type: character varying(255)
    description: "{{ doc('patients__sex') }}"
    config:
      tags:
      - quasi_identifier
  - name: date_of_birth
    data_type: date
    description: "{{ doc('patients__date_of_birth') }}"
    config:
      tags:
      - quasi_identifier
  - name: date_of_death
    data_type: timestamp
    description: "{{ doc('patients__date_of_death') }}"
    config:
      tags:
      - quasi_identifier
  - name: village_id
    data_type: character varying(255)
    description: "{{ doc('patients__village_id') }}"
    config:
      tags:
      - quasi_identifier
  - name: registration_date
    data_type: date
    description: "{{ doc('generic__created_at') }} in patients which is used as a best estimate of registration date."
