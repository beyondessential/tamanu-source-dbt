version: 2

models:
  - name: discharges_change_logs
    description: "Change logs for {{ doc('table__discharges') }}"
    config:
      tags:
        - clinical
        - log
    meta:
      owner: bes-maui
      domain: clinical
      pii: false
      classification: restricted
    columns:
      - name: change_id
        data_type: uuid
        description: "{{ doc('logs__changes__id') }}"

      - name: discharge_id
        data_type: text
        description: "{{ doc('logs__changes__record_id') }} in discharges."

      - name: encounter_id
        data_type: text
        description: "{{ doc('discharges__encounter_id') }} Sourced from the discharges table."

      - name: changed_datetime
        data_type: timestamp
        description: "{{ doc('discharges_change_logs__changed_datetime') }}"

      - name: changed_by_user_id
        data_type: text
        description: "{{ doc('discharges_change_logs__changed_by_user_id') }}"

      - name: note
        data_type: text
        description: "{{ doc('discharges__note') }} From history."

      - name: discharger_id
        data_type: text
        description: "{{ doc('discharges__discharger_id') }} From history."

      - name: disposition_id
        data_type: text
        description: "{{ doc('discharges__disposition_id') }} From history."

      - name: change_sequence
        data_type: integer
        description: "{{ doc('discharges_change_logs__change_sequence') }}"
