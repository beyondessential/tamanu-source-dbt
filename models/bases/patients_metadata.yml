version: 2
models:
  - name: patients_metadata
    description: "{{ doc('generic__metadata') }} for patients."
    config:
      tags:
        - patient
        - log
    meta:
      owner: bes-maui
      domain: clinical
      tier: silver
      pii: true
      classification: restricted
    columns:
      - name: id
        data_type: character varying(255)
        description: "{{ doc('generic__id') }} in patients."
      - name: created_datetime
        data_type: timestamp
        description: "{{ doc('generic__created_at') }} in the patients table."
      - name: updated_datetime
        data_type: timestamp
        description: "{{ doc('generic__updated_at') }} in the patients table."
      - name: deleted_datetime
        data_type: timestamp
        description: "{{ doc('generic__deleted_at') }} in the patients table, from its latest logged change. NULL when the record is not deleted, or was restored."
