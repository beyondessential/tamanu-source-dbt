version: 2
models:
  - name: logs_changes_patient_additional_data
    description: 'Historical changes to patient additional data extracted from the changes log table. Contains records for version >= 2.33 where the schema in record_data is available.'
    config:
      contract:
        enforced: true
      tags:
        - patient
        - history
    columns:
      - name: changelog_id
        data_type: uuid
        description: "{{ doc('logs__changes__id') }}"
      - name: logged_at
        data_type: timestamp
        description: "{{ doc('logs__changes__logged_at') }} in patient additional data history."
      - name: updated_by_user_id
        data_type: text
        description: "{{ doc('logs__changes__updated_by_user_id') }} in patient additional data history."
      - name: patient_id
        data_type: text
        description: "{{ doc('generic__id') }} in patient_additional_data from history."
      - name: title
        data_type: text
        description: "{{ doc('patient_additional_data__title') }} from history."
      - name: marital_status
        data_type: text
        description: "{{ doc('patient_additional_data__marital_status') }} from history."
      - name: primary_contact_number
        data_type: text
        description: "{{ doc('patient_additional_data__primary_contact_number') }} from history."
      - name: secondary_contact_number
        data_type: text
        description: "{{ doc('patient_additional_data__secondary_contact_number') }} from history."
      - name: emergency_contact_name
        data_type: text
        description: "{{ doc('patient_additional_data__emergency_contact_name') }} from history."
      - name: emergency_contact_number
        data_type: text
        description: "{{ doc('patient_additional_data__emergency_contact_number') }} from history."
      - name: social_media
        data_type: text
        description: "{{ doc('patient_additional_data__social_media') }} from history."
      - name: ethnicity_id
        data_type: text
        description: "{{ doc('patient_additional_data__ethnicity_id') }} from history."
