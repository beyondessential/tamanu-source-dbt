        description: "{{ doc('patient_additional_data__nationality_id') }} from history."
      - name: secondary_village_id
        data_type: text
        description: "{{ doc('patient_additional_data__secondary_village_id') }} from history."
      - name: country_id
        data_type: text
        description: "{{ doc('patient_additional_data__country_id') }} from history."
      - name: division_id
        data_type: text
        description: "{{ doc('patient_additional_data__division_id') }} from history."
      - name: subdivision_id
        data_type: text
        description: "{{ doc('patient_additional_data__subdivision_id') }} from history."
