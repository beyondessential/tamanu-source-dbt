      - name: settlement_id
        data_type: text
        description: "{{ doc('patient_additional_data__settlement_id') }} from history."
      - name: city_town
        data_type: text
        description: "{{ doc('patient_additional_data__city_town') }} from history."
      - name: street_village
        data_type: text
        description: "{{ doc('patient_additional_data__street_village') }} from history."
      - name: country_of_birth_id
        data_type: text
        description: "{{ doc('patient_additional_data__country_of_birth_id') }} from history."
      - name: place_of_birth
        data_type: text
        description: "{{ doc('patient_additional_data__place_of_birth') }} from history."
      - name: birth_certificate
        data_type: text
        description: "{{ doc('patient_additional_data__birth_certificate') }} from history."
