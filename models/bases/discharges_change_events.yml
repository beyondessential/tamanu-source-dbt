version: 2

models:
  - name: discharges_change_events
    description: >
      Thin projection of discharge rows in the change log, carrying the source filters but no
      window functions, so consumers can filter it with predicate pushdown. The windowed
      reconstruction of change_sequence sits downstream in discharges_change_log_events().
    config:
      tags:
        - clinical
        - log
    meta:
      owner: bes-maui
      domain: clinical
      pii: false
      classification: restricted
    columns:
      - name: changelog_id
        data_type: uuid
        description: "{{ doc('logs__changes__id') }}"

      - name: discharge_id
        data_type: text
        description: "{{ doc('logs__changes__record_id') }} in discharges."

      - name: encounter_id
        data_type: text
        description: "{{ doc('discharges__encounter_id') }} Sourced from the discharges table."

      - name: logged_at
        data_type: timestamp
        description: "{{ doc('logs__changes__logged_at') }} In the deployment's local time."

      - name: record_updated_at
        data_type: timestamp
        description: "{{ doc('logs__changes__record_updated_at') }} In the deployment's local time."

      - name: logged_at_utc
        data_type: timestamp
        description: "{{ doc('logs__changes__logged_at_utc') }}"

      - name: record_updated_at_utc
        data_type: timestamp
        description: "{{ doc('logs__changes__record_updated_at_utc') }}"

      - name: updated_by_user_id
        data_type: text
        description: "{{ doc('logs__changes__updated_by_user_id') }}"

      - name: record_data
        data_type: jsonb
        description: "{{ doc('logs__changes__record_data') }}"
