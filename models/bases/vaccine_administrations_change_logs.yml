version: 2
models:
  - name: vaccine_administrations_change_logs
    description: Historical changes to vaccine administrations extracted from the changes log table.
    config:
      contract:
        enforced: true
      tags:
        - clinical
        - history
    columns:
      - name: changelog_id
        data_type: uuid
        description: "{{ doc('logs__changes__id') }}"
      - name: logged_at
        data_type: timestamp
        description: "{{ doc('logs__changes__logged_at') }} in vaccine administrations history."
      - name: created_at
        data_type: timestamp
        description: "{{ doc('generic__created_at') }} in vaccine_administrations from history."
      - name: updated_at
        data_type: timestamp
        description: "{{ doc('generic__updated_at') }} in vaccine_administrations from history."
      - name: updated_by_user_id
        data_type: text
        description: "{{ doc('logs__changes__updated_by_user_id') }} in vaccine administrations history."
      - name: id
        data_type: text
        description: "{{ doc('generic__id') }} in vaccine_administrations from history."
      - name: datetime
        data_type: text
        description: "{{ doc('generic__date') }} in vaccine_administrations from history."
      - name: batch
        data_type: text
        description: "{{ doc('administered_vaccines__batch') }} from history."
      - name: is_consented
        data_type: text
        description: "{{ doc('administered_vaccines__consent') }} from history."
