unit_tests:
  - name: test_metric__emergency_care_attendance_filters
    model: metric__emergency_care
    description: >
      Behavioural coverage for the clauses the structural tests cannot reach. BL-003: an
      attendance is the intake segment only, and only when its OMOP visit concept is
      9203 -- a later segment and a non-ED intake are both excluded. BL-005: the admitted
      count follows visit-level concept 262, not the attendance itself. BL-002: the
      incomplete current month is excluded. The current-month row is built from
      current_date in SQL rather than pinned, since the model reads the session date.

    given:
      # vd_admitted + vd_not_admitted share (month, facility, sex, age band) so they
      # aggregate into one group: 2 attendances, 1 of them admitted.
      - input: ref('clinical__visit_detail')
        format: sql
        rows: |
          select 'vo_admitted' as visit_occurrence_id, 'per_1' as person_id, 'loc_1' as care_site_id, '2024-05-15'::date as visit_detail_start_date, null::text as preceding_visit_detail_id, 9203 as visit_detail_concept_id
          union all
          select 'vo_not_admitted', 'per_1', 'loc_1', '2024-05-20'::date, null::text, 9203
          union all
          -- BL-003: a later segment of an ED encounter is not a second attendance
          select 'vo_later_segment', 'per_1', 'loc_1', '2024-05-21'::date, 'vd_earlier', 9203
          union all
          -- BL-003: an intake segment that is not an ED visit
          select 'vo_not_ed', 'per_1', 'loc_1', '2024-05-22'::date, null::text, 9201
          union all
          -- BL-002: an ED attendance in the incomplete current month
          select 'vo_current_month', 'per_1', 'loc_1', date_trunc('month', current_date)::date, null::text, 9203

      - input: ref('clinical__visit_occurrence')
        format: sql
        rows: |
          select 'vo_admitted' as visit_occurrence_id, 262 as visit_concept_id
          union all
          select 'vo_not_admitted', 9203
          union all
          select 'vo_later_segment', 262
          union all
          select 'vo_not_ed', 9201
          union all
          select 'vo_current_month', 262

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'per_1' as person_id, 'female' as gender_source_value, 1984 as year_of_birth, 5 as month_of_birth, 15 as day_of_birth

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_1' as id, 'fac_1' as facility_id

    expect:
      format: sql
      rows: |
        select 'ed_attendance' as metric_id, null::text as variant_id, null::varchar as subject_id, '2024-05-01'::date as period_start, '2024-05-31'::date as period_end, 'month'::text as period_granularity, 2::numeric as value_numeric, null::boolean as value_boolean, 'fac_1' as facility_id, 'female' as sex, '25-44 years' as age_group__who_primary_classification
        union all
        select 'ed_attendance_admitted', null::text, null::varchar, '2024-05-01'::date, '2024-05-31'::date, 'month'::text, 1::numeric, null::boolean, 'fac_1', 'Not available', 'female', '25-44 years'
