unit_tests:
  - name: test_ds__lab_requests_sensitive_facilities
    model: ds__lab_requests
    description: >
      A lab request at a sensitive facility must be excluded from the standard dataset
      even when the individual lab test type it contains is not itself marked sensitive.
      A lab request at a non-sensitive facility must be included even when its test type
      is marked sensitive -- the partition is facility-only.
    given:
      - input: ref('lab_requests')
        format: sql
        rows: |
          select 'lr_001' as id, 'LR001' as display_id, 'published' as status, '2024-05-15 10:00:00'::timestamp as requested_datetime, null::text as lab_test_priority_id, null::text as lab_test_category_id, null::text as lab_test_panel_request_id, null::text as lab_test_laboratory_id, null::text as requested_by_id, null::text as specimen_type_id, null::text as lab_sample_site_id, null::timestamp as collected_datetime, null::text as collected_by_id, null::text as reason_for_cancellation, 'enc_001' as encounter_id, null::text as department_id
          union all
          select 'lr_002', 'LR002', 'published', '2024-05-16 14:00:00'::timestamp, null::text, null::text, null::text, null::text, null::text, null::text, null::text, null::timestamp, null::text, null::text, 'enc_002', null::text

      - input: ref('lab_tests')
        format: sql
        rows: |
          select 'lt_001' as id, 'lr_001' as lab_request_id, 'ltt_001' as lab_test_type_id, null::timestamp as completed_datetime
          union all
          select 'lt_002', 'lr_002', 'ltt_002', null::timestamp

      - input: ref('lab_test_types')
        format: sql
        rows: |
          select 'ltt_001' as id, 'Full Blood Count' as name, true as is_sensitive
          union all
          select 'ltt_002', 'HIV Test', false

      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_001' as id, 'pat_001' as patient_id, 'loc_001' as location_id, null::text as department_id
          union all
          select 'enc_002', 'pat_001', 'loc_002', null::text

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-05-15'::date as date_of_birth, 'male' as sex, null::text as village_id

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'Room 101' as name, 'fac_001' as facility_id, null::text as location_group_id
          union all
          select 'loc_002', 'Room 201', 'fac_002', null::text

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'Central Hospital' as name, false as is_sensitive
          union all
          select 'fac_002', 'Psychiatric Hospital', true

      - input: ref('location_groups')
        format: sql
        rows: |
          select null::text as id, null::text as name
          where false

      - input: ref('departments')
        format: sql
        rows: |
          select null::text as id, null::text as name
          where false

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as name, null::text as code
          where false

      - input: ref('users')
        format: sql
        rows: |
          select null::text as id, null::text as display_name
          where false

      - input: ref('lab_test_panel_requests')
        format: sql
        rows: |
          select null::text as id, null::text as lab_test_panel_id, null::text as encounter_id
          where false

      - input: ref('lab_test_panels')
        format: sql
        rows: |
          select null::text as id, null::text as name
          where false

    expect:
      format: sql
      rows: |
        select 'pat_001' as patient_id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-05-15'::date as date_of_birth, 34 as age, 'male' as sex, null::text as village_id, null::text as village, 'fac_001' as facility_id, 'Central Hospital' as facility, null::text as department, null::text as department_id, 'loc_001' as location_id, 'Room 101' as location, null::text as location_group_id, null::text as location_group, null::text as laboratory_id, null::text as laboratory, 'LR001' as request_id, 'Published' as status, 'published' as status_id, '2024-05-15 10:00:00'::timestamp as requested_datetime, null::text as requested_by_id, null::text as requested_by, null::text as requesting_department_id, null::text as requesting_department, null::text as priority_id, null::text as priority, null::text as lab_test_category_id, null::text as lab_test_category, null::text as lab_test_panel, 'Full Blood Count' as tests, null::timestamp as collected_datetime, null::text as collected_by_id, null::text as collected_by, null::text as specimen_type_id, null::text as specimen_type, null::text as site, null::timestamp as completed_datetime, null::text as reason_for_cancellation

