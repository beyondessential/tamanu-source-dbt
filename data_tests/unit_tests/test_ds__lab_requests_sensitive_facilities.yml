    expect:
      format: sql
      rows: |
        select 'pat_001' as patient_id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-05-15'::date as date_of_birth, 34 as age, 'male' as sex, null::text as village_id, null::text as village, 'fac_002' as facility_id, 'Psychiatric Hospital' as facility, null::text as department, null::text as department_id, 'loc_002' as location_id, 'Room 201' as location, null::text as location_group_id, null::text as location_group, null::text as laboratory_id, null::text as laboratory, 'LR002' as request_id, 'Published' as status, 'published' as status_id, '2024-05-16 14:00:00'::timestamp as requested_datetime, null::text as requested_by_id, null::text as requested_by, null::text as requesting_department_id, null::text as requesting_department, null::text as priority_id, null::text as priority, null::text as lab_test_category_id, null::text as lab_test_category, null::text as lab_test_panel, 'HIV Test' as tests, null::timestamp as collected_datetime, null::text as collected_by_id, null::text as collected_by, null::text as specimen_type_id, null::text as specimen_type, null::text as site, null::timestamp as completed_datetime, null::text as reason_for_cancellation
