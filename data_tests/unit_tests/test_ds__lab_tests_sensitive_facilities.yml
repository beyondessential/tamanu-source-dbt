      - input: ref('lab_test_panels')
        format: sql
        rows: |
          select null::text as id, null::text as name
          where false

    expect:
      format: sql
      rows: |
        select 'pat_001' as patient_id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-05-15'::date as date_of_birth, 34 as age, 'male' as sex, null::text as village_id, null::text as village, 'fac_002' as facility_id, 'Psychiatric Hospital' as facility, null::text as department_id, null::text as department, null::text as requesting_department_id, null::text as requesting_department, null::text as location_group_id, null::text as location_group, 'loc_002' as location_id, 'Room 201' as location, 'LR002' as lab_request_id, 'published' as status_id, 'Published' as status, null::text as lab_test_panel_id, null::text as lab_test_panel, null::text as lab_test_category_id, null::text as lab_test_category, '2024-05-16 14:00:00'::timestamp as requested_datetime, null::text as requested_by_id, null::text as requested_by, null::timestamp as lab_request_published_datetime, '2024-05-16'::date as lab_test_date, 'Reactive' as result, 'verified' as verification, 'ltt_002' as lab_test_type_id, 'HIV Test' as lab_test_type, '2024-05-16 15:00:00'::timestamp as lab_test_completed_datetime
