unit_tests:
  - name: ac_005_metric__encounter_attribution
    model: metric__encounter
    description: >
      BL-001, BL-003 -- BL-005. e1 arrived through the emergency department and was admitted, so
      its record now reads admission, the ward at fac2, Medical and Dr Ben -- one row with those
      values. e2 is a clinic encounter with no clinician recorded, read as 'Not recorded'. e3 is
      a survey-response encounter with no department, counted with department 'Not recorded'.
      e4's location does not resolve, so it is excluded.
    given:
      - input: ref('clinical__visit_occurrence')
        format: sql
        rows: |
          select 'e1' as visit_occurrence_id, 'p1' as person_id, '2026-01-10'::date as visit_start_date, 'admission' as visit_source_value, 'u2' as provider_id, 'loc_ward' as care_site_id, 'dept_med' as department_id
          union all
          select 'e2', 'p1', '2026-01-11'::date, 'clinic', null::text, 'loc_clinic', 'dept_opd'
          union all
          select 'e3', 'p1', '2026-01-12'::date, 'surveyResponse', 'u1', 'loc_clinic', null::text
          union all
          select 'e4', 'p1', '2026-01-13'::date, 'clinic', 'u1', 'loc_missing', 'dept_opd'

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'p1' as person_id, 'female' as gender_source_value, 1980 as year_of_birth, 1 as month_of_birth, 20 as day_of_birth

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_ward' as id, 'fac2' as facility_id
          union all
          select 'loc_clinic', 'fac1'

      - input: ref('ref__provider')
        format: sql
        rows: |
          select 'u1' as provider_id, 'Dr Ana' as provider_name
          union all
          select 'u2', 'Dr Ben'

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_med' as id, 'Medical' as name
          union all
          select 'dept_opd', 'General OPD'

    expect:
      format: sql
      rows: |
        select 'encounter' as metric_id, null::text as variant_id, 'e1' as subject_id, '2026-01-10'::date as period_start, null::date as period_end, 'day' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac2' as facility_id, 'admission' as encounter_type, 'Medical' as department, 'Dr Ben' as clinician, 'female' as sex, 45 as age_years
        union all
        select 'encounter', null::text, 'e2', '2026-01-11'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'clinic', 'General OPD', 'Not recorded', 'female', 45
        union all
        select 'encounter', null::text, 'e3', '2026-01-12'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'surveyResponse', 'Not recorded', 'Dr Ana', 'female', 45
