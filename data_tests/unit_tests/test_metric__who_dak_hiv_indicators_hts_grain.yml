unit_tests:
  - name: test_metric__who_dak_hiv_indicators_hts_grain
    model: metric__who_dak_hiv_indicators
    description: >
      BL-007, BL-010, BL-028, HTS.2 and HTS.3. Annex C counts tests for HTS.2 and clients
      for HTS.3, so the same submissions have to produce different totals: a client tested
      twice in a month is two tests and one client, and the client rows carry the facility
      of the earlier test (fac_001), not the later one.

      pat_c is positive and diagnosed in the period but has no results-returned date. A
      numerator has to be a subset of its denominator or the positivity rate it feeds can
      exceed 100%, so that client is in neither.
    given:
      - input: ref('int__who_dak_hiv_form_answers')
        format: sql
        rows: |
          select 'resp_a1' as response_id, 'pat_a' as patient_id, 'fac_001' as facility_id, 'htsvisit' as survey_code, '2026-06-05 09:00:00'::timestamp as submitted_datetime, 'female' as sex, 1996 as year_of_birth, 1 as month_of_birth, 1 as day_of_birth, null::text as hiv_status, 'HIV-positive' as hiv_test_result, null::text as viral_load_reason, null::text as art_stopped_reason, null::text as regimen_substitution_reason, null::text as key_population_hts_json, null::text as key_population_pmtct_json, '2026-06-05'::date as hiv_test_date, '2026-06-05'::date as hiv_test_result_returned_date, null::date as hiv_diagnosis_date, null::date as art_start_date, null::date as baseline_cd4_test_date, null::date as viral_load_sample_date, null::date as dsd_eligibility_assessed_date, null::date as dsd_start_date, null::date as art_stopped_date, null::date as substitution_first_line_date, null::date as substitution_second_line_date, null::date as substitution_third_line_date, null::numeric as baseline_cd4_count, null::numeric as viral_load_result, null::boolean as on_art, null::boolean as dsd_eligible, null::boolean as dsd_enrolled
          union all
          select 'resp_a2', 'pat_a', 'fac_002', 'htsvisit', '2026-06-20 09:00:00'::timestamp, 'female', 1996, 1, 1, null::text, 'HIV-positive', null::text, null::text, null::text, null::text, null::text, '2026-06-20'::date, '2026-06-20'::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::numeric, null::numeric, null::boolean, null::boolean, null::boolean
          union all
          select 'resp_b', 'pat_b', 'fac_001', 'htsvisit', '2026-06-07 09:00:00'::timestamp, 'male', 2000, 1, 1, null::text, 'HIV-negative', null::text, null::text, null::text, null::text, null::text, '2026-06-07'::date, '2026-06-07'::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::numeric, null::numeric, null::boolean, null::boolean, null::boolean
          union all
          select 'resp_c', 'pat_c', 'fac_001', 'htsvisit', '2026-06-09 09:00:00'::timestamp, 'male', 2000, 1, 1, null::text, 'HIV-positive', null::text, null::text, null::text, null::text, null::text, '2026-06-09'::date, null::date, '2026-06-09'::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::date, null::numeric, null::numeric, null::boolean, null::boolean, null::boolean

      - input: ref('int__who_dak_hiv_client_month_state')
        format: sql
        rows: |
          select null::date as month_start, null::date as month_end, null::text as patient_id, null::text as facility_id, null::boolean as on_art, null::boolean as on_art_recorded, null::date as art_stopped_date, null::date as art_start_date, null::boolean as dsd_enrolled, null::date as dsd_start_date, null::int as months_on_art, null::int as months_on_dsd, null::text as sex, null::int as age_years where false

      - input: ref('int__who_dak_hiv_key_populations')
        format: sql
        rows: |
          select null::text as patient_id, null::text as key_population where false

    expect:
      format: sql
      rows: |
        select 'who_dak_hiv_hts_test' as metric_id, null::text as variant_id, 'resp_a1' as subject_id, 'test' as subject_grain, '2026-06-01'::date as period_start, '2026-06-30'::date as period_end, 'month' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac_001' as facility_id, 'female' as sex, 30 as age_years, null::int as months_on_dsd, null::text as key_population
        union all
        select 'who_dak_hiv_hts_test', null::text, 'resp_a2', 'test', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_002', 'female', 30, null::int, null::text
        union all
        select 'who_dak_hiv_hts_test', null::text, 'resp_b', 'test', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'male', 26, null::int, null::text
        union all
        select 'who_dak_hiv_hts_test_positive', null::text, 'resp_a1', 'test', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'female', 30, null::int, null::text
        union all
        select 'who_dak_hiv_hts_test_positive', null::text, 'resp_a2', 'test', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_002', 'female', 30, null::int, null::text
        union all
        select 'who_dak_hiv_hts_client_positive', null::text, 'pat_a', 'patient', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'female', 30, null::int, null::text
        union all
        select 'who_dak_hiv_hts_client_tested', null::text, 'pat_a', 'patient', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'female', 30, null::int, null::text
        union all
        select 'who_dak_hiv_hts_client_tested', null::text, 'pat_b', 'patient', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'male', 26, null::int, null::text
