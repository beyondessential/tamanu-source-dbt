unit_tests:
  - name: ac_018_metric__emergency_stay_projection
    model: metric__emergency_stay
    description: >
      The D5 projection over the shared attendance base. BL-002: period_start is arrival in
      the ED and period_end is departure from the ED -- the internal transfer to an inpatient
      bed for an admitted patient, so it is earlier than the encounter end that
      metric__emergency_visit uses -- at 'minute' granularity, and period_end stays NULL
      while the patient is still in the ED. BL-015: the band is time in the ED, not total
      length of stay. BL-017: discharge_disposition is carried through unchanged. The inclusion
      rule and the derived timings are covered by ac_009_int__emergency_visits_derivations
      against int__emergency_visits.

    given:
      # ed_1 is the admitted case: it leaves the ED at 11:45 while its encounter runs to the
      # next day, so this model's period_end is 11:45 where metric__emergency_visit's is
      # the encounter end. Its time in the ED is under four hours even though its total length
      # of stay is not -- the two bands genuinely differ.
      - input: ref('int__emergency_visits')
        format: sql
        rows: |
          select 'ed_1' as visit_occurrence_id, '2024-05-15 08:30'::timestamp as ed_start__datetime, '2024-05-15 11:45'::timestamp as ed_end__datetime, 'fac_1' as facility_id, 'female' as sex, 40 as age_years, '1' as triage_score, 195.00::numeric as ed_time__minutes, 'Home' as discharge_disposition
          union all
          -- still in the ED: no departure, so the band is Unknown
          select 'ed_2', '2024-05-18 06:05'::timestamp, null::timestamp, 'fac_1', 'male', 30, 'Not recorded', null::numeric, 'Not recorded'

    expect:
      format: sql
      rows: |
        select 'ed_stay' as metric_id, null::text as variant_id, 'ed_1'::varchar as subject_id, '2024-05-15 08:30'::timestamp as period_start, '2024-05-15 11:45'::timestamp as period_end, 'minute'::text as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac_1' as facility_id, 'female' as sex, 40 as age_years, '1' as triage_score, 195.00::numeric as ed_time__minutes, 'Home' as discharge_disposition
        union all
        select 'ed_stay', null::text, 'ed_2'::varchar, '2024-05-18 06:05'::timestamp, null::timestamp, 'minute'::text, 1::numeric, null::boolean, 'fac_1', 'male', 30, 'Not recorded', null::numeric, 'Not recorded'
