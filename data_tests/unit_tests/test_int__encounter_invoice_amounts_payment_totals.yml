unit_tests:
  - name: test_int__encounter_invoice_amounts_payment_totals
    model: int__encounter_invoice_amounts
    description: >
      invoice_total sums discounted item totals. insurance_coverage applies
      plan coverage percentages to insurable items (60% default_coverage on a
      $100 total = $60). patient_payment nets payments minus refunds.
    given:
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_001' as id, '2024-01-14 09:00:00'::timestamp as start_datetime, '2024-01-15 11:00:00'::timestamp as end_datetime, 'pat_001' as patient_id, 'loc_001' as location_id, 'dept_001' as department_id, null::text as clinician_id, null::text as patient_billing_type_id

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'fac_001' as facility_id

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'General Hospital' as name, false as is_sensitive

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-01-01'::date as date_of_birth, 'male' as sex

      - input: ref('patient_additional_data')
        format: sql
        rows: |
          select null::text as patient_id, null::text as patient_billing_type_id where false

      - input: ref('invoices')
        format: sql
        rows: |
          select '00000000-0000-0000-0000-000000000001' as id, 'enc_001' as encounter_id, 'in_progress' as status, '2024-01-14 09:00:00'::timestamp as datetime, 'INV' as display_id

      - input: ref('invoices_change_logs')
        format: sql
        rows: |
          select null::text as invoice_id, null::timestamptz as logged_at, null::text as status, null::text as previous_status where false

      - input: ref('invoice_items')
        format: sql
        rows: |
          -- Two items: 30 * 2 = 60, 40 * 1 = 40, total = 100. Product is insurable with 60% coverage.
          select 'item_001'::text as id, '00000000-0000-0000-0000-000000000001' as invoice_id, 'Consultation A' as product_name_final, '2024-01-14'::date as date, 'prod_001' as product_id, 30.00::numeric as price_final, null::numeric as manual_entry_price, 2::integer as quantity, null::text as source_record_type, null::text as source_record_id
          union all
          select 'item_002'::text, '00000000-0000-0000-0000-000000000001', 'Consultation B', '2024-01-15'::date, 'prod_001', 40.00::numeric, null::numeric, 1::integer, null::text, null::text

      - input: ref('invoice_products')
        format: sql
        rows: |
          select 'prod_001' as id, 'Consultation' as category, true as insurable, null::text as name

      - input: ref('invoice_payments')
        format: sql
        rows: |
          select '00000000-0000-0000-0000-000000000011'::text as id, '00000000-0000-0000-0000-000000000001'::text as invoice_id, 25.00::numeric as amount, null::text as original_payment_id

      - input: ref('invoice_insurer_payments')
        format: sql
        rows: |
          select null::text as id, null::text as invoice_payment_id where false

      - input: ref('invoice_patient_payments')
        format: sql
        rows: |
          select '00000000-0000-0000-0000-000000000021'::text as id, '00000000-0000-0000-0000-000000000011'::text as invoice_payment_id

      - input: ref('invoice_item_finalised_insurances')
        format: sql
        rows: |
          select null::text as invoice_item_id, null::text as invoice_insurance_plan_id, null::numeric as coverage_value_final where false

      - input: ref('invoices_invoice_insurance_plans')
        format: sql
        rows: |
          -- Invoice linked to plan_001
          select 'iiip_001' as id, '00000000-0000-0000-0000-000000000001'::text as invoice_id, 'plan_001' as invoice_insurance_plan_id

      - input: ref('invoice_insurance_plan_items')
        format: sql
        rows: |
          select null::text as invoice_insurance_plan_id, null::text as invoice_product_id, null::numeric as coverage_value where false

      - input: ref('invoice_insurance_plans')
        format: sql
        rows: |
          -- Plan with 60% default coverage: item_001 = 60 * 0.6 = 36, item_002 = 40 * 0.6 = 24, total = 60
          select 'plan_001' as id, 60::numeric as default_coverage

      - input: ref('invoice_item_discounts')
        format: sql
        rows: |
          select null::text as invoice_item_id, null::numeric as amount, null::text as type, null::text as id where false

      - input: ref('invoice_discounts')
        format: sql
        rows: |
          select null::text as invoice_id, null::numeric as percentage, null::timestamp as applied_time, null::text as id where false

      - input: ref('invoice_price_lists')
        format: sql
        rows: |
          select null::text as id, null::text as code, null::jsonb as rules, null::integer as evaluation_order, null::timestamp as created_at, null::text as visibility_status where false

      - input: ref('invoice_price_list_items')
        format: sql
        rows: |
          select null::text as invoice_price_list_id, null::text as invoice_product_id, null::numeric as price, null::boolean as is_hidden where false

    expect:
      format: sql
      rows: |
        select
          '00000000-0000-0000-0000-000000000001' as invoice_id,
          'enc_001' as encounter_id,
          'in_progress' as status,
          '2024-01-14 09:00:00'::timestamp as invoice_datetime,
          null::timestamp as invoice_finalised_datetime,
          100.00::numeric as invoice_total,
          60.00::numeric as insurance_coverage,
          0.00::numeric as invoice_discount,
          25.00::numeric as patient_payment,
          null::numeric as insurer_payment,
          null::text as products_no_category,
          'INV' as display_id
