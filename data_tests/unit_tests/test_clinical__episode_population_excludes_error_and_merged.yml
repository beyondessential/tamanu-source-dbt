unit_tests:
  - name: test_clinical__episode_population_excludes_error_and_merged
    model: clinical__episode
    description: >
      BL-001, BL-002, AC-010, AC-012. The modelled population is the enrolments belonging to
      a patient bases/patients carries and not recorded in error. Three registrations go in:
      a valid one, one recorded in error, and one left stranded on a patient merged away -- a
      registration id embeds its patient id, so a merge cannot repoint it. Only the valid one
      comes out, which is what keeps every person_id answerable in clinical__person.
    given:
      - input: ref('patient_program_registrations')
        format: sql
        rows: |
          select 'pat_001;preg_001' as id, '2024-01-10 09:00:00'::timestamp as datetime, 'active' as registration_status, 'pat_001' as patient_id, 'preg_001' as program_registry_id, null::text as clinical_status_id, 'usr_001' as registered_by_id, 'fac_001' as registering_facility_id, 'fac_001' as facility_id, null::text as village_id, null::text as deactivated_by_id, null::timestamp as deactivated_datetime
          union all
          select 'pat_002;preg_001', '2024-02-11 09:00:00'::timestamp, 'recordedInError', 'pat_002', 'preg_001', null::text, 'usr_001', 'fac_001', 'fac_001', null::text, null::text, null::timestamp
          union all
          select 'pat_003;preg_001', '2024-03-12 09:00:00'::timestamp, 'active', 'pat_003', 'preg_001', null::text, 'usr_001', 'fac_001', 'fac_001', null::text, null::text, null::timestamp

      - input: ref('int__registration_status_history')
        format: sql
        rows: |
          select null::text as episode_id, null::timestamp as logged_at, null::text as registration_status, null::text as history_source
          where false

      - input: ref('program_registries')
        format: sql
        rows: |
          select 'preg_001' as id, 'HIV' as code, 'HIV Program' as name, 'facility' as currently_at_type, 'prog_001' as program_id

      - input: ref('program_registry_clinical_statuses')
        format: sql
        rows: |
          select null::text as id, null::text as code, null::text as name
          where false

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'Central Hospital' as name

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as name
          where false

      # pat_002 exists but its enrolment is recorded in error; pat_003 is absent, standing
      # for a record merged away -- bases/patients drops visibility_status = 'merged'
      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id
          union all
          select 'pat_002'

    expect:
      format: sql
      rows: |
        select 'pat_001;preg_001' as episode_id, 'pat_001' as person_id, null::int as episode_concept_id, null::int as episode_object_concept_id, '2024-01-10'::date as episode_start_date, '2024-01-10 09:00:00'::timestamp as episode_start_datetime, null::date as episode_end_date, null::timestamp as episode_end_datetime, null::text as episode_end_source, 'program registry' as episode_type_source_value, 'HIV' as episode_source_value, 'HIV Program' as episode_source_name, 'preg_001' as program_registry_id, 'prog_001' as program_id, null::text as episode_parent_id, null::int as episode_number, 'active' as registration_status, null::text as clinical_status_id, null::text as clinical_status_source_value, null::text as clinical_status_source_name, 'facility' as currently_at_type, 'fac_001' as currently_at_id, 'Central Hospital' as currently_at_name, 'fac_001' as care_site_id, 'usr_001' as provider_id, null::timestamp as deactivated_datetime, null::text as deactivated_by_provider_id
