unit_tests:
  - name: test_clinical__episode_excludes_recorded_in_error
    model: clinical__episode
    description: >
      BL-002, AC-012. An enrolment recorded in error is a data-entry mistake rather than a
      clinical fact, so it gets no episode. It stays in int__program_enrolments, because
      ds__patient_program_registrations lists it for the removed-patients report and always has
      (BL-025, BL-026) -- this model is where the clinical population is drawn from the wider
      one. The merged-patient exclusion happens upstream, in the intermediate.
    given:
      - input: ref('int__program_enrolments')
        format: sql
        rows: |
          select 'pat_001;preg_001' as enrolment_id, 'pat_001' as person_id, '2024-01-10 09:00:00'::timestamp as enrolment_datetime, 'active' as registration_status, null::timestamp as deactivated_datetime, null::text as deactivated_by_id, 'preg_001' as program_registry_id, 'HIV' as registry_code, 'HIV Program' as registry_name, 'prog_001' as program_id, 'stat_001' as clinical_status_id, 'ON_ART' as clinical_status_code, 'On ART' as clinical_status_name, 'facility' as currently_at_type, 'fac_001' as currently_at_id, 'Central Hospital' as currently_at_name, 'fac_001' as registering_facility_id, 'usr_001' as registered_by_id
          union all
          select 'pat_002;preg_001', 'pat_002', '2024-02-11 09:00:00'::timestamp, 'recordedInError', null::timestamp, null::text, 'preg_001', 'HIV', 'HIV Program', 'prog_001', null::text, null::text, null::text, 'facility', 'fac_001', 'Central Hospital', 'fac_001', 'usr_001'

      - input: ref('int__registration_status_history')
        format: sql
        rows: |
          select null::text as episode_id, null::timestamp as logged_at, null::text as registration_status, null::text as history_source
          where false

    expect:
      format: sql
      rows: |
        select 'pat_001;preg_001' as episode_id, 'pat_001' as person_id, null::int as episode_concept_id, null::int as episode_object_concept_id, '2024-01-10'::date as episode_start_date, '2024-01-10 09:00:00'::timestamp as episode_start_datetime, null::date as episode_end_date, null::timestamp as episode_end_datetime, null::text as episode_end_source, 'program registry' as episode_type_source_value, 'HIV' as episode_source_value, 'HIV Program' as episode_source_name, 'preg_001' as program_registry_id, 'prog_001' as program_id, null::text as episode_parent_id, null::int as episode_number, 'active' as registration_status, 'stat_001' as clinical_status_id, 'ON_ART' as clinical_status_source_value, 'On ART' as clinical_status_source_name, 'facility' as currently_at_type, 'fac_001' as currently_at_id, 'Central Hospital' as currently_at_name, 'fac_001' as care_site_id, 'usr_001' as provider_id, null::timestamp as deactivated_datetime, null::text as deactivated_by_provider_id
