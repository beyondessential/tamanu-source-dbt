unit_tests:
  - name: test_encounter_invoice_audit_aggregation
    model: audit-encounter-invoice
    description: >
      Per-encounter aggregation across multiple invoices. enc_001 has two
      finalised invoices: totals, coverage, discount and payments sum; the
      finalised datetime is the latest; products concatenate; patient subtotal
      = total - coverage - discount and patient total subtracts payments.
      enc_002 has no invoices, so all invoice columns are null.
    given:
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_001' as id, '2024-01-14 09:00:00'::timestamp as start_datetime, '2024-01-15 11:00:00'::timestamp as end_datetime, 'pat_001' as patient_id, 'loc_001' as location_id, 'dept_001' as department_id, null::text as clinician_id, null::text as patient_billing_type_id, 'clinic' as encounter_type, null::text as reason_for_encounter
          union all
          select 'enc_002', '2024-01-20 09:00:00'::timestamp, '2024-01-20 16:00:00'::timestamp, 'pat_002', 'loc_001', 'dept_001', null::text, null::text, 'clinic', null::text
          union all
          -- BL-001: sensitive facility, must not appear in the standard variant
          select 'enc_003', '2024-01-18 09:00:00'::timestamp, '2024-01-18 17:00:00'::timestamp, 'pat_001', 'loc_002', 'dept_001', null::text, null::text, 'clinic', null::text
          union all
          -- BL-006: dangling location_id, dropped by the inner join to locations
          select 'enc_004', '2024-01-19 09:00:00'::timestamp, '2024-01-19 17:00:00'::timestamp, 'pat_002', 'loc_missing', 'dept_001', null::text, null::text, 'clinic', null::text

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'fac_001' as facility_id
          union all
          select 'loc_002', 'fac_002'

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'General Hospital' as name, false as is_sensitive
          union all
          select 'fac_002', 'Sensitive Clinic', true

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-01-01'::date as date_of_birth, 'male' as sex
          union all
          select 'pat_002', 'P002', 'Jane', 'Smith', '1985-06-15'::date, 'female'

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_001' as id, 'Medicine' as name

      - input: ref('users')
        format: sql
        rows: |
          select null::text as id, null::text as display_name where false

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as name where false

      - input: ref('ds__encounter_invoices')
        format: sql
        rows: |
          -- enc_001: two finalised invoices that aggregate together
          select '00000000-0000-0000-0000-000000000001' as invoice_id, 'enc_001' as encounter_id, 'finalised' as status, '2024-01-14 09:00:00'::timestamp as invoice_datetime, '2024-01-15 14:00:00'::timestamp as invoice_finalised_datetime, 100.00::numeric as invoice_total, 60.00::numeric as insurance_coverage, 0.00::numeric as invoice_discount, 25.00::numeric as patient_payment, null::text as products_no_category
          union all
          select '00000000-0000-0000-0000-000000000002', 'enc_001', 'finalised', '2024-01-16 09:00:00'::timestamp, '2024-01-16 12:00:00'::timestamp, 50.00::numeric, 10.00::numeric, 5.00::numeric, 0.00::numeric, 'Extra Item'

    expect:
      format: sql
      rows: |
        -- enc_002 sorts first (later start_datetime), no invoices
        select
          'P002' as "Patient ID",
          'Jane' as "First name",
          'Smith' as "Last name",
          '1985-06-15' as "Date of birth",
          38 as "Age",
          'female' as "Sex",
          null::text as "Billing type",
          '2024-01-20 09:00:00' as "Encounter start date and time",
          '2024-01-20 16:00:00' as "Encounter end date and time",
          1 as "Length of stay (days)",
          'General Hospital' as "Facility",
          'Medicine' as "Discharging department",
          null::text as "Supervising clinician",
          null::text as "Invoice finalised date and time",
          null::numeric as "Invoice total",
          null::numeric as "Insurance coverage",
          null::numeric as "Patient subtotal",
          null::numeric as "Patient payment",
          null::numeric as "Patient total",
          null::text as "Invoice products with no category"
        union all
        select
          'P001', 'John', 'Doe', '1990-01-01', 34, 'male',
          null::text,
          '2024-01-14 09:00:00', '2024-01-15 11:00:00', 1,
          'General Hospital', 'Medicine', null::text,
          '2024-01-16 12:00:00',
          150.00::numeric, 70.00::numeric, 75.00::numeric, 25.00::numeric, 50.00::numeric,
          'Extra Item'
