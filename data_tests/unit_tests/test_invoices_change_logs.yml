version: 2

unit_tests:
  - name: test_invoices_change_logs_window_functions
    model: invoices_change_logs
    description: >
      Verifies that previous_status (LAG) and change_sequence (ROW_NUMBER) are
      computed correctly across two change events for the same invoice, and that
      invoices belonging to the test patient are excluded.

      record_updated_at is in the ordering key, so it is given explicitly even
      though every row leaves it null.
    given:
      - input: source('logs__tamanu', 'changes')
        format: sql
        rows: |
          select
            '00000000-0000-0000-0000-000000000001'::uuid as id,
            '2025-01-10 09:00:00'::timestamp as logged_at,
            null::timestamp as record_updated_at,
            'user_001'::text as updated_by_user_id,
            '00000000-0000-0000-0000-000000000011'::text as record_id,
            'invoices'::text as table_name,
            null::timestamp as record_deleted_at,
            '{"status": "in_progress"}'::jsonb as record_data
          union all
          select '00000000-0000-0000-0000-000000000002'::uuid, '2025-01-15 14:00:00'::timestamp, null::timestamp, 'user_002'::text, '00000000-0000-0000-0000-000000000011'::text, 'invoices'::text, null::timestamp, '{"status": "finalised"}'::jsonb
          union all
          select '00000000-0000-0000-0000-000000000003'::uuid, '2025-01-12 10:00:00'::timestamp, null::timestamp, 'user_003'::text, '00000000-0000-0000-0000-000000000022'::text, 'invoices'::text, null::timestamp, '{"status": "in_progress"}'::jsonb
          union all
          select '00000000-0000-0000-0000-000000000004'::uuid, '2025-01-11 08:00:00'::timestamp, null::timestamp, 'user_004'::text, '00000000-0000-0000-0000-000000000033'::text, 'invoices'::text, null::timestamp, '{"status": "in_progress"}'::jsonb
          union all
          select '00000000-0000-0000-0000-000000000005'::uuid, '2025-01-13 09:00:00'::timestamp, null::timestamp, 'user_005'::text, '00000000-0000-0000-0000-000000000044'::text, 'invoices'::text, '2025-01-14 00:00:00'::timestamp, '{"status": "in_progress"}'::jsonb
          union all
          select '00000000-0000-0000-0000-000000000006'::uuid, '2025-01-14 09:00:00'::timestamp, null::timestamp, 'user_006'::text, '00000000-0000-0000-0000-000000000055'::text, 'invoices'::text, null::timestamp, '{"status": "in_progress"}'::jsonb
          union all
          select '00000000-0000-0000-0000-000000000007'::uuid, '2025-01-16 09:00:00'::timestamp, null::timestamp, 'user_007'::text, '00000000-0000-0000-0000-000000000066'::text, 'invoices'::text, null::timestamp, '{"status": "in_progress"}'::jsonb

      - input: source('tamanu', 'invoices')
        format: sql
        rows: |
          select
            '00000000-0000-0000-0000-000000000011'::uuid as id,
            '00000000-0000-0000-0000-000000000111'::uuid as encounter_id,
            null::timestamp as deleted_at
          union all
          select '00000000-0000-0000-0000-000000000022'::uuid, '00000000-0000-0000-0000-000000000222'::uuid, null::timestamp
          union all
          select '00000000-0000-0000-0000-000000000033'::uuid, '00000000-0000-0000-0000-000000000333'::uuid, null::timestamp
          union all
          select '00000000-0000-0000-0000-000000000044'::uuid, '00000000-0000-0000-0000-000000000444'::uuid, null::timestamp
          union all
          select '00000000-0000-0000-0000-000000000055'::uuid, '00000000-0000-0000-0000-000000000555'::uuid, '2025-01-20 00:00:00'::timestamp
          union all
          select '00000000-0000-0000-0000-000000000066'::uuid, '00000000-0000-0000-0000-000000000666'::uuid, null::timestamp

      - input: source('tamanu', 'encounters')
        format: sql
        rows: |
          select
            '00000000-0000-0000-0000-000000000111'::uuid as id,
            '00000000-0000-0000-0000-000000001111'::text as patient_id,
            null::timestamp as deleted_at
          union all
          select '00000000-0000-0000-0000-000000000222'::uuid, '00000000-0000-0000-0000-000000002222'::text, null::timestamp
          union all
          select '00000000-0000-0000-0000-000000000333'::uuid, 'h1627394-3778-4c31-a510-9fcb88efdbf3'::text, null::timestamp
          union all
          select '00000000-0000-0000-0000-000000000444'::uuid, '00000000-0000-0000-0000-000000003333'::text, null::timestamp
          union all
          select '00000000-0000-0000-0000-000000000555'::uuid, '00000000-0000-0000-0000-000000004444'::text, null::timestamp
          union all
          select '00000000-0000-0000-0000-000000000666'::uuid, '00000000-0000-0000-0000-000000005555'::text, '2025-01-20 00:00:00'::timestamp

    expect:
      format: sql
      rows: |
        select
          '00000000-0000-0000-0000-000000000001'::uuid as change_id,
          '00000000-0000-0000-0000-000000000011'::uuid as invoice_id,
          '2025-01-10 09:00:00'::timestamp as logged_at,
          'user_001'::text as updated_by_user_id,
          'in_progress'::text as status,
          '00000000-0000-0000-0000-000000000111'::uuid as encounter_id,
          null::text as previous_status,
          1::bigint as change_sequence
        union all
        select '00000000-0000-0000-0000-000000000002'::uuid, '00000000-0000-0000-0000-000000000011'::uuid, '2025-01-15 14:00:00'::timestamp, 'user_002'::text, 'finalised'::text, '00000000-0000-0000-0000-000000000111'::uuid, 'in_progress'::text, 2::bigint
        union all
        select '00000000-0000-0000-0000-000000000003'::uuid, '00000000-0000-0000-0000-000000000022'::uuid, '2025-01-12 10:00:00'::timestamp, 'user_003'::text, 'in_progress'::text, '00000000-0000-0000-0000-000000000222'::uuid, null::text, 1::bigint
