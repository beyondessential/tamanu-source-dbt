unit_tests:
  - name: test_encounter_invoice_audit_finalised_coverage
    model: encounter-invoice-audit-line-list
    description: >
      Finalised coverage (invoice_item_finalised_insurances) takes precedence
      over current plan coverage. Item has plan coverage of 80% but finalised
      coverage of 50%. A $100 item should show $50 insurance coverage.
    given:
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_001' as id, '2024-01-14 09:00:00'::timestamp as start_datetime, '2024-01-15 11:00:00'::timestamp as end_datetime, 'pat_001' as patient_id, 'loc_001' as location_id, 'dept_001' as department_id, null::text as clinician_id, null::text as patient_billing_type_id

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'fac_001' as facility_id

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'General Hospital' as name, false as is_sensitive

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-01-01'::date as date_of_birth, 'male' as sex

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_001' as id, 'Medicine' as name

      - input: ref('users')
        format: sql
        rows: |
          select null::text as id, null::text as display_name where false

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as name where false

      - input: ref('invoices')
        format: sql
        rows: |
          select '00000000-0000-0000-0000-000000000001' as id, 'enc_001' as encounter_id, 'finalised' as status, '2024-01-14 09:00:00'::timestamp as datetime

      - input: ref('invoices_change_logs')
        format: sql
        rows: |
          select null::uuid as invoice_id, null::timestamptz as logged_at, null::text as status, null::text as previous_status where false

      - input: ref('invoice_items')
        format: sql
        rows: |
          select 'item_001'::text as id, '00000000-0000-0000-0000-000000000001' as invoice_id, 'Lab Test' as product_name_final, '2024-01-14'::date as date, 'prod_001' as product_id, 100.00::numeric as price_final, null::numeric as manual_entry_price, 1::integer as quantity

      - input: ref('invoice_products')
        format: sql
        rows: |
          select 'prod_001' as id, 'Lab' as category, true as insurable

      - input: ref('invoice_payments')
        format: sql
        rows: |
          select null::uuid as id, null::uuid as invoice_id, null::numeric as amount, null::uuid as original_payment_id where false

      - input: ref('invoice_patient_payments')
        format: sql
        rows: |
          select null::uuid as id, null::uuid as invoice_payment_id where false

      - input: ref('invoice_item_finalised_insurances')
        format: sql
        rows: |
          -- Finalised at 50%, overriding the plan's 80% default
          select 'item_001'::text as invoice_item_id, 50::numeric as coverage_value_final

      - input: ref('invoices_invoice_insurance_plans')
        format: sql
        rows: |
          select 'iiip_001' as id, '00000000-0000-0000-0000-000000000001'::uuid as invoice_id, 'plan_001' as invoice_insurance_plan_id

      - input: ref('invoice_insurance_plan_items')
        format: sql
        rows: |
          select null::text as invoice_insurance_plan_id, null::text as invoice_product_id, null::numeric as coverage_value where false

      - input: ref('invoice_insurance_plans')
        format: sql
        rows: |
          -- Plan default is 80%, but finalised coverage (50%) should take precedence
          select 'plan_001' as id, 80::numeric as default_coverage

      - input: ref('invoice_item_discounts')
        format: sql
        rows: |
          select null::uuid as invoice_item_id, null::numeric as amount, null::text as type where false

      - input: ref('invoice_discounts')
        format: sql
        rows: |
          select null::uuid as invoice_id, null::numeric as percentage where false

      - input: ref('invoice_price_lists')
        format: sql
        rows: |
          select null::text as id, null::text as code, null::jsonb as rules, null::text as visibility_status where false

      - input: ref('invoice_price_list_items')
        format: sql
        rows: |
          select null::text as invoice_price_list_id, null::text as invoice_product_id, null::numeric as price, null::boolean as is_hidden where false

    expect:
      format: sql
      rows: |
        select
          'P001' as "Patient ID",
          'John' as "First name",
          'Doe' as "Last name",
          '1990-01-01' as "Date of birth",
          34 as "Age",
          'male' as "Sex",
          null::text as "Billing type",
          '2024-01-14 09:00:00' as "Encounter start date and time",
          '2024-01-15 11:00:00' as "Encounter end date and time",
          1 as "Length of stay (days)",
          'General Hospital' as "Facility",
          'Medicine' as "Discharging department",
          null::text as "Supervising clinician",
          null::text as "Invoice finalised date and time",
          100.00::numeric as "Invoice total",
          50.00::numeric as "Insurance coverage",
          50.00::numeric as "Patient subtotal",
          null::numeric as "Patient payment",
          50.00::numeric as "Patient total",
          null::text as "Invoice products with no category"
