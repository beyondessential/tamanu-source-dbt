unit_tests:
  - name: test_metric__opd_diagnosis_window_overlap
    model: metric__opd_diagnosis
    description: >
      BL-003. A diagnosis on a pure-outpatient encounter (c1) is included; on a
      pure-inpatient encounter (c2) it is excluded. c3 is dated the day its encounter
      starts, so its window spans both an outpatient and a later inpatient segment
      (BL-003's "valid from the encounter start to its end" rule) -- it is included via
      the outpatient overlap, regardless of the inpatient segment its window also touches.
    given:
      - input: ref('clinical__condition_occurrence')
        format: sql
        rows: |
          select 'c1' as condition_occurrence_id, 'p1' as person_id, '2026-01-05'::date as condition_start_date, '2026-01-05 00:00:00'::timestamp as condition_start_datetime, null::date as condition_end_date, null::timestamp as condition_end_datetime, 'encounter diagnosis' as condition_type_source_value, 'confirmed' as condition_status_source_value, true as is_primary, 'prov1' as provider_id, 'v1' as visit_occurrence_id, 'A01' as condition_source_value, 'Pure outpatient diagnosis' as condition_source_name
          union all
          select 'c2', 'p1', '2026-01-05'::date, '2026-01-05 00:00:00'::timestamp, null::date, null::timestamp, 'encounter diagnosis', 'confirmed', true, 'prov1', 'v2', 'A02', 'Pure inpatient diagnosis'
          union all
          select 'c3', 'p1', '2026-01-01'::date, '2026-01-01 00:00:00'::timestamp, null::date, null::timestamp, 'encounter diagnosis', 'confirmed', true, 'prov1', 'v3', 'A03', 'Spanning diagnosis'

      - input: ref('clinical__visit_occurrence')
        format: sql
        rows: |
          select 'v1' as visit_occurrence_id, 'p1' as person_id, 9202 as visit_concept_id, '2026-01-01'::date as visit_start_date, '2026-01-01 09:00:00'::timestamp as visit_start_datetime, '2026-01-10'::date as visit_end_date, '2026-01-10 00:00:00'::timestamp as visit_end_datetime, 32817 as visit_type_concept_id, 'prov1' as provider_id, 'loc1' as care_site_id, 'clinic' as visit_source_value
          union all
          select 'v2', 'p1', 9201, '2026-01-01'::date, '2026-01-01 09:00:00'::timestamp, '2026-01-10'::date, '2026-01-10 00:00:00'::timestamp, 32817, 'prov1', 'loc2', 'admission'
          union all
          select 'v3', 'p1', 262, '2026-01-01'::date, '2026-01-01 09:00:00'::timestamp, '2026-01-10'::date, '2026-01-10 00:00:00'::timestamp, 32817, 'prov1', 'loc3a', 'admission'

      - input: ref('clinical__visit_detail')
        format: sql
        rows: |
          select 'vd1' as visit_detail_id, 'v1' as visit_occurrence_id, 'p1' as person_id, 9202 as visit_detail_concept_id, '2026-01-01'::date as visit_detail_start_date, '2026-01-01 09:00:00'::timestamp as visit_detail_start_datetime, '2026-01-10'::date as visit_detail_end_date, '2026-01-10 00:00:00'::timestamp as visit_detail_end_datetime, 'loc1' as care_site_id, null::varchar as department_id, 'prov1' as provider_id, 'clinic' as visit_detail_source_value, null::varchar as preceding_visit_detail_id
          union all
          select 'vd2', 'v2', 'p1', 9201, '2026-01-01'::date, '2026-01-01 09:00:00'::timestamp, '2026-01-10'::date, '2026-01-10 00:00:00'::timestamp, 'loc2', null::varchar, 'prov1', 'admission', null::varchar
          union all
          select 'vd3a', 'v3', 'p1', 9202, '2026-01-01'::date, '2026-01-01 09:00:00'::timestamp, '2026-01-05'::date, '2026-01-05 00:00:00'::timestamp, 'loc3a', null::varchar, 'prov1', 'clinic', null::varchar
          union all
          select 'vd3b', 'v3', 'p1', 9201, '2026-01-05'::date, '2026-01-05 00:00:00'::timestamp, '2026-01-10'::date, '2026-01-10 00:00:00'::timestamp, 'loc3b', null::varchar, 'prov1', 'admission', 'vd3a'

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'p1' as person_id, 'MRN1' as person_source_value, null::int as gender_concept_id, 'female' as gender_source_value, 1996 as year_of_birth, 1 as month_of_birth, 1 as day_of_birth, null::timestamp as birth_datetime, null::varchar as ethnicity_source_value, null::varchar as location_id

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc1' as id, 'L1' as code, 'Location 1' as name, null::int as max_occupancy, null::varchar as location_group_id, 'fac1' as facility_id, 'current' as visibility_status
          union all
          select 'loc2', 'L2', 'Location 2', null::int, null::varchar, 'fac2', 'current'
          union all
          select 'loc3a', 'L3A', 'Location 3A', null::int, null::varchar, 'fac3a', 'current'
          union all
          select 'loc3b', 'L3B', 'Location 3B', null::int, null::varchar, 'fac3b', 'current'

    expect:
      format: sql
      rows: |
        select 'opd_diagnosis' as metric_id, null::text as variant_id, 'c1' as subject_id, '2026-01-05'::date as period_start, null::date as period_end, 'day' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac1' as facility_id, 'female' as sex, 'A01' as diagnosis_code, 'Pure outpatient diagnosis' as diagnosis, 'confirmed' as diagnosis_certainty, true as is_primary, 30 as age_years
        union all
        select 'opd_diagnosis', null::text, 'c3', '2026-01-01'::date, null::date, 'day', 1::numeric, null::boolean, 'fac3a', 'female', 'A03', 'Spanning diagnosis', 'confirmed', true, 30
