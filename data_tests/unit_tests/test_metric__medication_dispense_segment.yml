unit_tests:
  - name: ac_005_metric__medication_dispense_segment
    model: metric__medication_dispense
    description: >
      BL-001 -- BL-007, BL-009.
      e1 arrives in the ED (vd1a, concept 9203, 08:00) and is admitted at 12:00 (vd1b, 9201).
      pop1 is ordered in the ED and dispensed in two partial fills, md1 on the 10th and md2 on the
      11th, each its own row on its own day. md3 is dispensed as Amoxicillin, so the dispensed
      drug is reported. md4's dispense names no medication, so it falls back to 'Not recorded'.
      pop5 is ordered at 13:00 while the patient boards, so md5 belongs to the admission segment.
      po3 predates every segment, so md6 clamps to the first (the ED). e2 has no segment, so md7
      is dropped. e3's only segment is a clinic (9202), so md8 is outpatient.
      Every resolved dispense is counted, in the setting its drug line was ordered in: md1-md4 and
      md6 in Emergency, md5 Inpatient, md8 Outpatient.
    given:
      - input: ref('medication_dispenses')
        format: sql
        rows: |
          select 'md1' as id, 'pop1' as pharmacy_order_prescription_id, '2026-01-10 10:00:00'::timestamp as dispensed_at, 10::numeric as quantity, 'med_para' as medication_id
          union all
          select 'md2', 'pop1', '2026-01-11 09:30:00'::timestamp, 10::numeric, 'med_para'
          union all
          select 'md3', 'pop2', '2026-01-10 11:00:00'::timestamp, 21::numeric, 'med_amox'
          union all
          select 'md4', 'pop3', '2026-01-10 11:30:00'::timestamp, 1::numeric, null::text
          union all
          select 'md5', 'pop5', '2026-01-10 14:00:00'::timestamp, 5::numeric, 'med_para'
          union all
          select 'md6', 'pop6', '2026-01-10 08:00:00'::timestamp, 2::numeric, 'med_para'
          union all
          select 'md7', 'pop7', '2026-01-11 10:00:00'::timestamp, 3::numeric, 'med_para'
          union all
          select 'md8', 'pop8', '2026-01-12 10:00:00'::timestamp, 4::numeric, 'med_para'

      - input: ref('pharmacy_order_prescriptions')
        format: sql
        rows: |
          select 'pop1' as id, 'po1' as pharmacy_order_id
          union all
          select 'pop2', 'po1'
          union all
          select 'pop3', 'po1'
          union all
          select 'pop5', 'po2'
          union all
          select 'pop6', 'po3'
          union all
          select 'pop7', 'po4'
          union all
          select 'pop8', 'po5'

      - input: ref('pharmacy_orders')
        format: sql
        rows: |
          select 'po1' as id, 'e1' as encounter_id, '2026-01-10 09:00:00'::timestamp as datetime
          union all
          select 'po2', 'e1', '2026-01-10 13:00:00'::timestamp
          union all
          select 'po3', 'e1', '2026-01-10 07:00:00'::timestamp
          union all
          select 'po4', 'e2', '2026-01-11 09:00:00'::timestamp
          union all
          select 'po5', 'e3', '2026-01-12 09:00:00'::timestamp

      - input: ref('reference_data')
        format: sql
        rows: |
          select 'med_para' as id, 'PARA' as code, 'Paracetamol' as name
          union all
          select 'med_amox', 'AMOX', 'Amoxicillin'

      - input: ref('clinical__visit_detail')
        format: sql
        rows: |
          select 'vd1a' as visit_detail_id, 'e1' as visit_occurrence_id, 'p1' as person_id, '2026-01-10 08:00:00'::timestamp as visit_detail_start_datetime, 9203 as visit_detail_concept_id, 'triage' as visit_detail_source_value, 'loc_ed' as care_site_id, 'dept_ed' as department_id
          union all
          select 'vd1b', 'e1', 'p1', '2026-01-10 12:00:00'::timestamp, 9201, 'admission', 'loc_ward', 'dept_med'
          union all
          select 'vd3a', 'e3', 'p1', '2026-01-12 08:00:00'::timestamp, 9202, 'clinic', 'loc_clinic', 'dept_opd'

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'p1' as person_id, 'male' as gender_source_value, 1980 as year_of_birth, 1 as month_of_birth, 20 as day_of_birth

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_ed' as id, 'fac1' as facility_id
          union all
          select 'loc_ward', 'fac1'
          union all
          select 'loc_clinic', 'fac1'

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_ed' as id, 'Emergency' as name
          union all
          select 'dept_med', 'Medical'
          union all
          select 'dept_opd', 'Outpatients'

    expect:
      format: sql
      rows: |
        select 'medication_dispense' as metric_id, null::text as variant_id, 'md1' as subject_id, '2026-01-10'::date as period_start, null::date as period_end, 'day' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac1' as facility_id, 'triage' as encounter_type, 'Emergency' as encounter_setting, 'male' as sex, 'PARA' as drug_source_value, 'Paracetamol' as drug_source_name, 45 as age_years, 'Emergency' as department, 10::numeric as quantity
        union all
        select 'medication_dispense', null::text, 'md2', '2026-01-11'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'triage', 'Emergency', 'male', 'PARA', 'Paracetamol', 45, 'Emergency', 10::numeric
        union all
        select 'medication_dispense', null::text, 'md3', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'triage', 'Emergency', 'male', 'AMOX', 'Amoxicillin', 45, 'Emergency', 21::numeric
        union all
        select 'medication_dispense', null::text, 'md4', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'triage', 'Emergency', 'male', 'Not recorded', 'Not recorded', 45, 'Emergency', 1::numeric
        union all
        select 'medication_dispense', null::text, 'md5', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'admission', 'Inpatient', 'male', 'PARA', 'Paracetamol', 45, 'Medical', 5::numeric
        union all
        select 'medication_dispense', null::text, 'md6', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'triage', 'Emergency', 'male', 'PARA', 'Paracetamol', 45, 'Emergency', 2::numeric
        union all
        select 'medication_dispense', null::text, 'md8', '2026-01-12'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'clinic', 'Outpatient', 'male', 'PARA', 'Paracetamol', 45, 'Outpatients', 4::numeric
