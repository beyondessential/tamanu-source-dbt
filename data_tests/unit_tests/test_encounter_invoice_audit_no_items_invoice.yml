unit_tests:
  - name: test_encounter_invoice_audit_no_items_invoice
    model: audit-encounter-invoice
    description: >
      An encounter whose only non-cancelled invoice has no items reads 0, not
      blank, for invoice total, patient subtotal and patient total — matching
      the application. ds__encounter_invoices leaves invoice_total (and so
      patient_subtotal) NULL for a no-items invoice, so the report's per-encounter
      aggregation has to coalesce the summed subtotal; without that the two money
      columns render blank while invoice total still reads 0. The other audit
      unit tests inject a non-null patient_subtotal, so this is the only case
      that pins BL-013/BL-014 against that NULL.
    overrides:
      vars:
        timezone: Australia/Sydney
        date_format: 'YYYY-MM-DD'
        time_format: 'HH24:MI'
        datetime_format: 'YYYY-MM-DD HH24:MI:SS'
        datetime_without_seconds_format: 'YYYY-MM-DD HH24:MI'
        yearmonth_format: 'YYYY-MM'
        language: default
    given:
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_001' as id, '2024-01-10 08:00:00'::timestamp as start_datetime, '2024-01-11 10:00:00'::timestamp as end_datetime, 'pat_001' as patient_id, 'loc_001' as location_id, 'dept_001' as department_id, null::text as clinician_id, null::text as patient_billing_type_id, 'clinic' as encounter_type, null::text as reason_for_encounter

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'fac_001' as facility_id

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'General Hospital' as name, false as is_sensitive

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-01-01'::date as date_of_birth, 'male' as sex

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_001' as id, 'Medicine' as name

      - input: ref('users')
        format: sql
        rows: |
          select null::text as id, null::text as display_name where false

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as name where false

      - input: ref('ds__encounter_invoices')
        format: sql
        rows: |
          -- A no-items invoice as ds__encounter_invoices emits it: invoice_total
          -- null (left join to invoice_items_agg found nothing), so patient_subtotal
          -- is null too, while invoice_discount is still 0.00 (never null).
          select '00000000-0000-0000-0000-000000000001' as invoice_id, 'enc_001' as encounter_id, 'in_progress' as status, '2024-01-10 09:00:00'::timestamp as invoice_datetime, null::timestamp as invoice_finalised_datetime, null::numeric as invoice_total, null::numeric as insurance_coverage, 0.00::numeric as invoice_discount, null::numeric as patient_payment, null::numeric as patient_subtotal, null::text as products_no_category

    expect:
      format: sql
      rows: |
        select
          'P001' as "Patient ID",
          'John' as "First name",
          'Doe' as "Last name",
          '1990-01-01' as "Date of birth",
          34 as "Age",
          'male' as "Sex",
          null::text as "Billing type",
          '2024-01-10 08:00:00' as "Encounter start date and time",
          '2024-01-11 10:00:00' as "Encounter end date and time",
          1 as "Length of stay (days)",
          'General Hospital' as "Facility",
          'Medicine' as "Discharging department",
          null::text as "Supervising clinician",
          null::text as "Invoice finalised date and time",
          0.00::numeric as "Invoice total",
          null::numeric as "Insurance coverage",
          0.00::numeric as "Patient subtotal",
          null::numeric as "Patient payment",
          0.00::numeric as "Patient total",
          null::text as "Invoice products with no category"
