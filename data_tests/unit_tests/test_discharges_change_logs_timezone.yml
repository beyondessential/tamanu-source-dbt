version: 2

unit_tests:
  - name: test_discharges_change_logs_timezone
    model: discharges_change_logs
    description: >
      AC-005. logs.changes.logged_at is stored in UTC, so a change logged either side of
      local midnight must land on the correct local date. Under Pacific/Tarawa (UTC+12) the
      second change crosses into the following day; discharges_change_events applies that
      conversion, so this model's extraction is exercised here with pre-converted local
      values. Also checks change_sequence ordering.
    given:
      - input: ref('discharges_change_events')
        format: sql
        rows: |
          select '00000000-0000-0000-0000-000000000001'::text as changelog_id, 'dis_001'::text as discharge_id, 'enc_001'::text as encounter_id, '2024-03-14 23:30:00'::timestamp as logged_at, '2024-03-14 23:30:00'::timestamp as record_updated_at, '2024-03-14 11:30:00'::timestamp as logged_at_utc, '2024-03-14 11:30:00'::timestamp as record_updated_at_utc, 'usr_001'::text as updated_by_user_id, '{"note": "Home", "discharger_id": "cli_001", "disposition_id": "disp_001"}'::jsonb as record_data
          union all
          select '00000000-0000-0000-0000-000000000002', 'dis_001', 'enc_001', '2024-03-15 00:30:00'::timestamp, '2024-03-15 00:30:00'::timestamp, '2024-03-14 12:30:00'::timestamp, '2024-03-14 12:30:00'::timestamp, 'usr_002', '{"note": "Home with follow up", "discharger_id": "cli_001", "disposition_id": "disp_001"}'::jsonb

    expect:
      format: sql
      rows: |
        select '00000000-0000-0000-0000-000000000001' as changelog_id, 'dis_001' as discharge_id, 'enc_001' as encounter_id, '2024-03-14 23:30:00'::timestamp as logged_at, '2024-03-14 11:30:00'::timestamp as logged_at_utc, 'usr_001' as updated_by_user_id, 'Home' as note, 'cli_001' as discharger_id, 'disp_001' as disposition_id, 1 as change_sequence
        union all
        select '00000000-0000-0000-0000-000000000002', 'dis_001', 'enc_001', '2024-03-15 00:30:00'::timestamp, '2024-03-14 12:30:00'::timestamp, 'usr_002', 'Home with follow up', 'cli_001', 'disp_001', 2
