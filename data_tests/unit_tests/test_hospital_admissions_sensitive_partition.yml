unit_tests:
  - name: test_int__admission_history_location_partition
    model: int__admission_history_location
    description: >
      Pins BL-012 on the standard variant: an episode in a sensitive facility is absent.
      The partition lives in this intermediate rather than in the three reports that read
      it, and a report-level unit test must stub this model — which would replace the very
      predicate under test — so the partition is asserted here instead.
    overrides:
      vars:
        timezone: UTC
    given: &partition_fixture
      - input: ref('encounter_history')
        format: sql
        rows: |
          select 'eh_std'::text as id, 'enc_std'::text as encounter_id, '2024-01-10 09:00:00'::timestamp as datetime,
                 'loc_std'::text as location_id, null::text[] as change_type, 'admission'::text as encounter_type
          union all
          select 'eh_sen', 'enc_sen', '2024-01-10 09:00:00'::timestamp, 'loc_sen', null::text[], 'admission'
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_std'::text as id, 'pat_001'::text as patient_id, '2024-01-12 09:00:00'::timestamp as end_datetime
          union all
          select 'enc_sen', 'pat_001', '2024-01-12 09:00:00'::timestamp
      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001'::text as id, null::date as date_of_death
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_std'::text as id, 'Std Room'::text as name, 'lg_std'::text as location_group_id, 'fac_std'::text as facility_id
          union all
          select 'loc_sen', 'Sen Room', 'lg_sen', 'fac_sen'
      - input: ref('location_groups')
        format: sql
        rows: |
          select 'lg_std'::text as id, 'Standard Ward'::text as name
          union all
          select 'lg_sen', 'Sensitive Ward'
      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_std'::text as id, 'Standard Hospital'::text as name, false as is_sensitive
          union all
          select 'fac_sen', 'Sensitive Hospital', true
    expect:
      format: sql
      rows: |
        select
          'enc_std'::text     as encounter_id,
          'lg_std'::text      as location_group_id,
          'Standard Ward'::text as location_group,
          'loc_std'::text     as location_id,
          'Std Room'::text    as location,
          'fac_std'::text     as facility_id,
          'Standard Hospital'::text as facility,
          '2024-01-10 09:00:00'::timestamp as start_datetime,
          '2024-01-12 09:00:00'::timestamp as end_datetime,
          2                   as length_of_stay,
          true                as admission,
          true                as discharge,
          false               as transfer_in,
          false               as transfer_out,
          false               as death

  - name: test_int__sensitive_admission_history_location_partition
    model: int__sensitive_admission_history_location
    description: >
      The other half of BL-012, on the same fixture: the sensitive variant carries the
      sensitive facility's episode and nothing else. Together the two show the partition is
      exhaustive and disjoint — each facility reaches exactly one variant.
    overrides:
      vars:
        timezone: UTC
    given: *partition_fixture
    expect:
      format: sql
      rows: |
        select
          'enc_sen'::text     as encounter_id,
          'lg_sen'::text      as location_group_id,
          'Sensitive Ward'::text as location_group,
          'loc_sen'::text     as location_id,
          'Sen Room'::text    as location,
          'fac_sen'::text     as facility_id,
          'Sensitive Hospital'::text as facility,
          '2024-01-10 09:00:00'::timestamp as start_datetime,
          '2024-01-12 09:00:00'::timestamp as end_datetime,
          2                   as length_of_stay,
          true                as admission,
          true                as discharge,
          false               as transfer_in,
          false               as transfer_out,
          false               as death
