unit_tests:
  - name: test_metric__who_dak_hiv_indicators_art3_viral_suppression
    model: metric__who_dak_hiv_indicators
    description: >
      BL-012, ART.3. Annex C counts a routine viral load only for a client on ART for more
      than six months at the reporting period end, and counts it suppressed below 1000
      copies/mL. Four clients sampled in the same month: two months on ART (in neither), a
      year on ART with 45 copies (denominator and numerator), a year on ART with exactly 1000
      (denominator only -- the threshold is strict), and a year on ART whose test was targeted
      rather than routine (in neither, because a test taken because treatment is failing would
      bias suppression downwards). Each also initiated ART, so each appears in ART.4 in the
      month treatment began.
    given:
      - input: ref('int__who_dak_hiv_form_answers')
        format: sql
        rows: |
          select 'resp_new' as response_id, 'pat_new' as patient_id, 'fac_001' as facility_id, 'carevisit' as survey_code, '2026-06-10 09:00:00'::timestamp as submitted_datetime, 'female' as sex, 1990 as year_of_birth, 1 as month_of_birth, 1 as day_of_birth, null::text as hiv_status, null::text as hiv_test_result, 'Routine viral load test' as viral_load_reason, null::text as art_stopped_reason, null::text as regimen_substitution_reason, null::text as key_population_hts_json, null::text as key_population_pmtct_json, null::date as hiv_test_date, null::date as hiv_test_result_returned_date, null::date as hiv_diagnosis_date, '2026-04-01'::date as art_start_date, null::date as baseline_cd4_test_date, '2026-06-10'::date as viral_load_sample_date, null::date as dsd_eligibility_assessed_date, null::date as dsd_start_date, null::date as art_stopped_date, null::date as substitution_first_line_date, null::date as substitution_second_line_date, null::date as substitution_third_line_date, null::numeric as baseline_cd4_count, 45::numeric as viral_load_result, true as on_art, null::boolean as dsd_eligible, null::boolean as dsd_enrolled
          union all
          select 'resp_supp', 'pat_supp', 'fac_001', 'carevisit', '2026-06-11 09:00:00'::timestamp, 'male', 1985, 1, 1, null::text, null::text, 'Routine viral load test', null::text, null::text, null::text, null::text, null::date, null::date, null::date, '2025-05-01'::date, null::date, '2026-06-11'::date, null::date, null::date, null::date, null::date, null::date, null::date, null::numeric, 45::numeric, true, null::boolean, null::boolean
          union all
          select 'resp_1000', 'pat_1000', 'fac_001', 'carevisit', '2026-06-12 09:00:00'::timestamp, 'male', 1985, 1, 1, null::text, null::text, 'Routine viral load test', null::text, null::text, null::text, null::text, null::date, null::date, null::date, '2025-05-01'::date, null::date, '2026-06-12'::date, null::date, null::date, null::date, null::date, null::date, null::date, null::numeric, 1000::numeric, true, null::boolean, null::boolean
          union all
          select 'resp_targeted', 'pat_targeted', 'fac_001', 'carevisit', '2026-06-13 09:00:00'::timestamp, 'female', 1985, 1, 1, null::text, null::text, 'Targeted viral load test', null::text, null::text, null::text, null::text, null::date, null::date, null::date, '2025-05-01'::date, null::date, '2026-06-13'::date, null::date, null::date, null::date, null::date, null::date, null::date, null::numeric, 45::numeric, true, null::boolean, null::boolean

      - input: ref('int__who_dak_hiv_client_month_state')
        format: sql
        rows: |
          select null::date as month_start, null::date as month_end, null::text as patient_id, null::text as facility_id, null::boolean as on_art, null::boolean as on_art_recorded, null::date as art_stopped_date, null::date as art_start_date, null::boolean as dsd_enrolled, null::date as dsd_start_date, null::int as months_on_art, null::int as months_on_dsd, null::text as sex, null::int as age_years where false

      - input: ref('int__who_dak_hiv_key_populations')
        format: sql
        rows: |
          select null::text as patient_id, null::text as key_population where false

    expect:
      format: sql
      rows: |
        select 'who_dak_hiv_art_initiated' as metric_id, null::text as variant_id, 'pat_new' as subject_id, 'patient' as subject_grain, '2026-04-01'::date as period_start, '2026-04-30'::date as period_end, 'month' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac_001' as facility_id, 'female' as sex, 36 as age_years, null::int as months_on_dsd, null::text as key_population
        union all
        select 'who_dak_hiv_art_initiated', null::text, 'pat_supp', 'patient', '2025-05-01'::date, '2025-05-31'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'male', 40, null::int, null::text
        union all
        select 'who_dak_hiv_art_initiated', null::text, 'pat_1000', 'patient', '2025-05-01'::date, '2025-05-31'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'male', 40, null::int, null::text
        union all
        select 'who_dak_hiv_art_initiated', null::text, 'pat_targeted', 'patient', '2025-05-01'::date, '2025-05-31'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'female', 40, null::int, null::text
        union all
        select 'who_dak_hiv_art_routine_viral_load', null::text, 'pat_supp', 'patient', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'male', 41, null::int, null::text
        union all
        select 'who_dak_hiv_art_routine_viral_load', null::text, 'pat_1000', 'patient', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'male', 41, null::int, null::text
        union all
        select 'who_dak_hiv_art_viral_suppression', null::text, 'pat_supp', 'patient', '2026-06-01'::date, '2026-06-30'::date, 'month', 1::numeric, null::boolean, 'fac_001', 'male', 41, null::int, null::text
