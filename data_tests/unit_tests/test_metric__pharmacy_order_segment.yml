unit_tests:
  - name: ac_006_metric__pharmacy_order_segment
    model: metric__pharmacy_order
    description: >
      BL-002 -- BL-004, BL-007 -- BL-010. e1 starts in a General OPD clinic (vd1a, 9202, 08:00),
      moves to Dental (vd1b, 9202, 10:00) and is admitted to Medical at another facility (vd1c,
      9201, 14:00). po1 (09:00) falls in the clinic segment, so pop1 reads General OPD and
      Outpatient rather than the Medical department e1 ends in. po2 (11:00) falls in Dental, so
      pop2 reads Dental. po3 (15:00) falls in the admission, so pop3 is Inpatient at fac2 -- the
      segment's facility, not the order's own fac_order -- and, carrying an ongoing prescription
      rather than an encounter one, still resolves its medication. po4 (07:00) predates every
      segment, so it clamps to the clinic segment, and pop4's prescription names no medication,
      so it falls back to 'Not recorded'. e2's only segment is a triage phase (9203), so pop5 is
      counted as Other. e3 has no segment, so pop6 is dropped. po7 is placed at 10:00, the
      Dental segment's own start, so pop7 falls in Dental. po8 is a discharge order at 20:00,
      after the admission began, so pop8 falls in the admission segment like any later order.
    given:
      - input: ref('pharmacy_order_prescriptions')
        format: sql
        rows: |
          select 'pop1' as id, 'po1' as pharmacy_order_id, 'rx1' as prescription_id, null::text as ongoing_prescription_id, true as is_completed
          union all
          select 'pop2', 'po2', 'rx2', null::text, false
          union all
          select 'pop3', 'po3', null::text, 'rx3', true
          union all
          select 'pop4', 'po4', 'rx_nomed', null::text, false
          union all
          select 'pop5', 'po5', 'rx1', null::text, true
          union all
          select 'pop6', 'po6', 'rx1', null::text, true
          union all
          select 'pop7', 'po7', 'rx2', null::text, true
          union all
          select 'pop8', 'po8', 'rx1', null::text, false

      - input: ref('pharmacy_orders')
        format: sql
        rows: |
          select 'po1' as id, 'e1' as encounter_id, '2026-01-10 09:00:00'::timestamp as datetime, 'fac_order' as facility_id
          union all
          select 'po2', 'e1', '2026-01-10 11:00:00'::timestamp, 'fac_order'
          union all
          select 'po3', 'e1', '2026-01-10 15:00:00'::timestamp, 'fac_order'
          union all
          select 'po4', 'e1', '2026-01-10 07:00:00'::timestamp, 'fac_order'
          union all
          select 'po5', 'e2', '2026-01-11 09:00:00'::timestamp, 'fac_order'
          union all
          select 'po6', 'e3', '2026-01-12 09:00:00'::timestamp, 'fac_order'
          union all
          select 'po7', 'e1', '2026-01-10 10:00:00'::timestamp, 'fac_order'
          union all
          select 'po8', 'e1', '2026-01-10 20:00:00'::timestamp, 'fac_order'

      - input: ref('prescriptions')
        format: sql
        rows: |
          select 'rx1' as id, 'med_para' as medication_id
          union all
          select 'rx2', 'med_amox'
          union all
          select 'rx3', 'med_sal'
          union all
          select 'rx_nomed', null::text

      - input: ref('reference_data')
        format: sql
        rows: |
          select 'med_para' as id, 'PARA' as code, 'Paracetamol' as name
          union all
          select 'med_amox', 'AMOX', 'Amoxicillin'
          union all
          select 'med_sal', 'SALB', 'Salbutamol'

      - input: ref('clinical__visit_detail')
        format: sql
        rows: |
          select 'vd1a' as visit_detail_id, 'e1' as visit_occurrence_id, 'p1' as person_id, '2026-01-10 08:00:00'::timestamp as visit_detail_start_datetime, 9202 as visit_detail_concept_id, 'clinic' as visit_detail_source_value, 'loc_clinic' as care_site_id, 'dept_opd' as department_id
          union all
          select 'vd1b', 'e1', 'p1', '2026-01-10 10:00:00'::timestamp, 9202, 'clinic', 'loc_dental', 'dept_dental'
          union all
          select 'vd1c', 'e1', 'p1', '2026-01-10 14:00:00'::timestamp, 9201, 'admission', 'loc_ward', 'dept_med'
          union all
          select 'vd2a', 'e2', 'p1', '2026-01-11 08:00:00'::timestamp, 9203, 'triage', 'loc_ed', 'dept_ed'

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'p1' as person_id, 'female' as gender_source_value

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_clinic' as id, 'fac1' as facility_id
          union all
          select 'loc_dental', 'fac1'
          union all
          select 'loc_ward', 'fac2'
          union all
          select 'loc_ed', 'fac1'

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_opd' as id, 'General OPD' as name
          union all
          select 'dept_dental', 'Dental'
          union all
          select 'dept_med', 'Medical'
          union all
          select 'dept_ed', 'Emergency'

    expect:
      format: sql
      rows: |
        select 'pharmacy_order' as metric_id, null::text as variant_id, 'pop1' as subject_id, '2026-01-10'::date as period_start, null::date as period_end, 'day' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac1' as facility_id, 'clinic' as encounter_type, 'Outpatient' as encounter_setting, 'female' as sex, true as is_completed, 'PARA' as drug_source_value, 'Paracetamol' as drug_source_name, 'General OPD' as department
        union all
        select 'pharmacy_order', null::text, 'pop2', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'clinic', 'Outpatient', 'female', false, 'AMOX', 'Amoxicillin', 'Dental'
        union all
        select 'pharmacy_order', null::text, 'pop3', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac2', 'admission', 'Inpatient', 'female', true, 'SALB', 'Salbutamol', 'Medical'
        union all
        select 'pharmacy_order', null::text, 'pop4', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'clinic', 'Outpatient', 'female', false, 'Not recorded', 'Not recorded', 'General OPD'
        union all
        select 'pharmacy_order', null::text, 'pop5', '2026-01-11'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'triage', 'Other', 'female', true, 'PARA', 'Paracetamol', 'Emergency'
        union all
        select 'pharmacy_order', null::text, 'pop7', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'clinic', 'Outpatient', 'female', true, 'AMOX', 'Amoxicillin', 'Dental'
        union all
        select 'pharmacy_order', null::text, 'pop8', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac2', 'admission', 'Inpatient', 'female', false, 'PARA', 'Paracetamol', 'Medical'
