unit_tests:
  - name: test_encounter_invoice_audit_invoice_finalised_datetime
    model: encounter-invoice-audit-line-list
    description: >
      invoice_finalised_datetime shows the Pohnpei-local time from logs.changes when the
      invoice status transitioned to finalised. Encounters with no finalised invoice 
      show null.
    given:
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_001' as id, '2024-01-14 09:00:00'::timestamp as start_datetime, '2024-01-15 11:00:00'::timestamp as end_datetime, 'pat_001' as patient_id, 'loc_001' as location_id, 'dept_001' as department_id, null::text as clinician_id, null::text as patient_billing_type_id
          union all
          select 'enc_002', '2024-01-20 09:00:00'::timestamp, '2024-01-20 16:00:00'::timestamp, 'pat_002', 'loc_001', 'dept_001', null::text, null::text

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'fac_001' as facility_id

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'General Hospital' as name, false as is_sensitive

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'John' as first_name, 'Doe' as last_name, '1990-01-01'::date as date_of_birth, 'male' as sex
          union all
          select 'pat_002', 'P002', 'Jane', 'Smith', '1985-06-15'::date, 'female'

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_001' as id, 'Medicine' as name

      - input: ref('users')
        format: sql
        rows: |
          select null::text as id, null::text as display_name where false

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as name where false

      - input: ref('invoices')
        format: sql
        rows: |
          select '00000000-0000-0000-0000-000000000001' as id, 'enc_001' as encounter_id, 'finalised' as status, '2024-01-14 09:00:00'::timestamp as datetime
          union all
          select '00000000-0000-0000-0000-000000000002', 'enc_002', 'in_progress', '2024-01-20 09:00:00'::timestamp

      - input: ref('invoices_change_logs')
        format: sql
        rows: |
          select '00000000-0000-0000-0000-000000000001'::uuid as invoice_id, '2024-01-14 10:00:00+00'::timestamptz as logged_at, 'in_progress' as status, null::text as previous_status
          union all
          -- First finalisation: logged_at UTC 03:00 = Pohnpei 14:00 (UTC+11)
          select '00000000-0000-0000-0000-000000000001'::uuid, '2024-01-15 03:00:00+00'::timestamptz, 'finalised', 'in_progress'
          union all
          -- Re-finalisation: previous_status = 'finalised' so excluded from invoice_finalised CTE
          select '00000000-0000-0000-0000-000000000001'::uuid, '2024-01-16 01:00:00+00'::timestamptz, 'finalised', 'finalised'
          union all
          -- enc_002 invoice: never reaches finalised
          select '00000000-0000-0000-0000-000000000002'::uuid, '2024-01-20 10:00:00+00'::timestamptz, 'in_progress', null::text

      - input: ref('invoice_items')
        format: sql
        rows: |
          select null::text as id, null::text as invoice_id, null::text as product_name_final, null::date as date, null::text as product_id, null::numeric as price_final, null::numeric as manual_entry_price, null::integer as quantity where false

      - input: ref('invoice_products')
        format: sql
        rows: |
          select null::text as id, null::text as category, null::boolean as insurable where false

      - input: ref('invoice_payments')
        format: sql
        rows: |
          select null::uuid as id, null::uuid as invoice_id, null::numeric as amount, null::uuid as original_payment_id where false

      - input: ref('invoice_patient_payments')
        format: sql
        rows: |
          select null::uuid as id, null::uuid as invoice_payment_id where false

      - input: ref('invoice_item_finalised_insurances')
        format: sql
        rows: |
          select null::text as invoice_item_id, null::numeric as coverage_value_final where false

      - input: ref('invoices_invoice_insurance_plans')
        format: sql
        rows: |
          select null::text as id, null::uuid as invoice_id, null::text as invoice_insurance_plan_id where false

      - input: ref('invoice_insurance_plan_items')
        format: sql
        rows: |
          select null::text as invoice_insurance_plan_id, null::text as invoice_product_id, null::numeric as coverage_value where false

      - input: ref('invoice_insurance_plans')
        format: sql
        rows: |
          select null::text as id, null::numeric as default_coverage where false

      - input: ref('invoice_item_discounts')
        format: sql
        rows: |
          select null::uuid as invoice_item_id, null::numeric as amount, null::text as type where false

      - input: ref('invoice_discounts')
        format: sql
        rows: |
          select null::uuid as invoice_id, null::numeric as percentage where false

      - input: ref('invoice_price_lists')
        format: sql
        rows: |
          select null::text as id, null::text as code, null::jsonb as rules, null::text as visibility_status where false

      - input: ref('invoice_price_list_items')
        format: sql
        rows: |
          select null::text as invoice_price_list_id, null::text as invoice_product_id, null::numeric as price, null::boolean as is_hidden where false

    expect:
      format: sql
      rows: |
        select
          'P001' as "Patient ID",
          'John' as "First name",
          'Doe' as "Last name",
          '1990-01-01' as "Date of birth",
          34 as "Age",
          'male' as "Sex",
          null::text as "Billing type",
          '2024-01-14 09:00:00' as "Encounter start date and time",
          '2024-01-15 11:00:00' as "Encounter end date and time",
          1 as "Length of stay (days)",
          'General Hospital' as "Facility",
          'Medicine' as "Discharging department",
          null::text as "Supervising clinician",
          '2024-01-15 14:00:00' as "Invoice finalised date and time",
          null::numeric as "Invoice total",
          null::numeric as "Insurance coverage",
          null::numeric as "Patient subtotal",
          null::numeric as "Patient payment",
          null::numeric as "Patient total",
          null::text as "Invoice products with no category"
        union all
        select
          'P002', 'Jane', 'Smith', '1985-06-15', 38, 'female',
          null::text,
          '2024-01-20 09:00:00', '2024-01-20 16:00:00', 1,
          'General Hospital', 'Medicine', null::text,
          null::text,
          null::numeric, null::numeric, null::numeric, null::numeric, null::numeric,
          null::text
