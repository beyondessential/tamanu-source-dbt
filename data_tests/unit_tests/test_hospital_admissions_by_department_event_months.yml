unit_tests:
  - name: test_hospital_admissions_by_department_event_months
    model: hospital-admissions-by-department-summary
    description: >
      Pins all four of BL-006's event attributions in one fixture, using a transfer that
      crosses a month boundary. One encounter moves from General Medicine to Surgical on
      5 February, having been admitted on 20 January.

      General Medicine is credited with the admission in JANUARY, because an admission is
      a start-of-episode event, and with the transfer out in FEBRUARY, because the move
      happens when the episode ends. Surgical is credited with the transfer in and the
      discharge in FEBRUARY. So the same physical move is a February transfer out for one
      department and a February transfer in for the other, rather than being booked to the
      month the patient first arrived in General Medicine.

      January therefore shows a General Medicine row with an admission and nothing else —
      no transfer out, which is what the previous start-month attribution produced.
    overrides:
      vars:
        timezone: UTC
        yearmonth_format: YYYY-MM
        fromDate: '2024-01-01'
        toDate: '2024-02-29'
    given:
      - input: ref('int__admission_history_department')
        format: sql
        rows: |
          select
            'enc_001'::text          as encounter_id,
            'dep_med'::text          as department_id,
            'General Medicine'::text as department,
            'fac_001'::text          as facility_id,
            'Central Hospital'::text as facility,
            '2024-01-20 09:00:00'::timestamp as start_datetime,
            '2024-02-05 14:00:00'::timestamp as end_datetime,
            16::integer              as length_of_stay,
            true                     as admission,
            false                    as discharge,
            false                    as transfer_in,
            true                     as transfer_out,
            false                    as death
          union all
          select
            'enc_001', 'dep_surg', 'Surgical', 'fac_001', 'Central Hospital',
            '2024-02-05 14:00:00'::timestamp, '2024-02-10 11:00:00'::timestamp,
            5, false, true, true, false, false

    expect:
      format: sql
      rows: |
        select
          '2024-01'           as "Month",
          'Central Hospital'  as "Facility",
          'General Medicine'  as "Department",
          1::bigint           as "Number of admissions",
          0::bigint           as "Number of discharges",
          0::bigint           as "Number of deaths",
          0::bigint           as "Number of transfers into department",
          0::bigint           as "Number of transfers out of department",
          0::numeric          as "Average length of stay"
        union all
        select '2024-02', 'Central Hospital', 'General Medicine',
               0::bigint, 0::bigint, 0::bigint, 0::bigint, 1::bigint, 16.0::numeric
        union all
        select '2024-02', 'Central Hospital', 'Surgical',
               0::bigint, 1::bigint, 0::bigint, 1::bigint, 0::bigint, 5.0::numeric
