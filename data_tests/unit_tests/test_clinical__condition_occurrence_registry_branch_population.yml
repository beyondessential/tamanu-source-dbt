unit_tests:
  - name: test_clinical__condition_occurrence_registry_branch_population
    model: clinical__condition_occurrence
    description: >
      BL-009, BL-011, BL-026, AC-013. The registry branch inherits clinical__episode's
      population by reading int__program_enrolments, the model that defines it, rather than
      rebuilding it: a condition tracked alongside an enrolment is only a diagnosis if the
      enrolment is one. Four conditions go in -- one valid, one on an enrolment recorded in
      error, one on a patient merged away, one deleted -- and only the valid one comes out,
      with no visit FK and the condition category as its status.
    given:
      - input: ref('patient_program_registration_conditions')
        format: sql
        rows: |
          select 'cond_001' as id, '2024-02-01 10:00:00'::timestamp as datetime, 'prc_001' as program_registry_condition_id, 'pat_001;preg_001' as patient_program_registration_id, 'cat_001' as program_registry_condition_category_id, 'usr_001' as recorded_by_id, null::timestamp as deleted_datetime
          union all
          select 'cond_002', '2024-02-02 10:00:00'::timestamp, 'prc_001', 'pat_002;preg_001', 'cat_001', 'usr_001', null::timestamp
          union all
          select 'cond_003', '2024-02-03 10:00:00'::timestamp, 'prc_001', 'pat_003;preg_001', 'cat_001', 'usr_001', null::timestamp
          union all
          select 'cond_004', '2024-02-04 10:00:00'::timestamp, 'prc_001', 'pat_001;preg_001', 'cat_001', 'usr_001', '2024-03-01 10:00:00'::timestamp

      # pat_003;preg_001 is absent: the intermediate already drops enrolments on a patient
      # merged away (BL-001, BL-026), so this branch never sees it
      - input: ref('int__program_enrolments')
        format: sql
        rows: |
          select 'pat_001;preg_001' as enrolment_id, 'pat_001' as person_id, 'active' as registration_status
          union all
          select 'pat_002;preg_001', 'pat_002', 'recordedInError'

      - input: ref('program_registry_conditions')
        format: sql
        rows: |
          select 'prc_001' as id, 'B20' as code, 'HIV disease' as name

      - input: ref('program_registry_condition_categories')
        format: sql
        rows: |
          select 'cat_001' as id, 'confirmed' as code, 'Confirmed' as name

      - input: ref('encounter_diagnoses')
        format: sql
        rows: |
          select null::text as id, null::text as encounter_id, null::text as diagnosis_id, null::boolean as is_primary, null::text as certainty, null::timestamp as datetime, null::text as diagnosed_by_id
          where false

      - input: ref('encounters')
        format: sql
        rows: |
          select null::text as id, null::text as patient_id
          where false

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as code, null::text as name
          where false

    expect:
      format: sql
      rows: |
        select 'cond_001' as condition_occurrence_id, 'pat_001' as person_id, '2024-02-01'::date as condition_start_date, '2024-02-01 10:00:00'::timestamp as condition_start_datetime, null::date as condition_end_date, null::timestamp as condition_end_datetime, 'program registry condition' as condition_type_source_value, 'confirmed' as condition_status_source_value, null::boolean as is_primary, 'usr_001' as provider_id, null::text as visit_occurrence_id, 'B20' as condition_source_value, 'HIV disease' as condition_source_name
