unit_tests:
  - name: test_metric__opd_diagnosis_boundary_clamps
    model: metric__opd_diagnosis
    description: >
      BL-003's clamping. c4's encounter closed long before it was recorded -- its window
      is clamped down to the close time, landing it in the last (and only) segment rather
      than being dropped for falling outside every segment (13e699c). c5's encounter is
      still open -- its active segment carries a NULL end (clinical__visit_detail leaves it
      open-ended rather than defaulting to the segment's own start), so a diagnosis dated
      well after the segment began still matches it.
    given:
      - input: ref('clinical__condition_occurrence')
        format: sql
        rows: |
          select 'c4' as condition_occurrence_id, 'p1' as person_id, '2026-01-20'::date as condition_start_date, '2026-01-20 00:00:00'::timestamp as condition_start_datetime, null::date as condition_end_date, null::timestamp as condition_end_datetime, 'encounter diagnosis' as condition_type_source_value, 'confirmed' as condition_status_source_value, true as is_primary, 'prov1' as provider_id, 'v4' as visit_occurrence_id, 'A04' as condition_source_value, 'After close diagnosis' as condition_source_name
          union all
          select 'c5', 'p1', '2026-01-10'::date, '2026-01-10 00:00:00'::timestamp, null::date, null::timestamp, 'encounter diagnosis', 'confirmed', true, 'prov1', 'v5', 'A05', 'Open encounter diagnosis'

      - input: ref('clinical__visit_occurrence')
        format: sql
        rows: |
          select 'v4' as visit_occurrence_id, 'p1' as person_id, 9202 as visit_concept_id, '2026-01-01'::date as visit_start_date, '2026-01-01 09:00:00'::timestamp as visit_start_datetime, '2026-01-05'::date as visit_end_date, '2026-01-05 00:00:00'::timestamp as visit_end_datetime, 32817 as visit_type_concept_id, 'prov1' as provider_id, 'loc4' as care_site_id, 'clinic' as visit_source_value
          union all
          select 'v5', 'p1', 9202, '2026-01-01'::date, '2026-01-01 09:00:00'::timestamp, null::date, null::timestamp, 32817, 'prov1', 'loc5', 'clinic'

      - input: ref('clinical__visit_detail')
        format: sql
        rows: |
          select 'vd4' as visit_detail_id, 'v4' as visit_occurrence_id, 'p1' as person_id, 9202 as visit_detail_concept_id, '2026-01-01'::date as visit_detail_start_date, '2026-01-01 09:00:00'::timestamp as visit_detail_start_datetime, '2026-01-05'::date as visit_detail_end_date, '2026-01-05 00:00:00'::timestamp as visit_detail_end_datetime, 'loc4' as care_site_id, null::varchar as department_id, 'prov1' as provider_id, 'clinic' as visit_detail_source_value, null::varchar as preceding_visit_detail_id
          union all
          select 'vd5', 'v5', 'p1', 9202, '2026-01-01'::date, '2026-01-01 09:00:00'::timestamp, null::date, null::timestamp, 'loc5', null::varchar, 'prov1', 'clinic', null::varchar

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'p1' as person_id, 'MRN1' as person_source_value, null::int as gender_concept_id, 'female' as gender_source_value, 1996 as year_of_birth, 1 as month_of_birth, 1 as day_of_birth, null::timestamp as birth_datetime, null::varchar as ethnicity_source_value, null::varchar as location_id

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc4' as id, 'L4' as code, 'Location 4' as name, null::int as max_occupancy, null::varchar as location_group_id, 'fac4' as facility_id, 'current' as visibility_status
          union all
          select 'loc5', 'L5', 'Location 5', null::int, null::varchar, 'fac5', 'current'

    expect:
      format: sql
      rows: |
        select 'opd_diagnosis' as metric_id, null::text as variant_id, 'c4' as subject_id, '2026-01-20'::date as period_start, null::date as period_end, 'day' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac4' as facility_id, 'female' as sex, 'A04' as diagnosis_code, 'After close diagnosis' as diagnosis, 'confirmed' as diagnosis_certainty, true as is_primary, 30 as age_years
        union all
        select 'opd_diagnosis', null::text, 'c5', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac5', 'female', 'A05', 'Open encounter diagnosis', 'confirmed', true, 30
