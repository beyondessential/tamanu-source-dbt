unit_tests:
  - name: test_enc_summary_encounter_notes
    model: encounter-summary-by-end-date
    description: >
      BL-009, encounter branch. An encounter note reaches its encounter through
      notes.record_id, which holds the encounter id directly. Also pins the two filters
      sitting on top of that branch: the revision dedup keeps only the latest note of a
      revision chain, and system notes are excluded.

      Before BL-009 no unit test touched notes at all -- every fixture stubbed the table
      out with `where false` -- so the entire notes path was uncovered.
    overrides:
      vars:
        timezone: UTC  # note: unit tests cannot exercise cross-timezone conversion — to_user_selected_timezone resolves to a no-op type cast in test/run mode (only :timezone bind parameter in compiled SQL exercises the conversion)
        datetime_format: YYYY-MM-DD HH24:MI
        date_format: YYYY-MM-DD
    given:
      - input: ref('encounters')
        format: sql
        rows: |
          select
            -- BL-008: the report filters on the stored ISO-9075 columns as well as the
            -- converted timestamps, so the fixture derives them from the timestamps it
            -- already declares. Deriving rather than restating them is what keeps the two
            -- representations of an instant from drifting apart as the fixture is edited.
            f.*,
            to_char(f.start_datetime, 'YYYY-MM-DD HH24:MI:SS') as start_date_iso,
            to_char(f.end_datetime, 'YYYY-MM-DD HH24:MI:SS') as end_date_iso
          from (
            select 'enc_001' as id, 'pat_001' as patient_id, '2024-01-15 10:00:00'::timestamp as start_datetime, '2024-01-20 09:00:00'::timestamp as end_datetime, 'loc_001' as location_id, 'dept_001' as department_id, 'cli_001' as clinician_id, null::text as patient_billing_type_id, null::text as reason_for_encounter, 'clinic' as encounter_type, null::text as planned_location_id, null::timestamp as planned_location_start_datetime
            union all
            select 'enc_002', 'pat_002', '2024-01-16 08:00:00'::timestamp, null::timestamp, 'loc_001', 'dept_001', 'cli_001', null::text, null::text, 'clinic', null::text, null::timestamp
          ) f

      - input: ref('patients')
        format: sql
        rows: |
          select 'pat_001' as id, 'P001' as display_id, 'Alice' as first_name, 'Smith' as last_name, '1985-03-20'::date as date_of_birth, 'female' as sex, null::text as village_id
          union all
          select 'pat_002', 'P002', 'Bob', 'Jones', '1990-07-10'::date, 'male', null::text

      - input: ref('encounter_history')
        format: sql
        rows: |
          select 'enc_001' as encounter_id, '2024-01-15 10:00:00'::timestamp as datetime, null::text[] as change_type, 'cli_001' as updated_by_id, 'cli_001' as clinician_id, 'dept_001' as department_id, 'loc_001' as location_id, 'admission' as encounter_type

      - input: ref('users')
        format: sql
        rows: |
          select 'cli_001' as id, 'Dr. Carol Lee' as display_name

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_001' as id, 'General Ward' as name

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001' as id, 'Bed 1' as name, 'fac_001' as facility_id, 'lg_001' as location_group_id

      - input: ref('location_groups')
        format: sql
        rows: |
          select 'lg_001' as id, 'Ward A' as name

      - input: ref('facilities')
        format: sql
        rows: |
          select 'fac_001' as id, 'General Hospital' as name, false as is_sensitive

      - input: ref('reference_data')
        format: sql
        rows: |
          select null::text as id, null::text as name, null::text as code
          where false

      - input: ref('patient_additional_data')
        format: sql
        rows: |
          select null::text as patient_id, null::text as ethnicity_id, null::text as division_id, null::text as subdivision_id
          where false

      - input: ref('triages')
        format: sql
        rows: |
          select null::text as encounter_id, null::text as score, null::timestamp as triage_datetime, null::timestamp as closed_datetime, null::text as arrival_mode_id
          where false

      - input: ref('discharges')
        format: sql
        rows: |
          select null::text as encounter_id, null::text as disposition_id
          where false

      - input: ref('encounter_diagnoses')
        format: sql
        rows: |
          select null::text as encounter_id, null::text as diagnosis_id, null::boolean as is_primary, null::text as certainty, null::timestamp as datetime
          where false

      - input: ref('encounter_prescriptions')
        format: sql
        rows: |
          select null::text as encounter_id, null::text as prescription_id
          where false

      - input: ref('prescriptions')
        format: sql
        rows: |
          select null::text as id, null::boolean as is_discontinued, null::text as discontinuing_reason, null::timestamp as datetime, null::text as medication_id
          where false

      - input: ref('vaccine_administrations')
        format: sql
        rows: |
          select null::text as encounter_id, null::timestamp as datetime, null::text as scheduled_vaccine_id
          where false

      - input: ref('vaccine_schedules')
        format: sql
        rows: |
          select null::text as id, null::text as label, null::text as dose_label, null::text as vaccine_id
          where false

      - input: ref('procedures')
        format: sql
        rows: |
          select null::text as encounter_id, null::date as date, null::text as procedure_type_id, null::text as location_id, null::text as note, null::text as completed_note
          where false

      - input: ref('lab_requests')
        format: sql
        rows: |
          select null::text as id, null::text as encounter_id, null::timestamp as collected_datetime, null::text as lab_test_panel_request_id, null::text as status
          where false

      - input: ref('lab_test_panel_requests')
        format: sql
        rows: |
          select null::text as id, null::text as lab_test_panel_id
          where false

      - input: ref('lab_test_panels')
        format: sql
        rows: |
          select null::text as id, null::text as name
          where false

      - input: ref('lab_tests')
        format: sql
        rows: |
          select null::text as lab_request_id, null::text as lab_test_type_id
          where false

      - input: ref('lab_test_types')
        format: sql
        rows: |
          select null::text as id, null::text as name
          where false

      - input: ref('notes')
        format: sql
        rows: |
          -- note_2b revises note_2a, so the two share the partition key
          -- coalesce(updated_note_id, id) = 'note_2a' and only the later survives.
          -- note_sys is dropped by note_type, not by the branch.
          select 'note_1' as id, '2024-01-16 08:00:00'::timestamp as datetime, 'First note' as content, 'nursing' as note_type, 'Encounter' as record_type, 'enc_001' as record_id, null::text as updated_note_id, null::text as visibility_status
          union all
          select 'note_2a', '2024-01-17 09:00:00'::timestamp, 'Original text', 'nursing', 'Encounter', 'enc_001', null::text, null::text
          union all
          select 'note_2b', '2024-01-17 15:00:00'::timestamp, 'Revised text', 'nursing', 'Encounter', 'enc_001', 'note_2a', null::text
          union all
          select 'note_sys', '2024-01-18 08:00:00'::timestamp, 'System generated', 'system', 'Encounter', 'enc_001', null::text, null::text

      - input: ref('imaging_requests')
        format: sql
        rows: |
          select null::text as id, null::text as encounter_id, null::text as imaging_type, null::text as status
          where false

      - input: ref('imaging_request_areas')
        format: sql
        rows: |
          select null::text as imaging_request_id, null::text as area_id
          where false

      - input: ref('invoices')
        format: sql
        rows: |
          select null::text as id, null::text as encounter_id, null::text as status, null::timestamp as datetime
          where false

      - input: ref('invoice_items')
        format: sql
        rows: |
          select null::text as invoice_id, null::text as product_id
          where false

      - input: ref('invoice_products')
        format: sql
        rows: |
          select null::text as id, null::text as category
          where false

    expect:
      format: sql
      rows: |
        select
          'P001'               as "Patient ID",
          'Alice'              as "First name",
          'Smith'              as "Last name",
          '1985-03-20'         as "Date of birth",
          38                   as "Age",
          'female'             as "Sex",
          null::text           as "Ethnicity",
          null::text           as "Billing type",
          null::text           as "Division",
          null::text           as "Sub-division",
          null::text           as "Village",
          '2024-01-15 10:00'   as "Encounter start date and time",
          '2024-01-20 09:00'   as "Encounter end date and time",
          5                    as "Length of stay (days)",
          'General Hospital'   as "Facility",
          null::text           as "Emergency encounter type",
          'Hospital admission' as "Inpatient encounter type",
          null::text           as "Outpatient encounter type",
          null::text           as "Discharge disposition",
          null::text           as "Triage category",
          null::text           as "Arrival mode",
          null::text           as "Time seen following triage/Waiting time (hh:mm:ss)",
          'Dr. Carol Lee'      as "Clinician",
          'Dr. Carol Lee'      as "Supervising clinician",
          'General Ward'       as "Discharging department",
          '2024-01-15 10:00'   as "Time assigned to Discharging department",
          'Ward A'             as "Discharging area",
          '2024-01-15 10:00'   as "Time assigned to Discharging area",
          'Bed 1'              as "Discharging location",
          '2024-01-15 10:00'   as "Time assigned to Discharging location",
          'General Ward'       as "Department history",
          '2024-01-15 10:00'   as "Department history date and times",
          'Ward A'             as "Area history",
          '2024-01-15 10:00'   as "Area history date and times",
          'Bed 1'              as "Location history",
          '2024-01-15 10:00'   as "Location history date and times",
          null::text           as "Reason for encounter",
          null::text           as "Diagnoses",
          null::text           as "Diagnosis codes",
          null::text           as "Medications",
          null::text           as "Vaccinations",
          null::text           as "Procedures",
          null::text           as "Lab requests",
          null::text           as "Imaging requests",
          concat(
            'Note type: nursing, Content: First note, Note date: 2024-01-16 08:00',
            chr(10),
            'Note type: nursing, Content: Revised text, Note date: 2024-01-17 15:00'
          )                    as "Notes",
          null::text           as "invoiceFinalisedDateTime",
          null::text           as "invoiceProductCategories"
