unit_tests:
  - name: ac_004_metric__ed_pharmacy_order_scope
    model: metric__ed_pharmacy_order
    description: >
      BL-001 -- BL-006. e1 arrives in the ED (vd1a, concept 9203, 08:00) and is admitted at
      12:00 (vd1b, 9201). po1 is ordered in the ED with two drug lines: pop1 dispensed, pop2 not,
      one row each. pop3 carries an ongoing prescription rather than an encounter one, and its
      medication still resolves. pop4's prescription names no medication, so it falls back to
      'Not recorded'. po2 is ordered at 13:00 while the patient boards, so pop5 is in the
      admission segment and not counted. po3 predates every segment, so it clamps to the first
      (the ED) and pop6 counts. e2 has no segment, so pop7 is dropped. e3's only segment is a
      clinic (9202), so pop8 is not counted.
    given:
      - input: ref('pharmacy_order_prescriptions')
        format: sql
        rows: |
          select 'pop1' as id, 'po1' as pharmacy_order_id, 'rx1' as prescription_id, null::text as ongoing_prescription_id, true as is_completed
          union all
          select 'pop2', 'po1', 'rx2', null::text, false
          union all
          select 'pop3', 'po1', null::text, 'rx3', false
          union all
          select 'pop4', 'po1', 'rx_nomed', null::text, false
          union all
          select 'pop5', 'po2', 'rx1', null::text, true
          union all
          select 'pop6', 'po3', 'rx1', null::text, false
          union all
          select 'pop7', 'po4', 'rx1', null::text, true
          union all
          select 'pop8', 'po5', 'rx1', null::text, true

      - input: ref('pharmacy_orders')
        format: sql
        rows: |
          select 'po1' as id, 'e1' as encounter_id, '2026-01-10 09:00:00'::timestamp as datetime
          union all
          select 'po2', 'e1', '2026-01-10 13:00:00'::timestamp
          union all
          select 'po3', 'e1', '2026-01-10 07:00:00'::timestamp
          union all
          select 'po4', 'e2', '2026-01-11 09:00:00'::timestamp
          union all
          select 'po5', 'e3', '2026-01-12 09:00:00'::timestamp

      - input: ref('prescriptions')
        format: sql
        rows: |
          select 'rx1' as id, 'med_para' as medication_id
          union all
          select 'rx2', 'med_amox'
          union all
          select 'rx3', 'med_sal'
          union all
          select 'rx_nomed', null::text

      - input: ref('reference_data')
        format: sql
        rows: |
          select 'med_para' as id, 'PARA' as code, 'Paracetamol' as name
          union all
          select 'med_amox', 'AMOX', 'Amoxicillin'
          union all
          select 'med_sal', 'SALB', 'Salbutamol'

      - input: ref('clinical__visit_detail')
        format: sql
        rows: |
          select 'vd1a' as visit_detail_id, 'e1' as visit_occurrence_id, 'p1' as person_id, '2026-01-10 08:00:00'::timestamp as visit_detail_start_datetime, 9203 as visit_detail_concept_id, 'loc_ed' as care_site_id, 'dept_ed' as department_id
          union all
          select 'vd1b', 'e1', 'p1', '2026-01-10 12:00:00'::timestamp, 9201, 'loc_ward', 'dept_med'
          union all
          select 'vd3a', 'e3', 'p1', '2026-01-12 08:00:00'::timestamp, 9202, 'loc_clinic', 'dept_opd'

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'p1' as person_id, 'male' as gender_source_value, 1980 as year_of_birth, 1 as month_of_birth, 20 as day_of_birth

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_ed' as id, 'fac1' as facility_id
          union all
          select 'loc_ward', 'fac1'
          union all
          select 'loc_clinic', 'fac1'

      - input: ref('departments')
        format: sql
        rows: |
          select 'dept_ed' as id, 'Emergency' as name
          union all
          select 'dept_med', 'Medical'
          union all
          select 'dept_opd', 'Outpatients'

    expect:
      format: sql
      rows: |
        select 'ed_pharmacy_order' as metric_id, null::text as variant_id, 'pop1' as subject_id, '2026-01-10'::date as period_start, null::date as period_end, 'day' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac1' as facility_id, 'male' as sex, true as is_completed, 'PARA' as drug_source_value, 'Paracetamol' as drug_source_name, 45 as age_years, 'Emergency' as department
        union all
        select 'ed_pharmacy_order', null::text, 'pop2', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'male', false, 'AMOX', 'Amoxicillin', 45, 'Emergency'
        union all
        select 'ed_pharmacy_order', null::text, 'pop3', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'male', false, 'SALB', 'Salbutamol', 45, 'Emergency'
        union all
        select 'ed_pharmacy_order', null::text, 'pop4', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'male', false, 'Not recorded', 'Not recorded', 45, 'Emergency'
        union all
        select 'ed_pharmacy_order', null::text, 'pop6', '2026-01-10'::date, null::date, 'day', 1::numeric, null::boolean, 'fac1', 'male', false, 'PARA', 'Paracetamol', 45, 'Emergency'
