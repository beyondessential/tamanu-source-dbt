unit_tests:
  - name: test_hospital_admissions_by_department_candidate_encounters
    model: hospital-admissions-by-department-summary
    description: >
      BL-016: a report reads only the encounters whose stored dates, widened two days either
      side, overlap its month spine. enc_in sits inside February and is reported. enc_misdated
      carries an episode in February but its own start and end dates are in early January, well
      outside the widened window, so it is not reported. enc_edge ended a day before February
      began, inside the two-day margin, so it is a candidate, and the exact month logic then
      leaves it out: the margin never adds a row.
    overrides:
      vars:
        timezone: UTC
        yearmonth_format: YYYY-MM
        fromDate: '2024-02-01'
        toDate: '2024-02-29'
    given:
      - input: ref('int__admission_history_department')
        format: sql
        rows: |
          select
            'enc_in'::text           as encounter_id,
            'dep_med'::text          as department_id,
            'General Medicine'::text as department,
            'fac_001'::text          as facility_id,
            'Central Hospital'::text as facility,
            '2024-02-10 09:00:00'::timestamp as start_datetime,
            '2024-02-12 09:00:00'::timestamp as end_datetime,
            2::integer               as length_of_stay,
            true                     as admission,
            true                     as discharge,
            false                    as transfer_in,
            false                    as transfer_out,
            false                    as death
          union all
          select
            'enc_misdated', 'dep_med', 'General Medicine', 'fac_001', 'Central Hospital',
            '2024-02-10 09:00:00'::timestamp, '2024-02-12 09:00:00'::timestamp,
            2, true, true, false, false, false
          union all
          select
            'enc_edge', 'dep_med', 'General Medicine', 'fac_001', 'Central Hospital',
            '2024-01-29 09:00:00'::timestamp, '2024-01-31 09:00:00'::timestamp,
            2, true, true, false, false, false
      - input: ref('encounters')
        format: sql
        rows: |
          select
            'enc_in'::text as id,
            '2024-02-10 09:00:00'::character(19) as start_date_iso,
            '2024-02-12 09:00:00'::character(19) as end_date_iso
          union all
          select 'enc_misdated', '2024-01-05 09:00:00', '2024-01-08 09:00:00'
          union all
          select 'enc_edge', '2024-01-29 09:00:00', '2024-01-31 09:00:00'
    expect:
      format: sql
      rows: |
        select
          '2024-02'           as "Month",
          'Central Hospital'  as "Facility",
          'General Medicine'  as "Department",
          1::bigint           as "Number of admissions",
          1::bigint           as "Number of discharges",
          0::bigint           as "Number of deaths",
          0::bigint           as "Number of transfers into department",
          0::bigint           as "Number of transfers out of department",
          2.0::numeric        as "Average length of stay"

  - name: test_hospital_admissions_by_area_candidate_encounters
    model: hospital-admissions-by-area-summary
    description: >
      BL-016: only the encounters whose stored dates overlap the widened month spine are read.
      enc_in is reported. enc_misdated carries a February episode under an encounter dated in
      early January, and enc_edge ended a day before February began, inside the margin, so it
      is a candidate that the exact month logic leaves out.
    overrides:
      vars:
        timezone: UTC
        yearmonth_format: YYYY-MM
        fromDate: '2024-02-01'
        toDate: '2024-02-29'
    given:
      - input: ref('int__admission_history_location')
        format: sql
        rows: |
          select
            'enc_in'::text           as encounter_id,
            'lg_001'::text           as location_group_id,
            'Ward A'::text           as location_group,
            'loc_001'::text          as location_id,
            'Room 1'::text           as location,
            'fac_001'::text          as facility_id,
            'Central Hospital'::text as facility,
            '2024-02-10 09:00:00'::timestamp as start_datetime,
            '2024-02-12 09:00:00'::timestamp as end_datetime,
            2::integer               as length_of_stay,
            true                     as admission,
            true                     as discharge,
            false                    as transfer_in,
            false                    as transfer_out,
            false                    as death
          union all
          select
            'enc_misdated', 'lg_002', 'Ward B', 'loc_002', 'Room 2', 'fac_001', 'Central Hospital',
            '2024-02-10 09:00:00'::timestamp, '2024-02-12 09:00:00'::timestamp,
            2, true, true, false, false, false
          union all
          select
            'enc_edge', 'lg_003', 'Ward C', 'loc_003', 'Room 3', 'fac_001', 'Central Hospital',
            '2024-01-29 09:00:00'::timestamp, '2024-01-31 09:00:00'::timestamp,
            2, true, true, false, false, false
      - input: ref('encounters')
        format: sql
        rows: |
          select
            'enc_in'::text as id,
            '2024-02-10 09:00:00'::character(19) as start_date_iso,
            '2024-02-12 09:00:00'::character(19) as end_date_iso
          union all
          select 'enc_misdated', '2024-01-05 09:00:00', '2024-01-08 09:00:00'
          union all
          select 'enc_edge', '2024-01-29 09:00:00', '2024-01-31 09:00:00'
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_001'::text as id, 'Room 1'::text as name, 'lg_001'::text as location_group_id, 'fac_001'::text as facility_id, 10::integer as max_occupancy
          union all
          select 'loc_002', 'Room 2', 'lg_002', 'fac_001', 10
          union all
          select 'loc_003', 'Room 3', 'lg_003', 'fac_001', 10
    expect:
      format: sql
      rows: |
        select
          '2024-02'          as "Month",
          'Central Hospital' as "Facility",
          'Ward A'           as "Area",
          1                  as "Number of admissions",
          1                  as "Number of discharges",
          0                  as "Number of deaths",
          0                  as "Number of transfers into location",
          0                  as "Number of transfers out of location",
          2.0                as "Average length of stay",
          2                  as "Number of patient days",
          '0.7%'             as "Bed occupancy (%)"

