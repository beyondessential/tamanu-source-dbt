        union all
        select 'invoice_patient_payment', null::text, 'pay_2', '2026-08-05'::timestamp, null::timestamp, 'day', 50.00::numeric, null::boolean, 'inv_2', 'in_progress', 'fac_1', 'inpatient', 262, 'Emergency Room and Inpatient Visit', true, 'dept_ward', 'admission'
        union all
        select 'invoice_patient_payment', null::text, 'pay_3', '2026-08-09'::timestamp, null::timestamp, 'day', -50.00::numeric, null::boolean, 'inv_2', 'in_progress', 'fac_1', 'inpatient', 262, 'Emergency Room and Inpatient Visit', true, 'dept_ward', 'admission'
        union all
        select 'invoice', null::text, 'inv_3', '2026-08-05 11:00:00'::timestamp, null::timestamp, 'minute', 1::numeric, null::boolean, 'inv_3', 'finalised', 'fac_1', 'emergency', 9203, 'Emergency Room Visit', false, 'dept_ed', 'emergency'
        union all
