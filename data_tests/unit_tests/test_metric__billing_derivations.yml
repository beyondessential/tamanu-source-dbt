        - {metric_id: invoice_discount, subject_id: 00000000-0000-0000-0000-000000000003, period_granularity: minute, value_numeric: 0.00, care_setting: emergency, is_admitted_via_emergency: false}
        - {metric_id: invoice_patient_total, subject_id: 00000000-0000-0000-0000-000000000003, period_granularity: minute, value_numeric: 10.00, care_setting: emergency, is_admitted_via_emergency: false}
        - {metric_id: invoice_patient_paid, subject_id: 00000000-0000-0000-0000-000000000003, period_granularity: minute, value_numeric: 15.00, care_setting: emergency, is_admitted_via_emergency: false}
