        - {metric_id: invoice_discount, subject_id: 00000000-0000-0000-0000-000000000001, period_granularity: minute, value_numeric: 6.00, care_setting: outpatient, is_admitted_via_emergency: false}
        - {metric_id: invoice_patient_total, subject_id: 00000000-0000-0000-0000-000000000001, period_granularity: minute, value_numeric: 54.00, care_setting: outpatient, is_admitted_via_emergency: false}
        - {metric_id: invoice_patient_paid, subject_id: 00000000-0000-0000-0000-000000000001, period_granularity: minute, value_numeric: 30.00, care_setting: outpatient, is_admitted_via_emergency: false}
        - {metric_id: invoice_patient_balance, subject_id: 00000000-0000-0000-0000-000000000001, period_granularity: minute, value_numeric: 24.00, care_setting: outpatient, is_admitted_via_emergency: false}
        - {metric_id: invoice_patient_payment, subject_id: 00000000-0000-0000-0000-0000000000a1, period_granularity: day, value_numeric: 30.00, care_setting: outpatient, is_admitted_via_emergency: false}
        - {metric_id: invoice, subject_id: 00000000-0000-0000-0000-000000000002, period_granularity: minute, value_numeric: 1, care_setting: inpatient, is_admitted_via_emergency: true}
        - {metric_id: invoice_total, subject_id: 00000000-0000-0000-0000-000000000002, period_granularity: minute, value_numeric: 200.00, care_setting: inpatient, is_admitted_via_emergency: true}
        - {metric_id: invoice_insurance_coverage, subject_id: 00000000-0000-0000-0000-000000000002, period_granularity: minute, value_numeric: 120.00, care_setting: inpatient, is_admitted_via_emergency: true}
