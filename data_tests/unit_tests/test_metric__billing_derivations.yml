        union all
        select 'invoice_patient_total', null::text, 'inv_2', '2026-08-04 22:40:00'::timestamp, null::timestamp, 'minute', 80.00::numeric, null::boolean, 'inv_2', 'in_progress', 'fac_1', 'inpatient', 262, 'Emergency Room and Inpatient Visit', true, 'dept_ward', 'admission'
        union all
        select 'invoice_patient_paid', null::text, 'inv_2', '2026-08-04 22:40:00'::timestamp, null::timestamp, 'minute', 0::numeric, null::boolean, 'inv_2', 'in_progress', 'fac_1', 'inpatient', 262, 'Emergency Room and Inpatient Visit', true, 'dept_ward', 'admission'
        union all
