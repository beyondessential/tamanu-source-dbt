unit_tests:
  - name: ac_014_metric__outpatient_visit_derivations
    model: metric__outpatient_visit
    description: >
      Behavioural coverage for the disaggregations and measures added in MAUI-6908.
      BL-003: a visit is the intake segment only, and only at OMOP visit concept 9202 -- a
      later segment and a non-outpatient intake are both excluded. BL-008: clinician_id is the
      intake segment's provider, NULL where none was recorded, and the visit is kept either
      way. BL-009: is_admitted follows a later segment at concept 9201, read off the segment
      timeline rather than the encounter's current type. BL-010: admission_clinician_id is the
      earliest 9201 segment's provider and is a different person from the attending clinician.
      BL-011: the outpatient episode ends at the first segment carrying a concept other than
      9202 -- a later 9202 segment is a handover, not a departure -- falling back to the
      encounter end, and is NULL while the encounter is open. BL-012: is_auto_discharge is
      true only for a note beginning 'Automatically discharged', and false rather than NULL
      for a clinician-recorded discharge and for no discharge at all.

    given:
      # opd_1 admitted: clinic intake 09:00 under clin_1, admission segment 11:00 under
      #       clin_2, encounter runs on to the next day. The episode ends at the admission,
      #       not at the encounter end -- 120 minutes, not 1620.
      # opd_2 handover: a second *clinic* segment at 08:30 does not end the episode, so the
      #       encounter end at 09:00 stands -- 60 minutes, not 30.
      # opd_3 auto-discharged at 23:59, the shape Tamanu's outpatient discharger leaves.
      # opd_4 still open: no encounter end and no later segment, so no duration at all.
      # opd_5 no clinician recorded on the intake segment -- kept, not dropped.
      - input: ref('clinical__visit_detail')
        format: sql
        rows: |
          select 'opd_1' as visit_occurrence_id, 'opd_1_s0' as visit_detail_id, 'per_1' as person_id, 'loc_opd' as care_site_id, '2024-05-15'::date as visit_detail_start_date, '2024-05-15 09:00'::timestamp as visit_detail_start_datetime, null::text as preceding_visit_detail_id, 9202 as visit_detail_concept_id, 'clin_1' as provider_id, null::varchar as department_id
          union all
          -- BL-009/BL-010/BL-011: the admission segment. Ends the outpatient episode, carries
          -- the admitting clinician, and is a different person from the attending one.
          select 'opd_1', 'opd_1_s1', 'per_1', 'loc_ward', '2024-05-15'::date, '2024-05-15 11:00'::timestamp, 'opd_1_s0', 9201, 'clin_2', null::varchar
          union all
          select 'opd_2', 'opd_2_s0', 'per_1', 'loc_opd', '2024-05-16'::date, '2024-05-16 08:00'::timestamp, null::text, 9202, 'clin_1', null::varchar
          union all
          -- BL-011: a clinician handover inside outpatient care -- same concept, so not a
          -- departure
          select 'opd_2', 'opd_2_s1', 'per_1', 'loc_opd', '2024-05-16'::date, '2024-05-16 08:30'::timestamp, 'opd_2_s0', 9202, 'clin_2', null::varchar
          union all
          select 'opd_3', 'opd_3_s0', 'per_1', 'loc_opd', '2024-05-17'::date, '2024-05-17 10:00'::timestamp, null::text, 9202, 'clin_1', null::varchar
          union all
          select 'opd_4', 'opd_4_s0', 'per_1', 'loc_opd', '2024-05-18'::date, '2024-05-18 07:00'::timestamp, null::text, 9202, 'clin_1', null::varchar
          union all
          select 'opd_5', 'opd_5_s0', 'per_1', 'loc_opd', '2024-05-19'::date, '2024-05-19 06:00'::timestamp, null::text, 9202, null::text, null::varchar
          union all
          -- BL-011: intake and admission recorded at the SAME datetime -- one user action
          -- writing both history rows, or a migration. The 9202 row sorts first on
          -- visit_detail_id, so it is still the intake; the episode is zero-length, not the
          -- three days to the encounter end.
          select 'opd_6', 'opd_6_s0', 'per_1', 'loc_opd', '2024-05-25'::date, '2024-05-25 08:00'::timestamp, null::text, 9202, 'clin_1', null::varchar
          union all
          select 'opd_6', 'opd_6_s1', 'per_1', 'loc_ward', '2024-05-25'::date, '2024-05-25 08:00'::timestamp, 'opd_6_s0', 9201, 'clin_2', null::varchar
          union all
          -- BL-003: a later outpatient segment of some other encounter is not a second visit
          select 'opd_later_segment', 'opd_ls_s1', 'per_1', 'loc_opd', '2024-05-20'::date, '2024-05-20 09:00'::timestamp, 'opd_ls_s0', 9202, 'clin_1', null::varchar
          union all
          -- BL-003: an intake segment that is not an outpatient visit
          select 'opd_not_opd', 'opd_no_s0', 'per_1', 'loc_opd', '2024-05-21'::date, '2024-05-21 09:00'::timestamp, null::text, 9203, 'clin_1', null::varchar

      - input: ref('clinical__visit_occurrence')
        format: sql
        rows: |
          select 'opd_1' as visit_occurrence_id, '2024-05-16'::date as visit_end_date, '2024-05-16 12:00'::timestamp as visit_end_datetime
          union all
          select 'opd_2', '2024-05-16'::date, '2024-05-16 09:00'::timestamp
          union all
          select 'opd_3', '2024-05-17'::date, '2024-05-17 23:59'::timestamp
          union all
          select 'opd_4', null::date, null::timestamp
          union all
          select 'opd_5', '2024-05-19'::date, '2024-05-19 06:30'::timestamp
          union all
          select 'opd_6', '2024-05-28'::date, '2024-05-28 12:00'::timestamp
          union all
          select 'opd_later_segment', '2024-05-20'::date, '2024-05-20 10:00'::timestamp
          union all
          select 'opd_not_opd', '2024-05-21'::date, '2024-05-21 10:00'::timestamp

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'per_1' as person_id, 'female' as gender_source_value, 1984 as year_of_birth, 5 as month_of_birth, 15 as day_of_birth

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_opd' as id, 'fac_1' as facility_id
          union all
          select 'loc_ward', 'fac_1'

      # BL-008/BL-010: clin_3 is deliberately absent, standing for a user record deleted
      # after the encounter -- the visit is kept and the name reads NULL.
      - input: ref('ref__provider')
        format: sql
        rows: |
          select 'clin_1' as provider_id, 'Dr Ali' as provider_name
          union all
          select 'clin_2', 'Dr Cara'

      # BL-012: opd_3 is the system discharge. opd_1 carries a clinician-recorded note that
      # merely mentions discharge, which must not match; opd_2 and opd_5 have a discharge with
      # no note at all; opd_4 has no discharge row.
      - input: ref('discharges')
        format: sql
        rows: |
          select 'opd_1' as encounter_id, 'Discharged home, review in one week' as note
          union all
          select 'opd_2', null::text
          union all
          select 'opd_3', 'Automatically discharged by outpatient discharger'
          union all
          select 'opd_5', null::text

      - input: ref('departments')
        format: sql
        rows: "select null::varchar as id, null::varchar as code, null::varchar as name, null::varchar as facility_id, null::varchar as visibility_status limit 0"

    expect:
      format: sql
      rows: |
        select 'opd_visit' as metric_id, null::text as variant_id, 'opd_1' as subject_id, '2024-05-15'::date as period_start, '2024-05-16'::date as period_end, 'day' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac_1' as facility_id, 'loc_opd' as location_id, 'female' as sex, 40 as age_years, 'clin_1' as clinician_id, 'Dr Ali' as clinician_name, true as is_admitted, 'clin_2' as admission_clinician_id, 'Dr Cara' as admission_clinician_name, false as is_auto_discharge, 120.00::numeric as opd_time__minutes, 'Not recorded' as department
        union all
        select 'opd_visit', null::text, 'opd_2', '2024-05-16'::date, '2024-05-16'::date, 'day', 1::numeric, null::boolean, 'fac_1', 'loc_opd', 'female', 40, 'clin_1', 'Dr Ali', false, null::text, 'Not recorded', false, 60.00::numeric, 'Not recorded'
        union all
        select 'opd_visit', null::text, 'opd_3', '2024-05-17'::date, '2024-05-17'::date, 'day', 1::numeric, null::boolean, 'fac_1', 'loc_opd', 'female', 40, 'clin_1', 'Dr Ali', false, null::text, 'Not recorded', true, 839.00::numeric, 'Not recorded'
        union all
        select 'opd_visit', null::text, 'opd_4', '2024-05-18'::date, null::date, 'day', 1::numeric, null::boolean, 'fac_1', 'loc_opd', 'female', 40, 'clin_1', 'Dr Ali', false, null::text, 'Not recorded', false, null::numeric, 'Not recorded'
        union all
        select 'opd_visit', null::text, 'opd_5', '2024-05-19'::date, '2024-05-19'::date, 'day', 1::numeric, null::boolean, 'fac_1', 'loc_opd', 'female', 40, null::text, 'Not recorded', false, null::text, 'Not recorded', false, 30.00::numeric, 'Not recorded'
        union all
        select 'opd_visit', null::text, 'opd_6', '2024-05-25'::date, '2024-05-28'::date, 'day', 1::numeric, null::boolean, 'fac_1', 'loc_opd', 'female', 40, 'clin_1', 'Dr Ali', true, 'clin_2', 'Dr Cara', false, 0.00::numeric, 'Not recorded'
