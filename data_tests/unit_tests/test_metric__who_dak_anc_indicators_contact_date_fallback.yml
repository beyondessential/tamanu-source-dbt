unit_tests:
  - name: test_metric__who_dak_anc_indicators_contact_date_fallback
    model: metric__who_dak_anc_indicators
    description: >
      AC-008 (specs/dbt-model/metric__who_dak_anc_indicators.md). A Registration whose contact
      date is malformed, one whose contact date is blank, and one with no answers at all are each
      a contact on the day the form was started.
    given:
      - input: ref('program_data_elements')
        format: sql
        rows: |
          select 'pde-whodakanc-a7-de4'::text as id, 'whodakanc-a7-de4'::text as code
      - input: ref('locations')
        format: sql
        rows: |
          select 'loc_1'::text as id, 'fac_1'::text as facility_id
      - input: ref('encounters')
        format: sql
        rows: |
          select 'enc_1'::text as id, 'pat_1'::text as patient_id, 'loc_1'::text as location_id
          union all
          select 'enc_2', 'pat_2', 'loc_1'
          union all
          select 'enc_3', 'pat_3', null
      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'pat_1'::text as person_id, 1990::int as year_of_birth, 1::int as month_of_birth, 1::int as day_of_birth
          union all
          select 'pat_2', 1990, 1, 1
          union all
          select 'pat_3', 1990, 1, 1
      - input: ref('survey_responses')
        format: sql
        rows: |
          select
            'r_1'::text as id, 'program-whodakanc-registration'::text as survey_id, 'enc_1'::text as encounter_id,
            '2026-04-01 09:00:00'::timestamp as start_datetime, '2026-04-01 09:05:00'::timestamp as end_datetime
          union all
          select 'r_2', 'program-whodakanc-registration', 'enc_2', '2026-04-02 09:00:00'::timestamp, '2026-04-02 09:05:00'::timestamp
          union all
          select 'r_3', 'program-whodakanc-registration', 'enc_3', '2026-04-03 09:00:00'::timestamp, null::timestamp
      - input: ref('survey_response_answers')
        format: sql
        rows: |
          select 'a_1'::text as id, 'r_1'::text as response_id, 'pde-whodakanc-a7-de4'::text as data_element_id, 'unknown'::text as body
          union all
          select 'a_2', 'r_2', 'pde-whodakanc-a7-de4', '  '
    expect:
      rows:
        - {subject_id: 'pat_1;2026-04-01', period_start: '2026-04-01', period_end: '2026-04-01', facility_id: fac_1}
        - {subject_id: 'pat_2;2026-04-02', period_start: '2026-04-02', period_end: '2026-04-02', facility_id: fac_1}
        - {subject_id: 'pat_3;2026-04-03', period_start: '2026-04-03', period_end: '2026-04-03', facility_id: null}
