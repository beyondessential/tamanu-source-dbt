unit_tests:
  - name: test_metric__imaging_request_setting_and_completion
    model: metric__imaging_request
    description: >
      BL-002, BL-003, BL-010 (metric__imaging_request). r1's segment is 'clinic' and it
      carries encounter_type 'clinic', with period_end from its earliest result and facility
      from that segment's own care_site_id rather than a request-level location (BL-005).
      r3's segment is 'triage' and it is included too, reading encounter_type 'triage' --
      this metric applies no setting filter, so a consumer scoping to outpatient imaging
      filters encounter_type = 'clinic' (BL-003). r4 is still
      pending with no imaging_results row at all and must still be included with a NULL
      period_end -- inclusion does not depend on a completion event that does not exist yet. r5
      is a procedure_type_source_value = 'procedure' row on the same clinic segment, proving
      the branch filter excludes it rather than merely never encountering one (BL-010). r6 is
      is_completed = false but does have a matching result (a stray/preliminary result on a
      still-open request), proving period_end is gated on is_completed rather than on a
      result merely existing (BL-002). r7 carries a NULL visit_detail_id, which
      clinical__procedure_occurrence emits where an encounter has no mapped segment, and is
      dropped rather than surfaced without a setting.

      BL-007: r9 has no structured area, so its imaging_area falls back to its free-text notes,
      of which only each chain's current revision counts. 'Chest' was edited to 'Abdomen', so
      only 'Abdomen' appears. 'Left knee' is a second, separate note and still appears.
      'Right knee' is a third, recorded in the same second as 'Left knee' but after it -- its id
      sorts first, so created_datetime is what keeps the string in the order entered.
      'Pelvis' was edited to 'Hip' within the same second -- the root's id sorts last, so the
      created_datetime tie-break is what picks 'Hip', not the id. 'Spine' was edited into an
      'other' note, so its current revision is no longer an area note and neither version
      appears -- proving the chain is ranked before the note_type filter.

      The as-of match and the first-segment clamp are no longer this model's behaviour and
      are covered once, upstream, by
      test_clinical__procedure_occurrence_visit_detail_resolution -- so they are not
      re-asserted here.
    given:
      - input: ref('clinical__procedure_occurrence')
        format: sql
        rows: |
          select 'r1' as procedure_occurrence_id, 'p1' as person_id, '2026-01-01'::date as procedure_date, '2026-01-01 10:00:00'::timestamp as procedure_datetime, 32817 as procedure_type_concept_id, 'imaging request' as procedure_type_source_value, 'u1' as provider_id, 'e1' as visit_occurrence_id, 'vd2b' as visit_detail_id, null::varchar as location_id, 'ctScan' as procedure_source_value, 'CT Scan' as procedure_source_name, true as is_completed
          union all
          select 'r3', 'p1', '2026-01-01'::date, '2026-01-01 10:00:00'::timestamp, 32817, 'imaging request', 'u1', 'e3', 'vd3', null::varchar, 'xRay', 'X-Ray', true
          union all
          select 'r4', 'p1', '2026-01-02'::date, '2026-01-02 09:00:00'::timestamp, 32817, 'imaging request', 'u1', 'e1', 'vd2b', null::varchar, 'mri', 'MRI', false
          union all
          select 'r5', 'p1', '2026-01-01'::date, '2026-01-01 11:00:00'::timestamp, 32817, 'procedure', 'u1', 'e1', 'vd2b', null::varchar, 'appendectomy', 'Appendectomy', true
          union all
          select 'r6', 'p1', '2026-01-03'::date, '2026-01-03 09:00:00'::timestamp, 32817, 'imaging request', 'u1', 'e1', 'vd2b', null::varchar, 'ultrasound', 'Ultrasound', false
          union all
          select 'r7', 'p1', '2026-01-04'::date, '2026-01-04 08:00:00'::timestamp, 32817, 'imaging request', 'u1', 'e7', null::varchar, null::varchar, 'mri', 'MRI', false
          union all
          -- BL-007: area from free-text notes only
          select 'r9', 'p1', '2026-01-06'::date, '2026-01-06 08:00:00'::timestamp, 32817, 'imaging request', 'u1', 'e1', 'vd2b', null::varchar, 'xRay', 'X-Ray', false

      - input: ref('imaging_results')
        format: sql
        rows: |
          select 'res1' as id, '2026-01-01 12:00:00'::timestamp as datetime, 'r1' as imaging_request_id
          union all
          select 'res3', '2026-01-01 11:00:00'::timestamp, 'r3'
          union all
          select 'res6', '2026-01-03 10:00:00'::timestamp, 'r6'

      - input: ref('imaging_request_areas')
        format: sql
        rows: "select null::varchar as id, null::varchar as imaging_request_id, null::varchar as area_id limit 0"

      - input: ref('reference_data')
        format: sql
        rows: "select null::varchar as id, null::varchar as name limit 0"

      - input: ref('notes')
        format: sql
        rows: |
          select 'n_chest' as id, '2026-01-06 08:00:00'::timestamp as datetime, '2026-01-06 08:00:00'::timestamp as created_datetime, 'Chest' as content, 'areaToBeImaged' as note_type, 'ImagingRequest' as record_type, 'r9' as record_id, null::varchar as updated_note_id
          union all
          -- the edit of n_chest
          select 'n_abdomen', '2026-01-06 08:05:00'::timestamp, '2026-01-06 08:05:00'::timestamp, 'Abdomen', 'areaToBeImaged', 'ImagingRequest', 'r9', 'n_chest'
          union all
          -- a second, separate area note
          select 'n_knee', '2026-01-06 08:10:00'::timestamp, '2026-01-06 08:10:00'::timestamp, 'Left knee', 'areaToBeImaged', 'ImagingRequest', 'r9', null::varchar
          union all
          -- a third, recorded in the same second as n_knee but after it, with an id sorting first
          select 'a_rknee', '2026-01-06 08:10:00'::timestamp, '2026-01-06 08:10:00.500'::timestamp, 'Right knee', 'areaToBeImaged', 'ImagingRequest', 'r9', null::varchar
          union all
          -- edited within the same second: ties on datetime, and the root's id sorts last
          select 'z_pelvis', '2026-01-06 08:20:00'::timestamp, '2026-01-06 08:20:00.100'::timestamp, 'Pelvis', 'areaToBeImaged', 'ImagingRequest', 'r9', null::varchar
          union all
          select 'a_hip', '2026-01-06 08:20:00'::timestamp, '2026-01-06 08:20:00.900'::timestamp, 'Hip', 'areaToBeImaged', 'ImagingRequest', 'r9', 'z_pelvis'
          union all
          -- an area note whose edit changed its type
          select 'n_spine', '2026-01-06 08:30:00'::timestamp, '2026-01-06 08:30:00'::timestamp, 'Spine', 'areaToBeImaged', 'ImagingRequest', 'r9', null::varchar
          union all
          select 'n_spine_2', '2026-01-06 08:35:00'::timestamp, '2026-01-06 08:35:00'::timestamp, 'Spine, see notes', 'other', 'ImagingRequest', 'r9', 'n_spine'

      - input: ref('clinical__visit_detail')
        format: sql
        rows: |
          select 'vd2b' as visit_detail_id, 'e1' as visit_occurrence_id, 'p1' as person_id, 9202 as visit_detail_concept_id, '2026-01-01'::date as visit_detail_start_date, '2026-01-01 09:00:00'::timestamp as visit_detail_start_datetime, null::date as visit_detail_end_date, null::timestamp as visit_detail_end_datetime, 'loc1' as care_site_id, null::varchar as department_id, 'prov1' as provider_id, 'clinic' as visit_detail_source_value, null::varchar as preceding_visit_detail_id
          union all
          select 'vd3', 'e3', 'p1', 9203, '2026-01-01'::date, '2026-01-01 08:00:00'::timestamp, null::date, null::timestamp, 'loc1', null::varchar, 'prov1', 'triage', null::varchar

      - input: ref('clinical__person')
        format: sql
        rows: |
          select 'p1' as person_id, 'MRN1' as person_source_value, null::int as gender_concept_id, 'female' as gender_source_value, 1996 as year_of_birth, 1 as month_of_birth, 1 as day_of_birth, null::timestamp as birth_datetime, null::varchar as ethnicity_source_value, null::varchar as location_id

      - input: ref('locations')
        format: sql
        rows: |
          select 'loc1' as id, 'LOC1' as code, 'Location 1' as name, null::int as max_occupancy, null::varchar as location_group_id, 'fac1' as facility_id, 'current' as visibility_status

      - input: ref('departments')
        format: sql
        rows: "select null::varchar as id, null::varchar as code, null::varchar as name, null::varchar as facility_id, null::varchar as visibility_status limit 0"

    expect:
      format: sql
      rows: |
        select 'imaging_request' as metric_id, null::text as variant_id, 'r1' as subject_id, '2026-01-01 10:00:00'::timestamp as period_start, '2026-01-01 12:00:00'::timestamp as period_end, 'minute' as period_granularity, 1::numeric as value_numeric, null::boolean as value_boolean, 'fac1' as facility_id, 'clinic' as encounter_type, 'female' as sex, true as is_completed, 'CT Scan' as imaging_type, 'ctScan' as imaging_type_code, 'Not recorded' as imaging_area, 30 as age_years, 'Not recorded' as department
        union all
        select 'imaging_request', null::text, 'r3', '2026-01-01 10:00:00'::timestamp, '2026-01-01 11:00:00'::timestamp, 'minute', 1::numeric, null::boolean, 'fac1', 'triage', 'female', true, 'X-Ray', 'xRay', 'Not recorded', 30, 'Not recorded'
        union all
        select 'imaging_request', null::text, 'r4', '2026-01-02 09:00:00'::timestamp, null::timestamp, 'minute', 1::numeric, null::boolean, 'fac1', 'clinic', 'female', false, 'MRI', 'mri', 'Not recorded', 30, 'Not recorded'
        union all
        select 'imaging_request', null::text, 'r6', '2026-01-03 09:00:00'::timestamp, null::timestamp, 'minute', 1::numeric, null::boolean, 'fac1', 'clinic', 'female', false, 'Ultrasound', 'ultrasound', 'Not recorded', 30, 'Not recorded'
        union all
        select 'imaging_request', null::text, 'r9', '2026-01-06 08:00:00'::timestamp, null::timestamp, 'minute', 1::numeric, null::boolean, 'fac1', 'clinic', 'female', false, 'X-Ray', 'xRay', 'Abdomen, Left knee, Right knee, Hip', 30, 'Not recorded'
