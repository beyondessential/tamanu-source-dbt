selectors:
  - name: analytics
    description: Analytics schema models built as views
    definition:
      method: path
      value: models/bases
  - name: replica
    description: Replica or reconstructed models from logs.changes
    definition:
      union:
        - method: fqn
          value: models.logs.changes
        - method: path
          value: models/reconstructs
  - name: reporting
    description: Reporting schema models built as views
    default: true
    definition:
      union:
        - method: path
          value: models/sources
        - method: path
          value: models/logs
        - method: path
          value: models/bases
        - method: path
          value: models/intermediate
        - method: path
          value: models/datasets
  - name: reports
    description: Report models for compiling with translations
    definition:
      method: path
      value: models/reports
